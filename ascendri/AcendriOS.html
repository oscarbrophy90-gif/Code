    title: 'Welcome',
    icon: 'sparkles',
    accent: 'cyan',
    inShell: false,
    order: 1,

    render: function (el, ctx) {
      var esc = A.ui.esc;
      var profile = ctx.S.get().profile || {};

      // A finished user re-entering the wizard starts fresh at step 1.
      if (!draft || profile.onboarded) {
        step = 1;
        draft = seedDraft(profile);
      }

      el.innerHTML = '<div class="onb"><div class="onb-card acc-cyan"></div></div>';
      var card = el.querySelector('.onb-card');

      function dots() {
        var h = '<div class="onb-dots">';
        for (var i = 1; i <= 3; i++) h += '<span class="' + (i <= step ? 'on' : '') + '"></span>';
        return h + '</div>';
      }

      function head(title, sub, grad) {
        return '<h2 class="' + (grad ? 'h-grad' : '') + '" style="font-size:1.5rem;text-align:center;line-height:1.25">' + title + '</h2>' +
          '<p class="muted" style="text-align:center;margin:8px 0 22px">' + sub + '</p>';
      }

      function goNext() { step = Math.min(3, step + 1); rerender(); }
      function goBack() { step = Math.max(1, step - 1); rerender(); }

      /* ---------- step renderers ---------- */

      function renderStep1() {
        card.innerHTML =
          dots() +
          head('Welcome to Acendri OS', 'Let’s set you up in under a minute. Your life, connected.', true) +
          '<div class="field"><label>What should we call you?</label>' +
          '<input class="input" id="onb-name" type="text" maxlength="40" placeholder="Your name" value="' + esc(draft.name) + '"></div>' +
          '<div class="field"><label>Pick an avatar</label><div class="emoji-pick">' +
          AVATARS.map(function (e, i) {
            return '<button type="button" data-avatar="' + i + '" class="' + (e === draft.avatar ? 'sel' : '') + '" title="Use ' + esc(e) + ' as your avatar">' + esc(e) + '</button>';
          }).join('') +
          '</div></div>' +
          '<button type="button" class="btn btn-primary btn-lg" data-next="1" style="width:100%;margin-top:6px">Continue ' + A.ui.icon('arrow') + '</button>';

        var nameInput = card.querySelector('#onb-name');
        nameInput.addEventListener('input', function () { draft.name = nameInput.value; });
        nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryContinue(); });
        setTimeout(function () { nameInput.focus(); }, 60);

        card.querySelectorAll('[data-avatar]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            draft.avatar = AVATARS[+btn.getAttribute('data-avatar')];
            rerender();
          });
        });

        function tryContinue() {
          if (!draft.name.trim()) { A.ui.toast('Tell us your name first', '✍️'); nameInput.focus(); return; }
          goNext();
        }
        card.querySelector('[data-next]').addEventListener('click', tryContinue);
      }

      function renderStep2() {
        card.innerHTML =
          dots() +
          head('What’s your main focus right now?', 'Acendri tunes your dashboard and suggestions around it.', false) +
          '<div class="col" style="margin-bottom:22px">' +
          FOCUSES.map(function (f, i) {
            return '<button type="button" class="focus-opt acc-' + f.accent + (draft.focus === f.id ? ' sel' : '') + '" data-focus="' + i + '">' +
              '<span style="font-size:1.5rem">' + esc(f.emoji) + '</span>' +
              '<span><span class="bold">' + esc(f.label) + '</span><br><span class="muted small">' + esc(f.desc) + '</span></span>' +
              '</button>';
          }).join('') +
          '</div>' +
          '<div class="row">' +
          '<button type="button" class="btn btn-ghost" data-back="1">Back</button>' +
          '<button type="button" class="btn btn-primary" data-next="1" style="flex:1">Continue ' + A.ui.icon('arrow') + '</button>' +
          '</div>';

        card.querySelectorAll('[data-focus]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            draft.focus = FOCUSES[+btn.getAttribute('data-focus')].id;
            rerender();
          });
        });
        card.querySelector('[data-back]').addEventListener('click', goBack);
        card.querySelector('[data-next]').addEventListener('click', function () {
          if (!draft.focus) { A.ui.toast('Pick a focus to continue', '🎯'); return; }
          goNext();
        });
      }

      function renderStep3() {
        card.innerHTML =
          dots() +
          head('Give Acendri something to work with', 'Add a first goal — or jump straight in. You can change everything later.', false) +
          '<div class="field"><label>Your first goal (optional)</label>' +
          '<input class="input" id="onb-goal" type="text" maxlength="80" placeholder="Become a professional tennis player" value="' + esc(draft.goalTitle) + '"></div>' +
          '<div class="field"><label>Category</label><select class="select" id="onb-cat">' +
          CATEGORIES.map(function (c) {
            return '<option value="' + esc(c) + '"' + (draft.goalCat === c ? ' selected' : '') + '>' + esc(c) + '</option>';
          }).join('') +
          '</select></div>' +
          '<div class="row" style="gap:12px;margin:2px 0 4px"><hr class="sep" style="flex:1;margin:0"><span class="dim small bold">OR</span><hr class="sep" style="flex:1;margin:0"></div>' +
          '<label class="checkbox" style="margin:14px 0 22px"><input type="checkbox" id="onb-demo"' + (draft.demo ? ' checked' : '') + '><span>Load demo data so I can explore a living app</span></label>' +
          '<div class="row">' +
          '<button type="button" class="btn btn-ghost" data-back="1">Back</button>' +
          '<button type="button" class="btn btn-primary" data-finish="1" style="flex:1">Enter Acendri OS ' + A.ui.icon('arrow') + '</button>' +
          '</div>';

        var goalInput = card.querySelector('#onb-goal');
        goalInput.addEventListener('input', function () { draft.goalTitle = goalInput.value; });
        goalInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') finish(); });
        card.querySelector('#onb-cat').addEventListener('change', function (e) { draft.goalCat = e.target.value; });
        card.querySelector('#onb-demo').addEventListener('change', function (e) { draft.demo = !!e.target.checked; });
        card.querySelector('[data-back]').addEventListener('click', goBack);
        card.querySelector('[data-finish]').addEventListener('click', finish);
      }

      function finish() {
        var name = draft.name.trim();
        if (!name) { A.ui.toast('Tell us your name first', '✍️'); step = 1; rerender(); return; }
        if (!draft.focus) { A.ui.toast('Pick a focus to continue', '🎯'); step = 2; rerender(); return; }

        var avatar = draft.avatar || '🙂';
        var focus = draft.focus;
        var title = draft.goalTitle.trim();
        var cat = CATEGORIES.indexOf(draft.goalCat) >= 0 ? draft.goalCat : 'Personal';
        var wantDemo = draft.demo;

        A.S.update(function (s) {
          s.profile.name = name;
          s.profile.avatar = avatar;
          s.profile.focus = focus;
          s.profile.onboarded = true;
          if (title) {
            s.goals.push({
              id: A.ui.uid(),
              title: title,
              category: cat,
              why: '',
              accent: CAT_ACCENT[cat] || 'cyan',
              targetDate: null,
              status: 'active',
              milestones: [],
              createdAt: Date.now()
            });
          }
        });
        // outside the update, per contract: demo seed is its own update + toast
        if (wantDemo) A.S.loadDemo();
        ctx.nav('app/dashboard');
        A.ui.toast('Welcome aboard, ' + name + ' — let’s make things happen!', '🚀');
        // "welcome" achievement fires automatically from core’s checkAchievements
      }

      /* ---------- card dispatcher ---------- */

      function rerender() {
        if (step === 1) renderStep1();
        else if (step === 2) renderStep2();
        else renderStep3();
      }

      rerender();
    }
  });
})();

/* ===== js/dashboard.js ===== */
/* ============================================================
   Acendri OS — Dashboard: the command centre.
   Hero greeting + quick actions, "What matters most right now",
   and a grid of live summaries pulling from every engine.
   ============================================================ */
(function () {
  'use strict';
  var A = window.Ascendri;

  /* ---------------- small builders ---------------- */

  function greeting() {
    var h = new Date().getHours();
    if (h < 12) return 'Good morning';
    if (h < 18) return 'Good afternoon';
    return 'Good evening';
  }

  function fullDate() {
    var d = new Date();
    return A.ui.DAY_NAMES[d.getDay()] + ' ' + d.getDate() + ' ' + A.ui.MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

  function footerBtn(screen, label) {
    return '<div style="margin-top:12px"><button class="btn btn-ghost btn-sm" data-nav="' + screen + '">' +
      label + ' ' + A.ui.icon('arrow', 'sm') + '</button></div>';
  }

  function emptyBlock(emoji, text, screen, label) {
    return '<div class="empty"><div class="e-emoji">' + emoji + '</div><p>' + text + '</p>' +
      '<button class="btn btn-acc" data-nav="' + screen + '">' + label + '</button></div>';
  }

  /* ---------------- A) hero ---------------- */

  function heroHTML(s) {
    var esc = A.ui.esc;
    var name = (s.profile && s.profile.name) || 'there';
    var avatar = (s.profile && s.profile.avatar) || '🙂';
    var focus = s.profile && s.profile.focus;
    var lp = A.ui.levelProgress((s.profile && s.profile.xp) || 0);
    var best = 0;
    (s.habits || []).forEach(function (h) {
      if (h.archived) return;
      var st = A.engine.habitStreak(h);
      if (st > best) best = st;
    });
    return '<div class="dash-hero">' +
      '<div class="spread wrap">' +
        '<div>' +
          '<div class="big"><span class="h-grad">' + greeting() + ', ' + esc(name) + '</span> ' + esc(avatar) + '</div>' +
          '<div class="muted small" style="margin-top:4px">' + fullDate() +
            (focus ? ' &nbsp;<span class="tag">🎯 ' + esc(focus) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="row wrap">' +
          '<span class="pill acc-cyan">⭐ LV ' + lp.level + ' · ' + esc(A.ui.levelTitle(lp.level)) + '</span>' +
          (best > 0 ? '<span class="pill acc-orange">🔥 ' + best + ' day streak</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="row wrap" style="margin-top:16px">' +
        '<button class="btn btn-acc acc-blue" data-nav="app/goals">+ Goal</button>' +
        '<button class="btn btn-acc acc-green" data-nav="app/tasks">+ Task</button>' +
        '<button class="btn btn-acc acc-purple" data-nav="app/schedule">⚡ Plan my week</button>' +
        '<button class="btn btn-acc acc-cyan" data-nav="app/assistant">🤖 Ask Acendri</button>' +
      '</div>' +
    '</div>';
  }

  /* ---------------- B) focus card ---------------- */

  function focusHTML() {
    var esc = A.ui.esc;
    var items = A.engine.focusSuggestions(4);
    var rows = items.map(function (it) {
      return '<div class="list-item acc-' + (it.accent || 'cyan') + '" data-nav="' + esc(it.screen) + '" style="cursor:pointer">' +
        '<span style="font-size:1.15rem">' + esc(it.emoji) + '</span>' +
        '<div class="li-main"><div class="li-title" style="font-weight:500">' + esc(it.text) + '</div></div>' +
        '<span class="h-acc">' + A.ui.icon('arrow', 'sm') + '</span>' +
      '</div>';
    }).join('');
    return '<div class="card acc glow acc-purple section-gap">' +
      '<div class="card-title">' + A.ui.icon('sparkles') + ' What matters most right now</div>' +
      (rows
        ? '<div class="list">' + rows + '</div>'
        : emptyBlock('🧘', 'All quiet — nothing urgent on your plate right now.', 'app/goals', 'Set a goal')) +
    '</div>';
  }

  /* ---------------- C1) today's timetable ---------------- */

  function timetableCard(s) {
    var esc = A.ui.esc;
    var t = A.ui.todayISO();
    var inner, foot = '';
    if (!s.timetable) {
      inner = emptyBlock('📅', 'No weekly plan yet — Acendri can fit your tasks around your commitments automatically.', 'app/schedule', 'Generate my week');
    } else {
      var blocks = (s.timetable.days && s.timetable.days[t]) || [];
      if (!blocks.length) {
        inner = emptyBlock('🌤️', 'Nothing scheduled today — enjoy the breathing room.', 'app/schedule', 'Open timetable');
      } else {
        var extra = blocks.length - 6;
        inner = '<div class="list">' + blocks.slice(0, 6).map(function (b) {
          return '<div class="list-item acc-' + (b.accent || 'cyan') + (b.done ? ' done' : '') + '" data-nav="app/schedule" style="cursor:pointer">' +
            '<span class="pill">' + esc(A.ui.fmtTime(b.start)) + '–' + esc(A.ui.fmtTime(b.end)) + '</span>' +
            '<div class="li-main"><div class="li-title">' + esc(b.title) + '</div>' +
            '<div class="li-sub">' + (b.type === 'commitment' ? 'Commitment' : 'Task') + (b.done ? ' · done ✔' : '') + '</div></div>' +
          '</div>';
        }).join('') + '</div>' +
        (extra > 0 ? '<div class="small dim" style="margin-top:8px">+' + extra + ' more block' + (extra === 1 ? '' : 's') + ' today</div>' : '');
        foot = footerBtn('app/schedule', 'Open timetable');
      }
    }
    return '<div class="card acc acc-purple">' +
      '<div class="card-title">' + A.ui.icon('calendar') + ' Today’s timetable</div>' + inner + foot + '</div>';
  }

  /* ---------------- C2) tasks due ---------------- */

  function tasksCard(s) {
    var esc = A.ui.esc;
    var t = A.ui.todayISO();
    var due = (s.tasks || []).filter(function (task) { return !task.done && task.due && task.due <= t; });
    due.sort(function (a, b) {
      if (a.due !== b.due) return a.due < b.due ? -1 : 1; // overdue (earlier) first
      return (b.priority || 1) - (a.priority || 1);
    });
    var inner, foot;
    if (!due.length) {
      inner = emptyBlock('✅', 'Nothing due — you’re ahead 🎉', 'app/tasks', 'Go to Tasks');
      foot = '';
    } else {
      var accFor = { 1: 'cyan', 2: 'orange', 3: 'red' };
      inner = '<div class="list">' + due.slice(0, 6).map(function (task) {
        var overdue = task.due < t;
        return '<div class="list-item">' +
          '<button class="check acc-' + (accFor[task.priority] || 'cyan') + '" data-task="' + esc(task.id) + '" title="Mark done" aria-label="Complete task">' + A.ui.icon('check', 'sm') + '</button>' +
          '<div class="li-main"><div class="li-title">' + esc(task.title) + '</div>' +
          '<div class="li-sub"><span class="' + (overdue ? 'neg' : '') + '">' + (overdue ? '⚠️ ' : '') + esc(A.ui.fmtDate(task.due)) + '</span>' +
          (task.priority === 3 ? ' · high priority' : '') + '</div></div>' +
        '</div>';
      }).join('') + '</div>';
      foot = footerBtn('app/tasks', 'View all tasks' + (due.length > 6 ? ' (' + due.length + ' due)' : ''));
    }
    return '<div class="card acc acc-green">' +
      '<div class="card-title">' + A.ui.icon('checksq') + ' Tasks due</div>' + inner + foot + '</div>';
  }

  /* ---------------- C3) goal progress ---------------- */

  function goalsCard(s) {
    var esc = A.ui.esc;
    var active = (s.goals || []).filter(function (g) { return g.status === 'active'; }).slice(0, 3);
    var inner, foot;
    if (!active.length) {
      inner = emptyBlock('🎯', 'Break a big dream into milestones and watch the bar fill up.', 'app/goals', 'Create your first goal');
      foot = '';
    } else {
      inner = '<div class="list">' + active.map(function (g) {
        var pct = A.engine.goalProgress(g);
        var next = (g.milestones || []).filter(function (m) { return !m.done; })[0];
        return '<div class="list-item acc-' + (g.accent || 'blue') + '" data-nav="app/goals" style="cursor:pointer">' +
          '<div class="li-main">' +
            '<div class="spread"><span class="li-title">' + esc(g.title) + '</span><span class="small bold h-acc">' + pct + '%</span></div>' +
            '<div class="bar" style="margin:7px 0 5px"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
            '<div class="li-sub">' + (next ? 'Next: ' + esc(next.title) : 'All milestones done — finish it off! 🏁') + '</div>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>';
      foot = footerBtn('app/goals', 'View all goals');
    }
    return '<div class="card acc acc-blue">' +
      '<div class="card-title">' + A.ui.icon('target') + ' Goal progress</div>' + inner + foot + '</div>';
  }

  /* ---------------- C4) habits today ---------------- */

  function habitsCard(s) {
    var esc = A.ui.esc;
    var t = A.ui.todayISO();
    var habits = (s.habits || []).filter(function (h) { return !h.archived; });
    var inner, foot;
    if (!habits.length) {
      inner = emptyBlock('🌱', 'Small daily actions compound — add your first habit.', 'app/habits', 'Add a habit');
      foot = '';
    } else {
      inner = '<div class="list">' + habits.slice(0, 6).map(function (h) {
        var on = !!(h.log && h.log[t]);
        var st = A.engine.habitStreak(h);
        return '<div class="list-item acc-' + (h.accent || 'orange') + '">' +
          '<span style="font-size:1.2rem">' + esc(h.emoji || '✨') + '</span>' +
          '<div class="li-main"><div class="li-title">' + esc(h.title) + '</div>' +
          '<div class="li-sub">🔥 ' + st + ' day streak · ' + A.engine.habitWeekCount(h) + '/' + (h.targetPerWeek || 7) + ' this week</div></div>' +
          '<button class="check' + (on ? ' on' : '') + '" data-habit="' + esc(h.id) + '" title="' + (on ? 'Untick for today' : 'Tick for today') + '" aria-label="Toggle habit">' + A.ui.icon('check', 'sm') + '</button>' +
        '</div>';
      }).join('') + '</div>';
      foot = footerBtn('app/habits', 'Open habits');
    }
    return '<div class="card acc acc-orange">' +
      '<div class="card-title">' + A.ui.icon('flame') + ' Habits today</div>' + inner + foot + '</div>';
  }

  /* ---------------- C5) money this month ---------------- */

  function moneyCard(s) {
    var esc = A.ui.esc;
    var hasTx = s.finance && s.finance.transactions && s.finance.transactions.length;
    var inner, foot;
    if (!hasTx) {
      inner = emptyBlock('💸', 'Track income and spending to see where your money actually goes.', 'app/finance', 'Log a transaction');
      foot = '';
    } else {
      var fin = A.engine.financeSummary();
      var over = fin.overBudget.map(function (o) { return esc(o.cat); }).join(', ');
      inner =
        '<div class="row wrap" style="gap:26px">' +
          '<div class="stat"><span class="v">' + esc(A.ui.fmtMoney(fin.income)) + '</span><span class="k">Income</span></div>' +
          '<div class="stat"><span class="v">' + esc(A.ui.fmtMoney(fin.expenses)) + '</span><span class="k">Expenses</span></div>' +
          '<div class="stat"><span class="v ' + (fin.net >= 0 ? 'pos' : 'neg') + '">' + esc(A.ui.fmtMoney(fin.net)) + '</span><span class="k">Net</span></div>' +
        '</div>' +
        (fin.overBudget.length ? '<div class="small neg" style="margin-top:12px">⚠️ Over budget: ' + over + '</div>' : '') +
        '<div class="small muted" style="margin-top:' + (fin.overBudget.length ? 6 : 12) + 'px">🏦 ' + esc(A.ui.fmtMoney(fin.savings)) + ' saved across your savings goals</div>';
      foot = footerBtn('app/finance', 'Open finance');
    }
    return '<div class="card acc acc-yellow">' +
      '<div class="card-title">' + A.ui.icon('wallet') + ' Money this month</div>' + inner + foot + '</div>';
  }

  /* ---------------- C6) latest achievements ---------------- */

  function achievementsCard(s) {
    var esc = A.ui.esc;
    var defs = A.engine.ACHIEVEMENTS;
    var byId = {};
    defs.forEach(function (d) { byId[d.id] = d; });
    var unlocked = Object.keys(s.achievements || {})
      .filter(function (id) { return byId[id]; })
      .map(function (id) { return { def: byId[id], ts: s.achievements[id] }; });
    unlocked.sort(function (a, b) { return b.ts - a.ts; });
    var locked = defs.length - unlocked.length;
    var inner, foot;
    if (!unlocked.length) {
      inner = emptyBlock('🏅', 'Complete tasks and build streaks to unlock your first badge.', 'app/achievements', 'See the badges');
      foot = '';
    } else {
      inner = '<div class="list">' + unlocked.slice(0, 3).map(function (u) {
        return '<div class="list-item acc-' + (u.def.accent || 'yellow') + '">' +
          '<span style="font-size:1.3rem">' + esc(u.def.emoji) + '</span>' +
          '<div class="li-main"><div class="li-title">' + esc(u.def.title) + '</div>' +
          '<div class="li-sub">' + esc(A.ui.timeAgo(u.ts)) + (u.def.xp ? ' · +' + u.def.xp + ' XP' : '') + '</div></div>' +
        '</div>';
      }).join('') + '</div>' +
      (locked > 0 ? '<div class="small dim" style="margin-top:8px">🔒 ' + locked + ' more to unlock</div>' : '');
      foot = footerBtn('app/achievements', 'All achievements');
    }
    return '<div class="card acc acc-yellow">' +
      '<div class="card-title">' + A.ui.icon('trophy') + ' Latest achievements</div>' + inner + foot + '</div>';
  }

  /* ---------------- screen ---------------- */

  A.registerScreen('app/dashboard', {
    title: 'Dashboard',
    icon: 'home',
    accent: 'cyan',
    inShell: true,
    order: 1,
    render: function (el, ctx) {
      var s = A.S.get();

      el.innerHTML =
        heroHTML(s) +
        focusHTML() +
        '<div class="grid2 section-gap">' +
          timetableCard(s) +
          tasksCard(s) +
          goalsCard(s) +
          habitsCard(s) +
          moneyCard(s) +
          achievementsCard(s) +
        '</div>';

      // navigation (quick actions, focus items, goal/timetable rows, footers, empty CTAs)
      el.querySelectorAll('[data-nav]').forEach(function (n) {
        n.addEventListener('click', function () { ctx.nav(n.getAttribute('data-nav')); });
      });

      // complete a due task
      el.querySelectorAll('[data-task]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-task');
          var pr = 1, hit = false;
          A.S.update(function (st) {
            for (var i = 0; i < st.tasks.length; i++) {
              var task = st.tasks[i];
              if (task.id === id && !task.done) {
                task.done = true;
                task.doneAt = Date.now();
                pr = task.priority;
                hit = true;
                break;
              }
            }
          });
          if (hit) A.S.addXp(pr === 3 ? 15 : 10, 'Task completed');
        });
      });

      // toggle a habit for today
      el.querySelectorAll('[data-habit]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-habit');
          var t = A.ui.todayISO();
          var ticked = false, hit = false, title = '';
          A.S.update(function (st) {
            for (var i = 0; i < st.habits.length; i++) {
              var h = st.habits[i];
              if (h.id === id) {
                if (!h.log) h.log = {};
                if (h.log[t]) delete h.log[t];
                else { h.log[t] = true; ticked = true; }
                title = h.title;
                hit = true;
                break;
              }
            }
          });
          if (!hit) return;
          if (ticked) A.S.addXp(5, 'Habit: ' + title);
          else A.ui.toast('Unticked "' + title + '" for today', '↩️');
        });
      });
    }
  });
})();

/* ===== js/goals.js ===== */
/* ============================================================
   Acendri OS — Goals screen
   Big ambitions, broken into milestones you can act on today.
   ============================================================ */
(function () {
  'use strict';
  var A = window.Ascendri;

  var CATEGORIES = ['Study', 'Sport', 'Finance', 'Career', 'Health', 'Personal'];

  var TEMPLATES = {
    Study: [
      'Break the syllabus into weekly topics',
      'Set a fixed daily study block',
      'Finish one practice paper per week',
      'Review mistakes the same evening',
      'Do a full mock under real exam timing'
    ],
    Sport: [
      'Build a weekly training schedule',
      'Set one measurable performance target',
      'Train at least 4 sessions per week',
      'Film and review technique monthly',
      'Enter a competition or trial'
    ],
    Finance: [
      'Work out the exact amount and deadline',
      'Open a separate account for it',
      'Set an automatic weekly transfer',
      'Cut one recurring expense',
      'Review progress at the halfway mark'
    ],
    Career: [
      'Define what success looks like in 12 months',
      'Update resume and portfolio',
      'Learn one high-value skill',
      'Talk to 3 people already doing it',
      'Apply, pitch or ship — take the shot'
    ],
    Health: [
      'Book a check-up and get a baseline',
      'Plan meals for the week ahead',
      'Move 30 minutes every day',
      'Fix a consistent sleep schedule',
      'Re-measure after 4 weeks'
    ],
    Personal: [
      'Write down why this matters to you',
      'Break it into monthly mini-goals',
      'Block weekly time for it',
      'Tell someone who will keep you honest',
      'Review and adjust each month'
    ]
  };
  var GENERIC_STEPS = [
    'Define what "done" looks like',
    'Break it into 3-5 smaller steps',
    'Schedule the first step this week',
    'Set a mid-point check-in',
    'Finish and celebrate'
  ];

  function templateFor(cat) { return TEMPLATES[cat] || GENERIC_STEPS; }

  function findGoal(s, id) {
    return s.goals.filter(function (g) { return g.id === id; })[0] || null;
  }

  function daysUntil(iso) {
    var p = iso.split('-'), q = A.ui.todayISO().split('-');
    var a = new Date(+p[0], +p[1] - 1, +p[2]);
    var b = new Date(+q[0], +q[1] - 1, +q[2]);
    return Math.round((a - b) / 86400000);
  }

  function dueTagHTML(iso) {
    var d = daysUntil(iso);
    if (d < 0) return '<span class="tag" style="color:#f87171;border-color:#7f1d1d">' + (-d) + 'd overdue</span>';
    if (d === 0) return '<span class="tag" style="color:#fb923c;border-color:#7c2d12">due today</span>';
    return '<span class="tag">' + d + 'd left</span>';
  }

  /* ---------------- state mutations ---------------- */

  function toggleMilestone(goalId, msId) {
    var becameDone = false, msTitle = '', allDone = false;
    A.S.update(function (s) {
      var g = findGoal(s, goalId);
      if (!g) return;
      var m = g.milestones.filter(function (x) { return x.id === msId; })[0];
      if (!m) return;
      m.done = !m.done;
      if (m.done) { becameDone = true; msTitle = m.title; }
      allDone = g.status === 'active' && g.milestones.length > 0 &&
        g.milestones.every(function (x) { return x.done; });
    });
    if (becameDone) A.S.addXp(25, 'Milestone: ' + msTitle);
    if (becameDone && allDone) A.ui.toast('Every step ticked — mark the goal complete!', '🎉');
  }

  function addMilestone(goalId, title) {
    var t = String(title || '').trim();
    if (!t) { A.ui.toast('Type a step first', '✍️'); return false; }
    A.S.update(function (s) {
      var g = findGoal(s, goalId);
      if (g) g.milestones.push({ id: A.ui.uid(), title: t, done: false });
    });
    // refocus the inline input after the idempotent re-render
    setTimeout(function () {
      var inp = document.querySelector('[data-ms-input][data-goal="' + goalId + '"]');
      if (inp) inp.focus();
    }, 90);
    return true;
  }

  function suggestForGoal(goalId) {
    A.S.update(function (s) {
      var g = findGoal(s, goalId);
      if (!g || g.milestones.length) return;
      templateFor(g.category).forEach(function (t) {
        g.milestones.push({ id: A.ui.uid(), title: t, done: false });
      });
    });
    A.ui.toast('Steps suggested — make them yours', '✨');
  }

  function milestoneToTask(goalId, msId) {
    var made = false, title = '';
    A.S.update(function (s) {
      var g = findGoal(s, goalId);
      if (!g) return;
      var m = g.milestones.filter(function (x) { return x.id === msId; })[0];
      if (!m) return;
      s.tasks.push({
        id: A.ui.uid(),
        title: m.title,
        priority: 2,
        due: A.ui.addDaysISO(A.ui.todayISO(), 3),
        duration: 45,
        done: false,
        goalId: goalId,
        createdAt: Date.now()
      });
      made = true; title = m.title;
    });
    if (made) A.ui.toast('Added to your tasks', '📋');
  }

  function completeGoal(goalId) {
    var g = findGoal(A.S.get(), goalId);
    if (!g || g.status === 'done') return;
    var doComplete = function () {
      var title = '', xp = false;
      A.S.update(function (s) {
        var gg = findGoal(s, goalId);
        if (!gg || gg.status === 'done') return;
        gg.status = 'done';
        gg.completedAt = Date.now();
        title = gg.title;
        xp = true;
        var n = gg.milestones.filter(function (m) { return m.done; }).length;
        if (s.settings && s.settings.autoPost) {
          s.social.feed.unshift({
            id: A.ui.uid(),
            author: s.profile.name || 'You',
            avatar: s.profile.avatar || '🙂',
            me: true,
            accent: gg.accent || 'blue',
            kind: 'goal',
            time: Date.now(),
            text: 'Goal completed 🏆 “' + gg.title + '” — ' + n + ' steps done. On to the next one!',
            likes: 0, liked: false, comments: []
          });
        }
      });
      if (!xp) return;
      A.S.addXp(100, 'Goal completed: ' + title);
      A.ui.confetti();
    };
    if (A.engine.goalProgress(g) < 100) {
      A.ui.confirm('Not every step is ticked — complete anyway?', doComplete,
        { title: 'Complete goal', yesLabel: '🏆 Complete it', danger: false, accent: g.accent || 'blue' });
    } else {
      doComplete();
    }
  }

  function reactivateGoal(goalId) {
    A.S.update(function (s) {
      var g = findGoal(s, goalId);
      if (!g) return;
      g.status = 'active';
      delete g.completedAt;
    });
    A.ui.toast('Goal reactivated — back on it!', '🎯');
  }

  function deleteGoal(goalId) {
    var g = findGoal(A.S.get(), goalId);
    if (!g) return;
    A.ui.confirm('Delete "' + g.title + '"? Its milestones go with it — this can’t be undone.', function () {
      A.S.update(function (s) {
        s.goals = s.goals.filter(function (x) { return x.id !== goalId; });
      });
      A.ui.toast('Goal deleted', '🗑️');
    }, { yesLabel: 'Delete goal' });
  }

  /* ---------------- new / edit modal ---------------- */

  function openGoalModal(goalId) {
    var esc = A.ui.esc;
    var src = goalId ? findGoal(A.S.get(), goalId) : null;
    var isEdit = !!src;
    var draft = {
      title: src ? src.title : '',
      category: src ? src.category : 'Study',
      why: src ? (src.why || '') : '',
      targetDate: src ? (src.targetDate || '') : '',
      accent: src ? (src.accent || 'blue') : 'blue',
      milestones: src ? src.milestones.map(function (m) {
        return { id: m.id, title: m.title, done: !!m.done };
      }) : []
    };

    function syncDraft(m) {
      var f;
      f = m.querySelector('#g-title'); if (f) draft.title = f.value;
      f = m.querySelector('#g-cat'); if (f) draft.category = f.value;
      f = m.querySelector('#g-why'); if (f) draft.why = f.value;
      f = m.querySelector('#g-date'); if (f) draft.targetDate = f.value;
      m.querySelectorAll('[data-ms-line]').forEach(function (inp) {
        var i = +inp.getAttribute('data-ms-line');
        if (draft.milestones[i]) draft.milestones[i].title = inp.value;
      });
    }

    function renderForm(m) {
      var body = m.querySelector('#goal-form');
      var stepsHTML = draft.milestones.length
        ? draft.milestones.map(function (ms, i) {
            return '<div class="row">' +
              '<input class="input" data-ms-line="' + i + '" maxlength="90" placeholder="Step ' + (i + 1) + '" value="' + esc(ms.title) + '">' +
              (ms.done ? '<span class="tag" title="Already done">✓ done</span>' : '') +
              '<button type="button" class="icon-btn danger" data-ms-del="' + i + '" title="Remove step">' + A.ui.icon('x', 'sm') + '</button>' +
              '</div>';
          }).join('')
        : '<div class="dim small">No steps yet — add your own or let Acendri suggest some.</div>';

      body.innerHTML =
        '<div class="field"><label>Goal title</label>' +
        '<input class="input" id="g-title" maxlength="90" placeholder="e.g. Run a half marathon" value="' + esc(draft.title) + '"></div>' +
        '<div class="grid2">' +
        '<div class="field"><label>Category</label><select class="select" id="g-cat">' +
        CATEGORIES.map(function (c) {
          return '<option value="' + esc(c) + '"' + (draft.category === c ? ' selected' : '') + '>' + esc(c) + '</option>';
        }).join('') +
        '</select></div>' +
        '<div class="field"><label>Target date (optional)</label>' +
        '<input class="input" id="g-date" type="date" value="' + esc(draft.targetDate) + '"></div>' +
        '</div>' +
        '<div class="field"><label>Why this goal?</label>' +
        '<textarea class="textarea" id="g-why" maxlength="240" placeholder="Why does this matter to you?">' + esc(draft.why) + '</textarea></div>' +
        '<div class="field"><label>Accent</label><div class="swatches">' +
        A.ui.ACCENT_NAMES.map(function (n) {
          return '<button type="button" data-swatch="' + n + '" class="' + (draft.accent === n ? 'sel' : '') + '"' +
            ' style="background:' + A.ui.ACCENTS[n].b + '" title="' + n + '"></button>';
        }).join('') +
        '</div></div>' +
        '<div class="field"><label>Steps (milestones)</label>' +
        '<div class="col">' + stepsHTML + '</div>' +
        '<div class="row" style="margin-top:8px">' +
        '<button type="button" class="btn btn-sm" data-add-step>+ Add step</button>' +
        '<button type="button" class="btn btn-sm btn-acc" data-suggest-form>✨ Suggest steps</button>' +
        '</div></div>';

      body.querySelectorAll('[data-swatch]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          syncDraft(m);
          draft.accent = btn.getAttribute('data-swatch');
          A.ui.ACCENT_NAMES.forEach(function (n) { m.classList.remove('acc-' + n); });
          m.classList.add('acc-' + draft.accent);
          renderForm(m);
        });
      });
      body.querySelectorAll('[data-ms-del]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          syncDraft(m);
          draft.milestones.splice(+btn.getAttribute('data-ms-del'), 1);
          renderForm(m);
        });
      });
      body.querySelector('[data-add-step]').addEventListener('click', function () {
        syncDraft(m);
        draft.milestones.push({ id: null, title: '', done: false });
        renderForm(m);
        var lines = m.querySelectorAll('[data-ms-line]');
        if (lines.length) lines[lines.length - 1].focus();
      });
      body.querySelector('[data-suggest-form]').addEventListener('click', function () {
        syncDraft(m);
        var have = {};
        draft.milestones.forEach(function (ms) { have[ms.title.trim().toLowerCase()] = true; });
        var added = 0;
        templateFor(draft.category).forEach(function (t) {
          if (have[t.toLowerCase()]) return;
          draft.milestones.push({ id: null, title: t, done: false });
          added++;
        });
        renderForm(m);
        A.ui.toast(added ? 'Suggested ' + added + ' steps for ' + draft.category : 'Those steps are already in', '✨');
      });
    }

    function save(m) {
      syncDraft(m);
      var title = draft.title.trim();
      if (!title) { A.ui.toast('Give your goal a title first', '✍️'); return false; }
      var ms = [];
      draft.milestones.forEach(function (line) {
        var t = line.title.trim();
        if (!t) return;
        ms.push({ id: line.id || A.ui.uid(), title: t, done: !!line.done });
      });
      var cat = CATEGORIES.indexOf(draft.category) >= 0 ? draft.category : 'Personal';
      var accent = A.ui.ACCENT_NAMES.indexOf(draft.accent) >= 0 ? draft.accent : 'blue';
      var why = draft.why.trim();
      var date = draft.targetDate || null;

      if (isEdit) {
        var found = false;
        A.S.update(function (s) {
          var g = findGoal(s, goalId);
          if (!g) return;
          found = true;
          g.title = title; g.category = cat; g.why = why;
          g.accent = accent; g.targetDate = date; g.milestones = ms;
        });
        A.ui.toast(found ? 'Goal updated' : 'That goal no longer exists', found ? '✏️' : '🤔');
      } else {
        A.S.update(function (s) {
          s.goals.push({
            id: A.ui.uid(), title: title, category: cat, why: why, accent: accent,
            targetDate: date, status: 'active', milestones: ms, createdAt: Date.now()
          });
        });
        A.ui.toast('Goal created — break it down and go 🎯', '🚀');
      }
      return true;
    }

    A.ui.modal({
      title: isEdit ? '✏️ Edit goal' : '🎯 New goal',
      accent: draft.accent,
      wide: true,
      body: '<div id="goal-form"></div>',
      actions: [
        { label: 'Cancel', cls: 'btn-ghost' },
        { label: isEdit ? 'Save changes' : 'Create goal', cls: 'btn-primary', onClick: function (m) { return save(m); } }
      ],
      onOpen: function (m) { renderForm(m); }
    });
  }

  /* ---------------- Ask Acendri (brain) modal ---------------- */

  var ASK_EXAMPLES = [
    'Become a professional tennis player',
    'Save $2,000 for a car',
    'Get an A in maths this term'
  ];

  function openAskModal() {
    var esc = A.ui.esc;
    var B = window.Ascendri.brain;
    if (!B || typeof B.goalFromText !== 'function') {
      A.ui.toast('Acendri’s brain isn’t available right now — try + New goal instead', '🤖');
      return;
    }

    var notes = '';
    var draft = null; // { title, category, accent, why, milestones:[str] }
    var closeFn = null;

    function syncNotes(m) {
      var t = m.querySelector('#ga-notes');
      if (t) notes = t.value;
    }

    function syncPreview(m) {
      var f = m.querySelector('#ga-title');
      if (f) draft.title = f.value;
      m.querySelectorAll('[data-ga-ms]').forEach(function (inp) {
        var i = +inp.getAttribute('data-ga-ms');
        if (i >= 0 && i < draft.milestones.length) draft.milestones[i] = inp.value;
      });
    }

    function renderNotes(m) {
      var body = m.querySelector('#ga-wrap');
      body.innerHTML =
        '<div class="field"><label>Your goal, in your own words</label>' +
        '<textarea class="textarea" id="ga-notes" rows="4" maxlength="500" ' +
        'placeholder="I want to make the state basketball team by next season. I can train after school and my jump shot needs the most work.">' +
        esc(notes) + '</textarea></div>' +
        '<div class="muted small">Mention what you’re aiming for, by when, and what needs the most work — Acendri drafts the goal and its steps for you.</div>' +
        '<div class="chips">' +
        ASK_EXAMPLES.map(function (x, i) {
          return '<button type="button" class="chip" data-ga-ex="' + i + '">' + esc(x) + '</button>';
        }).join('') +
        '</div>' +
        '<div class="modal-actions">' +
        '<button type="button" class="btn btn-ghost" data-ga-cancel>Cancel</button>' +
        '<button type="button" class="btn btn-acc" data-ga-gen>✨ Generate my goal</button>' +
        '</div>';

      body.querySelectorAll('[data-ga-ex]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var t = m.querySelector('#ga-notes');
          if (!t) return;
          t.value = ASK_EXAMPLES[+btn.getAttribute('data-ga-ex')] || '';
          notes = t.value;
          t.focus();
        });
      });
      body.querySelector('[data-ga-cancel]').addEventListener('click', function () {
        if (closeFn) closeFn();
      });
      body.querySelector('[data-ga-gen]').addEventListener('click', function () {
        syncNotes(m);
        var text = notes.trim();
        if (!text) { A.ui.toast('Tell Acendri a little about your goal first', '✍️'); return; }
        var d = null;
        try { d = B.goalFromText(text); } catch (e) { d = null; }
        if (!d) { A.ui.toast('Acendri couldn’t draft that one — try + New goal instead', '🤖'); return; }
        draft = {
          title: String(d.title || '').trim() || text.slice(0, 90),
          category: String(d.category || '').trim() || 'Personal',
          accent: A.ui.ACCENT_NAMES.indexOf(d.accent) >= 0 ? d.accent : 'cyan',
          why: String(d.why || '').trim(),
          milestones: (d.milestones || []).map(function (x) {
            return String(x == null ? '' : x).trim();
          }).filter(function (x) { return !!x; })
        };
        renderPreview(m);
      });
      var ta = m.querySelector('#ga-notes');
      if (ta) setTimeout(function () { ta.focus(); }, 60);
    }

    function renderPreview(m) {
      var body = m.querySelector('#ga-wrap');
      var accCol = (A.ui.ACCENTS[draft.accent] || A.ui.ACCENTS.cyan).c;
      var stepsHTML = draft.milestones.length
        ? draft.milestones.map(function (t, i) {
            return '<div class="row">' +
              '<input class="input" data-ga-ms="' + i + '" maxlength="90" placeholder="Step ' + (i + 1) + '" value="' + esc(t) + '">' +
              '<button type="button" class="icon-btn danger" data-ga-del="' + i + '" title="Remove step">' + A.ui.icon('x', 'sm') + '</button>' +
              '</div>';
          }).join('')
        : '<div class="dim small">No steps yet — add at least one so the goal has a first move.</div>';

      body.innerHTML =
        '<div class="muted small" style="margin-bottom:10px">Here’s Acendri’s draft — tweak anything, then create it.</div>' +
        '<div class="field"><label>Goal title</label>' +
        '<input class="input" id="ga-title" maxlength="90" placeholder="Goal title" value="' + esc(draft.title) + '"></div>' +
        '<div class="row wrap" style="gap:8px;margin-bottom:10px">' +
        '<span class="tag">' + esc(draft.category) + '</span>' +
        '<span class="tag" style="color:' + accCol + ';border-color:' + accCol + '">● ' + esc(draft.accent) + '</span>' +
        '</div>' +
        (draft.why ? '<div class="muted small" style="margin-bottom:10px">💡 ' + esc(draft.why) + '</div>' : '') +
        '<div class="field"><label>Steps (milestones)</label>' +
        '<div class="col">' + stepsHTML + '</div>' +
        '<div class="row" style="margin-top:8px">' +
        '<button type="button" class="btn btn-sm" data-ga-add>+ Add step</button>' +
        '</div></div>' +
        '<div class="modal-actions">' +
        '<button type="button" class="btn btn-ghost" data-ga-back>🔁 Rewrite</button>' +
        '<button type="button" class="btn btn-primary" data-ga-create>🎯 Create goal</button>' +
        '</div>';

      body.querySelectorAll('[data-ga-del]').forEach(function (btn) {

          syncPreview(m);
          draft.milestones.splice(+btn.getAttribute('data-ga-del'), 1);
          renderPreview(m);
        });
      });
      body.querySelector('[data-ga-add]').addEventListener('click', function () {
        syncPreview(m);
        draft.milestones.push('');
        renderPreview(m);
        var lines = m.querySelectorAll('[data-ga-ms]');
        if (lines.length) lines[lines.length - 1].focus();
      });
      body.querySelector('[data-ga-back]').addEventListener('click', function () {
        renderNotes(m);
      });
      body.querySelector('[data-ga-create]').addEventListener('click', function () {
        syncPreview(m);
        var title = draft.title.trim();
        if (!title) { A.ui.toast('Give your goal a title first', '✍️'); return; }
        var ms = [];
        draft.milestones.forEach(function (t) {
          var tt = String(t).trim();
          if (tt) ms.push({ id: A.ui.uid(), title: tt, done: false });
        });
        var cat = draft.category.trim() || 'Personal';
        var accent = A.ui.ACCENT_NAMES.indexOf(draft.accent) >= 0 ? draft.accent : 'cyan';
        var why = draft.why.trim();
        A.S.update(function (s) {

        if (closeFn) closeFn();

        renderNotes(m);

  /* ---------------- screen HTML builders ---------------- */

  function goalCardHTML(g) {
    var esc = A.ui.esc;

      '<div class="spread" style="align-items:flex-start">' +

      '<div class="row" style="gap:2px;flex:0 0 auto">' +
      '<button type="button" class="icon-btn" data-edit="' + g.id + '" title="Edit goal">' + A.ui.icon('edit') + '</button>' +
      '<button type="button" class="icon-btn danger" data-del="' + g.id + '" title="Delete goal">' + A.ui.icon('trash') + '</button>' +
      '</div></div>';

    var why = g.why
      ? '<div class="muted small">' + esc(g.why) + '</div>'
      : '';

    var date = g.targetDate
      ? '<div class="row small muted" style="gap:6px">' + A.ui.icon('calendar', 'sm') +
        '<span>Target: ' + A.ui.fmtDate(g.targetDate) + '</span>' + dueTagHTML(g.targetDate) + '</div>'
      : '';

    var bar =
      '<div>' +
      '<div class="bar lg"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="small muted" style="margin-top:6px">' + pct + '% · ' + done + '/' + total + ' milestones</div>' +
      '</div>';

    var steps;
    if (!total) {
      steps =
        '<div class="empty" style="padding:18px 14px">' +
        '<div class="e-emoji">🪜</div>' +
        '<p>No steps yet — big goals get done one step at a time.</p>' +
        '<button type="button" class="btn btn-acc btn-sm" data-suggest="' + g.id + '">✨ Suggest steps</button>' +
        '</div>';
    } else {
      steps = '<div class="list">' + g.milestones.map(function (m) {
        return '<div class="list-item' + (m.done ? ' done' : '') + '">' +
          '<button type="button" class="check' + (m.done ? ' on' : '') + '" data-ms-toggle data-goal="' + g.id + '" data-ms="' + m.id + '" title="' + (m.done ? 'Mark as not done' : 'Mark as done') + '">' + A.ui.icon('check', 'sm') + '</button>' +
          '<div class="li-main"><div class="li-title">' + esc(m.title) + '</div></div>' +
          '<button type="button" class="icon-btn" data-ms-task data-goal="' + g.id + '" data-ms="' + m.id + '" title="Create task from milestone">' + A.ui.icon('arrow', 'sm') + '</button>' +
          '</div>';
      }).join('') + '</div>';
    }

    var addRow =
      '<div class="row">' +
      '<input class="input" data-ms-input data-goal="' + g.id + '" maxlength="90" placeholder="Add a step…">' +
      '<button type="button" class="btn btn-sm" data-ms-add data-goal="' + g.id + '">Add</button>' +
      '</div>';

    var footer =
      '<button type="button" class="btn btn-acc" data-complete="' + g.id + '" style="width:100%">🏆 Mark goal complete</button>';

    return '<div class="card acc glow col acc-' + esc(g.accent || 'blue') + '">' +
      head + why + date + bar + steps + addRow + footer + '</div>';
  }

  function completedRowHTML(g) {
    var esc = A.ui.esc;
    var total = g.milestones.length;
    var done = g.milestones.filter(function (m) { return m.done; }).length;
    var when = g.completedAt
      ? A.ui.fmtDate(A.ui.dateISO(new Date(g.completedAt)))
      : '—';
    return '<div class="list-item done acc-' + esc(g.accent || 'blue') + '">' +
      '<span style="font-size:1.2rem">🏆</span>' +
      '<div class="li-main">' +
      '<div class="li-title">' + esc(g.title) + '</div>' +
      '<div class="li-sub">' + esc(g.category) + ' · completed ' + when + ' · ' + done + '/' + total + ' steps</div>' +
      '</div>' +
      '<button type="button" class="icon-btn" data-restore="' + g.id + '" title="Reactivate">' + A.ui.icon('arrow') + '</button>' +
      '<button type="button" class="icon-btn danger" data-del="' + g.id + '" title="Delete goal">' + A.ui.icon('trash') + '</button>' +
      '</div>';
  }

  /* ---------------- screen ---------------- */

  A.registerScreen('app/goals', {
    title: 'Goals',
    icon: 'target',
    accent: 'blue',
    inShell: true,
    order: 2,

    render: function (el, ctx) {
      var s = ctx.S.get();
      var goals = s.goals || [];
      var active = goals.filter(function (g) { return g.status !== 'done'; });
      var completed = goals.filter(function (g) { return g.status === 'done'; });

      var milestonesDone = 0;
      goals.forEach(function (g) {
        milestonesDone += g.milestones.filter(function (m) { return m.done; }).length;
      });
      var progressPool = active.length ? active : goals;
      var avg = progressPool.length
        ? Math.round(progressPool.reduce(function (a, g) { return a + A.engine.goalProgress(g); }, 0) / progressPool.length)
        : 0;

      var html =
        '<div class="screen-head"><div class="spread wrap">' +
        '<div><h1>Goals</h1><div class="sub">Big ambitions, broken into steps you can do today.</div></div>' +
        '<div class="row wrap" style="gap:10px">' +
        '<button type="button" class="btn btn-acc acc-cyan" data-ask>🤖 Ask Acendri</button>' +
        '<button type="button" class="btn btn-primary" data-new>+ New goal</button>' +
        '</div>' +
        '</div></div>';

      if (!goals.length) {
        html +=
          '<div class="empty section-gap">' +
          '<div class="e-emoji">🎯</div>' +
          '<p>A goal without a plan is just a wish. Create one and Acendri breaks it into steps.</p>' +
          '<div class="row wrap" style="gap:10px;justify-content:center">' +
          '<button type="button" class="btn btn-primary" data-new>+ Create your first goal</button>' +
          '<button type="button" class="btn btn-acc acc-cyan" data-ask>🤖 Ask Acendri</button>' +
          '</div>' +
          '</div>';
      } else {
        html +=
          '<div class="grid4">' +
          '<div class="card stat acc-blue"><span class="v h-acc">' + active.length + '</span><span class="k">Active goals</span></div>' +
          '<div class="card stat acc-green"><span class="v h-acc">' + completed.length + '</span><span class="k">Completed goals</span></div>' +
          '<div class="card stat acc-purple"><span class="v h-acc">' + milestonesDone + '</span><span class="k">Milestones done</span></div>' +
          '<div class="card stat acc-cyan"><span class="v h-acc">' + avg + '%</span><span class="k">Average progress</span></div>' +
          '</div>';

        if (active.length) {
          html += '<div class="grid2 section-gap">' + active.map(goalCardHTML).join('') + '</div>';
        } else {
          html +=
            '<div class="empty section-gap">' +
            '<div class="e-emoji">🌟</div>' +
            '<p>Every goal is complete — time to dream bigger.</p>' +
            '<button type="button" class="btn btn-primary" data-new>+ New goal</button>' +
            '</div>';
        }

        if (completed.length) {
          html +=
            '<div class="section-gap">' +
            '<h2 class="muted" style="font-size:.95rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">Completed</h2>' +
            '<div class="list">' + completed.map(completedRowHTML).join('') + '</div>' +
            '</div>';
        }
      }

      el.innerHTML = html;

      /* ---- wiring ---- */

      el.querySelectorAll('[data-new]').forEach(function (b) {
        b.addEventListener('click', function () { openGoalModal(null); });
      });
      el.querySelectorAll('[data-ask]').forEach(function (b) {
        b.addEventListener('click', function () { openAskModal(); });
      });
      el.querySelectorAll('[data-edit]').forEach(function (b) {
        b.addEventListener('click', function () { openGoalModal(b.getAttribute('data-edit')); });
      });
      el.querySelectorAll('[data-del]').forEach(function (b) {
        b.addEventListener('click', function () { deleteGoal(b.getAttribute('data-del')); });
      });
      el.querySelectorAll('[data-ms-toggle]').forEach(function (b) {
        b.addEventListener('click', function () {
          toggleMilestone(b.getAttribute('data-goal'), b.getAttribute('data-ms'));
        });
      });
      el.querySelectorAll('[data-ms-task]').forEach(function (b) {
        b.addEventListener('click', function () {
          milestoneToTask(b.getAttribute('data-goal'), b.getAttribute('data-ms'));
        });
      });
      el.querySelectorAll('[data-ms-add]').forEach(function (b) {
        b.addEventListener('click', function () {
          var gid = b.getAttribute('data-goal');
          var inp = el.querySelector('[data-ms-input][data-goal="' + gid + '"]');
          if (inp) addMilestone(gid, inp.value);
        });
      });
      el.querySelectorAll('[data-ms-input]').forEach(function (inp) {
        inp.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') addMilestone(inp.getAttribute('data-goal'), inp.value);
        });
      });
      el.querySelectorAll('[data-suggest]').forEach(function (b) {
        b.addEventListener('click', function () { suggestForGoal(b.getAttribute('data-suggest')); });
      });
      el.querySelectorAll('[data-complete]').forEach(function (b) {
        b.addEventListener('click', function () { completeGoal(b.getAttribute('data-complete')); });
      });
      el.querySelectorAll('[data-restore]').forEach(function (b) {
        b.addEventListener('click', function () { reactivateGoal(b.getAttribute('data-restore')); });
      });
    }
  });
})();

/* ===== js/tasks.js ===== */
/* ============================================================
   Acendri OS — Tasks: the small-actions engine.
   Summary chips, filters, a sorted task list with priority
   accents, a new/edit modal and a bridge to the timetable.
   ============================================================ */
(function () {
  'use strict';
  var A = window.Ascendri;

  /* module-level filter state (survives re-renders) */
  var FILTER = 'all';       // 'all' | 'today' | 'upcoming' | 'done'
  var PRIO = 0;             // 0 = any, 1 low, 2 medium, 3 high

  var PRIO_NAME = { 1: 'Low', 2: 'Medium', 3: 'High' };
  var PRIO_ACC = { 1: 'cyan', 2: 'orange', 3: 'red' };
  var DURATIONS = [20, 30, 45, 60, 90, 120];

  /* ---------------- helpers ---------------- */

  function sortTasks(list) {
    var t = A.ui.todayISO();
    return list.slice().sort(function (a, b) {
      if (!!a.done !== !!b.done) return a.done ? 1 : -1;
      if (a.done && b.done) return (b.doneAt || 0) - (a.doneAt || 0);
      var ao = a.due && a.due < t, bo = b.due && b.due < t;
      if (!!ao !== !!bo) return ao ? -1 : 1;                    // overdue first
      var da = a.due || '9999-12-31', db = b.due || '9999-12-31';
      if (da !== db) return da < db ? -1 : 1;                   // due asc, nulls last
      if ((a.priority || 1) !== (b.priority || 1)) return (b.priority || 1) - (a.priority || 1);
      return (a.createdAt || 0) - (b.createdAt || 0);
    });
  }

  function matchesFilter(task) {
    var t = A.ui.todayISO();
    if (FILTER === 'today' && (task.done || !task.due || task.due > t)) return false;
    if (FILTER === 'upcoming' && (task.done || (task.due && task.due <= t))) return false;
    if (FILTER === 'done' && !task.done) return false;
    if (PRIO && (task.priority || 1) !== PRIO) return false;
    return true;
  }

  /* ---------------- new / edit modal ---------------- */

  function openTaskModal(taskId) {
    var esc = A.ui.esc;
    var s = A.S.get();
    var task = null;
    (s.tasks || []).forEach(function (t) { if (t.id === taskId) task = t; });
    var isNew = !task;

    var vTitle = isNew ? '' : task.title;
    var vDue = isNew ? A.ui.todayISO() : (task.due || '');
    var vDur = isNew ? 45 : (task.duration || 45);
    var vPrio = isNew ? 2 : (task.priority || 2);
    var vGoal = isNew ? '' : (task.goalId || '');

    var goals = (s.goals || []).filter(function (g) { return g.status === 'active'; });
    if (vGoal && !goals.some(function (g) { return g.id === vGoal; })) {
      (s.goals || []).forEach(function (g) { if (g.id === vGoal) goals.push(g); });
    }

    A.ui.modal({
      title: (isNew ? '📥 New task' : '✏️ Edit task'),
      accent: 'green',
      body:
        '<div class="field"><label>What needs doing?</label>' +
          '<input id="tk-title" class="input" maxlength="90" placeholder="e.g. Maths practice paper #4" value="' + esc(vTitle) + '"></div>' +
        '<div class="grid2">' +
          '<div class="field"><label>Due date</label>' +
            '<input id="tk-due" class="input" type="date" value="' + esc(vDue) + '"></div>' +
          '<div class="field"><label>Duration</label>' +
            '<select id="tk-dur" class="select">' +
              (DURATIONS.indexOf(vDur) === -1
                ? DURATIONS.concat([vDur]).sort(function (a, b) { return a - b; })
                : DURATIONS
              ).map(function (d) {
                return '<option value="' + d + '"' + (d === vDur ? ' selected' : '') + '>' + d + ' min</option>';
              }).join('') +
            '</select></div>' +
        '</div>' +
        '<div class="grid2">' +
          '<div class="field"><label>Priority</label>' +
            '<select id="tk-prio" class="select">' +
              [1, 2, 3].map(function (p) {
                return '<option value="' + p + '"' + (p === vPrio ? ' selected' : '') + '>' + PRIO_NAME[p] + '</option>';
              }).join('') +
            '</select></div>' +
          '<div class="field"><label>Linked goal</label>' +
            '<select id="tk-goal" class="select">' +
              '<option value="">No goal</option>' +
              goals.map(function (g) {
                return '<option value="' + esc(g.id) + '"' + (g.id === vGoal ? ' selected' : '') + '>' +
                  esc(g.title) + (g.status === 'done' ? ' (done)' : '') + '</option>';
              }).join('') +
            '</select></div>' +
        '</div>',
      actions: [
        { label: 'Cancel', cls: 'btn-ghost' },
        {
          label: isNew ? 'Add task' : 'Save changes',
          cls: 'btn-primary',
          onClick: function (m) {
            var title = m.querySelector('#tk-title').value.trim();
            if (!title) { A.ui.toast('Give your task a title first', '✍️'); return false; }
            var due = m.querySelector('#tk-due').value || null;
            var dur = +m.querySelector('#tk-dur').value || 45;
            var prio = +m.querySelector('#tk-prio').value || 2;
            var goalId = m.querySelector('#tk-goal').value || null;
            A.S.update(function (st) {
              if (isNew) {
                st.tasks.push({
                  id: A.ui.uid(), title: title, priority: prio, due: due,
                  duration: dur, done: false, goalId: goalId || undefined, createdAt: Date.now()
                });
              } else {
                for (var i = 0; i < st.tasks.length; i++) {
                  if (st.tasks[i].id === taskId) {
                    st.tasks[i].title = title;
                    st.tasks[i].due = due;
                    st.tasks[i].duration = dur;
                    st.tasks[i].priority = prio;
                    if (goalId) st.tasks[i].goalId = goalId; else delete st.tasks[i].goalId;
                    break;
                  }
                }
              }
            });
            if (isNew) A.ui.toast('Task added — it’ll be planned into your week', '🗓️');
            else A.ui.toast('Task updated', '✏️');
          }
        }
      ]
    });
  }

  /* ---------------- Ask Acendri (brain) flow ---------------- */

  function brainOrToast() {
    var B = window.Ascendri.brain;
    if (!B || typeof B.tasksFromText !== 'function') {
      A.ui.toast('Acendri’s brain isn’t loaded yet — use + New task for now', '🤖');
      return null;
    }
    return B;
  }

  /* normalise whatever the brain returns into a safe task draft */
  function cleanDraft(d) {
    d = d || {};
    var p = +d.priority;
    if (p !== 1 && p !== 2 && p !== 3) p = 2;
    return {
      title: String(d.title || 'Untitled task').slice(0, 90),
      priority: p,
      due: (typeof d.due === 'string' && d.due) ? d.due : null,
      duration: +d.duration || 45
    };
  }

  function openAskModal(prefill) {
    var esc = A.ui.esc;
    A.ui.modal({
      title: '🤖 What do you need to get done?',
      accent: 'cyan',
      wide: true,
      body:
        '<div class="field"><label>Tell Acendri in your own words</label>' +
          '<textarea id="ask-text" class="textarea" rows="4" maxlength="400" ' +
            'placeholder="I have a maths exam Friday and basketball training twice this week, plus I need to fix my bike">' +
            esc(prefill || '') + '</textarea></div>' +
        '<div class="small muted">💡 Acendri will split this into bite-size tasks spread over the week — ' +
          'and the timetable engine plans them around your weekly commitments.</div>',
      actions: [
        { label: 'Cancel', cls: 'btn-ghost' },
        {
          label: '✨ Generate tasks',
          cls: 'btn-acc',
          onClick: function (m) {
            var text = m.querySelector('#ask-text').value.trim();
            if (!text) { A.ui.toast('Tell Acendri what’s on your plate first', '✍️'); return false; }
            var B = brainOrToast();
            if (!B) return false;
            var drafts;
            try { drafts = (B.tasksFromText(text) || []).map(cleanDraft); }
            catch (e) { drafts = []; }
            if (!drafts.length) {
              A.ui.toast('Couldn’t draft tasks from that — try adding a bit more detail', '🤖');
              return false;
            }
            openPreviewModal(text, drafts);
          }
        }
      ]
    });
  }

  function openPreviewModal(text, drafts) {
    var esc = A.ui.esc;
    var rowsHTML = drafts.map(function (d, i) {
      var meta = 'P' + d.priority + ' · ' + d.duration + ' min · ' +
        (d.due ? esc(A.ui.fmtDate(d.due)) : 'No due date');
      return '<div class="list-item">' +
        '<label class="checkbox" title="Include this task">' +
          '<input type="checkbox" data-keep="' + i + '" checked aria-label="Include this task"></label>' +
        '<div class="li-main">' +
          '<input class="input" data-dtitle="' + i + '" maxlength="90" value="' + esc(d.title) + '" aria-label="Task title">' +
          '<div class="li-sub" style="margin-top:4px">' + meta + '</div>' +
        '</div>' +
        '</div>';
    }).join('');

    A.ui.modal({
      title: '🤖 Here’s your plan',
      accent: 'cyan',
      wide: true,
      body:
        '<div class="small muted" style="margin-bottom:10px">Untick anything you don’t need and tweak the titles — then add them to your list.</div>' +
        '<div class="list">' + rowsHTML + '</div>',
      actions: [
        {
          label: '🔁 Rewrite',
          cls: 'btn-ghost',
          onClick: function () { openAskModal(text); }
        },
        {
          label: '📋 Add ' + drafts.length + ' task' + (drafts.length === 1 ? '' : 's'),
          cls: 'btn-acc',
          onClick: function (m) {
            var picked = [], missingTitle = false;
            drafts.forEach(function (d, i) {
              var cb = m.querySelector('input[data-keep="' + i + '"]');
              if (!cb || !cb.checked) return;
              var inp = m.querySelector('input[data-dtitle="' + i + '"]');
              var title = (inp ? inp.value : d.title).trim();
              if (!title) { missingTitle = true; return; }
              picked.push({ title: title, priority: d.priority, due: d.due, duration: d.duration });
            });
            if (missingTitle) { A.ui.toast('Give every ticked task a title — or untick it', '✍️'); return false; }
            if (!picked.length) { A.ui.toast('Tick at least one task to add', '☑️'); return false; }
            var now = Date.now();
            A.S.update(function (st) {
              st.tasks = st.tasks || [];
              picked.forEach(function (p) {
                st.tasks.push({
                  id: A.ui.uid(), title: p.title, priority: p.priority, due: p.due,
                  duration: p.duration, done: false, createdAt: now
                });
              });
            });
            A.S.log('Acendri drafted ' + picked.length + ' task' + (picked.length === 1 ? '' : 's') + ' from your brief', '🤖');
            A.ui.toast(picked.length + ' task' + (picked.length === 1 ? '' : 's') +
              ' added — generate your week to slot them in', '🤖');
          }
        }
      ],
      onOpen: function (m) {
        var acts = m.querySelectorAll('.modal-actions [data-act]');
        var addBtn = acts[acts.length - 1];
        function syncLabel() {
          var n = m.querySelectorAll('input[data-keep]:checked').length;
          if (addBtn) addBtn.textContent = '📋 Add ' + n + ' task' + (n === 1 ? '' : 's');
        }
        m.querySelectorAll('input[data-keep]').forEach(function (cb) {
          cb.addEventListener('change', syncLabel);
        });
        syncLabel();
      }
    });
  }

  /* ---------------- HTML builders ---------------- */

  function headHTML() {
    return '<div class="screen-head"><div class="spread wrap">' +
      '<div><h1>Tasks</h1>' +
      '<div class="sub">Small actions, ticked off. This is where goals become real.</div></div>' +
      '<div class="row wrap">' +
        '<button class="btn btn-acc acc-cyan" data-ask="1">🤖 Ask Acendri</button>' +
        '<button class="btn btn-primary" data-new="1">+ New task</button>' +
      '</div>' +
      '</div></div>';
  }

  function chipsHTML(s) {
    var t = A.ui.todayISO();
    var tasks = s.tasks || [];
    var open = 0, dueToday = 0, overdue = 0, done = 0;
    tasks.forEach(function (task) {
      if (task.done) { done++; return; }
      open++;
      if (task.due === t) dueToday++;
      if (task.due && task.due < t) overdue++;
    });
    return '<div class="row wrap">' +
      '<span class="tag acc-green"><span class="badge-dot"></span> Open ' + open + '</span>' +
      '<span class="tag acc-orange"><span class="badge-dot"></span> Due today ' + dueToday + '</span>' +
      '<span class="tag acc-red"><span class="badge-dot"></span> ' +
        (overdue > 0 ? '<span class="neg">Overdue ' + overdue + '</span>' : 'Overdue 0') + '</span>' +
      '<span class="tag acc-cyan"><span class="badge-dot"></span> Done ' + done + '</span>' +
      '</div>';
  }

  function filterBarHTML() {
    var btns = [['all', 'All'], ['today', 'Today'], ['upcoming', 'Upcoming'], ['done', 'Done']];
    return '<div class="row wrap section-gap">' +
      btns.map(function (b) {
        var active = FILTER === b[0];
        return '<button class="btn btn-sm' + (active ? ' btn-acc acc-green' : ' btn-ghost') + '" data-filter="' + b[0] + '">' + b[1] + '</button>';
      }).join('') +
      '<div style="flex:1"></div>' +
      '<select id="prio-filter" class="select" style="width:auto;min-width:150px" aria-label="Filter by priority">' +
        '<option value="0"' + (PRIO === 0 ? ' selected' : '') + '>Any priority</option>' +
        [3, 2, 1].map(function (p) {
          return '<option value="' + p + '"' + (PRIO === p ? ' selected' : '') + '>' + PRIO_NAME[p] + '</option>';
        }).join('') +
      '</select>' +
      '</div>';
  }

  function emptyHTML(s, filteredOut) {
    if (filteredOut) {
      return '<div class="empty section-gap"><div class="e-emoji">🔍</div>' +
        '<p>No tasks match this priority filter.</p>' +
        '<button class="btn btn-acc acc-green" data-clearprio="1">Clear priority filter</button></div>';
    }
    if (FILTER === 'done') {
      return '<div class="empty section-gap"><div class="e-emoji">🌱</div>' +
        '<p>Nothing done yet — tick your first task!</p>' +
        '<button class="btn btn-acc acc-green" data-filter="all">Show open tasks</button></div>';
    }
    if (FILTER === 'today') {
      return '<div class="empty section-gap"><div class="e-emoji">🌞</div>' +
        '<p>Nothing due today — you’re on top of things.</p>' +
        '<button class="btn btn-acc acc-green" data-filter="upcoming">See what’s upcoming</button></div>';
    }
    if (FILTER === 'upcoming') {
      return '<div class="empty section-gap"><div class="e-emoji">🗓️</div>' +
        '<p>Nothing on the horizon — add a task for later this week.</p>' +
        '<button class="btn btn-acc acc-green" data-new="1">+ New task</button></div>';
    }
    return '<div class="empty section-gap"><div class="e-emoji">📝</div>' +
      '<p>No tasks yet — describe your week to Acendri, or add your first small action yourself.</p>' +
      '<div class="row wrap" style="justify-content:center">' +
        '<button class="btn btn-acc acc-cyan" data-ask="1">🤖 Ask Acendri</button>' +
        '<button class="btn btn-acc acc-green" data-new="1">+ New task</button>' +
      '</div></div>';
  }

  function taskItemHTML(task, goalById) {
    var esc = A.ui.esc;
    var t = A.ui.todayISO();
    var prio = task.priority || 1;
    var acc = PRIO_ACC[prio] || 'cyan';
    var overdue = !task.done && task.due && task.due < t;

    var sub = [];
    if (task.done) {
      sub.push('✔ Done ' + esc(A.ui.timeAgo(task.doneAt || task.createdAt || Date.now())));
    } else if (task.due) {
      sub.push(overdue
        ? '<span class="neg">Overdue · ' + esc(A.ui.fmtDate(task.due)) + '</span>'
        : esc(A.ui.fmtDate(task.due)));
    } else {
      sub.push('No due date');
    }
    sub.push(esc(String(task.duration || 45)) + ' min');
    var goal = task.goalId && goalById[task.goalId];
    var goalTag = goal ? ' <span class="tag">🎯 ' + esc(goal.title) + '</span>' : '';

    return '<div class="list-item' + (task.done ? ' done' : '') + '">' +
      '<button class="check acc-' + acc + (task.done ? ' on' : '') + '" data-check="' + esc(task.id) + '"' +
        ' title="' + (task.done ? 'Mark as not done' : 'Mark done') + '" aria-label="Toggle task done">' +
        A.ui.icon('check', 'sm') + '</button>' +
      '<div class="li-main">' +
        '<div class="li-title">' + esc(task.title) + '</div>' +
        '<div class="li-sub">' + sub.join(' · ') + goalTag + '</div>' +
      '</div>' +
      '<span class="pill acc-' + acc + '">' + PRIO_NAME[prio] + '</span>' +
      '<button class="icon-btn" data-edit="' + esc(task.id) + '" title="Edit task" aria-label="Edit task">' + A.ui.icon('edit', 'sm') + '</button>' +
      '<button class="icon-btn danger" data-del="' + esc(task.id) + '" title="Delete task" aria-label="Delete task">' + A.ui.icon('trash', 'sm') + '</button>' +
      '</div>';
  }

  function footerHTML(s) {
    var doneCount = (s.tasks || []).filter(function (t) { return t.done; }).length;
    var html = '';
    if (doneCount > 0) {
      html += '<div class="row section-gap">' +
        '<button class="btn btn-ghost btn-sm" data-cleardone="1">🧹 Clear completed (' + doneCount + ')</button>' +
        '</div>';
    }
    html += '<div class="card acc acc-purple section-gap"><div class="spread wrap">' +
      '<div class="row"><span style="font-size:1.35rem">⚡</span>' +
        '<div><div class="bold">Let Acendri place these into your week automatically</div>' +
        '<div class="small muted">The timetable engine fits open tasks around your fixed commitments.</div></div></div>' +
      '<button class="btn btn-acc" data-nav="app/schedule">Open timetable</button>' +
      '</div></div>';
    return html;
  }

  /* ---------------- screen ---------------- */

  function renderTasks(el, ctx) {
    var s = A.S.get();
    var tasks = s.tasks || [];
    var goalById = {};
    (s.goals || []).forEach(function (g) { goalById[g.id] = g; });

    var visible = sortTasks(tasks).filter(matchesFilter);

    var listHTML;
    if (!visible.length) {
      // distinguish "nothing here" from "priority filter hides everything"
      var savedPrio = PRIO;
      PRIO = 0;
      var wouldShow = tasks.filter(matchesFilter).length;
      PRIO = savedPrio;
      listHTML = emptyHTML(s, PRIO !== 0 && wouldShow > 0);
    } else {
      listHTML = '<div class="list" style="margin-top:16px">' +
        visible.map(function (task) { return taskItemHTML(task, goalById); }).join('') +
        '</div>';
    }

    el.innerHTML = headHTML() + chipsHTML(s) + filterBarHTML() + listHTML + footerHTML(s);

    /* ---- listeners ---- */

    el.querySelectorAll('[data-nav]').forEach(function (b) {
      b.addEventListener('click', function () { ctx.nav(b.getAttribute('data-nav')); });
    });

    el.querySelectorAll('[data-new]').forEach(function (b) {
      b.addEventListener('click', function () { openTaskModal(null); });
    });

    el.querySelectorAll('[data-ask]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!brainOrToast()) return; // no brain module -> graceful toast, no dead modal
        openAskModal('');
      });
    });

    el.querySelectorAll('[data-filter]').forEach(function (b) {
      b.addEventListener('click', function () {
        FILTER = b.getAttribute('data-filter');
        renderTasks(el, ctx);
      });
    });

    var prioSel = el.querySelector('#prio-filter');
    if (prioSel) {
      prioSel.addEventListener('change', function () {
        PRIO = +prioSel.value || 0;
        renderTasks(el, ctx);
      });
    }

    el.querySelectorAll('[data-clearprio]').forEach(function (b) {
      b.addEventListener('click', function () { PRIO = 0; renderTasks(el, ctx); });
    });

    el.querySelectorAll('[data-check]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-check');
        var completed = false, unticked = false, prio = 1, title = '';
        A.S.update(function (st) {
          for (var i = 0; i < st.tasks.length; i++) {
            var task = st.tasks[i];
            if (task.id !== id) continue;
            title = task.title;
            prio = task.priority || 1;
            if (task.done) {
              task.done = false;
              delete task.doneAt;
              unticked = true;
            } else {
              task.done = true;
              task.doneAt = Date.now();
              completed = true;
            }
            break;
          }
        });
        if (completed) A.S.addXp(prio === 3 ? 15 : 10, 'Task completed: ' + title);
        else if (unticked) A.ui.toast('Moved "' + title + '" back to open', '↩️');
      });
    });

    el.querySelectorAll('[data-edit]').forEach(function (b) {
      b.addEventListener('click', function () { openTaskModal(b.getAttribute('data-edit')); });
    });

    el.querySelectorAll('[data-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-del');
        var task = null;
        (A.S.get().tasks || []).forEach(function (t) { if (t.id === id) task = t; });
        if (!task) return;
        A.ui.confirm('Delete "' + task.title + '"? This can’t be undone.', function () {
          A.S.update(function (st) {
            st.tasks = st.tasks.filter(function (t) { return t.id !== id; });
          });
          A.ui.toast('Task deleted', '🗑️');
        }, { title: 'Delete task', yesLabel: 'Delete' });
      });
    });

    el.querySelectorAll('[data-cleardone]').forEach(function (b) {
      b.addEventListener('click', function () {
        var n = (A.S.get().tasks || []).filter(function (t) { return t.done; }).length;
        if (!n) return;
        A.ui.confirm('Remove ' + n + ' completed task' + (n === 1 ? '' : 's') + ' from the list? Your XP stays yours.', function () {
          A.S.update(function (st) {
            st.tasks = st.tasks.filter(function (t) { return !t.done; });
          });
          A.ui.toast('Cleared ' + n + ' completed task' + (n === 1 ? '' : 's'), '🧹');
        }, { title: 'Clear completed', yesLabel: 'Clear them' });
      });
    });
  }

  A.registerScreen('app/tasks', {
    title: 'Tasks',
    icon: 'checksq',
    accent: 'green',
    inShell: true,
    order: 3,
    render: renderTasks
  });
})();

/* ===== js/schedule.js ===== */
/* ============================================================
   Acendri OS — Timetable screen
   Fixed commitments + open tasks -> one auto-planned week.
   ============================================================ */
(function () {
  'use strict';
  var A = window.Ascendri;

  var PX_PER_MIN = 0.9;
  var DAY_LETTERS = ['S', 'M', 'T', 'W', 'T', 'F', 'S']; // Sunday = 0

  /* ---------------- lookups ---------------- */

  function findCommitment(s, id) {
    return (s.commitments || []).filter(function (c) { return c.id === id; })[0] || null;
  }

  function findTask(s, id) {
    return (s.tasks || []).filter(function (t) { return t.id === id; })[0] || null;
  }

  function findBlock(s, iso, blockId) {
    if (!s.timetable || !s.timetable.days || !s.timetable.days[iso]) return null;
    return s.timetable.days[iso].filter(function (b) { return b.id === blockId; })[0] || null;
  }

  function safeAccent(name, fallback) {
    return A.ui.ACCENT_NAMES.indexOf(name) >= 0 ? name : fallback;
  }

  function wakeSleep(s) {
    var wake = A.ui.minutes((s.settings && s.settings.wake) || '07:00');
    var sleep = A.ui.minutes((s.settings && s.settings.sleep) || '22:30');
    if (sleep <= wake) sleep = wake + 8 * 60;
    return { wake: wake, sleep: sleep };
  }

  function fmtDays(days) {
    var d = (days || []).slice().sort(function (a, b) { return a - b; });
    if (d.length === 7) return 'Every day';
    return d.map(function (i) { return A.ui.DAY_NAMES[i]; }).join(' ') || '—';
  }

  function taskBlockProgress(s, tt) {
    var total = 0, done = 0;
    if (tt && tt.days) {
      Object.keys(tt.days).forEach(function (iso) {
        tt.days[iso].forEach(function (b) {
          if (b.type !== 'task') return;
          total++;
          var t = findTask(s, b.refId);
          if (b.done || (t && t.done)) done++;
        });
      });
    }
    return { total: total, done: done };
  }

  /* ---------------- actions ---------------- */

  function unplacedToast(tt) {
    if (tt && tt.unplaced && tt.unplaced.length) {
      A.ui.toast('Couldn’t fit ' + tt.unplaced.length + ' task' + (tt.unplaced.length === 1 ? '' : 's') + ' — see the note below', '⚠️');
    }
  }

  function generateWeek() {
    var pre = A.S.get();
    var openTasks = (pre.tasks || []).filter(function (t) { return !t.done; }).length;
    var hasCommitments = (pre.commitments || []).length > 0;

    if (!openTasks && !hasCommitments) {
      // Nothing to build a week from — an empty grid would just look broken.
      A.ui.toast('Nothing to plan yet — tell Acendri about your week', '🌱');
      openAskModal('');
      return;
    }

    // No XP for planning — core settles the week when it ends and pays per completed block.
    A.S.update(function (s) { A.engine.generateTimetable(s); });
    var after = A.S.get();
    var tt = after.timetable;
    if (!tt) return;
    if (!openTasks) {
      A.ui.toast('Planned your commitments — add tasks for Acendri to slot in around them', '🗓️');
    } else {
      var n = taskBlockProgress(after, tt).total;
      A.ui.toast('Planned ' + n + ' task block' + (n === 1 ? '' : 's') + ' this week', '🗓️');
    }
    unplacedToast(tt);
  }

  function clearPlan() {
    A.ui.confirm('Clear the generated plan? Your tasks and commitments stay — only this week’s layout goes.', function () {
      A.S.update(function (s) { s.timetable = null; });
      A.ui.toast('Plan cleared — generate again any time', '🧹');
