    }, { title: 'Clear plan', yesLabel: 'Clear plan' });
  }

  function deleteCommitment(id) {
    var c = findCommitment(A.S.get(), id);
    if (!c) return;
    A.ui.confirm('Delete "' + c.title + '"? Its blocks come off the timetable too.', function () {
      A.S.update(function (s) {
        s.commitments = s.commitments.filter(function (x) { return x.id !== id; });
        if (s.timetable && s.timetable.days) {
          Object.keys(s.timetable.days).forEach(function (iso) {
            s.timetable.days[iso] = s.timetable.days[iso].filter(function (b) {
              return !(b.type === 'commitment' && b.refId === id);
            });
          });
        }
      });
      A.ui.toast('Commitment deleted — regenerate to reclaim the time', '🗑️');
    }, { yesLabel: 'Delete it' });
  }

  function removeBlock(iso, blockId) {
    A.S.update(function (s) {
      if (s.timetable && s.timetable.days && s.timetable.days[iso]) {
        s.timetable.days[iso] = s.timetable.days[iso].filter(function (b) { return b.id !== blockId; });
      }
    });
    A.ui.toast('Removed from this week’s plan', '🗓️');
  }

  function markTaskDone(iso, blockId) {
    var xp = 0, title = '', already = false, found = false;
    A.S.update(function (s) {
      var b = findBlock(s, iso, blockId);
      if (!b) return;
      found = true;
      title = b.title;
      var t = findTask(s, b.refId);
      if (t && !t.done) {
        t.done = true;
        t.doneAt = Date.now();
        xp = t.priority === 3 ? 15 : 10;
        title = t.title;
      } else if (t) {
        already = true;
        title = t.title;
      }
      // tick every block that points at this task
      Object.keys(s.timetable.days).forEach(function (d) {
        s.timetable.days[d].forEach(function (bb) {
          if (bb.type === 'task' && bb.refId === b.refId) bb.done = true;
        });
      });
    });
    if (!found) return;
    if (xp) A.S.addXp(xp, 'Task done: ' + title);
    else A.ui.toast(already ? '“' + title + '” was already done — block ticked off' : 'Block ticked off', '✅');
  }

  /* ---------------- Ask Acendri (plan from plain words) ---------------- */

  var ASK_EXAMPLES = [
    'Basketball training 3 times this week, one hour each',
    'Study for my science test on Thursday',
    'Gym twice and one long run on Saturday',
    'Practise guitar 4 times, 30 minutes each'
  ];

  function openAskModal(prefill) {
    var esc = A.ui.esc;
    if (!window.Ascendri.brain) {
      A.ui.toast('Acendri’s brain isn’t loaded — add tasks and commitments by hand instead', '🤖');
      return;
    }

    function submit(m) {
      var B = window.Ascendri.brain;
      var field = m.querySelector('#ask-text');
      var text = field ? field.value.trim() : '';
      if (!text) { A.ui.toast('Tell Acendri at least one thing about your week', '✍️'); return false; }
      if (!B) { A.ui.toast('Acendri’s brain isn’t loaded — add tasks and commitments by hand instead', '🤖'); return true; }
      var plan = B.planFromText(text);
      if (!plan || !plan.sessions || !plan.sessions.length) {
        A.ui.toast('Acendri couldn’t find anything to plan in that — try naming an activity', '🤔');
        return false;
      }
      openPlanConfirmModal(text, plan);
      return true; // close this modal, the confirm view takes over
    }

    A.ui.modal({
      title: '🤖 Tell Acendri about your week',
      accent: 'cyan',
      wide: true,
      body:
        '<div class="field"><label>What’s on this week?</label>' +
        '<textarea class="textarea" id="ask-text" rows="4" placeholder="Basketball training 3 times this week, one hour each. Study for my science test on Thursday. Keep Sunday free.">' + esc(prefill || '') + '</textarea></div>' +
        '<p class="muted small">Plain words are fine — Acendri picks out the activities, how often and how long, then plans them around your commitments. Tap an example to start:</p>' +
        '<div class="chips">' +
        ASK_EXAMPLES.map(function (ex, i) {
          return '<button type="button" class="chip" data-ex="' + i + '">' + esc(ex) + '</button>';
        }).join('') +
        '</div>',
      actions: [
        { label: 'Cancel', cls: 'btn-ghost' },
        { label: '⚡ Plan my week', cls: 'btn-primary', onClick: function (m) { return submit(m); } }
      ],
      onOpen: function (m) {
        var field = m.querySelector('#ask-text');
        m.querySelectorAll('[data-ex]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var ex = ASK_EXAMPLES[+btn.getAttribute('data-ex')] || '';
            var cur = field.value.trim();
            field.value = cur ? cur.replace(/[.\s]*$/, '') + '. ' + ex : ex;
            field.focus();
          });
        });
        if (field) field.focus();
      }
    });
  }

  function openPlanConfirmModal(text, plan) {
    var esc = A.ui.esc;
    var sessions = (plan.sessions || []).map(function (se) {
      return {
        title: String(se.title || 'Session'),
        count: Math.max(1, Math.min(7, Math.round(se.count) || 1)),
        duration: Math.max(15, Math.min(240, Math.round(se.duration) || 45)),
        accent: safeAccent(se.accent, 'cyan')
      };
    });
    var totalTasks = sessions.reduce(function (a, se) { return a + se.count; }, 0);

    A.ui.modal({
      title: '🤖 Here’s what Acendri heard',
      accent: 'cyan',
      wide: true,
      body:
        (plan.summary ? '<p class="muted small" style="margin-bottom:10px">' + esc(plan.summary) + '</p>' : '') +
        '<div class="list">' +
        sessions.map(function (se) {
          return '<div class="list-item">' +
            '<span class="badge-dot acc-' + se.accent + '"></span>' +
            '<div class="li-main">' +
            '<div class="li-title">' + esc(se.title) + ' ×' + se.count + '</div>' +
            '<div class="li-sub">' + se.duration + ' min each</div>' +
            '</div></div>';
        }).join('') +
        '</div>' +
        '<p class="dim small" style="margin-top:10px">' + totalTasks + ' task' + (totalTasks === 1 ? '' : 's') +
        ' will be added, spread over the next 6 days, then the week regenerates around your commitments.</p>',
      actions: [
        { label: '← Edit', cls: 'btn-ghost', onClick: function () { openAskModal(text); } },
        { label: 'Add & generate', cls: 'btn-primary', onClick: function () { addSessionsAndGenerate(sessions); } }
      ]
    });
  }

  function addSessionsAndGenerate(sessions) {
    var now = Date.now();
    var t0 = A.ui.todayISO();
    A.S.update(function (s) {
      if (!s.tasks) s.tasks = [];
      sessions.forEach(function (se, si) {
        for (var i = 0; i < se.count; i++) {
          s.tasks.push({
            id: A.ui.uid(),
            title: se.title + (se.count > 1 ? ' (' + (i + 1) + '/' + se.count + ')' : ''),
            priority: 2,
            due: A.ui.addDaysISO(t0, 1 + Math.floor(i * 6 / se.count)),
            duration: se.duration,
            done: false,
            createdAt: now + si * 10 + i
          });
        }
      });
      A.engine.generateTimetable(s);
    });
    var after = A.S.get();
    var tt = after.timetable;
    var placed = taskBlockProgress(after, tt).total;
    A.ui.toast('Acendri placed ' + placed + ' block' + (placed === 1 ? '' : 's') + ' into your week', '🤖');
    unplacedToast(tt);
    A.S.log('Acendri planned the week from a description', '🤖');
  }

  /* ---------------- commitment modal ---------------- */

  function openCommitmentModal(commitmentId) {
    var esc = A.ui.esc;
    var src = commitmentId ? findCommitment(A.S.get(), commitmentId) : null;
    var isEdit = !!src;
    var draft = {
      title: src ? src.title : '',
      days: src ? (src.days || []).slice() : [],
      start: src ? src.start : '09:00',
      end: src ? src.end : '10:00',
      accent: src ? safeAccent(src.accent, 'indigo') : 'indigo'
    };

    function syncDraft(m) {
      var f;
      f = m.querySelector('#cm-title'); if (f) draft.title = f.value;
      f = m.querySelector('#cm-start'); if (f) draft.start = f.value;
      f = m.querySelector('#cm-end'); if (f) draft.end = f.value;
    }

    function renderForm(m) {
      var body = m.querySelector('#cm-form');
      body.innerHTML =
        '<div class="field"><label>What is it?</label>' +
        '<input class="input" id="cm-title" maxlength="60" placeholder="e.g. School, Training, Work shift" value="' + esc(draft.title) + '"></div>' +
        '<div class="field"><label>Days</label><div class="row wrap">' +
        DAY_LETTERS.map(function (L, i) {
          var on = draft.days.indexOf(i) >= 0;
          return '<button type="button" class="btn btn-sm' + (on ? ' btn-acc acc-indigo' : '') + '" data-day="' + i + '" title="' + A.ui.DAY_NAMES[i] + '">' + L + '</button>';
        }).join('') +
        '</div></div>' +
        '<div class="grid2">' +
        '<div class="field"><label>Starts</label><input class="input" id="cm-start" type="time" value="' + esc(draft.start) + '"></div>' +
        '<div class="field"><label>Ends</label><input class="input" id="cm-end" type="time" value="' + esc(draft.end) + '"></div>' +
        '</div>' +
        '<div class="field"><label>Colour</label><div class="swatches">' +
        A.ui.ACCENT_NAMES.map(function (n) {
          return '<button type="button" data-swatch="' + n + '" class="' + (draft.accent === n ? 'sel' : '') + '"' +
            ' style="background:' + A.ui.ACCENTS[n].b + '" title="' + n + '"></button>';
        }).join('') +
        '</div></div>';

      body.querySelectorAll('[data-day]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          syncDraft(m);
          var d = +btn.getAttribute('data-day');
          var ix = draft.days.indexOf(d);
          if (ix >= 0) draft.days.splice(ix, 1); else draft.days.push(d);
          renderForm(m);
        });
      });
      body.querySelectorAll('[data-swatch]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          syncDraft(m);
          draft.accent = btn.getAttribute('data-swatch');
          A.ui.ACCENT_NAMES.forEach(function (n) { m.classList.remove('acc-' + n); });
          m.classList.add('acc-' + draft.accent);
          renderForm(m);
        });
      });
    }

    function save(m) {
      syncDraft(m);
      var title = draft.title.trim();
      if (!title) { A.ui.toast('Name the commitment first', '✍️'); return false; }
      if (!draft.days.length) { A.ui.toast('Pick at least one day', '📆'); return false; }
      if (!draft.start || !draft.end || A.ui.minutes(draft.end) <= A.ui.minutes(draft.start)) {
        A.ui.toast('The end time must be after the start', '⏰'); return false;
      }
      var days = draft.days.slice().sort(function (a, b) { return a - b; });
      var accent = safeAccent(draft.accent, 'indigo');
      var hadPlan = !!A.S.get().timetable;

      if (isEdit) {
        var found = false;
        A.S.update(function (s) {
          var c = findCommitment(s, commitmentId);
          if (!c) return;
          found = true;
          c.title = title; c.days = days; c.start = draft.start; c.end = draft.end; c.accent = accent;
        });
        if (!found) { A.ui.toast('That commitment no longer exists', '🤔'); return true; }
        A.ui.toast(hadPlan ? 'Commitment updated — regenerate to replan' : 'Commitment updated', '✏️');
      } else {
        A.S.update(function (s) {
          s.commitments.push({ id: A.ui.uid(), title: title, days: days, start: draft.start, end: draft.end, accent: accent });
        });
        A.ui.toast(hadPlan ? 'Commitment added — regenerate to weave it in' : 'Commitment added', '📌');
      }
      return true;
    }

    A.ui.modal({
      title: isEdit ? '✏️ Edit commitment' : '🕰️ New commitment',
      accent: draft.accent,
      body: '<div id="cm-form"></div>',
      actions: [
        { label: 'Cancel', cls: 'btn-ghost' },
        { label: isEdit ? 'Save changes' : 'Add commitment', cls: 'btn-primary', onClick: function (m) { return save(m); } }
      ],
      onOpen: function (m) { renderForm(m); }
    });
  }

  /* ---------------- block detail modal ---------------- */

  function openBlockModal(iso, blockId) {
    var esc = A.ui.esc;
    var s = A.S.get();
    var b = findBlock(s, iso, blockId);
    if (!b) { A.ui.toast('That block is gone — regenerate for a fresh plan', '🤔'); return; }

    var isTask = b.type === 'task';
    var task = isTask ? findTask(s, b.refId) : null;
    var commitment = !isTask ? findCommitment(s, b.refId) : null;
    var done = !!(b.done || (task && task.done));
    var mins = Math.max(0, b.endMin - b.startMin);

    var rows =
      '<div class="row wrap" style="margin-bottom:10px">' +
      '<span class="pill">' + (isTask ? '📋 Task' : '📌 Commitment') + '</span>' +
      (done ? '<span class="tag">✅ done</span>' : '') +
      (task && task.priority === 3 ? '<span class="tag" style="color:#f87171;border-color:#7f1d1d">high priority</span>' : '') +
      '</div>' +
      '<div class="col" style="gap:6px">' +
      '<div class="row muted small">' + A.ui.icon('calendar', 'sm') + '<span>' + A.ui.fmtDate(iso) + '</span></div>' +
      '<div class="row muted small">' + A.ui.icon('clock', 'sm') + '<span>' + A.ui.fmtTime(b.start) + '–' + A.ui.fmtTime(b.end) + ' · ' + mins + ' min</span></div>' +
      (task && task.due ? '<div class="row muted small">' + A.ui.icon('flag', 'sm') + '<span>Due ' + A.ui.fmtDate(task.due) + '</span></div>' : '') +
      (commitment ? '<div class="row muted small">' + A.ui.icon('calendar', 'sm') + '<span>Repeats: ' + esc(fmtDays(commitment.days)) + '</span></div>' : '') +
      '</div>' +
      (!isTask && !commitment ? '<p class="dim small" style="margin-top:10px">This commitment was deleted — regenerate to tidy the week.</p>' : '') +
      (isTask && !task ? '<p class="dim small" style="margin-top:10px">The task behind this block was deleted — you can remove the block.</p>' : '') +
      (!isTask && commitment ? '<p class="dim small" style="margin-top:10px">Fixed block — Acendri plans your tasks around it.</p>' : '');

    var actions = [{ label: 'Close', cls: 'btn-ghost' }];
    if (isTask) {
      actions.push({ label: 'Remove from plan', cls: 'btn-ghost', onClick: function () { removeBlock(iso, blockId); } });
      if (!done && task) {
        actions.push({ label: '✅ Mark task done', cls: 'btn-primary', onClick: function () { markTaskDone(iso, blockId); } });
      } else if (!task) {
        // task deleted; only removal makes sense (button above)
      }
    } else if (commitment) {
      actions.push({ label: '✏️ Edit commitment', cls: 'btn-acc', onClick: function () { openCommitmentModal(commitment.id); } });
    } else {
      actions.push({ label: 'Remove from plan', cls: 'btn-danger', onClick: function () { removeBlock(iso, blockId); } });
    }

    A.ui.modal({
      title: esc(b.title),
      accent: safeAccent(b.accent, isTask ? 'cyan' : 'indigo'),
      body: rows,
      actions: actions
    });
  }

  /* ---------------- HTML builders ---------------- */

  function commitmentsCardHTML(s) {
    var esc = A.ui.esc;
    var list = s.commitments || [];
    var inner;
    if (!list.length) {
      inner =
        '<div class="empty" style="padding:22px 14px">' +
        '<div class="e-emoji">🕰️</div>' +
        '<p>Add school, training, work — the fixed blocks of your week.</p>' +
        '<button type="button" class="btn btn-acc btn-sm" data-add-commitment>＋ Add commitment</button>' +
        '</div>';
    } else {
      inner = '<div class="list">' + list.map(function (c) {
        var acc = safeAccent(c.accent, 'indigo');
        return '<div class="list-item">' +
          '<span class="badge-dot acc-' + acc + '"></span>' +
          '<div class="li-main">' +
          '<div class="li-title">' + esc(c.title) + '</div>' +
          '<div class="li-sub">' + esc(fmtDays(c.days)) + ' · ' + A.ui.fmtTime(c.start) + '–' + A.ui.fmtTime(c.end) + '</div>' +
          '</div>' +
          '<button type="button" class="icon-btn" data-edit-cm="' + c.id + '" title="Edit commitment">' + A.ui.icon('edit') + '</button>' +
          '<button type="button" class="icon-btn danger" data-del-cm="' + c.id + '" title="Delete commitment">' + A.ui.icon('trash') + '</button>' +
          '</div>';
      }).join('') + '</div>';
    }
    return '<div class="card acc acc-indigo section-gap">' +
      '<div class="card-title">' + A.ui.icon('clock') + 'Weekly commitments</div>' +
      inner + '</div>';
  }

  function unplacedCardHTML(tt) {
    var esc = A.ui.esc;
    if (!tt || !tt.unplaced || !tt.unplaced.length) return '';
    var titles = tt.unplaced.map(function (t) { return '“' + esc(t) + '”'; }).join(', ');
    return '<div class="card acc acc-orange section-gap">' +
      '<div class="card-title">⚠️ Couldn’t fit: ' + titles + '</div>' +
      '<p class="muted small" style="margin-bottom:10px">Your week is packed. Shorten these tasks, trim a commitment, or stretch your day — then regenerate.</p>' +
      '<button type="button" class="btn btn-acc btn-sm" data-goto-settings>⚙️ Adjust wake / sleep</button>' +
      '</div>';
  }

  function weekGridHTML(s) {
    var esc = A.ui.esc;
    var ws = wakeSleep(s);
    var colH = Math.round((ws.sleep - ws.wake) * PX_PER_MIN);
    var t0 = A.ui.todayISO();
    var isoList = [];
    for (var i = 0; i < 7; i++) isoList.push(A.ui.addDaysISO(t0, i));

    var html = '<div class="tt-scroll section-gap"><div class="tt-grid">';

    // row 1: empty corner + 7 day labels
    html += '<div></div>';
    isoList.forEach(function (iso) {
      var p = iso.split('-');
      var dow = new Date(+p[0], +p[1] - 1, +p[2]).getDay();
      html += '<div class="tt-daylabel' + (iso === t0 ? ' today' : '') + '">' +
        A.ui.DAY_NAMES[dow] + ' ' + (+p[2]) + '</div>';
    });

    // row 2: hour label column
    var hours = '';
    for (var h = Math.ceil(ws.wake / 60); h * 60 <= ws.sleep; h++) {
      var top = ((h * 60 - ws.wake) * PX_PER_MIN).toFixed(1);
      hours += '<div class="tt-hourlabel" style="position:absolute;left:0;right:0;top:' + top + 'px;transform:translateY(-50%)">' +
        A.ui.fmtTime(A.ui.hhmm(h * 60)) + '</div>';
    }
    html += '<div style="position:relative;height:' + colH + 'px">' + hours + '</div>';

    // row 2: 7 day columns
    isoList.forEach(function (iso) {
      var blocks = (s.timetable.days && s.timetable.days[iso]) || [];
      var inner = blocks.map(function (b) {
        var st = Math.max(b.startMin, ws.wake);
        var en = Math.min(b.endMin, ws.sleep);
        if (en <= st) return '';
        var top = ((st - ws.wake) * PX_PER_MIN).toFixed(1);
        var hgt = Math.max(16, (en - st) * PX_PER_MIN).toFixed(1);
        var task = b.type === 'task' ? findTask(s, b.refId) : null;
        var done = !!(b.done || (task && task.done));
        var acc = safeAccent(b.accent, b.type === 'task' ? 'cyan' : 'indigo');
        return '<div class="tt-block acc-' + acc + (done ? ' done' : '') + '"' +
          ' data-block="' + b.id + '" data-iso="' + iso + '"' +
          ' style="top:' + top + 'px;height:' + hgt + 'px" title="' + esc(b.title) + '">' +
          '<div class="tt-time">' + A.ui.fmtTime(b.start) + '–' + A.ui.fmtTime(b.end) + '</div>' +
          '<div>' + esc(b.title) + '</div>' +
          '</div>';
      }).join('');
      html += '<div class="tt-col" style="height:' + colH + 'px">' + inner + '</div>';
    });

    html += '</div></div>';

    // week progress — core settles the XP when the week ends (4/block +30 at 80%)
    var prog = taskBlockProgress(s, s.timetable);
    var pct = prog.total ? Math.round(100 * prog.done / prog.total) : 0;
    html += '<div class="acc-purple" style="margin-top:12px">' +
      '<div class="bar"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="muted small" style="margin-top:6px">' + prog.done + ' of ' + prog.total +
      ' planned block' + (prog.total === 1 ? '' : 's') + ' done — XP settles when the week ends</div>' +
      '</div>';

    // stale note + clear
    html += '<div class="row wrap" style="margin-top:10px">' +
      '<span class="muted small">Generated ' + A.ui.timeAgo(s.timetable.generatedAt) +
      '. Life changed? Regenerate any time — Acendri replans around what’s left.</span>' +
      '<button type="button" class="btn btn-ghost btn-sm" data-clear-plan>Clear plan</button>' +
      '</div>';

    return html;
  }

  function noPlanHTML(s) {
    var openTasks = (s.tasks || []).filter(function (t) { return !t.done; }).length;
    var commitments = (s.commitments || []).length;
    if (!openTasks && !commitments) {
      return '<div class="empty section-gap">' +
        '<div class="e-emoji">🌱</div>' +
        '<p>Nothing to plan yet — tell Acendri about your week in plain words and it will build the tasks and the timetable for you.</p>' +
        '<div class="row wrap" style="justify-content:center">' +
        '<button type="button" class="btn btn-acc acc-cyan" data-ask-acendri>🤖 Ask Acendri</button>' +
        '<button type="button" class="btn" data-goto-tasks>📋 Add tasks myself</button>' +
        '<button type="button" class="btn" data-add-commitment>＋ Add a commitment</button>' +
        '</div></div>';
    }
    return '<div class="empty section-gap">' +
      '<div class="e-emoji">📅</div>' +
      '<p>One click and Acendri builds your week around your commitments, priorities and due dates.</p>' +
      '<div class="row wrap" style="justify-content:center">' +
      '<button type="button" class="btn btn-primary" data-generate>⚡ Generate my week</button>' +
      '<button type="button" class="btn btn-acc acc-cyan" data-ask-acendri>🤖 Ask Acendri</button>' +
      '</div></div>';
  }

  /* ---------------- screen ---------------- */

  A.registerScreen('app/schedule', {
    title: 'Timetable',
    icon: 'calendar',
    accent: 'purple',
    inShell: true,
    order: 4,

    render: function (el, ctx) {
      var s = ctx.S.get();
      var tt = s.timetable;

      var html =
        '<div class="screen-head"><div class="spread wrap">' +
        '<div><h1>Timetable</h1><div class="sub">Tell Acendri your commitments — it plans your tasks around them.</div></div>' +
        '<div class="row wrap">' +
        '<button type="button" class="btn btn-acc acc-cyan" data-ask-acendri>🤖 Ask Acendri</button>' +
        '<button type="button" class="btn btn-primary" data-generate>⚡ Generate my week</button>' +
        '<button type="button" class="btn" data-add-commitment>＋ Commitment</button>' +
        '</div>' +
        '</div></div>';

      html += commitmentsCardHTML(s);
      html += unplacedCardHTML(tt);
      html += tt ? weekGridHTML(s) : noPlanHTML(s);

      el.innerHTML = html;

      /* ---- wiring ---- */

      el.querySelectorAll('[data-generate]').forEach(function (b) {
        b.addEventListener('click', generateWeek);
      });
      el.querySelectorAll('[data-ask-acendri]').forEach(function (b) {
        b.addEventListener('click', function () { openAskModal(''); });
      });
      el.querySelectorAll('[data-add-commitment]').forEach(function (b) {
        b.addEventListener('click', function () { openCommitmentModal(null); });
      });
      el.querySelectorAll('[data-edit-cm]').forEach(function (b) {
        b.addEventListener('click', function () { openCommitmentModal(b.getAttribute('data-edit-cm')); });
      });
      el.querySelectorAll('[data-del-cm]').forEach(function (b) {
        b.addEventListener('click', function () { deleteCommitment(b.getAttribute('data-del-cm')); });
      });
      el.querySelectorAll('[data-block]').forEach(function (b) {
        b.addEventListener('click', function () {
          openBlockModal(b.getAttribute('data-iso'), b.getAttribute('data-block'));
        });
      });
      el.querySelectorAll('[data-clear-plan]').forEach(function (b) {
        b.addEventListener('click', clearPlan);
      });
      el.querySelectorAll('[data-goto-tasks]').forEach(function (b) {
        b.addEventListener('click', function () { ctx.nav('app/tasks'); });
      });
      el.querySelectorAll('[data-goto-settings]').forEach(function (b) {
        b.addEventListener('click', function () { ctx.nav('app/settings'); });
      });
    }
  });
})();

/* ===== js/habits.js ===== */
/* ============================================================
   Acendri OS — Habits: streak-powered daily actions.
   Stats row, glowing habit cards with a 7-day tick strip,
   weekly progress bars and a new/edit modal.
   ============================================================ */
(function () {
  'use strict';
  var A = window.Ascendri;

  var EMOJIS = ['📚', '🏃', '🤸', '💪', '🥗', '💧', '😴', '🧹', '🎸', '🧠', '📖', '☀️'];

  /* ---------------- helpers ---------------- */

  function safeAccent(name) {
    return A.ui.ACCENT_NAMES.indexOf(name) >= 0 ? name : 'orange';
  }

  function findHabit(s, id) {
    var out = null;
    (s.habits || []).forEach(function (h) { if (h.id === id) out = h; });
    return out;
  }

  // Weekday initial for a local ISO date (component construction, not string parsing).
  function dayLetter(iso) {
    var p = iso.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return A.ui.DAY_NAMES[d.getDay()].charAt(0);
  }

  function last7(todayIso) {
    var out = [];
    for (var i = 6; i >= 0; i--) out.push(A.ui.addDaysISO(todayIso, -i));
    return out;
  }

  function ticksLast30(h, todayIso) {
    var n = 0, day = todayIso;
    for (var i = 0; i < 30; i++) {
      if (h.log && h.log[day]) n++;
      day = A.ui.addDaysISO(day, -1);
    }
    return n;
  }

  /* ---------------- new / edit modal ---------------- */

  function openHabitModal(habitId) {
    var esc = A.ui.esc;
    var s = A.S.get();
    var habit = habitId ? findHabit(s, habitId) : null;
    var isNew = !habit;

    var vTitle = isNew ? '' : habit.title;
    var vEmoji = isNew ? EMOJIS[0] : (habit.emoji || EMOJIS[0]);
    var vTarget = isNew ? 7 : (habit.targetPerWeek || 7);
    var vAccent = isNew ? 'orange' : safeAccent(habit.accent);
    if (EMOJIS.indexOf(vEmoji) === -1) vEmoji = EMOJIS[0];

    var targetOpts = '';
    for (var n = 1; n <= 7; n++) {
      targetOpts += '<option value="' + n + '"' + (n === vTarget ? ' selected' : '') + '>' +
        n + (n === 7 ? ' days a week (every day)' : n === 1 ? ' day a week' : ' days a week') + '</option>';
    }

    A.ui.modal({
      title: isNew ? '🌱 New habit' : '✏️ Edit habit',
      accent: vAccent,
      body:
        '<div class="field"><label>Habit</label>' +
          '<input id="hb-title" class="input" maxlength="60" placeholder="e.g. Read 20 pages" value="' + esc(vTitle) + '"></div>' +
        '<div class="field"><label>Emoji</label>' +
          '<div class="emoji-pick" id="hb-emoji">' +
            EMOJIS.map(function (e) {
              return '<button type="button" data-emoji="' + esc(e) + '"' + (e === vEmoji ? ' class="sel"' : '') +
                ' aria-label="Pick emoji ' + esc(e) + '">' + esc(e) + '</button>';
            }).join('') +
          '</div></div>' +
        '<div class="field"><label>Target per week</label>' +
          '<select id="hb-target" class="select">' + targetOpts + '</select></div>' +
        '<div class="field"><label>Accent colour</label>' +
          '<div class="swatches" id="hb-acc">' +
            A.ui.ACCENT_NAMES.map(function (name) {
              return '<button type="button" class="acc-' + name + (name === vAccent ? ' sel' : '') +
                '" data-swatch="' + name + '" title="' + name + '" aria-label="Accent ' + name + '"></button>';
            }).join('') +
          '</div></div>',
      onOpen: function (m) {
        m.querySelectorAll('#hb-emoji button').forEach(function (b) {
          b.addEventListener('click', function () {
            m.querySelectorAll('#hb-emoji button').forEach(function (x) { x.classList.remove('sel'); });
            b.classList.add('sel');
          });
        });
        m.querySelectorAll('#hb-acc button').forEach(function (b) {
          b.addEventListener('click', function () {
            m.querySelectorAll('#hb-acc button').forEach(function (x) { x.classList.remove('sel'); });
            b.classList.add('sel');
          });
        });
      },
      actions: [
        { label: 'Cancel', cls: 'btn-ghost' },
        {
          label: isNew ? 'Start habit' : 'Save changes',
          cls: 'btn-primary',
          onClick: function (m) {
            var title = m.querySelector('#hb-title').value.trim();
            if (!title) { A.ui.toast('Give your habit a name first', '✍️'); return false; }
            var emBtn = m.querySelector('#hb-emoji button.sel');
            var emoji = emBtn ? emBtn.getAttribute('data-emoji') : EMOJIS[0];
            var target = +m.querySelector('#hb-target').value || 7;
            var swBtn = m.querySelector('#hb-acc button.sel');
            var accent = safeAccent(swBtn ? swBtn.getAttribute('data-swatch') : 'orange');
            A.S.update(function (st) {
              if (isNew) {
                st.habits.push({
                  id: A.ui.uid(), title: title, emoji: emoji, accent: accent,
                  targetPerWeek: target, log: {}, createdAt: Date.now()
                });
              } else {
                for (var i = 0; i < st.habits.length; i++) {
                  if (st.habits[i].id === habitId) {
                    st.habits[i].title = title;
                    st.habits[i].emoji = emoji;
                    st.habits[i].accent = accent;
                    st.habits[i].targetPerWeek = target;
                    break;
                  }
                }
              }
            });
            if (isNew) A.ui.toast('Habit started — tick day one today!', '🌱');
            else A.ui.toast('Habit updated', '✏️');
          }
        }
      ]
    });
  }

  /* ---------------- HTML builders ---------------- */

  function headHTML() {
    var fade = A.engine.HABIT_FADE_DAYS || 14;
    return '<div class="screen-head"><div class="spread wrap">' +
      '<div><h1>Habits</h1>' +
      '<div class="sub">Repeated actions beat one-time heroics. Build your streaks.</div></div>' +
      '<button class="btn btn-primary" data-new="1">+ New habit</button>' +
      '</div>' +
      '<div class="muted small" style="margin-top:6px">Miss a habit and Acendri reminds you (check the 🔔 bell). ' +
      'Quiet for ' + fade + ' days and it fades to the archive.</div>' +
      '</div>';
  }

  function statsHTML(habits, t) {
    var best = 0, weekTicks = 0, ticks30 = 0;
    habits.forEach(function (h) {
      var st = A.engine.habitStreak(h);
      if (st > best) best = st;
      weekTicks += A.engine.habitWeekCount(h);
      ticks30 += ticksLast30(h, t);
    });
    var consistency = habits.length ? Math.round(100 * ticks30 / (habits.length * 30)) : 0;
    return '<div class="grid4">' +
      '<div class="card acc-orange"><div class="stat">' +
        '<div class="v">🔥 ' + best + (best === 1 ? ' day' : ' days') + '</div><div class="k">Best streak</div></div></div>' +
      '<div class="card acc-cyan"><div class="stat">' +
        '<div class="v">' + weekTicks + '</div><div class="k">Ticks this week</div></div></div>' +
      '<div class="card acc-green"><div class="stat">' +
        '<div class="v">' + habits.length + '</div><div class="k">Habit' + (habits.length === 1 ? '' : 's') + '</div></div></div>' +
      '<div class="card acc-purple"><div class="stat">' +
        '<div class="v h-acc">' + consistency + '%</div><div class="k">30-day consistency</div></div></div>' +
      '</div>';
  }

  function habitCardHTML(h, t) {
    var esc = A.ui.esc;
    var acc = safeAccent(h.accent);
    var streak = A.engine.habitStreak(h);
    var weekCount = A.engine.habitWeekCount(h);
    var target = Math.max(1, h.targetPerWeek || 7);
    var pct = Math.min(100, Math.round(100 * weekCount / target));
    var hit = weekCount >= target;

    // Reminder / fade warning — clears naturally once today is ticked.
    var warnHTML = '';
    var tickedToday = !!(h.log && h.log[t]);
    var missed = A.engine.daysSinceLastTick(h);
    if (!tickedToday && missed >= 2) {
      if (missed >= 10) {
        var fade = A.engine.HABIT_FADE_DAYS || 14;
        var left = Math.max(1, fade - missed);
        warnHTML = '<div style="margin-top:10px"><span class="pill acc-red">🍂 fades in ' +
          left + (left === 1 ? ' day' : ' days') + '</span></div>';
      } else {
        warnHTML = '<div style="margin-top:10px"><span class="tag acc-yellow">⏰ missed ' +
          missed + ' days</span></div>';
      }
    }

    var daysHTML = last7(t).map(function (iso) {
      var isToday = iso === t;
      var on = !!(h.log && h.log[iso]);
      return '<button class="habit-day' + (on ? ' on' : '') + (isToday ? ' today' : '') + '"' +
        (isToday
          ? ' data-tick="' + esc(h.id) + '" title="' + (on ? 'Untick today' : 'Tick off today') + '" aria-label="Toggle today"'
          : ' disabled title="' + esc(A.ui.fmtDate(iso)) + (on ? ' — done' : ' — missed') + '"') +
        '>' + dayLetter(iso) + '</button>';
    }).join('');

    return '<div class="card acc glow acc-' + acc + '">' +
      '<div class="spread">' +
        '<div class="row" style="min-width:0">' +
          '<span class="avatar">' + esc(h.emoji || '🌱') + '</span>' +
          '<div class="li-main">' +
            '<div class="li-title">' + esc(h.title) + '</div>' +
            '<div class="li-sub">🔥 ' + streak + ' day streak · target ' + target + '/week</div>' +
          '</div>' +
        '</div>' +
        '<div class="row">' +
          '<button class="icon-btn" data-edit="' + esc(h.id) + '" title="Edit habit" aria-label="Edit habit">' + A.ui.icon('edit', 'sm') + '</button>' +
          '<button class="icon-btn danger" data-del="' + esc(h.id) + '" title="Delete habit" aria-label="Delete habit">' + A.ui.icon('trash', 'sm') + '</button>' +
        '</div>' +
      '</div>' +
      warnHTML +
      '<div class="small muted" style="margin:12px 0 6px">Last 7 days</div>' +
      '<div class="habit-days">' + daysHTML + '</div>' +
      '<div class="spread" style="margin-top:14px">' +
        '<span class="small muted">' + weekCount + ' of ' + target + ' this week</span>' +
        (hit ? '<span class="tag acc-' + acc + '">🎉 Weekly target hit!</span>' : '') +
      '</div>' +
      '<div class="bar" style="margin-top:6px"><span class="bar-fill" style="width:' + pct + '%"></span></div>' +
      '</div>';
  }

  function emptyHTML() {
    return '<div class="empty section-gap"><div class="e-emoji">🌱</div>' +
      '<p>Habits are how you become the person you want to be. Start with one tiny daily action.</p>' +
      '<button class="btn btn-acc acc-orange" data-new="1">+ New habit</button></div>';
  }

  function archiveHTML(archived) {
    var esc = A.ui.esc;
    if (!archived.length) return '';
    return '<div class="section-gap">' +
      '<div class="card-title">🍂 Faded away</div>' +
      '<div class="list">' +
      archived.map(function (h) {
        var acc = safeAccent(h.accent);
        return '<div class="list-item done">' +
          '<span class="avatar sm">' + esc(h.emoji || '🌱') + '</span>' +
          '<div class="li-main">' +
            '<div class="li-title">' + esc(h.title) + '</div>' +
            '<div class="li-sub">faded ' + esc(A.ui.timeAgo(h.archivedAt || h.createdAt || Date.now())) +
              ' · best data kept</div>' +
          '</div>' +
          '<button class="btn btn-sm btn-acc acc-' + acc + '" data-revive="' + esc(h.id) + '" ' +
            'title="Bring this habit back">Revive</button>' +
          '<button class="icon-btn danger" data-del="' + esc(h.id) + '" title="Delete forever" aria-label="Delete habit">' +
            A.ui.icon('trash', 'sm') + '</button>' +
        '</div>';
      }).join('') +
      '</div></div>';
  }

  /* ---------------- screen ---------------- */

  function renderHabits(el, ctx) {
    var s = A.S.get();
    var all = s.habits || [];
    var habits = all.filter(function (h) { return !h.archived; });   // active only
    var archived = all.filter(function (h) { return !!h.archived; });
    var t = A.ui.todayISO();

    var body;
    if (!habits.length) {
      body = emptyHTML();
    } else {
      body = '<div class="grid2 section-gap">' +
        habits.map(function (h) { return habitCardHTML(h, t); }).join('') +
        '</div>';
    }

    el.innerHTML = headHTML() + statsHTML(habits, t) + body + archiveHTML(archived);

    /* ---- listeners ---- */

    el.querySelectorAll('[data-new]').forEach(function (b) {
      b.addEventListener('click', function () { openHabitModal(null); });
    });

    el.querySelectorAll('[data-edit]').forEach(function (b) {
      b.addEventListener('click', function () { openHabitModal(b.getAttribute('data-edit')); });
    });

    el.querySelectorAll('[data-tick]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-tick');
        var ticked = false, title = '', justHitTarget = false;
        A.S.update(function (st) {
          for (var i = 0; i < st.habits.length; i++) {
            var h = st.habits[i];
            if (h.id !== id) continue;
            title = h.title;
            if (!h.log) h.log = {};
            if (h.log[t]) {
              delete h.log[t];             // toggle off — just update
            } else {
              h.log[t] = true;
              ticked = true;
              var target = Math.max(1, h.targetPerWeek || 7);
              justHitTarget = A.engine.habitWeekCount(h) === target;
            }
            break;
          }
        });
        if (ticked) {
          A.S.addXp(5, 'Habit: ' + title);   // streak achievements fire from core
          if (justHitTarget) A.ui.toast('Weekly target hit for "' + title + '"!', '🎉');
        }
      });
    });

    el.querySelectorAll('[data-revive]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-revive');
        A.S.update(function (st) {
          for (var i = 0; i < st.habits.length; i++) {
            var h = st.habits[i];
            if (h.id !== id) continue;
            h.archived = false;
            delete h.archivedAt;
            if (!h.log) h.log = {};
            h.log[t] = true;   // tick today so it does not instantly re-fade
            break;
          }
        });
        A.ui.toast('Back from the ashes — streak restarts today 🔥');
      });
    });

    el.querySelectorAll('[data-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-del');
        var habit = findHabit(A.S.get(), id);
        if (!habit) return;
        var streak = A.engine.habitStreak(habit);
        A.ui.confirm(
          'Delete "' + habit.title + '"? Your ' +
          (streak > 0 ? streak + '-day streak' : 'streak') +
          ' and all its history will be lost forever.',
          function () {
            A.S.update(function (st) {
              st.habits = st.habits.filter(function (h) { return h.id !== id; });
            });
            A.ui.toast('Habit deleted', '🗑️');
          },
          { title: 'Delete habit', yesLabel: 'Delete' }
        );
      });
    });
  }

  A.registerScreen('app/habits', {
    title: 'Habits',
    icon: 'flame',
    accent: 'orange',
    inShell: true,
    order: 5,
    render: renderHabits
  });
})();

/* ===== js/finance.js ===== */
/* ============================================================
   Acendri OS — Finance: transactions, budgets, savings goals.
   Month navigator, summary stats, one-line insight, monthly
   budget bars and glowing savings goals with celebrations.
   ============================================================ */
(function () {
  'use strict';
  var A = window.Ascendri;

  var CATS = ['Food', 'Transport', 'Fun', 'Subscriptions', 'Sport', 'School', 'Shopping', 'Job', 'Gifts', 'Other'];
  var GOAL_EMOJIS = ['🛡️', '🎾', '💻', '✈️', '🏠', '🎁', '🚗', '🎮'];

  /* ---------------- module state ---------------- */

  var selMonth = A.ui.monthISO();   // 'YYYY-MM' being viewed
  var catFilter = 'all';            // transactions table category filter
  var showAllTx = false;            // table shows 12 rows until expanded

  /* ---------------- helpers ---------------- */

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function ymAdd(ym, delta) {
    var p = ym.split('-');
    var y = +p[0], m = (+p[1] - 1) + delta;
    y += Math.floor(m / 12);
    m = ((m % 12) + 12) % 12;
    return y + '-' + pad2(m + 1);
  }

  function ymLabel(ym) {
    var p = ym.split('-');
    return A.ui.MONTHS[(+p[1]) - 1] + ' ' + p[0];
  }

  function safeAccent(name) {
    return A.ui.ACCENT_NAMES.indexOf(name) >= 0 ? name : 'yellow';
  }

  function fin(s) {
    return s.finance || { transactions: [], budgets: {}, savingsGoals: [] };
  }

  function ensureFin(st) {
    if (!st.finance) st.finance = {};
    if (!st.finance.transactions) st.finance.transactions = [];
    if (!st.finance.budgets) st.finance.budgets = {};
    if (!st.finance.savingsGoals) st.finance.savingsGoals = [];
    return st.finance;
  }

  function findGoal(s, id) {
    var out = null;
    (fin(s).savingsGoals || []).forEach(function (g) { if (g.id === id) out = g; });
    return out;
  }

  function findTx(s, id) {
    var out = null;
    (fin(s).transactions || []).forEach(function (t) { if (t.id === id) out = t; });
    return out;
  }

  function parseAmount(raw) {
    var a = parseFloat(raw);
    if (!isFinite(a)) return 0;
    return Math.round(a * 100) / 100;
  }

  function catOptions(selected) {
    return CATS.map(function (c) {
      return '<option value="' + c + '"' + (c === selected ? ' selected' : '') + '>' + c + '</option>';
    }).join('');
  }

  /* ---------------- modals ---------------- */

  function openTxModal() {
    var esc = A.ui.esc;
    var vType = 'expense';

    A.ui.modal({
      title: '💸 New transaction',
      accent: 'yellow',
      body:
        '<div class="field"><label>Type</label><div class="row">' +
          '<button type="button" class="btn" id="tx-inc">Income</button>' +
          '<button type="button" class="btn btn-acc acc-red" id="tx-exp">Expense</button>' +
        '</div></div>' +
        '<div class="field"><label>Amount</label>' +
          '<input id="tx-amount" class="input" type="number" min="0" step="0.01" placeholder="0.00"></div>' +
        '<div class="field"><label>Category</label>' +
          '<select id="tx-cat" class="select">' + catOptions('Food') + '</select></div>' +
        '<div class="field"><label>Note</label>' +
          '<input id="tx-note" class="input" maxlength="80" placeholder="e.g. Lunch out"></div>' +
        '<div class="field"><label>Date</label>' +
          '<input id="tx-date" class="input" type="date" value="' + esc(A.ui.todayISO()) + '"></div>',
      onOpen: function (m) {
        var inc = m.querySelector('#tx-inc');
        var exp = m.querySelector('#tx-exp');
        function paint() {
          inc.className = 'btn' + (vType === 'income' ? ' btn-acc acc-green' : '');
          exp.className = 'btn' + (vType === 'expense' ? ' btn-acc acc-red' : '');
        }
        inc.addEventListener('click', function () { vType = 'income'; paint(); });
        exp.addEventListener('click', function () { vType = 'expense'; paint(); });
      },
      actions: [
        { label: 'Cancel', cls: 'btn-ghost' },
        {
          label: 'Save transaction',
          cls: 'btn-primary',
          onClick: function (m) {
            var amount = parseAmount(m.querySelector('#tx-amount').value);
            if (!(amount > 0)) { A.ui.toast('Enter an amount greater than zero', '🧮'); return false; }
            var cat = m.querySelector('#tx-cat').value;
            if (CATS.indexOf(cat) === -1) cat = 'Other';
            var note = m.querySelector('#tx-note').value.trim();
            var date = m.querySelector('#tx-date').value || A.ui.todayISO();
            selMonth = date.slice(0, 7);
            if (catFilter !== 'all' && catFilter !== cat) catFilter = 'all';
            A.S.update(function (st) {
              ensureFin(st).transactions.push({
                id: A.ui.uid(), type: vType, amount: amount, category: cat, note: note, date: date
              });
            });
            A.S.addXp(2, 'Transaction logged');
          }
        }
      ]
    });
  }

  function openBudgetModal() {
    A.ui.modal({
      title: '📊 Set a monthly budget',
      accent: 'orange',
      body:
        '<p class="small muted" style="margin-bottom:12px">Pick a category and a monthly spending cap — Acendri warns you before you blow past it.</p>' +
        '<div class="field"><label>Category</label>' +
          '<select id="bud-cat" class="select">' + catOptions('Food') + '</select></div>' +
        '<div class="field"><label>Monthly limit</label>' +
          '<input id="bud-limit" class="input" type="number" min="0" step="1" placeholder="e.g. 120"></div>',
      onOpen: function (m) {
        var sel = m.querySelector('#bud-cat');
        var inp = m.querySelector('#bud-limit');
        function syncExisting() {
          var budgets = fin(A.S.get()).budgets || {};
          if (budgets[sel.value]) inp.value = budgets[sel.value];
        }
        sel.addEventListener('change', syncExisting);
        syncExisting();
      },
      actions: [
        { label: 'Cancel', cls: 'btn-ghost' },
        {
          label: 'Set budget',
          cls: 'btn-primary',
          onClick: function (m) {
            var cat = m.querySelector('#bud-cat').value;
            if (CATS.indexOf(cat) === -1) cat = 'Other';
            var limit = parseAmount(m.querySelector('#bud-limit').value);
            if (!(limit > 0)) { A.ui.toast('Enter a limit greater than zero', '🧮'); return false; }
            A.S.update(function (st) {
              ensureFin(st).budgets[cat] = limit;
            });
            A.ui.toast('Budget set: ' + cat + ' capped at ' + A.ui.fmtMoney(limit) + '/month', '📊');
          }
        }
      ]
    });
  }

  function openGoalModal() {
    var esc = A.ui.esc;
    A.ui.modal({
      title: '🏦 New savings goal',
      accent: 'yellow',
      body:
        '<div class="field"><label>What are you saving for?</label>' +
          '<input id="sg-title" class="input" maxlength="60" placeholder="e.g. New racquet"></div>' +
        '<div class="field"><label>Emoji</label>' +
          '<div class="emoji-pick" id="sg-emoji">' +
            GOAL_EMOJIS.map(function (e, i) {
              return '<button type="button" data-emoji="' + esc(e) + '"' + (i === 0 ? ' class="sel"' : '') +
                ' aria-label="Pick emoji ' + esc(e) + '">' + esc(e) + '</button>';
            }).join('') +
          '</div></div>' +
        '<div class="field"><label>Target amount</label>' +
          '<input id="sg-target" class="input" type="number" min="0" step="0.01" placeholder="e.g. 500"></div>' +
        '<div class="field"><label>Accent colour</label>' +
          '<div class="swatches" id="sg-acc">' +
            A.ui.ACCENT_NAMES.map(function (name) {
              return '<button type="button" class="acc-' + name + (name === 'yellow' ? ' sel' : '') +
                '" data-swatch="' + name + '" title="' + name + '" aria-label="Accent ' + name + '"></button>';
            }).join('') +
          '</div></div>',
      onOpen: function (m) {
        m.querySelectorAll('#sg-emoji button').forEach(function (b) {
          b.addEventListener('click', function () {
            m.querySelectorAll('#sg-emoji button').forEach(function (x) { x.classList.remove('sel'); });
            b.classList.add('sel');
          });
        });
        m.querySelectorAll('#sg-acc button').forEach(function (b) {
          b.addEventListener('click', function () {
            m.querySelectorAll('#sg-acc button').forEach(function (x) { x.classList.remove('sel'); });
            b.classList.add('sel');
          });
        });
      },
      actions: [
        { label: 'Cancel', cls: 'btn-ghost' },
        {
          label: 'Create goal',
          cls: 'btn-primary',
          onClick: function (m) {
            var title = m.querySelector('#sg-title').value.trim();
            if (!title) { A.ui.toast('Give your savings goal a name first', '✍️'); return false; }
            var target = parseAmount(m.querySelector('#sg-target').value);
            if (!(target > 0)) { A.ui.toast('Enter a target amount greater than zero', '🧮'); return false; }
            var emBtn = m.querySelector('#sg-emoji button.sel');
            var emoji = emBtn ? emBtn.getAttribute('data-emoji') : GOAL_EMOJIS[0];
            var swBtn = m.querySelector('#sg-acc button.sel');
            var accent = safeAccent(swBtn ? swBtn.getAttribute('data-swatch') : 'yellow');
            A.S.update(function (st) {
              ensureFin(st).savingsGoals.push({
                id: A.ui.uid(), title: title, emoji: emoji, target: target, saved: 0, accent: accent
              });
            });
            A.ui.toast('Savings goal created — first dollar is the hardest', '🏦');
          }
        }
      ]
    });
  }

  function openAddMoneyModal(goalId) {
    var esc = A.ui.esc;
    var g = findGoal(A.S.get(), goalId);
    if (!g) return;
    var remaining = Math.max(0, g.target - g.saved);
    A.ui.modal({
      title: esc(g.emoji || '🏦') + ' Add money — ' + esc(g.title),
      accent: safeAccent(g.accent),
      body:
        '<p class="small muted" style="margin-bottom:12px">' +
          A.ui.esc(A.ui.fmtMoney(g.saved) + ' saved of ' + A.ui.fmtMoney(g.target)) +
          (remaining > 0 ? ' — ' + A.ui.esc(A.ui.fmtMoney(remaining)) + ' to go.' : ' — target already reached, keep stacking!') +
        '</p>' +
        '<div class="field"><label>Amount to add</label>' +
          '<input id="sg-add" class="input" type="number" min="0" step="0.01" placeholder="0.00"></div>',
      actions: [
        { label: 'Cancel', cls: 'btn-ghost' },
        {
          label: 'Add money',
          cls: 'btn-primary',
          onClick: function (m) {
            var amount = parseAmount(m.querySelector('#sg-add').value);
            if (!(amount > 0)) { A.ui.toast('Enter an amount greater than zero', '🧮'); return false; }
            var justReached = false, title = '';
            A.S.update(function (st) {
              var goals = ensureFin(st).savingsGoals;
              for (var i = 0; i < goals.length; i++) {
                if (goals[i].id !== goalId) continue;
                var before = goals[i].saved;
                goals[i].saved = Math.round((before + amount) * 100) / 100;
                title = goals[i].title;
                justReached = before < goals[i].target && goals[i].saved >= goals[i].target;
                break;
              }
            });
            if (justReached) {
              A.ui.confetti();
              A.ui.toast('GOAL reached 🎉 — "' + title + '" fully funded!', '🏆');
            } else {
              A.ui.toast(A.ui.fmtMoney(amount) + ' added to "' + title + '"', '💰');
            }
          }
        }
      ]
    });
  }

  /* ---------------- HTML builders ---------------- */

  // The view can go forward past the current month when future-dated
  // transactions exist there (e.g. a pre-logged payment).
  function maxMonth() {
    var max = A.ui.monthISO();
    A.S.get().finance.transactions.forEach(function (t) {
      if (t.date && t.date.slice(0, 7) > max) max = t.date.slice(0, 7);
    });
    return max;
  }

  function headHTML() {
    var atCurrent = selMonth >= maxMonth();
    return '<div class="screen-head"><div class="spread wrap">' +
      '<div><h1>Finance</h1>' +
      '<div class="sub">Know where your money goes — and where you want it to go.</div></div>' +
      '<div class="row wrap">' +
        '<div class="row" style="gap:2px">' +
          '<button class="icon-btn" data-mprev="1" title="Previous month" aria-label="Previous month">' +
            '<span style="display:inline-flex;transform:scaleX(-1)">' + A.ui.icon('arrow', 'sm') + '</span></button>' +
          '<span class="bold" style="min-width:82px;text-align:center">' + ymLabel(selMonth) + '</span>' +
          '<button class="icon-btn" data-mnext="1" title="Next month" aria-label="Next month"' +
            (atCurrent ? ' disabled style="opacity:.35;cursor:default"' : '') + '>' + A.ui.icon('arrow', 'sm') + '</button>' +
        '</div>' +
        '<button class="btn btn-primary" data-newtx="1">+ Transaction</button>' +
      '</div>' +
      '</div></div>';
  }

  function summaryHTML(sum) {
    var fmt = A.ui.fmtMoney;
    return '<div class="grid4">' +
      '<div class="card acc-green"><div class="stat">' +
        '<div class="v pos num">' + fmt(sum.income) + '</div><div class="k">Income</div></div></div>' +
      '<div class="card acc-red"><div class="stat">' +
        '<div class="v num">' + fmt(sum.expenses) + '</div><div class="k">Expenses</div></div></div>' +
      '<div class="card acc-cyan"><div class="stat">' +
        '<div class="v num ' + (sum.net >= 0 ? 'pos' : 'neg') + '">' + fmt(sum.net) + '</div><div class="k">Net this month</div></div></div>' +
      '<div class="card acc-yellow"><div class="stat">' +
        '<div class="v h-acc num">' + fmt(sum.savings) + '</div><div class="k">Total saved</div></div></div>' +
      '</div>';
  }

  function insightHTML(sum) {
    var esc = A.ui.esc, fmt = A.ui.fmtMoney;
    var sentence;
    if (sum.overBudget && sum.overBudget.length) {
      var o = sum.overBudget[0];
      sentence = '⚠️ Over budget in ' + esc(o.cat) + ' (' + esc(fmt(o.spent)) + ' of ' + esc(fmt(o.limit)) + ')' +
        (sum.overBudget.length > 1 ? ' — and ' + (sum.overBudget.length - 1) + ' more categor' + (sum.overBudget.length === 2 ? 'y is' : 'ies are') + ' over too.' : ' — ease off there this week.');
    } else if (sum.expenses > 0) {
      var topCat = null, topAmt = 0;
      Object.keys(sum.byCat).forEach(function (c) {
        if (sum.byCat[c] > topAmt) { topAmt = sum.byCat[c]; topCat = c; }
      });
      var pct = Math.round(100 * topAmt / sum.expenses);
      sentence = 'Your top expense category in ' + ymLabel(selMonth) + ' is ' + esc(topCat) + ' at ' + esc(fmt(topAmt)) +
        ' — ' + pct + '% of everything you spent.';
    } else {
      sentence = 'No expenses logged for ' + ymLabel(selMonth) + ' yet — log your first transaction and find out where your money actually goes.';
    }
    return '<div class="card acc acc-cyan section-gap"><div class="row">' +
      '<span class="icon-tile">' + A.ui.icon('bulb') + '</span>' +
      '<div style="min-width:0">' + sentence + '</div>' +
      '</div></div>';
  }

  function txTableHTML(monthTx) {
    var esc = A.ui.esc, fmt = A.ui.fmtMoney;
    var filtered = catFilter === 'all'
      ? monthTx
      : monthTx.filter(function (t) { return t.category === catFilter; });

    var body;
    if (!monthTx.length) {
      body = '<div class="empty"><div class="e-emoji">💸</div>' +
        '<p>No transactions in ' + ymLabel(selMonth) + ' yet — money you don’t track quietly disappears.</p>' +
        '<button class="btn btn-acc acc-yellow" data-newtx="1">Add your first transaction</button></div>';
    } else if (!filtered.length) {
      body = '<div class="empty"><div class="e-emoji">🔍</div>' +
        '<p>No ' + esc(catFilter) + ' transactions in ' + ymLabel(selMonth) + '.</p>' +
        '<button class="btn btn-acc acc-cyan" data-clearfilter="1">Show all categories</button></div>';
    } else {
      var shown = showAllTx ? filtered : filtered.slice(0, 12);
      var rows = shown.map(function (t) {
        var isInc = t.type === 'income';
        return '<tr>' +
          '<td class="muted">' + esc(A.ui.fmtDate(t.date)) + '</td>' +
          '<td>' + (t.note ? esc(t.note) : '<span class="dim">—</span>') + '</td>' +
          '<td><span class="tag">' + esc(t.category) + '</span></td>' +
          '<td class="num ' + (isInc ? 'pos' : 'neg') + '">' + (isInc ? '+' : '') + esc(fmt(t.amount)) + '</td>' +
          '<td style="text-align:right"><button class="icon-btn danger" data-delt="' + esc(t.id) + '" title="Delete transaction" aria-label="Delete transaction">' +
            A.ui.icon('trash', 'sm') + '</button></td>' +
          '</tr>';
      }).join('');
      body = '<div class="scroll-x"><table class="tbl">' +
        '<thead><tr><th>Date</th><th>Note</th><th>Category</th><th>Amount</th><th></th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table></div>' +
        (filtered.length > 12
          ? '<div style="margin-top:8px"><button class="btn btn-ghost btn-sm" data-txmore="1">' +
            (showAllTx ? 'Show fewer' : 'Show all ' + filtered.length) + '</button></div>'
          : '');
    }

    var filterSel = '';
    if (monthTx.length) {
      filterSel = '<select class="select" data-catfilter="1" style="width:auto;padding-top:6px;padding-bottom:6px" aria-label="Filter by category">' +
        '<option value="all"' + (catFilter === 'all' ? ' selected' : '') + '>All categories</option>' +
        CATS.map(function (c) {
          return '<option value="' + c + '"' + (c === catFilter ? ' selected' : '') + '>' + c + '</option>';
        }).join('') +
        '</select>';
    }

    return '<div class="card acc-yellow section-gap">' +
      '<div class="spread wrap" style="margin-bottom:6px">' +
        '<div class="card-title" style="margin-bottom:0">' + A.ui.icon('dollar') + 'Transactions</div>' +
        filterSel +
      '</div>' + body + '</div>';
  }

  function budgetsHTML(sum, budgets) {
    var esc = A.ui.esc, fmt = A.ui.fmtMoney;
    var cats = Object.keys(budgets).sort();
    var body;
    if (!cats.length) {
      body = '<div class="empty"><div class="e-emoji">📊</div>' +
        '<p>A budget is a monthly cap for one category — set one and Acendri flags you before overspending sneaks up.</p>' +
        '<button class="btn btn-acc acc-orange" data-newbudget="1">Set your first budget</button></div>';
    } else {
      body = '<div class="list">' + cats.map(function (cat) {
        var limit = budgets[cat];
        var spent = sum.byCat[cat] || 0;
        var over = limit > 0 && spent > limit;
        var pct = over ? 100 : (limit > 0 ? Math.min(100, Math.round(100 * spent / limit)) : 100);
        return '<div class="list-item acc-' + (over ? 'red' : 'orange') + '">' +
          '<div class="li-main">' +
            '<div class="spread">' +
              '<span class="li-title' + (over ? ' neg' : '') + '">' + (over ? '⚠️ ' : '') + esc(cat) + '</span>' +
              '<span class="small num ' + (over ? 'neg' : 'muted') + '">' + esc(fmt(spent)) + ' spent of ' + esc(fmt(limit)) + '</span>' +
            '</div>' +
            '<div class="bar" style="margin-top:7px"><span class="bar-fill" style="width:' + pct + '%"></span></div>' +
          '</div>' +
          '<button class="icon-btn danger" data-delbudget="' + esc(cat) + '" title="Remove budget" aria-label="Remove budget">' +
            A.ui.icon('trash', 'sm') + '</button>' +
          '</div>';
      }).join('') + '</div>';
    }
    return '<div class="card acc-orange">' +
      '<div class="spread" style="margin-bottom:6px">' +
        '<div class="card-title" style="margin-bottom:0">' + A.ui.icon('trend') + 'Monthly budgets</div>' +
        '<button class="btn btn-sm btn-acc" data-newbudget="1">Set budget</button>' +
      '</div>' + body + '</div>';
  }

  function savingsHTML(goals) {
    var esc = A.ui.esc, fmt = A.ui.fmtMoney;
    var body;
    if (!goals.length) {
      body = '<div class="empty"><div class="e-emoji">🏦</div>' +
        '<p>Give every dollar a mission — create a savings goal and watch the bar fill up.</p>' +
        '<button class="btn btn-acc acc-yellow" data-newgoal="1">New savings goal</button></div>';
    } else {
      body = '<div class="list">' + goals.map(function (g) {
        var acc = safeAccent(g.accent);
        var target = Math.max(0.01, g.target || 0.01);
        var pct = Math.min(100, Math.round(100 * (g.saved || 0) / target));
        var done = (g.saved || 0) >= (g.target || 0);
        return '<div class="list-item acc-' + acc + '">' +
          '<div class="li-main">' +
            '<div class="spread wrap">' +
              '<div class="row" style="min-width:0">' +
                '<span class="avatar">' + esc(g.emoji || '🏦') + '</span>' +
                '<div style="min-width:0">' +
                  '<div class="li-title">' + esc(g.title) + (done ? ' <span class="tag">🎉 reached</span>' : '') + '</div>' +
                  '<div class="li-sub num">' + esc(fmt(g.saved || 0)) + ' saved of ' + esc(fmt(g.target || 0)) + '</div>' +
                '</div>' +
              '</div>' +
              '<div class="row">' +
                '<button class="btn btn-sm btn-acc" data-addmoney="' + esc(g.id) + '">+ Add money</button>' +
                '<button class="icon-btn danger" data-delgoal="' + esc(g.id) + '" title="Delete savings goal" aria-label="Delete savings goal">' +
                  A.ui.icon('trash', 'sm') + '</button>' +
              '</div>' +
            '</div>' +
            '<div class="bar" style="margin-top:9px"><span class="bar-fill" style="width:' + pct + '%"></span></div>' +
          '</div>' +
          '</div>';
      }).join('') + '</div>';
    }
    return '<div class="card acc-yellow">' +
      '<div class="spread" style="margin-bottom:6px">' +
        '<div class="card-title" style="margin-bottom:0">' + A.ui.icon('flag') + 'Savings goals</div>' +
        '<button class="btn btn-sm btn-acc" data-newgoal="1">New savings goal</button>' +
      '</div>' + body + '</div>';
  }

  /* ---------------- screen ---------------- */

  function renderFinance(el, ctx) {
    var s = A.S.get();
    var f = fin(s);
    var sum = A.engine.financeSummary(selMonth);

    var monthTx = (f.transactions || [])
      .filter(function (t) { return t.date && t.date.slice(0, 7) === selMonth; })
      .slice()
      .sort(function (a, b) { return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });

    el.innerHTML =
      headHTML() +
      summaryHTML(sum) +
      insightHTML(sum) +
      txTableHTML(monthTx) +
      '<div class="grid2 section-gap">' + budgetsHTML(sum, f.budgets || {}) + savingsHTML(f.savingsGoals || []) + '</div>';

    /* ---- listeners ---- */

    el.querySelector('[data-mprev]').addEventListener('click', function () {
      selMonth = ymAdd(selMonth, -1);
      renderFinance(el, ctx);
    });

    el.querySelector('[data-mnext]').addEventListener('click', function () {
      if (selMonth >= maxMonth()) return; // disabled at the last month that has anything to show
      selMonth = ymAdd(selMonth, 1);
      renderFinance(el, ctx);
    });

    el.querySelectorAll('[data-newtx]').forEach(function (b) {
      b.addEventListener('click', function () { openTxModal(); });
    });

    el.querySelectorAll('[data-catfilter]').forEach(function (sel) {
      sel.addEventListener('change', function () {
        catFilter = sel.value;
        renderFinance(el, ctx);
      });
    });

    el.querySelectorAll('[data-clearfilter]').forEach(function (b) {
      b.addEventListener('click', function () {
        catFilter = 'all';
        renderFinance(el, ctx);
      });
    });

    el.querySelectorAll('[data-txmore]').forEach(function (b) {
      b.addEventListener('click', function () {
        showAllTx = !showAllTx;
        renderFinance(el, ctx);
      });
    });

    el.querySelectorAll('[data-delt]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-delt');
        var t = findTx(A.S.get(), id);
        if (!t) return;
        A.ui.confirm(
          'Delete this ' + t.type + ' (' + (t.note || t.category) + ', ' + A.ui.fmtMoney(t.amount) + ')? This can’t be undone.',
          function () {
            A.S.update(function (st) {
              var ff = ensureFin(st);
              ff.transactions = ff.transactions.filter(function (x) { return x.id !== id; });
            });
            A.ui.toast('Transaction deleted', '🗑️');
          },
          { title: 'Delete transaction', yesLabel: 'Delete' }
        );
      });
    });

    el.querySelectorAll('[data-newbudget]').forEach(function (b) {
      b.addEventListener('click', function () { openBudgetModal(); });
    });

    el.querySelectorAll('[data-delbudget]').forEach(function (b) {
      b.addEventListener('click', function () {
        var cat = b.getAttribute('data-delbudget');
        A.ui.confirm(
          'Remove the ' + cat + ' budget? Spending in ' + cat + ' will no longer be capped or flagged.',
          function () {
            A.S.update(function (st) {
              delete ensureFin(st).budgets[cat];
            });
            A.ui.toast(cat + ' budget removed', '🗑️');
          },
          { title: 'Remove budget', yesLabel: 'Remove' }
        );
      });
    });

    el.querySelectorAll('[data-newgoal]').forEach(function (b) {
      b.addEventListener('click', function () { openGoalModal(); });
    });

    el.querySelectorAll('[data-addmoney]').forEach(function (b) {
      b.addEventListener('click', function () { openAddMoneyModal(b.getAttribute('data-addmoney')); });
    });

    el.querySelectorAll('[data-delgoal]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-delgoal');
        var g = findGoal(A.S.get(), id);
        if (!g) return;
        A.ui.confirm(
          'Delete "' + g.title + '"? The ' + A.ui.fmtMoney(g.saved || 0) + ' you tracked stays in your pocket, but the goal and its progress are gone.',
          function () {
            A.S.update(function (st) {
              var ff = ensureFin(st);
              ff.savingsGoals = ff.savingsGoals.filter(function (x) { return x.id !== id; });
            });
            A.ui.toast('Savings goal deleted', '🗑️');
          },
          { title: 'Delete savings goal', yesLabel: 'Delete' }
        );
      });
    });
  }

  A.registerScreen('app/finance', {
    title: 'Finance',
    icon: 'wallet',
    accent: 'yellow',
    inShell: true,
    order: 6,
    render: renderFinance
  });
})();

/* ===== js/social.js ===== */
/* ============================================================
   Acendri OS — Social Hub: a positive feed where people flex
   real goals. Feed + Friends + Groups + Paths tabs, all local.
   The demo community is simulated; the user's posts are real.
   ============================================================ */
(function () {
  'use strict';
  var A = window.Ascendri;

  /* ---------------- module state ---------------- */

  var TAB = 'feed';           // 'feed' | 'friends' | 'groups' | 'paths'
  var openComments = {};      // postId -> true (inline comment area open)
  var draft = '';             // composer text preserved across re-renders
  var curEl = null;           // current screen element (for manual re-render)
  var curCtx = null;

  var KIND_TAGS = {
    update: '✨ Update',
    achievement: '🏅 Achievement',
    goal: '🎯 Goal',
    streak: '🔥 Streak',
    pr: '🏋️ PR',
    path: '🧭 Path'
  };

  var GENERIC_STEPS = [
    'Write the goal down and decide why it matters',
    'Break it into small weekly actions',
    'Show up every day until it’s done'
  ];

  /* ---------------- helpers ---------------- */

  function safeAccent(name, fallback) {
    return A.ui.ACCENT_NAMES.indexOf(name) >= 0 ? name : (fallback || 'pink');
  }

  function findById(arr, id) {
    arr = arr || [];
    for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i];
    return null;
  }

  function socialOf(s) {
    return s.social || { friends: [], requests: [], suggestions: [], feed: [], groups: [], paths: [] };
  }

  function ensureSocial(st) {
    if (!st.social) st.social = { friends: [], requests: [], suggestions: [], feed: [], groups: [], paths: [] };
    st.social.friends = st.social.friends || [];
    st.social.requests = st.social.requests || [];
    st.social.suggestions = st.social.suggestions || [];
    st.social.feed = st.social.feed || [];
    st.social.groups = st.social.groups || [];
    st.social.paths = st.social.paths || [];
    return st.social;
  }

  function myName(s) { return (s.profile && s.profile.name) || 'You'; }
  function myAvatar(s) { return (s.profile && s.profile.avatar) || '🙂'; }

  function rerender() { if (curEl) renderSocial(curEl, curCtx); }

  function pathDoneCount(p) {
    var n = 0;
    (p.steps || []).forEach(function (_, i) { if (p.done && p.done[i]) n++; });
    return n;
  }

  function pathPct(p) {
    var total = (p.steps || []).length;
    return total ? Math.round(100 * pathDoneCount(p) / total) : 0;
  }

  /* ================= FEED ================= */

  function composerHTML(s) {
    var esc = A.ui.esc;
    return '<div class="card acc acc-cyan">' +
      '<div class="row" style="align-items:flex-start">' +
        '<span class="avatar">' + esc(myAvatar(s)) + '</span>' +
        '<div class="li-main">' +
          '<textarea class="textarea" data-ctext maxlength="400" placeholder="Share a win, a streak, a milestone…">' + esc(draft) + '</textarea>' +
          '<div class="row" style="justify-content:flex-end;margin-top:10px">' +
            '<button class="btn btn-primary" data-share>' + A.ui.icon('send', 'sm') + ' Share</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function postHTML(p) {
    var esc = A.ui.esc;
    var accCls = (p.kind === 'achievement' || p.kind === 'goal') ? ' acc acc-' + safeAccent(p.accent) : '';
    var open = !!openComments[p.id];
    var comments = p.comments || [];
    var kindTag = KIND_TAGS[p.kind] || ('✨ ' + esc(p.kind || 'update'));

    var h = '<div class="post' + accCls + '">';
    // header
    h += '<div class="spread">' +
      '<div class="row" style="min-width:0">' +
        '<span class="avatar">' + esc(p.avatar || '🙂') + '</span>' +
        '<div class="li-main">' +
          '<div class="row wrap" style="gap:8px"><span class="bold">' + esc(p.author) + '</span>' +
            (p.me ? '<span class="pill acc-cyan">You</span>' : '') + '</div>' +
          '<div class="row wrap" style="gap:8px"><span class="li-sub">' + esc(A.ui.timeAgo(p.time || Date.now())) + '</span>' +
            '<span class="tag">' + kindTag + '</span></div>' +
        '</div>' +
      '</div>' +
      (p.me
        ? '<button class="icon-btn danger" data-delpost="' + esc(p.id) + '" title="Delete post" aria-label="Delete post">' + A.ui.icon('trash', 'sm') + '</button>'
        : '') +
    '</div>';
    // body
    h += '<p style="margin:10px 0 12px;font-size:.93rem;color:var(--body)">' + esc(p.text) + '</p>';
    // actions
    h += '<div class="row wrap">' +
      '<button class="react-btn' + (p.liked ? ' on' : '') + '" data-like="' + esc(p.id) + '" title="' + (p.liked ? 'Unlike' : 'Like') + '">❤️ ' + (p.likes || 0) + '</button>' +
      '<button class="react-btn' + (open ? ' on' : '') + '" data-cbtn="' + esc(p.id) + '" title="Comments">💬 ' + comments.length + '</button>' +
    '</div>';
    // inline comments
    if (open) {
      h += '<hr class="sep"><div class="col" style="gap:8px">';
      comments.forEach(function (c) {
        h += '<div class="row" style="align-items:flex-start">' +
          '<span class="avatar sm">' + esc(c.avatar || '🙂') + '</span>' +
          '<div class="small" style="padding-top:5px"><span class="bold">' + esc(c.author) + '</span> ' +
          '<span class="muted">' + esc(c.text) + '</span></div></div>';
      });
      if (!comments.length) h += '<div class="small dim">No replies yet — be the first.</div>';
      h += '<div class="row">' +
        '<input class="input" data-cin="' + esc(p.id) + '" maxlength="240" placeholder="Write a reply…">' +
        '<button class="btn btn-sm btn-acc acc-cyan" data-crep="' + esc(p.id) + '">Reply</button>' +
      '</div></div>';
    }
    h += '</div>';
    return h;
  }

  function feedHTML(s) {
    var feed = socialOf(s).feed || [];
    var h = composerHTML(s);
    if (!feed.length) {
      h += '<div class="empty section-gap"><div class="e-emoji">🌤️</div>' +
        '<p>The feed is quiet. Post a win — even a tiny one — and set the tone.</p>' +
        '<button class="btn btn-acc acc-cyan" data-focus-composer>✍️ Share your first win</button></div>';
    } else {
      h += '<div class="col section-gap" style="gap:14px">' +
        feed.map(postHTML).join('') + '</div>';
    }
    return h;
  }

  function postReply(postId) {
    if (!curEl) return;
    var input = curEl.querySelector('[data-cin="' + postId + '"]');
    if (!input) return;
    var text = input.value.trim();
    if (!text) { A.ui.toast('Write a reply first', '💬'); return; }
    var s = A.S.get();
    var name = myName(s), av = myAvatar(s);
    openComments[postId] = true;
    A.S.update(function (st) {
      var p = findById(ensureSocial(st).feed, postId);
      if (!p) return;
      if (!p.comments) p.comments = [];
      p.comments.push({ author: name, avatar: av, text: text });
    });
  }

  function wireFeed(el) {
    var ta = el.querySelector('[data-ctext]');
    if (ta) ta.addEventListener('input', function () { draft = ta.value; });

    var share = el.querySelector('[data-share]');
    if (share) share.addEventListener('click', function () {
      var text = (ta ? ta.value : '').trim();
      if (!text) { A.ui.toast('Write something first — even a tiny win counts', '✍️'); return; }
      var s = A.S.get();
      var name = myName(s), av = myAvatar(s);
      draft = '';
      A.S.update(function (st) {
        ensureSocial(st).feed.unshift({
          id: A.ui.uid(), author: name, avatar: av, me: true, accent: 'cyan',
          kind: 'update', time: Date.now(), text: text, likes: 0, liked: false, comments: []
        });
      });
      A.S.addXp(5, 'Shared an update');
    });

    var focusBtn = el.querySelector('[data-focus-composer]');
    if (focusBtn) focusBtn.addEventListener('click', function () {
      if (ta) { ta.focus(); ta.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    });

    el.querySelectorAll('[data-like]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-like');
        A.S.update(function (st) {
          var p = findById(ensureSocial(st).feed, id);
          if (!p) return;
          p.liked = !p.liked;
          p.likes = Math.max(0, (p.likes || 0) + (p.liked ? 1 : -1));
        });
      });
    });

    el.querySelectorAll('[data-cbtn]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-cbtn');
        openComments[id] = !openComments[id];
        rerender();
      });
    });

    el.querySelectorAll('[data-crep]').forEach(function (b) {
      b.addEventListener('click', function () { postReply(b.getAttribute('data-crep')); });
    });
    el.querySelectorAll('[data-cin]').forEach(function (inp) {
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); postReply(inp.getAttribute('data-cin')); }
      });
    });

    el.querySelectorAll('[data-delpost]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-delpost');
        A.ui.confirm('Delete this post? It will disappear from the feed forever.', function () {
          delete openComments[id];
          A.S.update(function (st) {
            var so = ensureSocial(st);
            so.feed = so.feed.filter(function (p) { return p.id !== id; });
          });
          A.ui.toast('Post deleted', '🗑️');
        }, { title: 'Delete post', yesLabel: 'Delete' });
      });
    });
  }

  /* ================= FRIENDS ================= */

  function friendsHTML(s) {
    var esc = A.ui.esc;
    var so = socialOf(s);
    var requests = so.requests || [];
    var friends = so.friends || [];
    var suggestions = so.suggestions || [];
    var h = '';

    if (requests.length) {
      h += '<div class="card acc acc-pink">' +
        '<div class="card-title">💌 Friend requests</div><div class="list">' +
        requests.map(function (r) {
          return '<div class="list-item">' +
            '<span class="avatar">' + esc(r.avatar || '🙂') + '</span>' +
            '<div class="li-main"><div class="li-title">' + esc(r.name) + '</div>' +
            '<div class="li-sub">' + esc(r.role || '') + '</div></div>' +
            '<button class="btn btn-sm btn-acc acc-pink" data-accept="' + esc(r.id) + '">Accept</button>' +
            '<button class="btn btn-sm btn-ghost" data-decline="' + esc(r.id) + '">Decline</button>' +
          '</div>';
        }).join('') + '</div></div>';
    }

    h += '<div class="card' + (requests.length ? ' section-gap' : '') + '">' +
      '<div class="card-title">' + A.ui.icon('users') + ' Your friends <span class="muted" style="font-weight:400">(' + friends.length + ')</span></div>';
    if (!friends.length) {
      h += '<div class="empty"><div class="e-emoji">🫂</div>' +
        '<p>No friends yet — accept a request or add someone from the suggestions below.</p>' +
        '<button class="btn btn-acc acc-pink" data-goto-feed>🌍 Meet the community</button></div>';
    } else {
      h += '<div class="list">' + friends.map(function (f) {
        return '<div class="list-item">' +
          '<span class="avatar">' + esc(f.avatar || '🙂') + '</span>' +
          '<div class="li-main">' +
            '<div class="li-title row" style="gap:7px">' + esc(f.name) +
              (f.online ? '<span class="badge-dot acc-green" title="Online"></span>' : '') + '</div>' +
            '<div class="li-sub">' + esc(f.role || '') + '</div>' +
          '</div>' +
          '<span class="pill acc-blue">LV ' + (f.level || 1) + '</span>' +
          '<span class="tag">🔥 ' + (f.streak || 0) + '</span>' +
          '<button class="btn btn-sm btn-acc acc-pink" data-wave="' + esc(f.id) + '" title="Send some hype">👋 Wave</button>' +
        '</div>';
      }).join('') + '</div>';
    }
    h += '</div>';

    h += '<div class="card section-gap"><div class="card-title">✨ People you may know</div>';
    if (!suggestions.length) {
      h += '<div class="small muted">🎉 No more suggestions — you already know everyone around here.</div>';
    } else {
      h += '<div class="list">' + suggestions.map(function (p) {
        return '<div class="list-item">' +
          '<span class="avatar">' + esc(p.avatar || '🙂') + '</span>' +
          '<div class="li-main"><div class="li-title">' + esc(p.name) + '</div>' +
          '<div class="li-sub">' + esc(p.role || '') + '</div></div>' +
          '<button class="btn btn-sm btn-acc acc-pink" data-addfriend="' + esc(p.id) + '">+ Add friend</button>' +
        '</div>';
      }).join('') + '</div>';
    }
    h += '</div>';
    return h;
  }

  function wireFriends(el) {
    el.querySelectorAll('[data-accept]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-accept');
        var name = '';
        A.S.update(function (st) {
          var so = ensureSocial(st);
          var r = findById(so.requests, id);
          if (!r) return;
          name = r.name;
          so.requests = so.requests.filter(function (x) { return x.id !== id; });
          so.friends.push({ id: r.id, name: r.name, avatar: r.avatar, role: r.role, level: 3, streak: 1, online: true });
        });
        if (name) A.ui.toast('You and ' + name + ' are now friends 🎉', '🫂');
      });
    });

    el.querySelectorAll('[data-decline]').forEach(function (b) {
      b.addEventListener('click', function () {
