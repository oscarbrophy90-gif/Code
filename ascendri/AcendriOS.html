        var id = b.getAttribute('data-decline');
        A.S.update(function (st) {
          var so = ensureSocial(st);
          so.requests = so.requests.filter(function (x) { return x.id !== id; });
        });
        A.ui.toast('Request declined — no hard feelings', '👌');
      });
    });

    el.querySelectorAll('[data-addfriend]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-addfriend');
        var name = '';
        A.S.update(function (st) {
          var so = ensureSocial(st);
          var idx = -1;
          for (var i = 0; i < so.suggestions.length; i++) if (so.suggestions[i].id === id) idx = i;
          if (idx < 0) return;
          var p = so.suggestions[idx];
          name = p.name;
          so.suggestions.splice(idx, 1);
          so.friends.push({
            id: p.id, name: p.name, avatar: p.avatar, role: p.role,
            level: 2 + (idx % 4), streak: 1 + idx * 2, online: idx % 2 === 0
          });
        });
        if (name) A.ui.toast('You and ' + name + ' are now friends 🎉', '🫂');
      });
    });

    el.querySelectorAll('[data-wave]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-wave');
        var s = A.S.get();
        var f = findById(socialOf(s).friends, id);
        if (!f) return;
        // If the user has a post, the friend hypes it up in the comments.
        var myPost = null;
        (socialOf(s).feed || []).forEach(function (p) { if (!myPost && p.me) myPost = p; });
        if (myPost) {

  /* ================= GROUPS ================= */

  function groupsHTML(s) {

    if (!groups.length) {

  function openLeaderboard(groupId) {
    var esc = A.ui.esc;
    var s = A.S.get();
    var g = findById(socialOf(s).groups, groupId);
    if (!g) return;
    var rows = (g.leaderboard || []).map(function (r) {
      return { name: r.name, avatar: r.avatar, xp: r.xp || 0, me: false };

      rows.push({ name: myName(s), avatar: myAvatar(s), xp: (s.profile && s.profile.xp) || 0, me: true });
    }
    rows.sort(function (a, b) { return b.xp - a.xp; });
    var body = '<table class="tbl"><thead><tr><th>#</th><th>Member</th><th class="num" style="text-align:right">XP</th></tr></thead><tbody>' +
      rows.map(function (r, i) {

          '<td' + cls + '>' + (i + 1) + '</td>' +
          '<td' + cls + '><span style="margin-right:6px">' + esc(r.avatar || '🙂') + '</span>' + esc(r.name) + (r.me ? ' <span class="pill">You</span>' : '') + '</td>' +
          '<td class="num' + (r.me ? ' bold h-acc' : '') + '" style="text-align:right">' + r.xp + '</td>' +

    el.querySelectorAll('[data-join]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-join');

          g.members = (g.members || 0) + 1;
          name = g.name;

    el.querySelectorAll('[data-leave]').forEach(function (b) {

  /* ================= PATHS ================= */

  function pathCardHTML(p) {
    var esc = A.ui.esc;
    var acc = safeAccent(p.accent, 'indigo');
    var total = (p.steps || []).length;
    var done = pathDoneCount(p);
    var pct = pathPct(p);
    var h = '<div class="card acc acc-' + acc + '">' +
      '<div class="row">' +
        '<span class="avatar lg">' + esc(p.emoji || '🧭') + '</span>' +
        '<div class="li-main">' +
          '<div class="bold">' + esc(p.title) + '</div>' +
          '<div class="li-sub">by ' + esc(p.author) + ' · ' + (p.followers || 0) + ' followers · ' + total + ' steps</div>' +
        '</div>' +
      '</div>';
    if (p.following) {
      h += '<div style="margin-top:12px">' +
        '<div class="bar"><span class="bar-fill" style="width:' + pct + '%"></span></div>' +
        '<div class="small muted" style="margin-top:5px">' + done + ' of ' + total + ' steps done · ' + pct + '%' +
          (total && done === total ? ' — completed 🎉' : '') + '</div>' +
      '</div>';
    }
    h += '<div class="row wrap" style="margin-top:12px">' +
      (p.following
        ? '<button class="btn btn-sm btn-ghost" data-unfollow="' + esc(p.id) + '">Unfollow</button>'

      '<button class="btn btn-sm" data-open-path="' + esc(p.id) + '">🧭 Open</button>' +
    '</div></div>';

  function createPathCardHTML(s) {
    var esc = A.ui.esc;
    var doneGoals = (s.goals || []).filter(function (g) { return g.status === 'done'; });
    var h = '<div class="card acc acc-pink section-gap">' +
      '<div class="card-title">🌟 Create your own Path</div>';
    if (!doneGoals.length) {
      h += '<div class="muted small">Complete a goal to turn your journey into a Path others can follow.</div>' +
        '<button class="btn btn-sm btn-acc acc-pink" data-goto-goals style="margin-top:10px">🎯 Go to Goals</button>';
    } else {
      h += '<div class="muted small" style="margin-bottom:10px">You did it — now show others the way, step by step.</div>' +
        '<div class="row wrap">' +
          '<select class="select" data-pubsel style="flex:1;min-width:200px">' +
            doneGoals.map(function (g) {
              return '<option value="' + esc(g.id) + '">' + esc(g.title) + '</option>';
            }).join('') +
          '</select>' +
          '<button class="btn btn-primary" data-publish>🚀 Publish my Path</button>' +
        '</div>';
    }
    h += '</div>';
    return h;
  }

  function pathsHTML(s) {
    var paths = socialOf(s).paths || [];
    var h = '<div class="muted small" style="margin-bottom:14px">Paths are real journeys from real people — follow them step-by-step.</div>';
    if (!paths.length) {
      h += '<div class="empty"><div class="e-emoji">🧭</div>' +
        '<p>No Paths to follow yet — complete a goal and publish the very first one.</p>' +
        '<button class="btn btn-acc acc-pink" data-goto-goals>🎯 Go to Goals</button></div>';
    } else {
      h += '<div class="grid2">' + paths.map(pathCardHTML).join('') + '</div>';
    }
    h += createPathCardHTML(s);
    return h;
  }

  function openPathModal(pathId) {
    var esc = A.ui.esc;

    function getPath() { return findById(socialOf(A.S.get()).paths, pathId); }

    function bodyHTML() {
      var p = getPath();
      if (!p) return '<div class="muted">This Path is gone.</div>';
      var total = (p.steps || []).length;
      var done = pathDoneCount(p);
      var pct = pathPct(p);
      var h = '<div class="spread" style="margin-bottom:6px">' +
        '<span class="small muted">by ' + esc(p.author) + ' · ' + done + ' of ' + total + ' steps</span>' +
        '<span class="small bold h-acc">' + pct + '%</span></div>' +
        '<div class="bar lg"><span class="bar-fill" style="width:' + pct + '%"></span></div>';
      if (!p.following) {
        h += '<div class="small muted" style="margin-top:8px">👀 You’re previewing — follow this Path to start ticking steps.</div>';
      }
      h += '<div class="list" style="margin-top:14px">' +
        (p.steps || []).map(function (stp, i) {
          var on = !!(p.done && p.done[i]);
          return '<div class="list-item' + (on ? ' done' : '') + '">' +
            '<button class="check' + (on ? ' on' : '') + '" data-step="' + i + '" title="' + (p.following ? (on ? 'Untick step' : 'Tick step') : 'Follow to unlock') + '" aria-label="Toggle step ' + (i + 1) + '">' + A.ui.icon('check', 'sm') + '</button>' +
            '<div class="li-main"><div class="li-title" style="font-weight:500">' + esc(stp) + '</div>' +
            '<div class="li-sub">Step ' + (i + 1) + ' of ' + total + '</div></div>' +
          '</div>';
        }).join('') + '</div>';
      return h;
    }

    var p0 = getPath();
    if (!p0) return;

    var handle = A.ui.modal({
      title: esc(p0.emoji || '🧭') + ' ' + esc(p0.title),
      accent: safeAccent(p0.accent, 'indigo'),
      wide: true,
      body: bodyHTML(),
      actions: [{ label: 'Close', cls: 'btn-ghost' }],
      onOpen: function (m) { wire(m); }
    });

    function refresh() {
      var body = handle.el.querySelector('.modal-body');
      if (body) { body.innerHTML = bodyHTML(); wire(handle.el); }
    }

    function wire(m) {
      m.querySelectorAll('[data-step]').forEach(function (b) {
        b.addEventListener('click', function () {
          var idx = +b.getAttribute('data-step');
          var p = getPath();
          if (!p) return;
          if (!p.following) { A.ui.toast('Follow this path to start ticking steps', '🧭'); return; }
          var wasDone = !!(p.done && p.done[idx]);
          var completed = false;
          A.S.update(function (st) {
            var pp = findById(ensureSocial(st).paths, pathId);
            if (!pp) return;
            if (!pp.done) pp.done = {};
            if (wasDone) {
              delete pp.done[idx];
            } else {
              pp.done[idx] = true;
              completed = (pp.steps || []).every(function (_, i) { return !!pp.done[i]; });
            }
          });
          if (!wasDone) {
            A.S.addXp(5, 'Path step done');
            if (completed) { A.ui.confetti(); A.ui.toast('Path completed 🎉', '🏆'); }
          }
          refresh();
        });
      });
    }
  }

  function publishPath(el) {
    var sel = el.querySelector('[data-pubsel]');
    if (!sel || !sel.value) { A.ui.toast('Pick a completed goal first', '🎯'); return; }
    var s = A.S.get();
    var goal = findById(s.goals || [], sel.value);
    if (!goal || goal.status !== 'done') { A.ui.toast('Pick a completed goal first', '🎯'); return; }
    var title = 'How I ' + String(goal.title || '').toLowerCase();
    var already = false;
    (socialOf(s).paths || []).forEach(function (p) {
      if (p.author === myName(s) && p.title === title) already = true;
    });
    if (already) { A.ui.toast('You already published that journey as a Path', '🌟'); return; }
    var steps = (goal.milestones && goal.milestones.length)
      ? goal.milestones.map(function (m) { return m.title; })
      : GENERIC_STEPS.slice();
    var done = {};
    steps.forEach(function (_, i) { done[i] = true; });
    var name = myName(s), av = myAvatar(s);
    A.S.update(function (st) {
      ensureSocial(st).paths.unshift({
        id: A.ui.uid(), title: title, author: name, avatar: av,
        accent: safeAccent(goal.accent, 'pink'), emoji: '🌟',
        followers: 0, following: true, done: done, steps: steps
      });
    });
    A.ui.toast('Path published — inspire someone 🚀', '🌟');
  }

  function wirePaths(el) {
    el.querySelectorAll('[data-follow]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-follow');
        A.S.update(function (st) {
          var p = findById(ensureSocial(st).paths, id);
          if (!p || p.following) return;
          p.following = true;
          p.followers = (p.followers || 0) + 1;
        });
        A.ui.toast('Following — step 1 awaits!', '🧭');
      });
    });

    el.querySelectorAll('[data-unfollow]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-unfollow');
        var p = findById(socialOf(A.S.get()).paths, id);
        if (!p) return;
        A.ui.confirm('Unfollow "' + p.title + '"? Your ticked steps are kept in case you come back.', function () {
          A.S.update(function (st) {
            var pp = findById(ensureSocial(st).paths, id);
            if (!pp || !pp.following) return;
            pp.following = false;
            pp.followers = Math.max(0, (pp.followers || 1) - 1);
          });
          A.ui.toast('Unfollowed — your progress is saved', '👌');
        }, { title: 'Unfollow path', yesLabel: 'Unfollow' });
      });
    });

    el.querySelectorAll('[data-open-path]').forEach(function (b) {
      b.addEventListener('click', function () { openPathModal(b.getAttribute('data-open-path')); });
    });

    var pub = el.querySelector('[data-publish]');
    if (pub) pub.addEventListener('click', function () { publishPath(el); });

    el.querySelectorAll('[data-goto-goals]').forEach(function (b) {
      b.addEventListener('click', function () { if (curCtx) curCtx.nav('app/goals'); else A.nav('app/goals'); });
    });
  }

  /* ================= SCREEN ================= */

  function tabsHTML(s) {
    var so = socialOf(s);
    var reqCount = (so.requests || []).length;
    var defs = [
      { id: 'feed', label: '📣 Feed' },
      { id: 'friends', label: '🫂 Friends' + (reqCount ? ' <span class="pill acc-pink">' + reqCount + '</span>' : '') },
      { id: 'groups', label: '👥 Groups' },
      { id: 'paths', label: '🧭 Paths' }
    ];
    return '<div class="row wrap" style="margin-bottom:20px">' +
      defs.map(function (d) {
        return '<button class="btn' + (TAB === d.id ? ' btn-acc acc-pink' : '') + '" data-tab="' + d.id + '">' + d.label + '</button>';
      }).join('') + '</div>';
  }

  function renderSocial(el, ctx) {
    curEl = el;
    curCtx = ctx;
    var s = A.S.get();

    var body;
    if (TAB === 'friends') body = friendsHTML(s);
    else if (TAB === 'groups') body = groupsHTML(s);
    else if (TAB === 'paths') body = pathsHTML(s);
    else { TAB = 'feed'; body = feedHTML(s); }

    el.innerHTML =
      '<div class="screen-head">' +
        '<h1>Social Hub</h1>' +
        '<div class="sub">A positive feed where people flex real goals, not selfies.</div>' +
        '<div style="margin-top:10px"><span class="tag">🧪 Demo community — simulated friends show how the hub works. Your posts are real (and stay on this device).</span></div>' +
      '</div>' +
      tabsHTML(s) +
      body;

    el.querySelectorAll('[data-tab]').forEach(function (b) {
      b.addEventListener('click', function () {
        TAB = b.getAttribute('data-tab');
        rerender();
      });
    });

    if (TAB === 'feed') wireFeed(el);
    else if (TAB === 'friends') wireFriends(el);
    else if (TAB === 'groups') wireGroups(el);
    else if (TAB === 'paths') wirePaths(el);
  }

  A.registerScreen('app/social', {
    title: 'Social Hub',
    icon: 'users',
    accent: 'pink',
    inShell: true,
    order: 7,
    render: renderSocial
  });
})();

/* ===== js/achievements.js ===== */
/* ============================================================
   Acendri OS — Achievements: gamified progression.
   Level hero + ladder preview, cross-app stats, badge grid
   with detail modals ("Take me there" for locked ones), and
   a recent-XP history feed.
   ============================================================ */
(function () {
  'use strict';
  var A = window.Ascendri;

  /* ---------------- helpers ---------------- */

  // Cumulative XP thresholds for the next `count` levels, derived purely
  // from A.ui.levelProgress so the curve always matches core.
  function ladder(xp, count) {
    var lp = A.ui.levelProgress(xp);
    var out = [];
    var need = xp - lp.into + lp.span; // cumulative XP to reach lp.level + 1
    var lvl = lp.level + 1;
    for (var i = 0; i < count; i++) {
      out.push({ level: lvl, xp: need });
      var nx = A.ui.levelProgress(need); // sits exactly at the start of `lvl`
      need += nx.span;
      lvl++;
    }
    return out;
  }

  // Map an achievement id to its most relevant screen.
  var SCREEN_RULES = [
    ['goal', 'app/goals'], ['milestone', 'app/goals'],
    ['task', 'app/tasks'], ['focused', 'app/tasks'],
    ['habit', 'app/habits'], ['streak', 'app/habits'],
    ['money', 'app/finance'], ['budget', 'app/finance'], ['save', 'app/finance'],
    ['planner', 'app/schedule'],
    ['social', 'app/social'], ['group', 'app/social'], ['path', 'app/social'],
    ['ai', 'app/assistant'],
    ['level', 'app/dashboard'], ['welcome', 'app/dashboard']
  ];
  var SCREEN_LABELS = {
    'app/goals': 'Goals', 'app/tasks': 'Tasks', 'app/habits': 'Habits',
    'app/finance': 'Finance', 'app/schedule': 'Planner', 'app/social': 'Social',
    'app/assistant': 'Assistant', 'app/dashboard': 'Dashboard'
  };
  function screenFor(id) {
    for (var i = 0; i < SCREEN_RULES.length; i++) {
      if (id.indexOf(SCREEN_RULES[i][0]) !== -1) return SCREEN_RULES[i][1];
    }
    return 'app/dashboard';
  }

  // Actionable hint per locked achievement.
  var HINTS = {
    'welcome': 'Finish setting up your profile — your journey starts the moment you do.',
    'goal-starter': 'Head to Goals and create your first one — pick something that genuinely excites you.',
    'milestone': 'Open one of your goals and tick off its first milestone.',
    'goal-crusher': 'Finish every milestone on a goal, then mark the whole goal complete.',
    'first-task': 'Add a task and check it off — the first of many.',
    'task-10': 'Keep ticking tasks off — 10 completed tasks unlocks this.',
    'task-50': 'Complete 50 tasks in total. Slow and steady absolutely counts.',
    'focused': 'Complete 5 high-priority tasks — the scary ones give the most back.',
    'habit-first': 'Create your first habit — small daily actions compound fast.',
    'streak-3': 'Tick any habit 3 days in a row to warm up.',
    'streak-7': 'Keep a habit streak alive for a full week without missing.',
    'streak-30': 'Hold a habit streak for 30 straight days. Diamond hands.',
    'first-money': 'Log any income or expense in Finance to start mapping your money.',
    'budget-boss': 'Set a monthly limit for one spending category in Finance.',
    'saver': 'Create a savings goal in Finance — future you says thanks.',
    'save-500': 'Grow your combined savings goals to $500.',
    'planner': 'Open the Planner and generate your automatic weekly timetable.',
    'social-butterfly': 'Accept a friend request or add a suggested friend in Social.',
    'grouped': 'Join any group in the Social screen and climb its leaderboard.',
    'pathfinder': 'Follow a Path shared by the community in Social.',
    'ai-curious': 'Send your first message to the Acendri assistant.',
    'level-5': 'Keep earning XP from tasks, habits and goals to reach Level 5.',
    'level-10': 'The long game — stack XP every day until you hit Level 10.'
  };

  /* ---------------- A) level hero ---------------- */

  function heroHTML(s) {
    var esc = A.ui.esc;
    var xp = (s.profile && s.profile.xp) || 0;
    var lp = A.ui.levelProgress(xp);
    var next = ladder(xp, 3);
    var ladderRows = next.map(function (n) {
      return '<span class="tag">LV ' + n.level + ' ' + esc(A.ui.levelTitle(n.level).toUpperCase()) +
        ' · ' + n.xp + ' XP</span>';
    }).join('');
    return '<div class="dash-hero">' +
      '<div class="spread wrap" style="align-items:flex-start;gap:22px">' +
        '<div class="row" style="gap:16px;flex:1;min-width:260px;align-items:flex-start">' +
          '<span class="avatar lg acc-purple" style="font-size:2.2rem;font-weight:800">' + lp.level + '</span>' +
          '<div class="col" style="gap:6px;flex:1;min-width:0">' +
            '<div class="bold" style="font-size:1.3rem">Level ' + lp.level +
              ' — <span class="h-grad">' + esc(A.ui.levelTitle(lp.level).toUpperCase()) + '</span></div>' +
            '<div class="muted small">total XP: ' + xp + '</div>' +
            '<div class="bar lg acc-cyan"><div class="bar-fill" style="width:' + lp.pct + '%"></div></div>' +
            '<div class="small muted">' + lp.into + ' / ' + lp.span + ' XP to Level ' + (lp.level + 1) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="col" style="gap:8px;align-items:flex-end">' +
          '<div class="small dim">NEXT ON THE LADDER</div>' + ladderRows +
        '</div>' +
      '</div>' +
    '</div>';
  }

  /* ---------------- B) stats row ---------------- */

  function statsHTML(s) {
    var esc = A.ui.esc;
    var defs = A.engine.ACHIEVEMENTS;
    var got = s.achievements || {};
    var unlocked = defs.filter(function (d) { return got[d.id]; });
    var achXp = unlocked.reduce(function (a, d) { return a + (d.xp || 0); }, 0);
    var best = 0;
    (s.habits || []).forEach(function (h) {
      var st = A.engine.habitStreak(h);
      if (st > best) best = st;
    });
    var doneTasks = (s.tasks || []).filter(function (t) { return t.done; }).length;
    function statCard(acc, emoji, v, k) {
      return '<div class="card acc acc-' + acc + '"><div class="stat">' +
        '<span class="v">' + emoji + ' ' + esc(String(v)) + '</span>' +
        '<span class="k">' + esc(k) + '</span></div></div>';

/* ===== js/assistant.js ===== */
/* ============================================================
   Acendri OS — AI Assistant: chat UI wired to the brain
   (js/brain.js). The brain classifies intent, answers from
   REAL state and may perform its own effects (create goals,
   reminders, timetables). No network — everything is local.
   ============================================================ */
(function () {
  'use strict';
  var A = window.Ascendri;

  var CHIPS = [
    'What should I focus on today?',
    'Generate my timetable for basketball training',
    'Set me a goal for tennis',
    'Remind me to stretch tomorrow',
    'How is my spending?',
    'Motivate me'
  ];

  var typingActive = false;   // true while the "…" indicator is up (blocks double-sends)
  var sendGen = 0;            // bumped on clear so a pending reply can bail out
  var draft = '';             // preserves half-typed input across re-renders
  var inputFocused = false;   // restore focus after re-render
  var logEl = null;           // current .chat-log element

  /* ---------------- state helpers ---------------- */

  function ensureAssistant(s) {
    if (!s.assistant) s.assistant = { history: [] };
    if (!s.assistant.history) s.assistant.history = [];
  }

  function historyOf(s) {
    return (s.assistant && s.assistant.history) ? s.assistant.history : [];
  }

  function capHistory(s) {
    while (s.assistant.history.length > 50) s.assistant.history.shift();
  }

  function userName(s) {
    return (s.profile && s.profile.name) ? s.profile.name : '';
  }

  /* ---------------- send flow ---------------- */

  function typingHTML() {
    return '<div class="msg ai typing" data-typing="1"><i></i><i></i><i></i></div>';
  }

  function appendTypingNow() {
    if (!logEl || logEl.isConnected === false) return;
    if (logEl.querySelector('[data-typing]')) return;
    var holder = document.createElement('div');
    holder.innerHTML = typingHTML();
    logEl.appendChild(holder.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function computeReply(text) {
    var B = A.brain;
    if (!B || typeof B.respond !== 'function') {
      A.ui.toast('Assistant brain not loaded', '🧠');
      return { text: 'My brain isn’t loaded (js/brain.js is missing) 🧠 Reload the app and I’ll be back to full power.' };
    }
    var out;
    try {
      out = B.respond(text);
    } catch (err) {
      out = null;
    }
    if (!out || typeof out.text !== 'string') {
      out = { text: 'Oof, I tripped over my own wires there 🤕 Ask me that again?' };
    }
    return out;
  }

  function sendMessage(text) {
    text = String(text == null ? '' : text).trim();
    if (!text || typingActive) return;
    if (text.length > 400) text = text.slice(0, 400);
    typingActive = true;
    draft = '';
    inputFocused = true;
    var gen = sendGen;

    // (a) store the user message (non-silent -> re-render shows it,
    //     and the "ai-curious" achievement check fires automatically)
    A.S.update(function (s) {
      ensureAssistant(s);
      s.assistant.history.push({ role: 'user', text: text, ts: Date.now() });
      capHistory(s);
    });

    // (b) instant typing indicator (re-render also re-adds it while typingActive)
    appendTypingNow();

    // (c) think, then answer. brain.respond may run its own A.S.update effects
    //     (create a goal/reminder, generate the timetable…) which re-render
    //     mid-flow — that's fine, because (d) pushes the ai message with a
    //     final non-silent update that re-renders everything cleanly.
    setTimeout(function () {
      if (gen !== sendGen) return; // conversation was cleared meanwhile
      var out = computeReply(text);
      typingActive = false;
      A.S.update(function (s) {
        ensureAssistant(s);
        var m = { role: 'ai', text: out.text, ts: Date.now() };
        if (out.actions && out.actions.length) m.actions = out.actions;
        s.assistant.history.push(m);
        capHistory(s);
      });
    }, 700);
  }

  /* ---------------- render ---------------- */

  function render(el, ctx) {
    var s = A.S.get();
    var esc = A.ui.esc;
    var history = historyOf(s);

    // remember focus before the DOM is torn down
    var ae = document.activeElement;
    if (ae && ae.hasAttribute && ae.hasAttribute('data-as-input')) inputFocused = true;

    var msgsHTML = '';
    if (!history.length) {
      var introName = userName(s) || 'there';
      msgsHTML += '<div class="msg ai">' +
        esc('Hey ' + introName + ' 👋 I’m your Acendri assistant — and I don’t just talk. From this chat I can create goals with milestones, plan your whole week into a timetable and set reminders, plus keep an eye on your focus, money and streaks. Try a suggestion below.') +
        '</div>';
    }
    history.forEach(function (m) {
      var when = m.ts ? esc(A.ui.timeAgo(m.ts)) : '';
      if (m.role === 'user') {
        msgsHTML += '<div class="msg me" title="' + when + '">' + esc(m.text) + '</div>';
      } else {
        var actionsHTML = '';
        if (m.actions && m.actions.length) {
          actionsHTML = '<div class="msg-actions">' + m.actions.map(function (a) {
            return '<button class="btn btn-sm btn-acc acc-cyan" data-goto="' + esc(a.screen) + '">' + esc(a.label) + '</button>';
          }).join('') + '</div>';
        }
        msgsHTML += '<div class="msg ai" title="' + when + '">' + esc(m.text) + actionsHTML + '</div>';
      }
    });
    if (typingActive) msgsHTML += typingHTML();

    var chipsHTML = '<div class="chips">' + CHIPS.map(function (c) {
      return '<button class="chip" data-chip="' + esc(c) + '">' + esc(c) + '</button>';
    }).join('') + '</div>';

    el.innerHTML =
      '<div class="screen-head spread">' +
        '<div>' +
          '<h1 class="h-grad">Acendri AI</h1>' +
          '<div class="sub">It knows your goals, timetable, money and habits — ask away.</div>' +
        '</div>' +
        '<button class="icon-btn danger" data-clear aria-label="Clear conversation" title="Clear conversation">' + A.ui.icon('trash') + '</button>' +
      '</div>' +
      '<div class="chat-wrap acc-cyan">' +
        '<div class="chat-log">' + msgsHTML + '</div>' +
        chipsHTML +
        '<div class="row">' +
          '<input class="input" data-as-input maxlength="400" placeholder="Ask Acendri anything…" value="' + esc(draft) + '">' +
          '<button class="btn btn-primary" data-send aria-label="Send message" title="Send"' + (typingActive ? ' disabled' : '') + '>' + A.ui.icon('send') + '</button>' +
        '</div>' +
      '</div>';

    logEl = el.querySelector('.chat-log');
    logEl.scrollTop = logEl.scrollHeight;

    // clear conversation
    el.querySelector('[data-clear]').addEventListener('click', function () {
      if (!historyOf(A.S.get()).length) {
        A.ui.toast('Nothing to clear yet — say hi first!', '🤖');
        return;
      }
      A.ui.confirm(
        'Delete your entire conversation with Acendri? Your goals, tasks and data stay untouched — only the chat is cleared.',
        function () {
          sendGen++;
          typingActive = false;
          A.S.update(function (st) { ensureAssistant(st); st.assistant.history = []; });
          A.ui.toast('Conversation cleared', '🧹');
        },
        { title: 'Clear conversation', yesLabel: 'Clear it' }
      );
    });

    // suggestion chips
    el.querySelectorAll('[data-chip]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (typingActive) { A.ui.toast('One sec — I’m still typing…', '🤖'); return; }
        sendMessage(b.getAttribute('data-chip'));
      });
    });

    // input + send
    var input = el.querySelector('[data-as-input]');
    function trySend() {
      if (typingActive) { A.ui.toast('One sec — I’m still typing…', '🤖'); return; }
      sendMessage(input.value);
    }
    input.addEventListener('input', function () { draft = input.value; });
    input.addEventListener('focus', function () { inputFocused = true; });
    input.addEventListener('blur', function () { inputFocused = false; });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); trySend(); }
    });
    el.querySelector('[data-send]').addEventListener('click', trySend);
    if (inputFocused) { try { input.focus(); } catch (e2) { /* noop */ } }

    // action buttons inside ai messages
    el.querySelectorAll('[data-goto]').forEach(function (b) {
      b.addEventListener('click', function () {
        ctx.nav(b.getAttribute('data-goto'));
      });
    });
  }

  /* ---------------- register ---------------- */

  A.registerScreen('app/assistant', {
    title: 'AI Assistant',
    icon: 'chat',
    accent: 'cyan',
    inShell: true,
    order: 10,
    render: render
  });
})();

        '</div>' +

          '<button class="btn" data-act="import">' + icon('upload', 'sm') + 'Import data</button>' +
          '<button class="btn btn-acc" data-act="demo">' + icon('sparkles', 'sm') + 'Load demo data</button>' +
          '<button class="btn btn-danger" data-act="reset">' + icon('trash', 'sm') + 'Reset everything</button>' +
        '</div>' +
        '<input type="file" id="set-import-file" accept=".json,application/json" style="display:none">' +
      '</div>';
  }

  function aboutCard() {
    return '' +
      '<div class="card acc acc-indigo section-gap">' +
        '<div class="card-title">' + icon('sparkles') + 'About Acendri OS</div>' +
        '<p class="bold">Acendri OS · prototype v1.0</p>' +
        '<p class="h-acc small" style="margin:6px 0">Plan → Act → Track → Learn → Improve → Plan again.</p>' +
        '<p class="muted small" style="margin-bottom:14px">One connected operating system for your goals, time, habits and money — so ambitious people can spend less energy organising life and more energy living it.</p>' +
        '<div class="row wrap">' +
          '<button class="btn" data-act="landing">' + icon('eye', 'sm') + 'View landing page</button>' +
          '<button class="btn btn-ghost" data-act="assistant">' + icon('chat', 'sm') + 'Meet the assistant</button>' +
        '</div>' +
      '</div>';
  }

  /* ---------------- actions ---------------- */

  function saveProfile(el) {
    var name = el.querySelector('#set-name').value.trim();
    var focus = el.querySelector('#set-focus').value;
    var selBtn = el.querySelector('#set-avatars button.sel');
    var avatar = selBtn ? selBtn.getAttribute('data-emoji') : '🙂';
    if (!name) { A.ui.toast('Tell us your name first', '✍️'); el.querySelector('#set-name').focus(); return; }
    A.S.update(function (s) {
      s.profile.name = name;
      s.profile.avatar = avatar;
      if (focus) s.profile.focus = focus;
    });
    A.S.log('Updated profile', '👤');
    A.ui.toast('Profile saved', '✅');
  }

  function savePrefs(el) {
    var wake = el.querySelector('#set-wake').value;
    var sleep = el.querySelector('#set-sleep').value;
    var currency = el.querySelector('#set-currency').value;
    var autoPost = el.querySelector('#set-autopost').checked;
    var notifications = el.querySelector('#set-notif').checked;
    if (!wake || !sleep) { A.ui.toast('Set both a wake and a sleep time', '⏰'); return; }
    if (A.ui.minutes(sleep) <= A.ui.minutes(wake)) { A.ui.toast('Sleep time must be after wake time', '🌙'); return; }
    A.S.update(function (s) {
      if (!s.settings) s.settings = {};
      s.settings.wake = wake;
      s.settings.sleep = sleep;
      s.settings.currency = currency;
      s.settings.autoPost = autoPost;
      s.settings.notifications = notifications;
      if (s.timetable) A.engine.generateTimetable(s); // keep the timetable in step with the new day shape
    });
    A.S.log('Updated planner preferences', '⚙️');
    A.ui.toast('Preferences saved', '✅');
  }

  function exportData() {
    var blob = new Blob([A.S.exportJSON()], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'acendri-backup.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    A.ui.toast('Backup downloaded', '💾');
  }

  function importData(el) {
    var input = el.querySelector('#set-import-file');
    input.value = '';
    input.onchange = function () {
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          A.S.importJSON(String(reader.result));
          A.ui.toast('Data restored', '🎉');
        } catch (e) {
          A.ui.toast(e && e.message ? e.message : 'That file could not be read', '⚠️');
        }
      };
      reader.onerror = function () { A.ui.toast('Could not read that file', '⚠️'); };
      reader.readAsText(file);
    };
    input.click();
  }

  function loadDemo() {
    A.ui.confirm(
      'This adds demo goals, tasks, habits and finances on top of your data. Continue?',
      function () { A.S.loadDemo(); },
      { title: 'Load demo data?', yesLabel: 'Load demo', danger: false, accent: 'teal' }
    );
  }

  function resetAll() {
    A.ui.confirm(
      'This permanently erases ALL your Acendri data — goals, tasks, habits, finances, XP, achievements and settings. There is no backup and this cannot be undone.',
      function () { A.S.reset(); A.ui.toast('Everything wiped — fresh start', '🧹'); },
      { title: 'Reset everything?', yesLabel: 'Erase it all' }
    );
  }

  /* ---------------- screen ---------------- */

  A.registerScreen('app/settings', {
    title: 'Settings',
    icon: 'gear',
    accent: 'teal',
    inShell: true,
    order: 12,
    render: function (el, ctx) {
      var s = ctx.S.get();
      el.innerHTML =
        '<div class="screen-head"><h1>Settings <span class="h-grad">&amp; privacy</span></h1>' +
        '<div class="sub">Tune Acendri to your life — and keep every byte of your data in your hands.</div></div>' +
        '<div class="grid2">' + profileCard(s) + prefsCard(s) + '</div>' +
        dataCard(s) +
        aboutCard();

      // avatar picker: highlight locally, saved on "Save profile"
      el.querySelectorAll('#set-avatars button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          el.querySelectorAll('#set-avatars button').forEach(function (b) { b.classList.remove('sel'); });
          btn.classList.add('sel');
        });
      });

      el.querySelectorAll('[data-act]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var act = btn.getAttribute('data-act');
          if (act === 'save-profile') saveProfile(el);
          else if (act === 'save-prefs') savePrefs(el);
          else if (act === 'export') exportData();
          else if (act === 'import') importData(el);
          else if (act === 'demo') loadDemo();
          else if (act === 'reset') resetAll();
          else if (act === 'landing') ctx.nav('landing');
          else if (act === 'assistant') ctx.nav('app/assistant');
        });
      });
    }
  });
})();

window.Ascendri.boot();
</script>
</body>
</html>
