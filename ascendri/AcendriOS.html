<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acendri OS — Your Life Operating System</title>
<meta name="description" content="Stop juggling apps. Start living smarter. Acendri manages your productivity, finances, learning, health, and time through one intelligent platform.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='.5' stop-color='%23c084fc'/%3E%3Cstop offset='1' stop-color='%2360a5fa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='44' fill='none' stroke='url(%23g)' stroke-width='8'/%3E%3Cpath d='M50 26 30 70h12l8-20 8 20h12z' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
/* ============================================================
   Acendri OS — design system
   Dark navy base, neon accent glow cards, gradient headlines.
   Accent variants: add .acc-cyan | .acc-blue | .acc-orange |
   .acc-green | .acc-purple | .acc-pink | .acc-teal |
   .acc-indigo | .acc-red | .acc-yellow to any element to set
   --acc / --accB / --accBg / --accGlow for it and its children.
   ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #060713;
  --bg2: #0a0c1f;
  --panel: rgba(13, 16, 36, 0.75);
  --panel-solid: #0d1024;
  --line: #1d2342;
  --text: #f1f5f9;
  --body: #cbd5e1;
  --muted: #94a3b8;
  --dim: #64748b;
  --grad-hero: linear-gradient(90deg, #22d3ee 0%, #c084fc 50%, #60a5fa 100%);
  --grad-btn: linear-gradient(90deg, #06b6d4 0%, #3b82f6 100%);
  --acc: #22d3ee; --accB: #06b6d4;
  --accBg: rgba(6,182,212,.1); --accGlow: rgba(6,182,212,.2);
  --radius: 16px;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  font-size: 16px;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif,
    "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
  line-height: 1.55;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ---- accent variants ---- */
.acc-cyan   { --acc:#22d3ee; --accB:#06b6d4; --accBg:rgba(6,182,212,.1);  --accGlow:rgba(6,182,212,.22); }
.acc-blue   { --acc:#60a5fa; --accB:#3b82f6; --accBg:rgba(59,130,246,.1); --accGlow:rgba(59,130,246,.22); }
.acc-orange { --acc:#fb923c; --accB:#f97316; --accBg:rgba(249,115,22,.1); --accGlow:rgba(249,115,22,.22); }
.acc-green  { --acc:#4ade80; --accB:#22c55e; --accBg:rgba(34,197,94,.1);  --accGlow:rgba(34,197,94,.22); }
.acc-purple { --acc:#c084fc; --accB:#a855f7; --accBg:rgba(168,85,247,.1); --accGlow:rgba(168,85,247,.22); }
.acc-pink   { --acc:#f472b6; --accB:#ec4899; --accBg:rgba(236,72,153,.1); --accGlow:rgba(236,72,153,.22); }
.acc-teal   { --acc:#2dd4bf; --accB:#14b8a6; --accBg:rgba(20,184,166,.1); --accGlow:rgba(20,184,166,.22); }
.acc-indigo { --acc:#818cf8; --accB:#6366f1; --accBg:rgba(99,102,241,.1); --accGlow:rgba(99,102,241,.22); }
.acc-red    { --acc:#f87171; --accB:#ef4444; --accBg:rgba(239,68,68,.1);  --accGlow:rgba(239,68,68,.22); }
.acc-yellow { --acc:#facc15; --accB:#eab308; --accBg:rgba(234,179,8,.1);  --accGlow:rgba(234,179,8,.22); }

/* ---- typography helpers ---- */
.h-grad {
  background: var(--grad-hero);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.h-acc { color: var(--acc); }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.small { font-size: .82rem; }
.big { font-size: 1.5rem; font-weight: 700; }
.bold { font-weight: 700; }

/* ---- generic layout ---- */
.row { display: flex; align-items: center; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 10px; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.wrap { flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; }
@media (max-width: 1100px) { .grid4 { grid-template-columns: repeat(2,minmax(0,1fr)); } .grid3 { grid-template-columns: repeat(2,minmax(0,1fr)); } }
@media (max-width: 720px)  { .grid2, .grid3, .grid4 { grid-template-columns: 1fr; } }

/* ---- cards ---- */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
}
.card.acc, .card.glow {
  border-color: var(--accB);
  background: linear-gradient(var(--accBg), var(--accBg)), var(--panel);
}
.card.glow { box-shadow: 0 0 20px var(--accGlow); }
.card-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 10px; display:flex; align-items:center; gap:8px; }
.card-title .svgi { color: var(--acc); }

/* icon tile (rounded square with accent icon inside) */
.icon-tile {
  width: 42px; height: 42px; flex: 0 0 42px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 12px;
  border: 1px solid var(--accB);
  background: var(--accBg);
  color: var(--acc);
  font-size: 1.2rem;
}
.icon-tile.lg { width: 54px; height: 54px; flex-basis: 54px; border-radius: 14px; font-size: 1.6rem; }

/* ---- buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: inherit; font-weight: 600; font-size: .95rem;
  color: var(--text);
  background: #141834;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 18px;
  cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease, opacity .15s;
  user-select: none;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); border-color: #2a3160; }
.btn:active { transform: translateY(0); }
.btn-primary {
  background: var(--grad-btn);
  border: none; color: #fff;
}
.btn-primary:hover { box-shadow: 0 6px 24px rgba(34,131,246,.45); }
.btn-acc {
  background: var(--accBg); border: 1px solid var(--accB); color: var(--acc);
}
.btn-acc:hover { box-shadow: 0 0 16px var(--accGlow); border-color: var(--acc); }
.btn-ghost { background: transparent; }
.btn-danger { background: rgba(239,68,68,.12); border-color: #7f1d1d; color: #f87171; }
.btn-danger:hover { border-color: #ef4444; box-shadow: 0 0 14px rgba(239,68,68,.25); }
.btn-sm { padding: 6px 12px; font-size: .82rem; border-radius: 10px; }
.btn-lg { padding: 14px 28px; font-size: 1.05rem; border-radius: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; flex: 0 0 34px; padding: 0;
  background: transparent; border: 1px solid transparent; border-radius: 10px;
  color: var(--muted); cursor: pointer; font: inherit;
  transition: background .15s, color .15s, border-color .15s;
}
.icon-btn:hover { background: #161b3a; color: var(--text); border-color: var(--line); }
.icon-btn.danger:hover { color: #f87171; background: rgba(239,68,68,.1); }

/* ---- pills, tags, badges ---- */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: .72rem; font-weight: 600; letter-spacing: .02em;
  padding: 2px 9px; border-radius: 999px;
  border: 1px solid var(--accB); color: var(--acc); background: var(--accBg);
}
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: .74rem; padding: 3px 10px; border-radius: 999px;
  background: #151a38; border: 1px solid var(--line); color: var(--muted);
}
.badge-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--acc); display: inline-block; }

/* ---- progress bars ---- */
.bar {
  height: 8px; border-radius: 999px; background: #141834;
  overflow: hidden; width: 100%;
}
.bar-fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--accB), var(--acc));
  transition: width .4s ease;
  min-width: 0;
}
.bar.lg { height: 12px; }

/* ---- inputs ---- */
.input, .select, .textarea {
  font: inherit; color: var(--text);
  background: #10142c;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 14px;
  width: 100%;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--accB); box-shadow: 0 0 0 3px var(--accBg);
}
.textarea { resize: vertical; min-height: 80px; }
.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.select option { background: var(--panel-solid); color: var(--text); }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > label { font-size: .82rem; font-weight: 600; color: var(--muted); }
.checkbox { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: .9rem; color: var(--body); }
.checkbox input { accent-color: var(--accB); width: 16px; height: 16px; cursor: pointer; }
input[type="date"], input[type="time"] { color-scheme: dark; }

/* emoji option picker (settings / habit forms) */
.emoji-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.emoji-pick button {
  font: inherit; font-size: 1.2rem; width: 40px; height: 40px;
  background: #10142c; border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
}
.emoji-pick button.sel { border-color: var(--acc); background: var(--accBg); box-shadow: 0 0 10px var(--accGlow); }

/* color/accent swatch picker */
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatches button {
  width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent; background: var(--accB);
}
.swatches button.sel { border-color: #fff; box-shadow: 0 0 10px var(--accGlow); }

/* ---- lists ---- */
.list { display: flex; flex-direction: column; gap: 10px; }
.list-item {
  display: flex; align-items: center; gap: 12px;
  background: #0e1228; border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 14px;
  transition: border-color .15s;
}
.list-item:hover { border-color: #2a3160; }
.list-item.done { opacity: .55; }
.list-item.done .li-title { text-decoration: line-through; }
.li-title { font-weight: 600; font-size: .95rem; }
.li-sub { font-size: .78rem; color: var(--muted); }
.li-main { flex: 1; min-width: 0; }

/* round check control for tasks/milestones */
.check {
  width: 24px; height: 24px; flex: 0 0 24px; border-radius: 50%;
  border: 2px solid var(--accB); background: transparent;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  color: transparent; transition: all .15s; padding: 0;
}
.check:hover { background: var(--accBg); }
.check.on { background: var(--accB); color: #fff; }

/* ---- stats ---- */
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-size: 1.45rem; font-weight: 800; color: var(--text); }
.stat .v.h-acc { color: var(--acc); }
.stat .k { font-size: .78rem; color: var(--muted); }

/* ---- avatar ---- */
.avatar {
  width: 42px; height: 42px; flex: 0 0 42px; border-radius: 12px;
  background: var(--accBg); border: 1px solid var(--accB);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 1.3rem;
}
.avatar.sm { width: 32px; height: 32px; flex-basis: 32px; font-size: 1rem; border-radius: 9px; }
.avatar.lg { width: 60px; height: 60px; flex-basis: 60px; font-size: 2rem; border-radius: 16px; }

/* ---- empty state ---- */
.empty {
  text-align: center; padding: 36px 20px; color: var(--muted);
  border: 1px dashed var(--line); border-radius: var(--radius);
}
.empty .e-emoji { font-size: 2.2rem; margin-bottom: 8px; }
.empty p { max-width: 420px; margin: 0 auto 14px; font-size: .9rem; }

/* ---- svg icons ---- */
.svgi { width: 20px; height: 20px; flex: 0 0 auto; display: inline-block; vertical-align: -4px; }
.svgi.sm { width: 16px; height: 16px; }
.svgi.lg { width: 26px; height: 26px; }

/* ============================================================
   APP SHELL
   ============================================================ */
.app-shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 232px; flex: 0 0 232px;
  background: rgba(8, 10, 26, .92);
  border-right: 1px solid var(--line);
  padding: 20px 12px;
  display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  z-index: 30;
}
.sidebar .logo {
  font-size: 1.3rem; font-weight: 800; padding: 4px 10px 16px; letter-spacing: .01em;
  cursor: pointer; background: none; border: none; text-align: left; font-family: inherit;
}
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 12px; border-radius: 11px;
  color: var(--muted); font-weight: 600; font-size: .92rem;
  cursor: pointer; border: 1px solid transparent; background: none; font-family: inherit;
  width: 100%; text-align: left;
  transition: background .15s, color .15s;
}
.nav-item:hover { background: #10142e; color: var(--text); }
.nav-item.active { background: var(--accBg); color: var(--acc); border-color: var(--accB); }
.nav-item .svgi { width: 19px; height: 19px; }
.sidebar .side-foot { margin-top: auto; padding: 10px; font-size: .72rem; color: var(--dim); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 26px;
  border-bottom: 1px solid var(--line);
  background: rgba(6,7,19,.8); backdrop-filter: blur(8px);
  position: sticky; top: 0; z-index: 20;
}
.topbar .tb-title { font-weight: 800; font-size: 1.1rem; }
.topbar .tb-spacer { flex: 1; }
.xp-chip {
  display: flex; align-items: center; gap: 9px;
  background: #10142c; border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 13px 5px 8px; font-size: .8rem; cursor: pointer; font-family: inherit; color: var(--text);
}
.xp-chip .lvl {
  background: var(--grad-btn); color: #fff; font-weight: 800; font-size: .72rem;
  border-radius: 999px; padding: 2px 8px;
}
.xp-chip .bar { width: 70px; }
.hamburger { display: none; }

.screen { padding: 26px; max-width: 1180px; width: 100%; margin: 0 auto; }
.screen-head { margin-bottom: 22px; }
.screen-head h1 { font-size: 1.7rem; font-weight: 800; }
.screen-head .sub { color: var(--muted); font-size: .92rem; margin-top: 2px; }
.section-gap { margin-top: 24px; }

@media (max-width: 900px) {
  .sidebar {
    position: fixed; left: 0; top: 0; transform: translateX(-105%);
    transition: transform .25s ease; box-shadow: var(--shadow);
  }
  .sidebar.open { transform: translateX(0); }
  .hamburger { display: inline-flex; }
  .screen { padding: 18px 14px; }
  .sidebar-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 25; }
  .topbar { padding: 12px 14px; }
  .xp-chip .muted { display: none; }
  .xp-chip .bar { width: 44px; }
}

/* ============================================================
   MODAL / TOAST / CONFETTI
   ============================================================ */
.modal-back {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(3,4,12,.72); backdrop-filter: blur(4px);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 7vh 16px 16px; overflow-y: auto;
  animation: fadeIn .18s ease;
}
.modal {
  background: #0c0f24;
  border: 1px solid var(--accB);
  box-shadow: 0 0 34px var(--accGlow), var(--shadow);
  border-radius: 18px;
  width: 100%; max-width: 520px;
  padding: 22px 24px;
  animation: rise .22s ease;
}
.modal.wide { max-width: 700px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.modal-head h3 { font-size: 1.12rem; font-weight: 800; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

.toast-wrap {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center;
  pointer-events: none; width: max-content; max-width: 92vw;
}
.toast {
  background: #0e1230; border: 1px solid var(--accB);
  box-shadow: 0 0 22px var(--accGlow);
  color: var(--text); font-weight: 600; font-size: .9rem;
  border-radius: 999px; padding: 10px 20px;
  display: flex; align-items: center; gap: 9px;
  animation: rise .25s ease;
  max-width: 100%;
}
.toast.leaving { opacity: 0; transition: opacity .3s; }

.confetti-bit { position: fixed; top: -12px; z-index: 300; pointer-events: none; border-radius: 2px; animation: confetti-fall linear forwards; }
@keyframes confetti-fall { to { transform: translateY(105vh) rotate(720deg); opacity: .9; } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
.pop { animation: pop .3s ease; }

/* ============================================================
   LANDING PAGE (faithful to the Figma site)
   ============================================================ */
.landing { min-height: 100vh; background: var(--bg); overflow-x: hidden; }

.l-hero {
  text-align: center;
  padding: 90px 24px 120px;
  background:
    radial-gradient(58% 120% at 50% -20%, rgba(124, 58, 237, .28), transparent 70%),
    radial-gradient(40% 80% at 12% 0%, rgba(34, 211, 238, .10), transparent 70%),
    radial-gradient(40% 80% at 88% 0%, rgba(59, 130, 246, .12), transparent 70%),
    linear-gradient(180deg, #10102b 0%, #0a0a1e 55%, var(--bg) 100%);
}
.l-hero h1 { font-size: clamp(2.6rem, 6.5vw, 4.5rem); font-weight: 700; letter-spacing: -0.01em; }
.l-hero .l-sub { font-size: 1.15rem; color: var(--body); margin-top: 14px; }
.l-hero .l-desc { max-width: 560px; margin: 14px auto 0; color: var(--muted); font-size: .95rem; }

.l-features { max-width: 1030px; margin: 0 auto; padding: 60px 24px 20px; display: flex; flex-direction: column; gap: 34px; }
.l-card {
  border: 1px solid var(--accB);
  background: linear-gradient(var(--accBg), var(--accBg)), rgba(8, 10, 24, .6);
  box-shadow: 0 0 20px var(--accGlow);
  border-radius: 16px;
  padding: 24px 28px 26px;
  max-width: 900px;
  opacity: 0; transform: translateY(34px);
  transition: opacity .6s ease, transform .6s ease;
}
.l-card.vis { opacity: 1; transform: translateY(0); }
.l-card:nth-child(odd)  { align-self: flex-start; }
.l-card:nth-child(even) { align-self: flex-end; }
.l-card .l-card-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
.l-card h2 { color: var(--acc); font-size: 1.35rem; font-weight: 700; margin: 6px 0 10px; }
.l-card p { color: var(--body); font-size: .95rem; }

.l-testimonials { max-width: 1030px; margin: 0 auto; padding: 70px 24px 30px; text-align: center; }
.l-testimonials > h2 { font-size: 2.2rem; font-weight: 700; }
.l-testimonials > .t-sub { color: var(--muted); margin: 10px 0 34px; }
.t-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; text-align: left; }
@media (max-width: 900px) { .t-grid { grid-template-columns: 1fr; } }
.t-card {
  border: 1px solid var(--accB);
  background: linear-gradient(var(--accBg), var(--accBg)), rgba(8, 10, 24, .6);
  border-radius: 14px; padding: 18px;
  transition: box-shadow .25s ease, transform .25s ease;
}
.t-card:hover { box-shadow: 0 0 22px var(--accGlow); transform: translateY(-3px); }
.t-card .t-head { display: flex; gap: 11px; align-items: center; margin-bottom: 8px; }
.t-card .t-name { font-weight: 700; font-size: .95rem; }
.t-card .t-role { font-size: .78rem; color: var(--muted); }
.t-card .t-stars { color: var(--acc); letter-spacing: 2px; font-size: .85rem; margin-bottom: 8px; }
.t-card .t-quote { color: var(--body); font-size: .87rem; }

.l-cta {
  max-width: 900px; margin: 60px auto 0; padding: 0 24px;
}
.l-cta-inner {
  border: 1px solid rgba(6,182,212,.3);
  border-radius: 24px;
  background:
    linear-gradient(120deg, rgba(6,182,212,.12) 0%, rgba(124,58,237,.12) 55%, rgba(59,130,246,.14) 100%),
    rgba(8, 10, 24, .6);
  text-align: center;
  padding: 60px 30px 64px;
}
.l-cta h2 { font-size: 2.4rem; font-weight: 700; }
.l-cta p { color: var(--body); max-width: 480px; margin: 14px auto 30px; }
.l-cta-btn {
  font: inherit; font-size: 1.25rem; font-weight: 700; color: #fff;
  background: var(--grad-btn);
  border: none; border-radius: 14px;
  padding: 20px 40px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 10px;
  transition: transform .18s ease, box-shadow .18s ease;
}
.l-cta-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 10px 40px rgba(37, 132, 235, .45); }
.l-foot {
  border-top: 1px solid var(--line);
  margin-top: 70px; padding: 26px;
  text-align: center; color: var(--muted); font-size: .85rem;
}

   ============================================================ */
.onb {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 30px 16px;
  background:
    radial-gradient(58% 120% at 50% -20%, rgba(124, 58, 237, .25), transparent 70%),
    linear-gradient(180deg, #0e0e28 0%, var(--bg) 70%);
}
.onb-card {
  width: 100%; max-width: 560px;
  background: rgba(10, 12, 30, .85);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: var(--shadow);
  padding: 34px 34px 30px;
}
.onb-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 22px; }
.onb-dots span { width: 34px; height: 5px; border-radius: 999px; background: #1a2044; }
.onb-dots span.on { background: var(--grad-btn); }
.focus-opt {
  display: flex; align-items: center; gap: 13px; width: 100%;
  background: #10142c; border: 1px solid var(--line); border-radius: 14px;
  padding: 13px 16px; cursor: pointer; font: inherit; color: var(--text); text-align: left;
  transition: border-color .15s, background .15s, box-shadow .15s;
}
.focus-opt:hover { border-color: #2a3160; }
.focus-opt.sel { border-color: var(--acc); background: var(--accBg); box-shadow: 0 0 14px var(--accGlow); }

/* ============================================================
   SCREEN-SPECIFIC HELPERS
   ============================================================ */

/* dashboard hero strip */
.dash-hero {
  border-radius: 20px; padding: 24px 26px;
  background:
    radial-gradient(80% 160% at 85% -30%, rgba(124,58,237,.3), transparent 60%),
    radial-gradient(60% 140% at 10% -20%, rgba(6,182,212,.22), transparent 60%),
    #0c0f26;
  border: 1px solid var(--line);
}

/* timetable */
.tt-grid { display: grid; grid-template-columns: 52px repeat(7, minmax(120px, 1fr)); gap: 6px; min-width: 950px; }
.tt-scroll { overflow-x: auto; padding-bottom: 8px; }
.tt-daylabel { text-align: center; font-size: .78rem; font-weight: 700; color: var(--muted); padding: 6px 2px; }
.tt-daylabel.today { color: var(--acc); }
.tt-col { position: relative; background: #0c0f24; border: 1px solid var(--line); border-radius: 12px; }
.tt-hourlabel { font-size: .68rem; color: var(--dim); text-align: right; padding-right: 6px; position: relative; }
.tt-block {
  position: absolute; left: 4px; right: 4px;
  border-radius: 8px; border: 1px solid var(--accB);
  background: linear-gradient(var(--accBg), var(--accBg)), #0d1128;
  color: var(--text); font-size: .7rem; line-height: 1.25;
  padding: 4px 7px; overflow: hidden; cursor: pointer;
}
.tt-block .tt-time { color: var(--acc); font-weight: 700; font-size: .64rem; }
.tt-block.done { opacity: .45; }

/* habit week grid */
.habit-days { display: flex; gap: 6px; }
.habit-day {
  width: 34px; height: 34px; border-radius: 9px;
  border: 1px solid var(--line); background: #10142c;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: .7rem; color: var(--dim); cursor: pointer; font-family: inherit;
  transition: all .15s;
}
.habit-day.on { background: var(--accB); border-color: var(--acc); color: #fff; font-weight: 700; }
.habit-day.today { outline: 2px solid var(--accGlow); }
.habit-day:disabled { cursor: default; opacity: .5; }

/* chat (assistant) */
.chat-wrap { display: flex; flex-direction: column; height: calc(100vh - 210px); min-height: 420px; }
.chat-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 6px 2px 18px; }
.msg { max-width: 78%; padding: 12px 16px; border-radius: 16px; font-size: .93rem; white-space: pre-wrap; }
.msg.me { align-self: flex-end; background: var(--grad-btn); color: #fff; border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: #10142e; border: 1px solid var(--line); border-bottom-left-radius: 4px; color: var(--body); }
.msg.ai .msg-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.chip {
  font: inherit; font-size: .8rem; color: var(--acc);
  background: var(--accBg); border: 1px solid var(--accB); border-radius: 999px;
  padding: 6px 14px; cursor: pointer; transition: box-shadow .15s;

.chip:hover { box-shadow: 0 0 12px var(--accGlow); }
.typing { display: inline-flex; gap: 4px; padding: 14px 16px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* achievements */
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.ach-card { border-radius: 14px; padding: 16px; border: 1px solid var(--line); background: var(--panel); display: flex; gap: 12px; align-items: flex-start; }
.ach-card.unlocked { border-color: var(--accB); background: linear-gradient(var(--accBg), var(--accBg)), var(--panel); box-shadow: 0 0 16px var(--accGlow); }
.ach-card.locked { opacity: .55; filter: saturate(.4); }

.post { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 15px 17px; }
.post.acc { border-color: var(--accB); background: linear-gradient(var(--accBg), var(--accBg)), var(--panel); }
.react-btn {
  font: inherit; font-size: .8rem; color: var(--muted);
  background: #10142c; border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 12px; cursor: pointer; transition: all .15s;

.react-btn:hover { border-color: #2a3160; color: var(--text); }
.react-btn.on { color: var(--acc); border-color: var(--accB); background: var(--accBg); }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: .88rem; }
.tbl th { text-align: left; color: var(--muted); font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 10px; border-bottom: 1px solid #131836; }
.tbl tr:hover td { background: rgba(20,25,55,.4); }
.num { font-variant-numeric: tabular-nums; }
.pos { color: #4ade80; } .neg { color: #f87171; }

/* misc */
hr.sep { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
.scroll-x { overflow-x: auto; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #1c2244; border-radius: 999px; }
::-webkit-scrollbar-track { background: transparent; }

  function initialState() {
    return {
      version: 1,
      profile: { name: '', avatar: '🙂', focus: '', onboarded: false, createdAt: Date.now(), xp: 0 },
      goals: [],
      tasks: [],
      commitments: [],
      habits: [],
      finance: { transactions: [], budgets: {}, savingsGoals: [] },
      timetable: null,
      achievements: {},          // id -> unlocked at (ts)
      reminders: [],             // { id, text, due:'YYYY-MM-DD'|null, done, createdAt }
      activityLog: [],           // { ts, text, emoji, xp }

      social: seedSocial(),
      settings: { wake: '07:00', sleep: '22:30', currency: '$', autoPost: true, notifications: true }

  /* ---------------- store ---------------- */

  var state = null;
  var renderScheduled = false;

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && s.version === 1) {
          if (!s.reminders) s.reminders = [];   // saved before reminders existed
          state = s;
          maintainHabits(state);
          settleTimetableWeek(state);
          save();
          return;
        }
      }
    } catch (e) { /* corrupted -> fresh */ }
    state = initialState();
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* storage full/blocked */ }
  }

  var pendingToasts = [];

  // Keep timetable blocks in lock-step with their tasks, wherever the task
  // was completed or re-opened from (tasks screen, dashboard, schedule).
  function syncTimetableDone(s) {
    if (!s.timetable || !s.timetable.days) return;
    var byId = {};
    s.tasks.forEach(function (t) { byId[t.id] = t; });
    Object.keys(s.timetable.days).forEach(function (iso) {
      s.timetable.days[iso].forEach(function (b) {
        if (b.type === 'task' && byId[b.refId]) b.done = !!byId[b.refId].done;
      });
    });
  }

  function update(fn, opts) {
    fn(state);
    syncTimetableDone(state);
    settleTimetableWeek(state);
    checkAchievements();
    save();
    if (!(opts && opts.silent)) scheduleRender();
    flushToasts();
  }

  function scheduleRender() {
    if (renderScheduled) return;
    renderScheduled = true;
    requestAnimationFrame(function () { renderScheduled = false; render(); });
  }

  function addXp(n, reason) {
    var before = levelFor(state.profile.xp);
    update(function (s) {
      s.profile.xp += n;
      s.activityLog.unshift({ ts: Date.now(), text: reason || 'XP earned', emoji: '⚡', xp: n });
      if (s.activityLog.length > 120) s.activityLog.length = 120;
    });
    var after = levelFor(state.profile.xp);
    toast('+' + n + ' XP — ' + (reason || 'nice work'), '⚡');
    if (after > before) {
      toast('Level up! You reached Level ' + after + ' — ' + levelTitle(after), '🚀');
      confetti();
    }
  }

  function checkAchievements() {
    for (var pass = 0; pass < 2; pass++) {
      var got = false;
      ACHIEVEMENTS.forEach(function (a) {
        if (state.achievements[a.id]) return;

        try { ok = a.test(state); } catch (e) { ok = false; }

        got = true;
        state.achievements[a.id] = Date.now();
        state.profile.xp += a.xp;
        logActivity('Achievement unlocked: ' + a.title, a.emoji);

          state.social.feed.unshift({
            id: uid(), author: state.profile.name || 'You', avatar: state.profile.avatar, me: true,

            likes: 0, liked: false, comments: []
          });
        }
        pendingToasts.push({ msg: 'Achievement: ' + a.title + (a.xp ? '  (+' + a.xp + ' XP)' : ''), emoji: a.emoji });
      });
      if (!got) break;

  }

  function flushToasts() {
    while (pendingToasts.length) { var t = pendingToasts.shift(); toast(t.msg, t.emoji); }
  }

  /* ---------------- engines ---------------- */

  function habitStreak(h) {
    var streak = 0;
    var day = todayISO();
    if (!h.log[day]) day = addDaysISO(day, -1); // today not ticked yet doesn't break it
    while (h.log[day]) { streak++; day = addDaysISO(day, -1); }
    return streak;
  }

  function habitWeekCount(h) {
    var n = 0; var day = todayISO();
    for (var i = 0; i < 7; i++) { if (h.log[day]) n++; day = addDaysISO(day, -1); }
    return n;
  }

  function daysSinceLastTick(h) {
    var dates = Object.keys(h.log || {});
    var last = null;
    dates.forEach(function (d) { if (h.log[d] && (!last || d > last)) last = d; });
    if (!last) {
      var created = dateISO(new Date(h.createdAt || Date.now()));
      last = created;
    }
    var t = todayISO(); var days = 0; var cur = last;
    while (cur < t && days < 999) { cur = addDaysISO(cur, 1); days++; }
    return days;
  }

  var HABIT_FADE_DAYS = 14;   // untouched this long -> habit fades to the archive

  function maintainHabits(s) {
    s.habits.forEach(function (h) {
      if (h.archived) return;
      if (daysSinceLastTick(h) >= HABIT_FADE_DAYS) {
        h.archived = true;
        h.archivedAt = Date.now();
        logActivity('Habit faded away after ' + HABIT_FADE_DAYS + ' quiet days: ' + h.title, '🍂');
        pendingToasts.push({ msg: '"' + h.title + '" faded to the archive — restore it any time', emoji: '🍂' });
      }
    });
  }

  // XP for a planned week is earned by DOING it: when the week ends, award
  // XP for the task blocks that were completed. Nothing for planning alone.
  function settleTimetableWeek(s) {
    var tt = s.timetable;
    if (!tt || tt.settled || !tt.days) return;
    var isoList = Object.keys(tt.days).sort();
    if (!isoList.length || todayISO() <= isoList[isoList.length - 1]) return; // week still running
    var total = 0, done = 0;
    isoList.forEach(function (iso) {
      tt.days[iso].forEach(function (b) {
        if (b.type !== 'task') return;
        total++;
        if (b.done) done++;
      });
    });
    tt.settled = true;
    if (!total) return;
    var ratio = done / total;
    var xp = done * 4 + (ratio >= 0.8 ? 30 : 0);
    if (xp > 0) {
      s.profile.xp += xp;
      logActivity('Week complete: ' + done + '/' + total + ' planned blocks done', '🗓️');
      pendingToasts.push({ msg: 'Week wrapped: ' + done + '/' + total + ' blocks done — +' + xp + ' XP' + (ratio >= 0.8 ? ' (consistency bonus!)' : ''), emoji: '🗓️' });
    } else {
      logActivity('Week ended with no planned blocks completed', '🗓️');
      pendingToasts.push({ msg: 'Last week’s plan went unfinished — regenerate and try a lighter one', emoji: '🌱' });
    }
  }

  function goalProgress(g) {
    if (g.status === 'done') return 100;
    if (!g.milestones.length) return 0;
    var d = g.milestones.filter(function (m) { return m.done; }).length;
    return Math.round(100 * d / g.milestones.length);
  }

  function financeSummary(ym) {
    ym = ym || monthISO();
    var inc = 0, exp = 0, byCat = {};
    state.finance.transactions.forEach(function (t) {
      if (t.date.slice(0, 7) !== ym) return;
      if (t.type === 'income') inc += t.amount;
      else { exp += t.amount; byCat[t.category] = (byCat[t.category] || 0) + t.amount; }
    });
    var savings = state.finance.savingsGoals.reduce(function (a, g) { return a + g.saved; }, 0);
    var over = [];
    Object.keys(state.finance.budgets).forEach(function (cat) {
      var lim = state.finance.budgets[cat];
      if (lim > 0 && (byCat[cat] || 0) > lim) over.push({ cat: cat, spent: byCat[cat] || 0, limit: lim });
    });
    return { month: ym, income: inc, expenses: exp, net: inc - exp, byCat: byCat, savings: savings, overBudget: over };
  }

  // Automatic timetable: fits open tasks around fixed commitments for the next 7 days.
  function generateTimetable(s) {
    s = s || state;
    var wake = minutes(s.settings.wake), sleep = minutes(s.settings.sleep);
    if (sleep <= wake) sleep = wake + 8 * 60;
    var days = {}, freeMap = {}, isoList = [];
    var t0 = todayISO();
    var nowMin = new Date().getHours() * 60 + new Date().getMinutes();

    for (var i = 0; i < 7; i++) {
      var iso = addDaysISO(t0, i);
      isoList.push(iso);
      days[iso] = [];
      var p = iso.split('-');
      var dow = new Date(+p[0], +p[1] - 1, +p[2]).getDay();
      var blocks = [];
      s.commitments.forEach(function (c) {
        if (c.days.indexOf(dow) === -1) return;
        var st = minutes(c.start), en = minutes(c.end);
        if (en <= st) return;
        blocks.push({ id: uid(), refId: c.id, title: c.title, type: 'commitment', accent: c.accent || 'indigo', startMin: st, endMin: en, start: hhmm(st), end: hhmm(en) });
      });
      blocks.sort(function (a, b) { return a.startMin - b.startMin; });
      days[iso] = blocks;
      // free intervals
      var free = []; var cur = (i === 0 ? Math.max(wake, Math.ceil(nowMin / 30) * 30) : wake);
      blocks.forEach(function (b) {
        if (b.startMin > cur) free.push([cur, Math.min(b.startMin, sleep)]);
        cur = Math.max(cur, b.endMin);
      });
      if (cur < sleep) free.push([cur, sleep]);
      freeMap[iso] = free.filter(function (f) { return f[1] - f[0] >= 20; });
    }

    var open = s.tasks.filter(function (t) { return !t.done; }).slice();
    open.sort(function (a, b) {
      var da = a.due || '9999-12-31', db = b.due || '9999-12-31';
      if (da !== db) return da < db ? -1 : 1;
      if (a.priority !== b.priority) return b.priority - a.priority;
      return a.createdAt - b.createdAt;
    });

    var unplaced = [];
    open.forEach(function (task) {
      var dur = Math.max(20, task.duration || 45);
      var placed = false;
      var lastIdx = isoList.length - 1;
      if (task.due) {
        var di = isoList.indexOf(task.due);
        if (di >= 0) lastIdx = di;
      }
      for (var round = 0; round < 2 && !placed; round++) {
        var maxI = round === 0 ? lastIdx : isoList.length - 1; // try before due first, then anywhere
        for (var i2 = 0; i2 <= maxI && !placed; i2++) {
          var iso2 = isoList[i2];
          var free2 = freeMap[iso2];
          for (var f2 = 0; f2 < free2.length; f2++) {
            var gap = free2[f2];
            if (gap[1] - gap[0] >= dur) {
              var st2 = gap[0], en2 = st2 + dur;
              days[iso2].push({ id: uid(), refId: task.id, title: task.title, type: 'task', accent: task.priority === 3 ? 'red' : task.priority === 2 ? 'orange' : 'cyan', startMin: st2, endMin: en2, start: hhmm(st2), end: hhmm(en2) });
              if (gap[1] - en2 - 10 >= 20) free2[f2] = [en2 + 10, gap[1]];
              else free2.splice(f2, 1);
              placed = true; break;
            }
          }
        }
      }
      if (!placed) unplaced.push(task.title);
    });

    isoList.forEach(function (iso3) { days[iso3].sort(function (a, b) { return a.startMin - b.startMin; }); });
    s.timetable = { generatedAt: Date.now(), days: days, unplaced: unplaced };
    return s.timetable;
  }

  // "What matters most right now?" — ranked focus items for dashboard + assistant.
  function focusSuggestions(n) {
    var out = [];
    var t = todayISO();
    state.tasks.forEach(function (task) {
      if (task.done || !task.due) return;
      if (task.due < t) out.push({ score: 100 + task.priority * 5, emoji: '⚠️', accent: 'red', screen: 'app/tasks', text: '"' + task.title + '" is overdue (' + fmtDate(task.due) + ') — knock it out first.' });
      else if (task.due === t) out.push({ score: 80 + task.priority * 5, emoji: '📌', accent: 'orange', screen: 'app/tasks', text: '"' + task.title + '" is due today' + (task.priority === 3 ? ' and it’s high priority.' : '.') });
      else if (task.due === addDaysISO(t, 1) && task.priority === 3) out.push({ score: 55, emoji: '⏳', accent: 'yellow', screen: 'app/tasks', text: 'High-priority "' + task.title + '" is due tomorrow — get ahead of it.' });
    });
    if (state.timetable && state.timetable.days[t]) {
      var nowMin = new Date().getHours() * 60 + new Date().getMinutes();
      var next = state.timetable.days[t].filter(function (b) { return b.endMin > nowMin && !b.done; })[0];
      if (next) out.push({ score: 74, emoji: '🗓️', accent: 'purple', screen: 'app/schedule', text: (next.startMin <= nowMin ? 'Now on your timetable: ' : 'Next up at ' + fmtTime(next.start) + ': ') + next.title });
    }
    (state.reminders || []).forEach(function (r) {
      if (r.done) return;
      if (r.due && r.due < t) out.push({ score: 95, emoji: '⏰', accent: 'red', screen: 'app/dashboard', text: 'Reminder overdue: ' + r.text });
      else if (r.due === t) out.push({ score: 85, emoji: '⏰', accent: 'yellow', screen: 'app/dashboard', text: 'Reminder for today: ' + r.text });
    });
    state.habits.forEach(function (h) {
      if (h.archived || h.log[t]) return;
      var st = habitStreak(h);
      if (st >= 3) { out.push({ score: 70 + Math.min(st, 20), emoji: '🔥', accent: 'orange', screen: 'app/habits', text: 'Don’t break your ' + st + '-day "' + h.title + '" streak — tick it today.' }); return; }
      var missed = daysSinceLastTick(h);
      if (missed >= HABIT_FADE_DAYS - 4) out.push({ score: 72, emoji: '🍂', accent: 'red', screen: 'app/habits', text: '"' + h.title + '" has been quiet for ' + missed + ' days — it fades away at ' + HABIT_FADE_DAYS + '. One tick saves it.' });
      else if (missed >= 2) out.push({ score: 58 + missed, emoji: '⏰', accent: 'yellow', screen: 'app/habits', text: 'You’ve missed "' + h.title + '" ' + missed + ' days running — get back on it today.' });
    });
    var fin = financeSummary();
    fin.overBudget.forEach(function (o) {
      out.push({ score: 65, emoji: '💸', accent: 'red', screen: 'app/finance', text: 'You’re over your ' + o.cat + ' budget (' + fmtMoney(o.spent) + ' of ' + fmtMoney(o.limit) + ') — ease off this week.' });
    });
    state.goals.forEach(function (g) {
      if (g.status === 'done') return;
      var next = g.milestones.filter(function (m) { return !m.done; })[0];

      back.remove();
      var ix = openModals.indexOf(handle); if (ix >= 0) openModals.splice(ix, 1);
      if (opts.onClose) opts.onClose();

  /* ============================== slots =============================== */
  var MONEY_CONTEXT = /\b(save|sav(e|ing)s?|spend|spent|spending|budget|cost|costs|buy|buying|purchase|afford|price|dollars?|money|pay|owe)\b|\$/;

  function extractWhen(n) {
    if (/\btomorrow\b/.test(n)) return 'tomorrow';
    if (/\btoday\b|\btonight\b|\bthis (morning|afternoon|evening)\b/.test(n)) return 'today';
    if (/\bweek\b|\bweekly\b/.test(n)) return 'week';
    return null;
  }

  function extractAmount(n) {
    var m = n.match(/\$\s?(\d[\d, ]*(?:\.\d+)?)/);
    if (m) { var v = parseFloat(m[1].replace(/[ ,]/g, '')); return isNaN(v) ? null : v; }
    if (MONEY_CONTEXT.test(n)) {
      m = n.match(/\b(\d{1,7}(?:\.\d+)?)\b/);
      if (m) { var v2 = parseFloat(m[1]); return isNaN(v2) ? null : v2; }
    }
    return null;
  }

  function extractTopic(n) {
    var m = n.match(SPORT_RE);
    if (m) return m[1];
    m = n.match(SUBJECT_RE);
    if (m) return m[1];
    var s = stripPoliteness(n);
    m = s.match(/\bremind me to (.{2,60})$/);
    if (m) return m[1].replace(/^(my |the |a |an )/, '');
    m = s.match(/\b(?:for|about|on|toward|towards|at|of)\s+((?:my |the |a |an )?[a-z][a-z0-9 ]{1,40})$/);
    if (m) {
      var t = m[1].replace(/^(my |the |a |an )/, '').replace(/\b(goal|plan|habit|reminder)\b\s*$/, '').replace(/\s+$/, '');
      if (t.length > 1) return t;
    }
    return null;
  }

  /* ============================= classify ============================= */
  function classify(text) {
    var n, best, bestScore, scores, i, intent, rules, j, r;
    try {
      n = norm(text);
    } catch (e) { n = ''; }
    scores = {};
    for (i = 0; i < INTENTS.length; i++) {
      intent = INTENTS[i];
      rules = RULES[intent] || [];
      var sc = 0;
      for (j = 0; j < rules.length; j++) {
        r = rules[j];
        try { if (r[0].test(n)) sc += r[1]; } catch (e2) { /* never throw */ }
      }
      scores[intent] = sc;
    }
    best = 'general_conversation'; bestScore = 0;
    for (i = 0; i < SPECIFICITY.length; i++) {
      intent = SPECIFICITY[i];
      if (scores[intent] > bestScore) { best = intent; bestScore = scores[intent]; }
    }
    if (bestScore < 2) { best = 'general_conversation'; bestScore = scores.general_conversation || 0; }
    var slots = { topic: null, when: null, amount: null };
    try {
      slots.topic = extractTopic(n);
      slots.when = extractWhen(n);
      slots.amount = extractAmount(n);
    } catch (e3) { /* keep defaults */ }
    return { intent: best, score: bestScore, slots: slots };
  }

  /* ====================== category / domain helpers ==================== */
  var CATEGORY_ACCENTS = { Sport: 'green', Study: 'blue', Finance: 'yellow', Career: 'purple', Health: 'orange', Personal: 'cyan' };

  function detectCategory(n) {
    if (SPORT_RE.test(n) || /\btraining\b|\bfitness\b|\bteam\b|\bcompetition\b|\btryouts?\b|\bcoach\b/.test(n)) return 'Sport';
    if (SUBJECT_RE.test(n) || /\bstudy\b|\bstudying\b|\bgrades?\b|\bschool\b|\bexams?\b|\bhomework\b|\bassignment\b|\breading\b|\bread\b/.test(n)) return 'Study';
    if (/\$|\bsave\b|\bsaving\b|\bsavings\b|\bmoney\b|\bbudget\b|\bspending\b|\bfund\b/.test(n)) return 'Finance';
    if (/\bcareer\b|\bjob\b|\bfuture\b|\buniversity\b|\bwork experience\b|\bapprenticeship\b|\binternship\b/.test(n)) return 'Career';
    if (/\bhealth\w*\b|\bfit\b|\bfitter\b|\bsleep\b|\bwater\b|\beat\w*\b|\brun\w*\b|\bwellbeing\b|\bstress\b|\bmeditat|\bexercise\b|\bwalk\w*\b/.test(n)) return 'Health';
    return 'Personal';
  }

  function cap(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }

  function firstWords(n, k) {
    var w = n.split(' ').filter(function (x) { return x; });
    return w.slice(0, k).join(' ');
  }

  /* =========================== goalFromText =========================== */
  function goalFromText(text) {
    var n, s, c, topic, amount, title, why, ms, accent;
    try { n = norm(text); } catch (e) { n = ''; }
    s = stripPoliteness(n);
    c = classify(text);
    topic = c.slots.topic;
    amount = c.slots.amount;
    var category = detectCategory(s || 'personal growth');
    accent = CATEGORY_ACCENTS[category];
    var t = topic || null;

    // Title: clean imperative.
    var core = s
      .replace(/^(please |hey |hi |ok |okay |so )+/, '')
      .replace(/^(can you |could you |will you |would you )+/, '')
      .replace(/^(help me to |help me |i want to |i would like to |i wanna |i need to |my goal is to |i m going to |i am going to )+/, '')
      .replace(/^(set|create|make|add|start) (a |another |my |new )?goal (for|to|about|of)? ?/, '')
      .replace(/^(turn my idea about )/, '')
      .replace(/( into a proper goal| into a goal)$/, '')
      .replace(/\s+/g, ' ').replace(/^ | $/g, '');
    if (category === 'Sport' && t) title = 'Make the ' + t + ' A team';
    else if (category === 'Study' && SUBJECT_RE.test(s)) title = 'Get top marks in ' + (s.match(SUBJECT_RE) || [t])[0];
    else if (category === 'Study' && /\bgrades?\b/.test(s)) title = 'Lift my grades this term';
    else if (category === 'Finance' && amount) title = 'Save $' + amount;
    else if (category === 'Finance') title = 'Save ' + (t ? 'for ' + t : 'money consistently');
    else if (core && core.length > 2 && core.length < 70) title = cap(core);
    else if (t) title = 'Improve at ' + t;
    else title = 'Level up my personal growth';

    // Why: short motivating line derived from the text.
    var whyByCat = {
      Sport: 'Because I want to compete at my best' + (t ? ' in ' + t : '') + ' and earn my spot.',
      Study: 'Because strong results' + (t ? ' in ' + t : '') + ' keep every door open for me.',
      Finance: 'Because money set aside' + (amount ? ' ($' + amount + ')' : '') + ' means freedom and less stress.',
      Career: 'Because the future I want is built by what I do now.',
      Health: 'Because feeling strong and rested makes everything else easier.',
      Personal: 'Because becoming a better me is the goal behind every other goal.'
    };
    why = whyByCat[category];

    // Milestones: rich per-domain templates with the topic substituted in.
    var tt;
    if (category === 'Sport') {
      tt = t || 'my sport';
      ms = [
        'Nail the ' + tt + ' fundamentals with 3 practice sessions a week',
        'Run focused ' + tt + ' drills twice a week for a month',
        'Ask the coach for one piece of feedback and work on it',
        'Play a full scrimmage or practice match every week',
        'Perform with confidence at the next ' + tt + ' tryout or trial'
      ];
    } else if (category === 'Study') {
      tt = (s.match(SUBJECT_RE) || [])[0] || t || 'my subjects';
      ms = [
        'Set up a weekly ' + tt + ' study block and stick to it',

  /* =========================== tasksFromText ========================== */
  function tasksFromText(text) {

  /* =========================== planFromText =========================== */
  var COUNT_WORDS = { once: 1, twice: 2, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7 };

  function parseCountNear(s, idx, fallback) {
    // look for "3x", "x3", "3 times", "three times" anywhere (applies to nearest activity — keep simple: first pattern found after idx, else anywhere)
    var seg = s.slice(idx);
    var m = seg.match(/\b(\d)\s?x\b/) || seg.match(/\bx\s?(\d)\b/) || seg.match(/\b(\d) times\b/) ||
      seg.match(/\b(once|twice|one|two|three|four|five|six|seven) times\b/) || seg.match(/\b(once|twice)\b/);
    if (!m) return fallback;
    var v = COUNT_WORDS[m[1]] !== undefined ? COUNT_WORDS[m[1]] : parseInt(m[1], 10);
    return (v >= 1 && v <= 7) ? v : fallback;
  }

  function parseDuration(s) {
    var m = s.match(/\b(\d{1,3})\s?(min|mins|minutes)\b/);
    if (m) return Math.min(180, Math.max(15, parseInt(m[1], 10)));
    m = s.match(/\b(\d{1,2})\s?(hour|hours|hr|hrs)\b/);
    if (m) return Math.min(180, Math.max(30, parseInt(m[1], 10) * 60));
    if (/\ban hour\b/.test(s)) return 60;
    if (/\bhalf an hour\b/.test(s)) return 30;
    return 60;
  }

  function planFromText(text) {
    var n; try { n = norm(text); } catch (e) { n = ''; }
    var s = stripPoliteness(n);
    var duration = parseDuration(s);
    var sessions = [];
    var seen = {};
    // sports
    var sm = s.match(new RegExp(SPORT_RE.source, 'g')) || [];
    for (var i = 0; i < sm.length; i++) {
      if (seen[sm[i]]) continue;
      seen[sm[i]] = true;
      sessions.push({ title: cap(sm[i]) + ' training', count: parseCountNear(s, s.indexOf(sm[i]), 3), duration: duration, accent: 'green' });
    }
    if (!sm.length && /\btraining\b|\bworkout\b|\bexercise\b|\bconditioning\b/.test(s)) {
      sessions.push({ title: 'Training session', count: parseCountNear(s, s.search(/\btraining\b|\bworkout\b|\bexercise\b|\bconditioning\b/), 3), duration: duration, accent: 'green' });
    }
    // study
    var subj = s.match(new RegExp(SUBJECT_RE.source, 'g')) || [];
    for (var j = 0; j < subj.length; j++) {
      if (seen[subj[j]]) continue;
      seen[subj[j]] = true;
      sessions.push({ title: cap(subj[j]) + ' study', count: parseCountNear(s, s.indexOf(subj[j]), 2), duration: duration, accent: 'blue' });
    }
    if (!subj.length && /\bstudy\b|\bstudying\b|\brevision\b|\brevise\b|\bexams?\b|\bhomework\b|\bassignment\b/.test(s)) {
      sessions.push({ title: 'Study session', count: parseCountNear(s, s.search(/\bstudy\b|\brevision\b|\bexam\b/), sessions.length ? 2 : 3), duration: duration, accent: 'blue' });
    }
    if (/\bbudget\b|\bfinance\b|\bsavings?\b/.test(s)) {
      sessions.push({ title: 'Finance check-in', count: 1, duration: Math.min(duration, 30), accent: 'yellow' });
    }
    if (/\bread\b|\breading\b/.test(s) && !seen.reading) {
      sessions.push({ title: 'Reading time', count: parseCountNear(s, s.indexOf('read'), 3), duration: Math.min(duration, 45), accent: 'purple' });
    }
    if (!sessions.length) {
      var c = classify(text);
      var topic = c.slots.topic || firstWords(s, 3) || 'the week';
      sessions.push({ title: 'Focus session: ' + topic, count: 3, duration: duration, accent: 'cyan' });
    }
    var parts = sessions.map(function (x) { return x.title + ' ' + x.count + 'x (' + x.duration + ' min)'; });
    var summary = 'I’ll plan ' + parts.join(', ') + ' across your week.';
    return { sessions: sessions, summary: summary };
  }

  function createGoalFromDraft(draft) {

            duration: sess.duration, done: false, createdAt: Date.now()

          dayCursor += Math.max(1, Math.floor(6 / Math.max(1, sess.count)));
