# Render blueprint. Point Render at this repo and it picks this up.
#
# Render's free tier sleeps after inactivity, which for a game server means the
# first player to arrive waits for a cold start and anyone already connected is
# dropped. Fine for testing with friends; move to a paid instance if the server
# is meant to be there all the time.
services:
  - type: web
    name: hoops-elite-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8787
      - key: HOOPS_DATA_DIR
        value: /var/data
    # Render's free tier has no persistent disk, so records reset on redeploy.
    # Uncomment on a paid instance to keep them.
    # disk:
    #   name: hoops-data
    #   mountPath: /var/data
    #   sizeGB: 1
