          if (on) VF.cosmetics.unequip(c.slot);
          else VF.cosmetics.equip(c.id);
          VF.audio.click(); VF.save.save(); refresh(tab);
        });
      }
      grid.appendChild(cell);
    });
    b.appendChild(grid);
    p.appendChild(b);
    return p;
  }

  /* --------------------------------------------------- journal + people */

  function buildJournal(tab) {
    const d = VF.state.data;
    const p = shell('Journal', d.journal.length + ' entries · ' +
                    Object.keys(d.secrets).length + ' hidden places found');
    p.appendChild(tabs([
      { id: 'entries', label: 'entries' },
      { id: 'people', label: 'people' + (VF.npcs.anyNew() ? ' •' : '') },
      { id: 'records', label: 'records' }
    ], tab, function (t) { refresh(t); }));
    const b = body();

    if (tab === 'entries') {
      if (!d.journal.length) {
        b.appendChild(U.el('div', 'empty', 'nothing written down yet. keep fishing.'));
      } else {
        d.journal.slice().reverse().forEach(function (e) {
          const el = U.el('div', 'entry' + (e.hint ? ' hint' : ''));
          const head = U.el('div');
          head.appendChild(U.el('span', 'entry-title', e.title));
          head.appendChild(U.el('span', 'entry-kind', e.kind));
          el.appendChild(head);
          el.appendChild(U.el('div', 'entry-text', e.text));
          b.appendChild(el);
        });
      }
    } else if (tab === 'people') {
      VF.npcs.list.forEach(function (n) {
        const known = VF.npcs.unlocked(n.id);
        const el = U.el('div', 'npc-row' + (known ? '' : ' locked'));
        const mark = U.el('div', 'npc-mark');
        mark.style.background = known ? n.color : 'var(--line-2)';
        el.appendChild(mark);
        const main = U.el('div');
        const nm = U.el('div', 'npc-name', known ? n.name : '?????');
        main.appendChild(nm);
        main.appendChild(U.el('div', 'npc-where', known ? n.where : 'you have not run into them yet'));
        if (known) main.appendChild(U.el('div', 'npc-blurb', n.blurb));
        el.appendChild(main);
        const side = U.el('div', 'row-side');
        if (known) {
          if (VF.npcs.hasNew(n.id)) side.appendChild(U.el('div', 'npc-new', 'has something to say'));
          const btn = U.el('button', 'btn btn-sm' + (VF.npcs.hasNew(n.id) ? ' btn-primary' : ''),
                           'go and see them');
          btn.addEventListener('click', function () { speak(n.id); });
          side.appendChild(btn);
        }
        el.appendChild(side);
        b.appendChild(el);
      });
    } else {
      const R = d.records;
      const grid = U.el('div', 'stats-grid');
      function nameOf(id, traits) {
        const f = VF.fish.byId(id);
        if (!f) return '—';
        return (traits && traits.length ? VF.traits.prefix(traits) : '') + f.name;
      }
      const tiles = [
        ['biggest fish', R.biggestKg ? U.weight(R.biggestKg) : '—', nameOf(R.biggestId, R.biggestTraits)],
        ['most valuable', R.richest ? '◈ ' + U.money(R.richest) : '—', nameOf(R.richestId, R.richestTraits)],
        ['rarest combination', R.bestComboTraits && R.bestComboTraits.length
          ? R.bestComboTraits.length + ' traits' : '—', nameOf(R.bestComboId, R.bestComboTraits)],
        ['longest specimen', R.longestSpecies ? U.length(R.longestSpecies) : '—', nameOf(R.longestId)],
        ['longest streak', U.commas(R.bestStreak), 'landed without a loss'],
        ['current streak', U.commas(d.streak), d.streak ? 'still going' : 'start again']
      ];
      tiles.forEach(function (t) {
        const tile = U.el('div', 'stat-tile');
        tile.appendChild(U.el('span', 'k', t[0]));
        tile.appendChild(U.el('div', 'v', t[1]));
        if (t[2]) tile.appendChild(U.el('div', 'sub', t[2]));
        grid.appendChild(tile);
      });
      b.appendChild(grid);

      const th = U.el('div');
      th.style.marginTop = '18px';
      th.appendChild(U.el('span', 'k', 'traits recorded'));
      const tg = U.el('div', 'cos-grid');
      tg.style.marginTop = '10px';
      VF.traits.list.forEach(function (tr) {
        const n = d.traitsSeen[tr.id] | 0;
        const cell = U.el('div', 'cos-cell' + (n ? '' : ' locked'));
        cell.style.cursor = 'default';
        const pip = U.el('div', 'cos-pip');
        pip.style.background = tr.color;
        cell.appendChild(pip);
        const nm = U.el('div', 'cos-name', n ? tr.name : '?????');
        nm.style.marginTop = '2px';
        cell.appendChild(nm);
        cell.appendChild(U.el('div', 'cos-slot', n ? '×' + U.commas(n) + ' · value ×' + tr.mult : 'not yet'));
        if (n) cell.title = tr.desc;
        tg.appendChild(cell);
      });
      th.appendChild(tg);
      b.appendChild(th);
    }
    p.appendChild(b);
    return p;
  }

  /* Talking is not a card any more — the panel closes and the two of you go
     and have the conversation out on the shore where it can be seen. */
  function speak(id) {
    if (!VF.visit.canVisit()) {
      VF.toast.show('reel in before you walk off', null, 2600);
      return;
    }
    close();
    // let the panel finish getting out of the way first
    setTimeout(function () { VF.visit.start(id); }, 190);
  }

  /* ------------------------------------------------------------- fishdex */

  function buildDex() {
    const d = VF.state.data;
    const found = Object.keys(d.fishdex).length;
    const p = shell('Fishdex', found + ' of ' + VF.fish.count + ' species recorded');
    const b = body();

    const bar = U.el('div', 'dex-toolbar');
    const segR = U.el('div', 'seg');
    [{ id: 'all', label: 'All' }].concat(VF.rarities.list.map(function (r) {
      return { id: r.id, label: r.name };
    })).forEach(function (o) {
      const btn = U.el('button', dexFilter === o.id ? 'active' : '', o.label);
      if (o.id !== 'all') {
        const col = VF.rarities.color(o.id);
        btn.style.color = dexFilter === o.id ? col : '';
        const dot = U.el('span');
        dot.style.cssText = 'display:inline-block;width:5px;height:5px;border-radius:50%;' +
          'margin-right:6px;vertical-align:middle;background:' + col +
          ';box-shadow:0 0 6px ' + U.rgbToCss(U.hexToRgb(VF.rarities.get(o.id).glow), 0.6);
        btn.insertBefore(dot, btn.firstChild);
      }
      btn.addEventListener('click', function () { dexFilter = o.id; VF.audio.click(); refresh(); });
      segR.appendChild(btn);
    });
    bar.appendChild(segR);

    const segM = U.el('div', 'seg');
    [{ id: 'all', label: 'Every' }, { id: 'found', label: 'Found' }, { id: 'missing', label: 'Missing' }].forEach(function (o) {
      const btn = U.el('button', dexMode === o.id ? 'active' : '', o.label);
      btn.addEventListener('click', function () { dexMode = o.id; VF.audio.click(); refresh(); });
      segM.appendChild(btn);
    });
    bar.appendChild(segM);
    b.appendChild(bar);

    const list = VF.fish.list.filter(function (f) {
      if (dexFilter !== 'all' && f.rarity !== dexFilter) return false;
      const has = !!d.fishdex[f.id];
      if (dexMode === 'found' && !has) return false;
      if (dexMode === 'missing' && has) return false;
      return true;
    });

    const cnt = U.el('div', 'dex-count', list.length + ' shown');
    bar.appendChild(cnt);

    if (!list.length) { b.appendChild(U.el('div', 'empty', 'Nothing here yet.')); p.appendChild(b); return p; }

    const grid = U.el('div', 'dex-grid');
    list.forEach(function (f, i) {
      const entry = d.fishdex[f.id];
      const has = !!entry;
      const cell = U.el('div', 'dex-cell' + (has ? '' : ' undiscovered'));
      const r = VF.rarities.get(f.rarity);

      const idx = U.el('div', 'dex-n', '#' + String(VF.fish.list.indexOf(f) + 1).padStart(2, '0'));
      cell.appendChild(idx);
      const pip = U.el('div', 'dex-pip');
      pip.style.background = has ? r.color : 'var(--line-2)';
      if (has) pip.style.boxShadow = '0 0 8px ' + U.rgbToCss(U.hexToRgb(r.glow), 0.7);
      cell.appendChild(pip);

      const cv = U.el('canvas', 'dex-art');
      cv.width = 240; cv.height = 132;
      const g = cv.getContext('2d');
      g.save(); g.translate(120, 66);
      const sz = VF.fishArt.fitSize(f, 118);
      if (has) VF.fishArt.draw(g, f, sz, { time: i * 0.7 });
      else { g.globalAlpha = 0.34; VF.fishArt.drawSilhouette(g, f, sz, 0.85); }
      g.restore();
      cell.appendChild(cv);

      cell.appendChild(U.el('div', 'dex-name', has ? f.name : '?????'));
      const nTraits = has ? Object.keys(entry.traits || {}).length : 0;
      cell.appendChild(U.el('div', 'dex-rec', has
        ? (entry.record ? U.weight(entry.record.kg) + ' · ×' + entry.caught +
            (nTraits ? ' · ' + nTraits + 't' : '') : '×' + entry.caught)
        : r.name));

      if (has) {
        cell.addEventListener('click', function () { VF.audio.click(); showDexDetail(f, entry); });
      }
      grid.appendChild(cell);
    });
    b.appendChild(grid);
    p.appendChild(b);
    return p;
  }

  function showDexDetail(f, entry) {
    const r = VF.rarities.get(f.rarity);
    const card = U.el('div', 'catch-card');
    const ban = U.el('div', 'catch-banner', r.name);
    ban.style.background = r.color;
    card.appendChild(ban);

    const hero = U.el('div', 'catch-hero');
    hero.style.background = 'radial-gradient(ellipse at 50% 55%, ' + U.rgbToCss(U.hexToRgb(r.glow), 0.14) + ', rgba(0,0,0,0) 68%)';
    const cv = U.el('canvas');
    cv.width = 400; cv.height = 168;
    cv.style.width = '100%'; cv.style.height = '168px';
    const g = cv.getContext('2d');
    g.save(); g.translate(200, 84);
    VF.fishArt.draw(g, f, 62, { time: 1.2, mutation: entry.record ? entry.record.mutation : null });
    g.restore();
    hero.appendChild(cv);
    card.appendChild(hero);

    const bd = U.el('div', 'catch-body');
    bd.appendChild(U.el('h2', 'catch-name', f.name));
    bd.appendChild(U.el('p', 'catch-desc', f.desc));

    const m = U.el('div', 'catch-metrics');
    m.appendChild(metricEl('Record', entry.record ? U.weight(entry.record.kg) : '—'));
    m.appendChild(metricEl('Caught', U.commas(entry.caught)));
    m.appendChild(metricEl('Base value', '◈ ' + U.money(f.value)));
    bd.appendChild(m);

    const where = f.locs.length ? f.locs.map(function (l) { return VF.locations.get(l).name; }).join(' · ') : 'anywhere at all';
    const baits = f.baits.length ? f.baits.map(function (x) { return VF.bait.get(x).name; }).join(', ') : 'anything';
    const meta = U.el('div');
    meta.style.cssText = 'font-size:11.5px;line-height:1.7;color:var(--ink-3);margin-bottom:14px';
    meta.appendChild(kv('Found at', where));
    meta.appendChild(kv('Prefers', baits));
    if (f.time.length) meta.appendChild(kv('Active', f.time.join(', ')));
    if (f.weather.length) meta.appendChild(kv('Weather', f.weather.map(function (w) { return VF.weatherData.get(w).name; }).join(', ')));
    bd.appendChild(meta);

    /* every trait, with the ones seen on this species filled in */
    const tw = U.el('div');
    tw.appendChild(U.el('span', 'k', 'traits recorded on this species'));
    const trow = U.el('div', 'trait-row');
    trow.style.marginTop = '8px';
    const seen = entry.traits || {};
    VF.traits.list.forEach(function (tr) {
      const n = seen[tr.id] | 0;
      const chip = U.el('span', 'trait-chip', n ? tr.name + ' ×' + n : '?????');
      chip.style.color = n ? tr.color : 'var(--ink-4)';
      chip.style.borderColor = n ? U.rgbToCss(U.hexToRgb(tr.color), 0.42) : 'var(--line)';
      if (n) chip.title = tr.desc;
      trow.appendChild(chip);
    });
    tw.appendChild(trow);
    bd.appendChild(tw);

    const acts = U.el('div', 'catch-actions');
    acts.style.gridTemplateColumns = '1fr';
    const back = U.el('button', 'btn btn-primary', 'Back');
    back.addEventListener('click', function () { VF.audio.back(); refresh(); });
    acts.appendChild(back);
    bd.appendChild(acts);
    card.appendChild(bd);

    const prev = node;
    node = card;
    if (prev && prev.parentNode) prev.parentNode.replaceChild(card, prev);
  }

  function metricEl(k, v) {
    const el = U.el('div', 'metric');
    el.appendChild(U.el('span', 'k', k));
    el.appendChild(U.el('span', 'v', v));
    return el;
  }
  function kv(k, v) {
    const row = U.el('div');
    const kk = U.el('span', 'k', k + ' ');
    kk.style.marginRight = '6px';
    row.appendChild(kk);
    row.appendChild(document.createTextNode(v));
    return row;
  }

  /* ----------------------------------------------------------------- bag */

  function buildBag(tab) {
    const d = VF.state.data;
    const p = shell('Bag', 'What you are carrying');
    p.appendChild(tabs([
      { id: 'catches', label: 'catches (' + d.kept.length + ')' },
      { id: 'rods', label: 'rods' },
      { id: 'bait', label: 'bait' },
      { id: 'charms', label: 'charms' },
      { id: 'salvage', label: 'salvage' }
    ], tab, function (t) { refresh(t); }));
    const b = body();

    if (tab === 'charms') {
      b.appendChild(slotStrip());
      const owned = d.charms.map(function (id) { return VF.charms.get(id); }).filter(Boolean);
      if (!owned.length) {
        b.appendChild(U.el('div', 'empty', 'no charms yet. the shop sells some; the water gives up the rest.'));
      } else {
        const list = U.el('div', 'list');
        owned.forEach(function (c) {
          const eqd = VF.charms.isEquipped(c.id);
          const row = U.el('div', 'row row-rod' + (eqd ? ' equipped' : ' owned'));
          const mark = U.el('div', 'row-mark');
          mark.style.background = VF.rarities.color(c.rarity);
          row.appendChild(mark);
          const iconBox = U.el('div', 'rod-art-box');
          iconBox.style.cssText = 'width:84px;flex:0 0 84px;display:grid;place-items:center';
          iconBox.appendChild(charmIcon(c, 56));
          row.appendChild(iconBox);
          const main = U.el('div', 'row-main');
          const nm = U.el('div', 'row-name');
          nm.appendChild(U.el('span', null, c.name));
          const kt = U.el('span', 'tag', c.kind);
          kt.style.color = VF.rarities.color(c.rarity);
          nm.appendChild(kt);
          main.appendChild(nm);
          main.appendChild(U.el('div', 'row-desc', c.desc));
          const note = U.el('div', 'row-desc');
          note.style.color = 'var(--ink-2)';
          note.textContent = c.note;
          main.appendChild(note);
          main.appendChild(statLine(c));
          row.appendChild(main);
          const side = U.el('div', 'row-side');
          const btn = U.el('button', 'btn btn-sm' + (eqd ? '' : ' btn-primary'), eqd ? 'take off' : 'wear');
          btn.addEventListener('click', function () {
            if (eqd) VF.charms.unequip(d.charmSlots.indexOf(c.id));
            else VF.charms.equip(c.id);
            VF.audio.click(); VF.save.save(); refresh('charms');
          });
          side.appendChild(btn);
          row.appendChild(side);
          list.appendChild(row);
        });
        b.appendChild(list);
      }
    } else if (tab === 'salvage') {
      const ids = Object.keys(d.treasures);
      if (!ids.length) {
        b.appendChild(U.el('div', 'empty', 'nothing but fish so far.'));
      } else {
        const grid = U.el('div', 'cos-grid');
        VF.treasureData.list.forEach(function (t) {
          const n = d.treasures[t.id] | 0;
          const cell = U.el('div', 'cos-cell' + (n ? '' : ' locked'));
          cell.style.cursor = 'default';
          const pip = U.el('div', 'cos-pip');
          pip.style.background = VF.rarities.color(t.rarity);
          cell.appendChild(pip);
          const cv = U.el('canvas', 'cos-art');
          cv.width = 236; cv.height = 108;
          const g = cv.getContext('2d');
          g.scale(2, 2); g.translate(59, 27);
          if (!n) g.globalAlpha = 0.18;
          VF.treasureArt.draw(g, t, 22, 1.1);
          cell.appendChild(cv);
          cell.appendChild(U.el('div', 'cos-name', n ? t.name : '?????'));
          cell.appendChild(U.el('div', 'cos-slot', n ? '×' + n : VF.rarities.get(t.rarity).name));
          if (n) cell.title = t.desc;
          grid.appendChild(cell);
        });
        b.appendChild(grid);
      }
    } else if (tab === 'catches') {
      if (!d.kept.length) {
        b.appendChild(U.el('div', 'empty', 'Nothing kept. Choose "Keep" on a catch to store it here.'));
      } else {
        let total = 0;
        d.kept.forEach(function (k) { total += k.value; });
        const bar = U.el('div', 'dex-toolbar');
        const sellAll = U.el('button', 'btn btn-sm btn-primary', 'Sell everything · ◈ ' + U.money(total));
        sellAll.addEventListener('click', function () {
          const got = VF.catches.sellAllKept();
          if (got) VF.toast.show('Sold everything for <strong class="mono">' + U.money(got) + '</strong>', 'good');
          refresh('catches');
        });
        bar.appendChild(sellAll);
        b.appendChild(bar);

        const list = U.el('div', 'list');
        d.kept.slice().reverse().forEach(function (k, ri) {
          const idx = d.kept.length - 1 - ri;
          const f = VF.fish.byId(k.id);
          if (!f) return;
          const r = VF.rarities.get(f.rarity);
          const kTraits = k.traits || (k.mutation ? [k.mutation] : []);
          const row = U.el('div', 'row');
          const mark = U.el('div', 'row-mark');
          mark.style.background = r.color;
          row.appendChild(mark);
          const main = U.el('div', 'row-main');
          const name = U.el('div', 'row-name');
          name.appendChild(U.el('span', null, VF.traits.prefix(kTraits) + f.name));
          const tg = U.el('span', 'tag', r.name); tg.style.color = r.color; name.appendChild(tg);
          kTraits.forEach(function (tid) {
            const tr = VF.traits.get(tid);
            if (!tr) return;
            const mt = U.el('span', 'tag', tr.name);
            mt.style.color = tr.color;
            name.appendChild(mt);
          });
          main.appendChild(name);
          main.appendChild(U.el('div', 'row-desc',
            U.weight(k.kg) + ' · ' + U.length(k.m) + ' · ' + U.ordinalPercentile(k.pct) +
            ' · from ' + VF.locations.get(k.location).name));
          row.appendChild(main);
          const side = U.el('div', 'row-side');
          side.appendChild(priceEl(k.value, true));
          const btn = U.el('button', 'btn btn-sm', 'Sell');
          btn.addEventListener('click', function () {
            const got = VF.catches.sellKept(idx);
            if (got) VF.toast.show('Sold for <strong class="mono">' + U.money(got) + '</strong>', 'good', 2200);
            refresh('catches');
          });
          side.appendChild(btn);
          row.appendChild(side);
          list.appendChild(row);
        });
        b.appendChild(list);
      }
    } else if (tab === 'rods') {
      const list = U.el('div', 'list');
      d.ownedRods.map(function (id) { return VF.rods.get(id); })
        .sort(function (a, c) { return VF.rods.index(a.id) - VF.rods.index(c.id); })
        .forEach(function (rod) {
          const row = U.el('div', 'row row-rod' + (d.rod === rod.id ? ' equipped' : ' owned'));
          const mark = U.el('div', 'row-mark');
          mark.style.background = rod.art.tip;
          row.appendChild(mark);
          const artBox = U.el('div', 'rod-art-box');
          artBox.appendChild(rodPreview(rod, VF.rods.index(rod.id), false));
          row.appendChild(artBox);
          const main = U.el('div', 'row-main');
          const name = U.el('div', 'row-name');
          name.appendChild(U.el('span', null, rod.name));
          if (d.rod === rod.id) { const t = U.el('span', 'tag', 'equipped'); t.style.color = 'var(--accent)'; name.appendChild(t); }
          main.appendChild(name);
          main.appendChild(U.el('div', 'row-desc', rod.desc));
          const grid = U.el('div', 'stat-grid');
          grid.appendChild(statCell('Cast', rod.cast.toFixed(2), 0));
          grid.appendChild(statCell('Reel', rod.reel.toFixed(2), 0));
          grid.appendChild(statCell('Line', rod.line.toFixed(2), 0));
          grid.appendChild(statCell('Rare', '×' + rod.rare.toFixed(2), 0));
          grid.appendChild(statCell('Luck', '+' + rod.luck.toFixed(2), 0));
          main.appendChild(grid);
          const bn = U.el('div', 'row-desc', rodBarNote(rod));
          bn.style.color = 'var(--ink-2)';
          main.appendChild(bn);
          row.appendChild(main);
          const side = U.el('div', 'row-side');
          if (d.rod !== rod.id) {
            const btn = U.el('button', 'btn btn-sm btn-primary', 'Equip');
            btn.addEventListener('click', function () {
              d.rod = rod.id; VF.audio.click(); VF.bus.emit('gear:changed'); VF.save.save(); refresh('rods');
            });
            side.appendChild(btn);
          }
          row.appendChild(side);
          list.appendChild(row);
        });
      b.appendChild(list);
    } else {
      const list = U.el('div', 'list');
      VF.bait.list.forEach(function (bt) {
        const have = VF.bait.count(bt.id);
        if (!bt.unlimited && have <= 0) return;
        const row = U.el('div', 'row' + (d.bait === bt.id ? ' equipped' : ''));
        const mark = U.el('div', 'row-mark');
        mark.style.background = bt.color;
        row.appendChild(mark);
        const main = U.el('div', 'row-main');
        const name = U.el('div', 'row-name');
        name.appendChild(U.el('span', null, bt.name));
        if (d.bait === bt.id) { const t = U.el('span', 'tag', 'equipped'); t.style.color = 'var(--accent)'; name.appendChild(t); }
        main.appendChild(name);
        main.appendChild(U.el('div', 'row-desc', bt.desc));
        row.appendChild(main);
        const side = U.el('div', 'row-side');
        side.appendChild(U.el('div', 'row-price', have === Infinity ? '∞' : U.commas(have) + ' left'));
        if (d.bait !== bt.id) {
          const btn = U.el('button', 'btn btn-sm btn-primary', 'Use');
          btn.addEventListener('click', function () {
            d.bait = bt.id; VF.audio.click(); VF.bus.emit('bait:changed'); VF.save.save(); refresh('bait');
          });
          side.appendChild(btn);
        }
        row.appendChild(side);
        list.appendChild(row);
      });
      if (!list.children.length) b.appendChild(U.el('div', 'empty', 'No bait. Worms are always free in the shop.'));
      else b.appendChild(list);
    }

    p.appendChild(b);
    return p;
  }

  /* --------------------------------------------------------------- stats */

  function buildStats(tab) {
    const d = VF.state.data, s = d.stats;
    const done = VF.achievements.unlockedCount();
    const p = shell('Record', 'A quiet accounting');

  function slider(label, value, onChange) {

  function toggle(label, value, onChange) {
    const row = U.el('div', 'set-row');

    const sw = U.el('div', 'switch' + (value ? ' on' : ''));
    sw.setAttribute('role', 'switch');
    sw.setAttribute('tabindex', '0');
    sw.setAttribute('aria-checked', value ? 'true' : 'false');
    function flip() {
      const on = !sw.classList.contains('on');
      sw.classList.toggle('on', on);
      sw.setAttribute('aria-checked', on ? 'true' : 'false');
      onChange(on);
      VF.audio.click();
      VF.save.save();
    }
    sw.addEventListener('click', flip);
    sw.addEventListener('keydown', function (e) { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); flip(); } });

  /* ------------------------------------------------- the case opening
     The result is decided before the animation starts. The strip is then
     positioned so it lands on it, easing out over roughly six seconds. */
  function openCase(caseId) {
    const res = VF.caseOpen.buy(caseId);
    if (!res) { VF.audio.error(); return; }

    stopRodLoop();
    const rank = VF.rarities.rank(res.rarity);
    const box = U.el('div', 'opener');

    const head = U.el('div', 'opener-head');
    head.appendChild(U.el('div', 'opener-title', res.caseDef.name));
    box.appendChild(head);

    const win = U.el('div', 'reel-window');
    const strip = U.el('div', 'reel-strip');
    const ITEM = 118, GAP = 8, STEP = ITEM + GAP;
    res.strip.forEach(function (it, i) {
      const cell = U.el('div', 'reel-item');
      cell.appendChild(cosThumb(it, 118, 70, i * 0.4));
      cell.appendChild(U.el('div', 'rn', it.name));
      const bar = U.el('div', 'rbar');
      bar.style.background = VF.rarities.color(it.rarity);
      cell.appendChild(bar);
      strip.appendChild(cell);
    });
    win.appendChild(strip);
    win.appendChild(U.el('div', 'reel-fade'));
    win.appendChild(U.el('div', 'reel-marker'));
    box.appendChild(win);

    const resultBox = U.el('div', 'opener-result');
    resultBox.style.display = 'none';
    box.appendChild(resultBox);

    const acts = U.el('div', 'opener-actions');
    acts.style.display = 'none';
    box.appendChild(acts);

    const prev = node;
    node = box;
    if (prev && prev.parentNode) prev.parentNode.replaceChild(box, prev);

    // land the winning cell under the marker
    const winW = win.clientWidth || 720;
    const target = -(res.winIndex * STEP) + winW / 2 - ITEM / 2 - 8;
    const start = 0;
    const DUR = 6.1;
    let t0 = 0, lastTick = -1, raf = 0;

    VF.audio.caseRoll();

    function frame(now) {
      if (!t0) t0 = now;
      const el = (now - t0) / 1000;
      const k = Math.min(1, el / DUR);
      // strong ease-out: fast blur, long slow crawl into the result
      const e = 1 - Math.pow(1 - k, 4.2);
      const x = start + (target - start) * e;
      strip.style.transform = 'translateX(' + x.toFixed(2) + 'px)';

      // one tick per cell that passes the marker, thinning out as it slows
      const idx = Math.floor(-x / STEP);
      if (idx !== lastTick) { lastTick = idx; VF.audio.caseTick(k); }

      if (k < 1) { raf = requestAnimationFrame(frame); return; }
      finish();
    }

    function finish() {
      cancelAnimationFrame(raf);
      if (rank >= 5) box.classList.add('hit-mythic');
      else if (rank >= 4) box.classList.add('hit-legendary');
      VF.audio.stinger(rank >= 4 ? 'grand' : rank >= 2 ? 'bright' : 'soft', rank);
      if (rank >= 3) VF.fx.shake(2 + rank * 1.6, 3.4);
      if (rank >= 2) VF.fx.flash(U.rgbToCss(U.hexToRgb(VF.rarities.get(res.rarity).glow), 0.18),
                                 0.16 + rank * 0.04, 1.8);

      resultBox.style.display = '';
      resultBox.appendChild(cosThumb(res.item, 300, 96, 1.4));
      resultBox.appendChild(U.el('div', 'result-name', res.item.name));
      const slotName = (VF.cosmetics.slots.filter(function (s2) { return s2.id === res.item.slot; })[0] || {}).name;
      resultBox.appendChild(U.el('div', 'result-slot', slotName || res.item.slot));
      const rr = U.el('div', 'result-rarity', VF.rarities.get(res.rarity).name);
      rr.style.color = VF.rarities.color(res.rarity);
      resultBox.appendChild(rr);
      if (res.duplicate) {
        resultBox.appendChild(U.el('div', 'result-dupe',
          'already owned — refunded ◈ ' + U.money(res.refund)));
      }

      acts.style.display = '';
      if (!res.duplicate) {
        const eq = U.el('button', 'btn btn-primary', 'wear it');
        eq.addEventListener('click', function () {
          VF.cosmetics.equip(res.item.id);
          VF.audio.click(); VF.save.save();
          VF.toast.show('wearing <strong>' + U.esc(res.item.name) + '</strong>', 'good', 2600);
          refresh('cases');
        });
        acts.appendChild(eq);
      }
      const again = U.el('button', 'btn', 'open another');
      again.addEventListener('click', function () {
        if (VF.caseOpen.canBuy(caseId).ok) openCase(caseId);
        else { VF.audio.error(); refresh('cases'); }
      });
      acts.appendChild(again);
      const done = U.el('button', 'btn', 'done');
      done.addEventListener('click', function () { VF.audio.back(); refresh('cases'); });
      acts.appendChild(done);

      VF.achievements.check();
    }

    raf = requestAnimationFrame(frame);
  }

  VF.panels = { init: init, open: open, close: close, isOpen: isOpen, refresh: refresh,
                openCase: openCase };
})(window.VF = window.VF || {});

/* VOID FISHING — the catch card.
   The payoff screen: species art, rarity, mutation, size against the species
   record, value, and what to do with it. */
(function (VF) {
  'use strict';

  const U = VF.util;
  let host = null, card = null, open = false, raf = 0, art = null, artCtx = null;
  let gen = 0;   // guards the deferred teardown against a newer open
  let current = null, artT = 0, lastFrame = 0, resolved = false;
  let revealT = 0;   // 0..1 silhouette-to-creature wipe for a new species

  function init() {
    host = document.getElementById('modal');
    VF.bus.on('fishing:landed', function (c) { setTimeout(function () { show(c); }, 340); });
    VF.bus.on('fishing:treasure', function (c) { setTimeout(function () { showTreasure(c); }, 320); });
  }

  function banner(c) {
    const traits = c.traits || [];
    if (c.rarity === 'glitch') return { text: 'this should not be here', color: '#ff2d55' };
    if (traits.length >= 3) return { text: traits.length + ' traits', color: VF.traits.color(traits) };
    if (c.isNew) return { text: 'new discovery', color: VF.rarities.color(c.rarity) };
    if (traits.length === 2) return { text: 'double trait', color: VF.traits.color(traits) };
    if (c.isGiant) return { text: 'enormous', color: '#ffb03a' };
    if (c.isRecord) return { text: 'personal best', color: '#6fd8a4' };
    return { text: VF.rarities.get(c.rarity).name, color: VF.rarities.color(c.rarity) };
  }

  function show(c) {
    if (!c || open) return;
    current = c;
    open = true;
    resolved = false;
    gen++;
    VF.state.rt.panelOpen = 'catch';

    const r = VF.rarities.get(c.rarity);
    const traits = c.traits || [];
    const topTrait = traits.length ? VF.traits.get(traits[traits.length - 1]) : null;
    const b = banner(c);
    const rank = r.rank;

    /* --- audio + screen feedback scaled to how special this is --- */
    VF.audio.stinger(r.stinger, rank);
    if (r.shake > 0) VF.fx.shake(r.shake, 3.6);
    if (rank >= 2) VF.fx.flash(U.rgbToCss(U.hexToRgb(r.glow), 0.20), 0.24 + rank * 0.035, 1.8);
    if (rank >= 4 || c.isGiant) VF.fx.pulse(0.55);
    if (topTrait) VF.fx.flash(U.rgbToCss(U.hexToRgb(topTrait.color), 0.14 + traits.length * 0.04),
                              0.20 + traits.length * 0.05, 2.0);

    const scn = VF.scene.L;
    VF.particles.burst(scn.landPoint.x, scn.landPoint.y, 14 + rank * 5, {
      color: U.hexToRgb(r.glow), angle: -Math.PI / 2, spread: 2.0,
      speedMin: 40, speedMax: 130 + rank * 30, sizeMax: 2.6, grav: 260, lifeMax: 1.0
    });

    /* --- build the card --- */
    card = U.el('div', 'catch-card');

    const ban = U.el('div', 'catch-banner', b.text);
    ban.style.background = b.color;
    card.appendChild(ban);

    const hero = U.el('div', 'catch-hero');
    hero.style.background = 'radial-gradient(ellipse at 50% 55%, ' +
      U.rgbToCss(U.hexToRgb(r.glow), 0.14) + ', rgba(0,0,0,0) 68%)';
    art = U.el('canvas');
    art.width = 400; art.height = 168;
    art.style.width = '100%'; art.style.height = '168px';
    artCtx = art.getContext('2d');

    card.appendChild(hero);

    const body = U.el('div', 'catch-body');

    if (c.isRecord && !c.isNew) {
      const flag = U.el('div', 'record-flag');
      flag.appendChild(U.el('span', null, '↑'));
      flag.appendChild(U.el('span', null, 'beat your previous best'));
      body.appendChild(flag);
    }

    const rr = U.el('div', 'catch-rarity', r.name);
    rr.style.color = b.color;
    body.appendChild(rr);

    body.appendChild(U.el('h2', 'catch-name', VF.traits.prefix(traits) + c.fish.name));

    if (traits.length) {
      const row = U.el('div', 'trait-row');
      traits.forEach(function (id) {
        const t = VF.traits.get(id);
        if (!t) return;
        const chip = U.el('span', 'trait-chip', t.name + ' ×' + t.mult);
        chip.style.color = t.color;
        chip.style.borderColor = U.rgbToCss(U.hexToRgb(t.color), 0.42);
        chip.title = t.desc;
        row.appendChild(chip);
      });
      if (traits.length > 1) {
        const combo = U.el('span', 'trait-chip trait-combo',
          'combination ×' + (1 + (traits.length - 1) * 0.6).toFixed(1));
        combo.style.color = '#ffd88a';
        row.appendChild(combo);
      }
      body.appendChild(row);
    }

    body.appendChild(U.el('p', 'catch-desc', topTrait ? topTrait.desc : c.fish.desc));

    const metrics = U.el('div', 'catch-metrics');
    metrics.appendChild(metric('Weight', U.weight(c.kg)));
    metrics.appendChild(metric('Length', U.length(c.m)));
    metrics.appendChild(metric('Size', U.ordinalPercentile(c.pct)));
    body.appendChild(metrics);

    const track = U.el('div', 'size-track');
    const fill = U.el('div', 'size-fill');
    fill.style.background = 'linear-gradient(90deg, ' + U.rgbToCss(U.hexToRgb(r.color), 0.35) + ', ' + r.glow + ')';
    track.appendChild(fill);
    body.appendChild(track);

    const note = U.el('div', 'size-note');
    note.appendChild(U.el('span', null, 'runt'));
    note.appendChild(U.el('span', null, c.isGiant ? 'a specimen' : 'giant'));
    body.appendChild(note);

    const val = U.el('div', 'catch-value');
    const coin = U.el('span', 'coin', '◈');
    coin.style.color = 'var(--accent)';
    val.appendChild(coin);
    val.appendChild(U.el('span', 'amt', U.money(c.value)));
    body.appendChild(val);

    const acts = U.el('div', 'catch-actions');
    const sellBtn = U.el('button', 'btn btn-primary', 'Sell');
    sellBtn.addEventListener('click', function () { act('sell'); });
    const keepBtn = U.el('button', 'btn', 'Keep');
    keepBtn.title = 'Store it in your bag. Sell it later.';
    keepBtn.addEventListener('click', function () { act('keep'); });
    const relBtn = U.el('button', 'btn', 'Release');
    relBtn.title = 'Let it go for reputation, which quietly improves your luck.';
    relBtn.addEventListener('click', function () { act('release'); });
    acts.appendChild(sellBtn); acts.appendChild(keepBtn); acts.appendChild(relBtn);
    body.appendChild(acts);

    card.appendChild(body);
    U.clear(host);
    host.appendChild(card);
    host.classList.remove('hidden');

    requestAnimationFrame(function () { fill.style.width = (c.pct * 100).toFixed(1) + '%'; });

    if (c.isNew) {
      VF.audio.discover();
      VF.toast.show('<strong>' + U.esc(c.fish.name) + '</strong> added to the Fishdex', 'good', 4200);
    }
    VF.achievements.check();

    artT = 0;
    revealT = c.isNew ? 0 : 1;
    lastFrame = performance.now();
    loop();
    setTimeout(function () { sellBtn.focus(); }, 60);
  }

  /* Objects get their own card: no size, no fishdex, and often no price. */
  function showTreasure(c) {
    if (!c || open) return;
    current = c; open = true; resolved = false; gen++;
    VF.state.rt.panelOpen = 'catch';

    const t = c.treasure;
    const r = VF.rarities.get(t.rarity);
    const rank = r.rank;
    VF.audio.stinger(rank >= 4 ? 'grand' : rank >= 2 ? 'bright' : 'soft', rank);
    if (rank >= 3) VF.fx.shake(r.shake, 3.6);
    VF.fx.flash(U.rgbToCss(U.hexToRgb(t.color), 0.16), 0.20 + rank * 0.03, 1.9);

    card = U.el('div', 'catch-card');
    const ban = U.el('div', 'catch-banner', t.relic ? 'a relic' : 'pulled from the water');
    ban.style.background = t.color;
    card.appendChild(ban);

    const hero = U.el('div', 'catch-hero');
    hero.style.background = 'radial-gradient(ellipse at 50% 55%, ' +
      U.rgbToCss(U.hexToRgb(t.color), 0.16) + ', rgba(0,0,0,0) 68%)';
    art = U.el('canvas');
    art.width = 400; art.height = 168;
    art.style.width = '100%'; art.style.height = '168px';
    artCtx = art.getContext('2d');
    hero.appendChild(art);
    card.appendChild(hero);

    const body = U.el('div', 'catch-body');
    const rr = U.el('div', 'catch-rarity', r.name);
    rr.style.color = t.color;
    body.appendChild(rr);
    body.appendChild(U.el('h2', 'catch-name', t.name));
    body.appendChild(U.el('p', 'catch-desc', t.desc));

    if (t.relic) {
      const ch = VF.charms.get(t.relic);
      if (ch) {
        const note = U.el('div', 'relic-note');
        note.appendChild(U.el('span', 'k', 'relic'));
        note.appendChild(U.el('div', null, ch.note));
        body.appendChild(note);
      }
    }
    if (t.token) {
      const note = U.el('div', 'relic-note');
      note.appendChild(U.el('span', 'k', 'the keeper will want this'));
      note.appendChild(U.el('div', null, 'kept for now. it opens something.'));
      body.appendChild(note);
    }

    const sellable = t.value[1] > 0;
    let amount = 0;
    if (sellable) {
      amount = Math.round(VF.rng.g.range(t.value[0], t.value[1]) *
                          (VF.build ? VF.build.stats().value : 1));
      const val = U.el('div', 'catch-value');
      const coin = U.el('span', 'coin', '◈');
      coin.style.color = 'var(--accent)';
      val.appendChild(coin);
      val.appendChild(U.el('span', 'amt', U.money(amount)));
      body.appendChild(val);
    }

    const acts = U.el('div', 'catch-actions');
    acts.style.gridTemplateColumns = sellable ? '1.3fr 1fr' : '1fr';
    if (sellable) {
      const sellBtn = U.el('button', 'btn btn-primary', 'sell');
      sellBtn.addEventListener('click', function () {
        if (resolved) return;
        resolved = true;
        VF.economy.earn(amount, 'treasure');
        VF.state.data.stats.sold++;
        VF.audio.sell();
        VF.toast.show('sold for <strong class="mono">' + U.money(amount) + '</strong>', 'good', 2400);
        VF.fishing.resolveCatch();
        close();
      });
      acts.appendChild(sellBtn);
    }
    const keepBtn = U.el('button', sellable ? 'btn' : 'btn btn-primary', t.relic || t.token ? 'keep' : 'keep');
    keepBtn.addEventListener('click', function () {
      if (resolved) return;
      resolved = true;
      VF.audio.click();
      VF.fishing.resolveCatch();
      close();
    });
    acts.appendChild(keepBtn);
    body.appendChild(acts);
    card.appendChild(body);

    U.clear(host);
    host.appendChild(card);
    host.classList.remove('hidden');
    VF.achievements.check();

    artT = 0; revealT = 1;
    lastFrame = performance.now();
    loopTreasure();
    setTimeout(function () { acts.firstChild.focus(); }, 60);
  }

  function loopTreasure() {
    if (!open || !current || !current.treasure) return;
    const now = performance.now();
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    artT += dt;
    const g = artCtx;
    g.clearRect(0, 0, art.width, art.height);
    g.save();
    g.translate(art.width / 2, art.height / 2 + Math.sin(artT * 1.3) * 4);
    g.rotate(Math.sin(artT * 0.7) * 0.06);
    VF.treasureArt.draw(g, current.treasure, 52, artT);
    g.restore();
    raf = requestAnimationFrame(loopTreasure);
  }

  function metric(k, v) {
    const el = U.el('div', 'metric');
    el.appendChild(U.el('span', 'k', k));
    el.appendChild(U.el('span', 'v', v));
    return el;
  }

  function loop() {
    if (!open) return;
    const now = performance.now();
    const dt = Math.min(0.05, (now - lastFrame) / 1000);
    lastFrame = now;
    artT += dt;

    const c = current;
    const g = artCtx;
    const W = art.width, H = art.height;
    g.clearRect(0, 0, W, H);

    if (revealT < 1) revealT = Math.min(1, revealT + dt / 1.15);
    const k = VF.util.smootherstep(revealT);

    g.save();
    g.translate(W / 2, H / 2 + Math.sin(artT * 1.4) * 4);
    g.rotate(Math.sin(artT * 0.85) * 0.055);
    const size = VF.fishArt.fitSize(c.fish, 150);

    if (k < 1) {
      // a new species resolves out of its own silhouette
      g.globalAlpha = 1 - k;
      VF.fishArt.drawSilhouette(g, c.fish, size, 0.9);
      g.globalAlpha = k;
    }
    VF.fishArt.draw(g, c.fish, size, { time: artT, traits: c.traits });
    g.globalAlpha = 1;
    g.restore();

    if (k < 1) {
      // a light sweeps across as it resolves
      const r = VF.rarities.get(c.rarity);
      const x = -W * 0.3 + k * W * 1.6;
      const grad = g.createLinearGradient(x - W * 0.16, 0, x + W * 0.16, 0);
      grad.addColorStop(0, U.rgbToCss(U.hexToRgb(r.glow), 0));
      grad.addColorStop(0.5, U.rgbToCss(U.hexToRgb(r.glow), 0.42 * (1 - k)));
      grad.addColorStop(1, U.rgbToCss(U.hexToRgb(r.glow), 0));
      g.save();
      g.globalCompositeOperation = 'lighter';
      g.fillStyle = grad;
      g.fillRect(0, 0, W, H);
      g.restore();
    }
    raf = requestAnimationFrame(loop);
  }

  function act(kind) {
    if (!open || resolved) return;
    resolved = true;
    let r;
    if (kind === 'sell') { r = VF.catches.sell(); if (r) VF.toast.show('Sold for <strong class="mono">' + U.money(r) + '</strong>', 'good', 2400); }
    else if (kind === 'keep') { VF.catches.keep(); VF.toast.plain('Kept in your bag', null, 2000); }
    else {
      const res = VF.catches.release();
      if (res) {
        let msg = 'Released · <span class="mono">+' + res.rep + '</span> reputation';
        if (res.bonus && res.bonus.kind === 'bait') msg += '<br><span style="color:var(--good)">Found: ' + U.esc(res.bonus.text) + '</span>';
        if (res.bonus && res.bonus.kind === 'money') msg += '<br><span style="color:var(--good)">Gratitude: ' + U.money(res.bonus.amount) + '</span>';
        VF.toast.show(msg, 'good', 3600);
      }
    }
    close();
  }

  function defaultAction() { act('sell'); }

  /* Dismissing the card must never strand the catch. If no choice was made the
     fish is sold, so the player cannot lose progress by closing the window. */
  function close() {
    if (!open) return;
    if (!resolved && VF.fishing.state() === 'landed') {
      resolved = true;
      if (current && current.treasure) VF.fishing.resolveCatch();
      else VF.catches.sell();
    }
    open = false;
    VF.state.rt.panelOpen = null;
    cancelAnimationFrame(raf);
    raf = 0;
    if (card) card.classList.add('out');
    const myGen = ++gen;
    setTimeout(function () {
      // something else may own the modal host by now
      if (myGen !== gen || open || VF.panels.isOpen()) return;
      host.classList.add('hidden');
      U.clear(host);
      card = null; art = null; artCtx = null; current = null;
    }, 210);
    VF.hud.pressEnd();
  }

  VF.catchUI = { init: init, isOpen: function () { return open; }, defaultAction: defaultAction, close: close };
})(window.VF = window.VF || {});

/* js/ui/tutorial.js */
/* VOID FISHING — a light touch of teaching.
   Six short hints, each tied to the moment the player needs it, then it stops
   talking forever. Nothing is gated or blocked. */
(function (VF) {
  'use strict';

  const STEPS = [
    { id: 0, text: 'Hold Space — or press and hold on the water — to charge a cast. Let go to send it out. Fill the meter into the gold band for a better cast.' },
    { id: 1, text: 'Now wait. Watch the bobber. The void takes its time.' },
    { id: 2, text: 'Something is on. Press now to set the hook.' },
    { id: 3, text: 'Hold Space — or press and hold anywhere — to drive the white bar right. Let go and it runs back left. Keep the fish inside the bar and the bottom meter fills; let it out and the meter drains. Empty it and the fish is gone.' },
    { id: 4, text: 'Sell it for Brophys, keep it for the collection, or release it for reputation.' },
    { id: 5, text: 'Spend what you earn in the Shop. Better rods reach further and find stranger things.' }
  ];

  let shown = -1;

  function init() {
    const t = VF.state.data.tutorial;
    if (t.done) return;
    VF.bus.on('fishing:state', onState);
    VF.bus.on('fishing:landed', function () { advance(4); });
    VF.bus.on('catch:sold', function () { advance(5); });
    VF.bus.on('catch:kept', function () { advance(5); });
    VF.bus.on('catch:released', function () { advance(5); });
    VF.bus.on('rod:bought', finish);
    setTimeout(function () { advance(0); }, 1400);
  }

  function onState(s) {
    const t = VF.state.data.tutorial;
    if (t.done) return;
    if (s === 'waiting') advance(1);
    else if (s === 'bite') advance(2);
    else if (s === 'reeling') advance(3);
  }

  function advance(step) {
    const t = VF.state.data.tutorial;
    if (t.done || step < t.step || step === shown) return;
    const s = STEPS[step];
    if (!s) return;
    shown = step;
    t.step = step + 1;
    VF.hud.hint(s.text, step === 2 ? 2.2 : 9);
    if (step >= STEPS.length - 1) {
      t.done = true;
      VF.save.save();
    }
  }

  function finish() {
    const t = VF.state.data.tutorial;
    if (t.done) return;
    t.done = true;
    VF.save.save();
  }

  function reset() {
    shown = -1;
    VF.state.data.tutorial = { step: 0, done: false };
    setTimeout(function () { advance(0); }, 900);
  }

  VF.tutorial = { init: init, reset: reset, advance: advance };
})(window.VF = window.VF || {});

/* js/main.js */
/* VOID FISHING — boot and the frame loop. */
(function (VF) {
  'use strict';

  const U = VF.util;
  let last = 0, running = false, rafId = 0;
  let started = false;

  function boot() {
    const res = VF.save.load();
    const s = VF.state.data.settings;
    document.body.className = 'q-' + s.quality;

    const canvas = document.getElementById('scene');
    VF.scene.init(canvas);
    VF.palette.update();
    VF.scene.seedAmbient();

    VF.toast.init();
    VF.hud.init();
    VF.panels.init();
    VF.catchUI.init();

    VF.weather.reconcile();
    VF.secrets.registerFound();
    VF.loot.invalidatePool();

    window.addEventListener('resize', onResize, { passive: true });
    window.addEventListener('orientationchange', onResize, { passive: true });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible') return;
      last = performance.now();
      // coming back from a background tab is not evidence about this machine
      perf.acc = 0; perf.frames = 0; perf.slow = 0; perf.bad = 0; perf.warm = 2;
    });
    document.addEventListener('contextmenu', function (e) {
      if (e.target && e.target.id === 'scene') e.preventDefault();
    });

    const bootEl = document.getElementById('boot');
    const startBtn = document.getElementById('bootStart');
    if (res.loaded && VF.state.data.stats.casts > 0) {
      startBtn.textContent = 'Continue';
      const note = U.qs('.boot-note');
      if (note) note.textContent = 'Level ' + VF.state.data.level + ' · ' +
        U.commas(VF.state.data.stats.catches) + ' caught';
    }
    startBtn.addEventListener('click', start);

    // draw one frame behind the title card so it is never a black screen
    VF.scene.update(0.016);
    VF.scene.draw();
    startLoop();
  }

  function start() {
    if (started) return;
    started = true;
    VF.audio.unlock();
    VF.audio.setVolumes();
    const bootEl = document.getElementById('boot');
    bootEl.classList.add('gone');
    setTimeout(function () { bootEl.style.display = 'none'; }, 750);
    document.getElementById('hud').classList.remove('hidden');
    VF.hud.show();
    VF.hud.refreshAll();
    VF.tutorial.init();
    VF.achievements.check();
    if (VF.state.data.stats.casts === 0) VF.hud.showPrompt(VF.locations.current().name, VF.locations.current().glow, 1.8);
  }

  function onResize() {
    VF.scene.resize();
    VF.scene.seedAmbient();
  }

  function startLoop() {
    if (running) return;
    running = true;
    last = performance.now();
    rafId = requestAnimationFrame(frame);
  }

  /* ------------------------------------------------- adaptive quality
     The scene is heavier than it used to be. Rather than let a slow machine
     run it at twenty frames a second, watch the frame time and step the
     setting down — once, visibly, and never back up on its own, so the player
     stays in charge of it from Settings. */
  const perf = { acc: 0, frames: 0, slow: 0, bad: 0, warm: 4, stepped: 0 };

  function watchFrameRate(dt) {
    if (!started || perf.stepped >= 2 || VF.state.rt.panelOpen) return;
    if (perf.warm > 0) { perf.warm -= Math.min(dt, 0.1); return; }
    // half a second is not a slow machine, it is a tab that was somewhere else
    if (dt > 0.5) return;
    perf.acc += dt;
    perf.frames++;
    if (dt > 0.030) perf.slow++;
    if (perf.acc < 4) return;

    // the share of slow frames, not the mean: one garbage-collection pause in
    // four seconds should not be read as a machine that cannot cope
    const share = perf.slow / Math.max(1, perf.frames);
    const enough = perf.frames >= 40;
    perf.acc = 0; perf.frames = 0; perf.slow = 0;
    const q = VF.state.data.settings.quality;
    perf.share = share;
    if (enough && share > 0.55 && q !== 'low') {
      perf.bad++;
      if (perf.bad < 4) return;
      perf.bad = 0;
      perf.stepped++;
      const next = q === 'high' ? 'medium' : 'low';
      VF.state.data.settings.quality = next;
      document.body.className = 'q-' + next;
      VF.scene.resize();
      VF.bus.emit('settings:quality');
      VF.save.save();
      VF.toast.show('graphics turned down to <strong>' + next + '</strong> to keep it smooth' +
                    ' &mdash; change it back in settings', null, 6000);
    } else {
      perf.bad = 0;
    }
  }

  function frame(now) {
    rafId = requestAnimationFrame(frame);
    let dt = (now - last) / 1000;
    last = now;
    if (!(dt > 0)) dt = 0.016;
    // the honest frame time, before the clamp, is what tells us how the
    // machine is coping — the clamp is for the simulation, not for measuring
    const raw = dt;
    // a long pause (tab in the background) must not fast-forward the fight
    if (dt > 0.1) dt = 0.1;

    const rt = VF.state.rt;
    rt.dt = dt;
    rt.t += dt;

    try {
      VF.time.tick(dt);
      VF.weather.tick(dt);
      VF.palette.update();

      if (started) {
        VF.visit.tick(dt);
        VF.fishing.tick(dt);
        VF.conditions.tick(dt);
        VF.encounters.tick(dt);
        VF.wrong.tick(dt);
        VF.achievements.tick(dt);
        VF.state.data.stats.playSeconds += dt;
        VF.save.tick(dt);
      }

      VF.fx.update(dt);
      VF.scene.update(dt);
      VF.scene.draw();

      if (started) VF.hud.tick(dt);
      VF.audio.tick(dt);
      watchFrameRate(raw);
    } catch (err) {
      console.error('[frame]', err);
      // never let one bad frame kill the loop
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  VF.game = { start: start, restartLoop: startLoop, perf: perf };
})(window.VF = window.VF || {});
