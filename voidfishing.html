/* js/systems/time.js */
/* VOID FISHING — day/night cycle.
   One full day is DAY_LENGTH real seconds and transitions continuously, so the
   scene is never abruptly repainted. Phases are named windows on that cycle. */
(function (VF) {
  'use strict';

  const DAY_LENGTH = 560;

  const PHASES = [
    { id: 'dawn',   name: 'Dawn',   from: 0.00, to: 0.18 },
    { id: 'day',    name: 'Day',    from: 0.18, to: 0.48 },
    { id: 'sunset', name: 'Sunset', from: 0.48, to: 0.64 },
    { id: 'night',  name: 'Night',  from: 0.64, to: 1.00 }
  ];

  let cycle = 0.66;   // start just into night — the game reads best at night
  let phaseId = 'night';

  function tick(dt) {
    const prev = phaseId;
    cycle = (cycle + dt / DAY_LENGTH) % 1;
    for (let i = 0; i < PHASES.length; i++) {
      if (cycle >= PHASES[i].from && cycle < PHASES[i].to) { phaseId = PHASES[i].id; break; }
    }
    if (phaseId !== prev) VF.bus.emit('time:phase', phaseId);
  }

  /* Sun elevation: 0 at deep night, 1 at midday. Drives global scene brightness. */
  function elevation() {
    // peak at cycle 0.33, trough at 0.83
    return VF.util.clamp(0.5 + 0.5 * Math.cos((cycle - 0.33) * VF.util.TAU), 0, 1);
  }

  /* Clock string for the HUD — cosmetic, mapped onto a 24h face. */
  function clock() {
    const total = ((cycle + 0.25) % 1) * 24;
    const h = Math.floor(total);
    const m = Math.floor((total - h) * 60);
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }

  function phase() { return phaseId; }
  function phaseName() {
    for (let i = 0; i < PHASES.length; i++) if (PHASES[i].id === phaseId) return PHASES[i].name;
    return 'Night';
  }
  function setCycle(c) { cycle = c % 1; }

  VF.time = {
    tick: tick,
    phase: phase,
    phaseName: phaseName,
    elevation: elevation,
    clock: clock,
    cycle: function () { return cycle; },
    setCycle: setCycle,
    DAY_LENGTH: DAY_LENGTH,
    PHASES: PHASES
  };
})(window.VF = window.VF || {});

/* js/systems/weather.js */
/* VOID FISHING — weather system.
   Weather changes on a slow timer and cross-fades over BLEND seconds so the
   scene never snaps. `intensity` is the live 0..1 blend used by the renderer. */
(function (VF) {
  'use strict';

  const MIN_HOLD = 95;
  const MAX_HOLD = 210;
  const BLEND = 9;

  let current = 'clear';
  let next = null;
  let hold = 60;
  let blend = 1;      // 1 = fully settled on `current`

  function allowed() {
    const loc = VF.locations.current();
    return loc.weather && loc.weather.length ? loc.weather : ['clear'];
  }

  function pick() {
    const pool = allowed().map(function (id) { return VF.weatherData.get(id); });
    const avoid = current;
    const chosen = VF.rng.weighted(pool, function (w) {
      return w.id === avoid ? w.weight * 0.12 : w.weight;
    }, VF.rng.g);
    return chosen ? chosen.id : 'clear';
  }

  function tick(dt) {
    if (next) {
      blend += dt / BLEND;
      if (blend >= 1) { current = next; next = null; blend = 1; VF.bus.emit('weather:changed', current); }
      return;
    }
    hold -= dt;
    if (hold <= 0) {
      hold = VF.rng.g.range(MIN_HOLD, MAX_HOLD);
      const n = pick();
      if (n !== current) { next = n; blend = 0; }
    }
  }

  /* Re-roll immediately when the player moves somewhere the weather cannot follow. */
  function reconcile() {
    const ok = allowed();
    if (ok.indexOf(current) < 0) { current = ok[0]; next = null; blend = 1; VF.bus.emit('weather:changed', current); }
    if (next && ok.indexOf(next) < 0) { next = null; blend = 1; }
  }

  function force(id) {
    if (!VF.weatherData.get(id)) return;
    next = id; blend = 0; hold = VF.rng.g.range(MIN_HOLD, MAX_HOLD);
  }

  /* Numeric field lookup blended between outgoing and incoming weather. */
  function field(key, dflt) {
    const a = VF.weatherData.get(current);
    const av = (a[key] === undefined ? dflt : a[key]);
    if (!next) return av;
    const b = VF.weatherData.get(next);
    const bv = (b[key] === undefined ? dflt : b[key]);
    return VF.util.lerp(av, bv, VF.util.smoothstep(blend));
  }

  /* Whoever changes the location, the weather follows. */
  VF.bus.on('location:changed', function () { reconcile(); });

  VF.weather = {
    tick: tick, reconcile: reconcile, force: force, field: field,
    id: function () { return blend < 0.5 && next ? current : (next && blend >= 0.5 ? next : current); },
    data: function () { return VF.weatherData.get(VF.weather.id()); },
    name: function () { return VF.weather.data().name; },
    /* Modifiers the fishing systems read — always the settled-ish value. */
    bite: function () { return field('bite', 1); },
    rare: function () { return field('rare', 1); },
    luck: function () { return field('luck', 0); },
    encounter: function () { return field('encounter', 1); },
    /* Render fields */
    fog: function () { return field('fog', 0); },
    rain: function () { return field('rain', 0); },
    wind: function () { return field('wind', 0.3); },
    light: function () { return field('light', 1); },
    meteors: function () { return field('meteors', 0); },
    aurora: function () { return field('aurora', 0); },
    surge: function () { return field('surge', 0); },
    shakeAmt: function () { return field('shake', 0); },
    tint: function () {
      const a = VF.weatherData.get(current);
      if (!next) return a.tint ? { c: a.tint, k: 1 } : null;
      const b = VF.weatherData.get(next);
      const t = VF.util.smoothstep(blend);
      if (!a.tint && !b.tint) return null;
      if (!a.tint) return { c: b.tint, k: t };
      if (!b.tint) return { c: a.tint, k: 1 - t };
      return { c: VF.util.rgbToCss(VF.util.mixRgb(VF.util.hexToRgb(a.tint), VF.util.hexToRgb(b.tint), t)), k: 1 };
    }
  };
})(window.VF = window.VF || {});

/* js/systems/progression.js */
/* VOID FISHING — levels, XP and unlocks.
   Curve is tuned so the early game moves fast and the deep locations arrive
   at a steady clip rather than after an hour of grinding. */
(function (VF) {
  'use strict';

  const MAX_LEVEL = 99;

  function xpForLevel(n) {
    return Math.round(30 * Math.pow(n, 1.72));
  }
  function xpToNext() { return xpForLevel(VF.state.data.level); }

  function addXp(amount) {
    const d = VF.state.data;
    if (d.level >= MAX_LEVEL) return { levels: 0 };
    d.xp += amount;
    let gained = 0;
    while (d.level < MAX_LEVEL && d.xp >= xpForLevel(d.level)) {
      d.xp -= xpForLevel(d.level);
      d.level++;
      gained++;
    }
    if (gained) {
      const unlocked = checkUnlocks();
      VF.bus.emit('level:up', { level: d.level, gained: gained, unlocked: unlocked });
    }
    return { levels: gained };
  }

  /* Returns the list of things that became available at the new level. */
  function checkUnlocks() {
    const d = VF.state.data;
    const out = { locations: [], rods: [], baits: [] };
    for (let i = 0; i < VF.locations.list.length; i++) {
      const l = VF.locations.list[i];
      if (d.level >= l.level && d.unlockedLocations.indexOf(l.id) < 0) {
        d.unlockedLocations.push(l.id);
        out.locations.push(l);
      }
    }
    for (let i = 0; i < VF.rods.list.length; i++) {
      const r = VF.rods.list[i];
      if (d.level === r.level) out.rods.push(r);
    }
    for (let i = 0; i < VF.bait.list.length; i++) {
      const b = VF.bait.list[i];
      if (d.level === b.level) out.baits.push(b);
    }
    return out;
  }

  /* Aggregate luck from rod + bait + weather + reputation. Feeds size & mutation rolls. */
  function luck() {
    const d = VF.state.data;
    const rod = VF.rods.get(d.rod);
    const bait = VF.bait.get(d.bait);
    const rep = Math.min(1.2, d.reputation * 0.0025);
    return rod.luck + bait.luck + VF.weather.luck() + rep;
  }

  /* Aggregate rare-tier multiplier. */
  function rareMult() {
    const d = VF.state.data;
    return VF.rods.get(d.rod).rare * VF.bait.get(d.bait).rare *
           VF.weather.rare() * VF.locations.current().rarityBoost;
  }

  VF.progression = {
    MAX_LEVEL: MAX_LEVEL,
    xpForLevel: xpForLevel,
    xpToNext: xpToNext,
    addXp: addXp,
    checkUnlocks: checkUnlocks,
    luck: luck,
    rareMult: rareMult
  };
})(window.VF = window.VF || {});

/* js/systems/build.js */
/* VOID FISHING — the loadout.
   One place that folds rod, bait, charms, relics and conditions into the
   numbers the rest of the game reads. Recomputed only when something changes,
   because the loot roll asks for it on every cast. */
(function (VF) {
  'use strict';

  const U = VF.util;

  const BASE = {
    luck: 0,        // additive
    rare: 1, value: 1, xp: 1, bite: 1, reel: 1, line: 1,
    size: 1, trait: 1, treasure: 1, encounter: 1, secret: 1, void: 1,
    /* the catch minigame reads these two directly */
    barSize: 1,     // how wide the white bar is
    barSpeed: 1     // how fast the white bar travels
  };

  let cache = null;
  let key = '';

  function currentKey() {
    const d = VF.state.data;
    return d.rod + '|' + d.bait + '|' + d.charmSlots.join(',') + '|' +
           VF.time.phase() + '|' + d.level;
  }

  function compute() {
    const d = VF.state.data;
    const s = Object.assign({}, BASE);

    const rod = VF.rods.get(d.rod);
    const bait = VF.bait.get(d.bait);
    s.luck += rod.luck + bait.luck;
    s.rare *= rod.rare * bait.rare;
    s.bite *= bait.bite;

    const max = VF.charms.slotCount();
    for (let i = 0; i < max; i++) {
      const c = VF.charms.get(d.charmSlots[i]);
      if (!c) continue;
      const st = c.stats || {};
      for (const k in st) {
        if (k === 'luck') s.luck += st.luck;
        else if (s[k] !== undefined) s[k] *= st[k];
      }
      if (c.dynamic) { try { c.dynamic(s); } catch (e) { /* a charm must not break a cast */ } }
    }

    // keep the extremes sane no matter how the build is stacked
    s.bite = U.clamp(s.bite, 0.35, 2.6);
    s.line = U.clamp(s.line, 0.4, 3.0);
    s.reel = U.clamp(s.reel, 0.5, 2.5);
    s.rare = Math.max(0.3, s.rare);
    s.value = Math.max(0.4, s.value);
    // five stacked size charms should be a real build, not an auto-win
    s.barSize = U.clamp(s.barSize, 0.6, 2.4);
    s.barSpeed = U.clamp(s.barSpeed, 0.5, 2.0);
    return s;
  }

  function stats() {
    const k = currentKey();
    if (k !== key || !cache) { key = k; cache = compute(); }
    return cache;
  }

  /* What the worn charms alone are doing. The rod and the bait have their own
     tabs; folding them in here made the summary read as nonsense. */
  function charmStats() {
    const d = VF.state.data;
    const s = Object.assign({}, BASE);
    const max = VF.charms.slotCount();
    for (let i = 0; i < max; i++) {
      const c = VF.charms.get(d.charmSlots[i]);
      if (!c) continue;
      const st = c.stats || {};
      for (const kk in st) {
        if (kk === 'luck') s.luck += st.luck;
        else if (s[kk] !== undefined) s[kk] *= st[kk];
      }
      if (c.dynamic) { try { c.dynamic(s); } catch (e) { /* ignore */ } }
    }
    return s;
  }

  function invalidate() { key = ''; cache = null; }

  /* A short human summary of what this loadout is for — shown in the bag. */
  function describe() {
    const s = charmStats();
    const parts = [];
    if (s.rare >= 1.25) parts.push('rarity');
    if (s.size >= 1.2) parts.push('size');
    if (s.trait >= 1.3) parts.push('traits');
    if (s.value >= 1.3) parts.push('value');
    if (s.bite <= 0.8) parts.push('speed');
    if (s.treasure >= 1.6) parts.push('salvage');
    if (s.encounter >= 1.4) parts.push('encounters');
    if (s.secret >= 1.5) parts.push('discovery');
    if (s['void'] >= 1.5) parts.push('the deep');
    if (s.barSize >= 1.18) parts.push('the white bar');
    if (s.barSpeed <= 0.93) parts.push('a steady bar');
    else if (s.barSpeed >= 1.12) parts.push('a quick bar');
    if (!parts.length) return 'balanced';
    return parts.slice(0, 3).join(' · ');
  }

  VF.build = { stats: stats, charmStats: charmStats, invalidate: invalidate,
               describe: describe, BASE: BASE };

  VF.bus.on('charm:changed', invalidate);
  VF.bus.on('gear:changed', invalidate);
  VF.bus.on('bait:changed', invalidate);
  VF.bus.on('rod:bought', invalidate);
  VF.bus.on('level:up', invalidate);
  VF.bus.on('time:phase', invalidate);
})(window.VF = window.VF || {});

/* js/systems/conditions.js */
/* VOID FISHING — the condition currently affecting this spot.
   At most one at a time, on a long timer, cross-faded so the water changes
   rather than snaps. */
(function (VF) {
  'use strict';

  const U = VF.util;

  const IDLE_MIN = 210;
  const IDLE_MAX = 460;
  const FADE = 7;

  let active = null;      // condition def
  let remain = 0;
  let idle = 90;
  let blend = 0;          // 0..1 presence

  const NEUTRAL = { bite: 1, rare: 1, value: 1, size: 1, trait: 1, treasure: 1,
                    encounter: 1, secret: 1, 'void': 1 };

  function available() {
    const li = VF.locations.index(VF.state.data.location);
    return VF.conditionData.list.filter(function (c) {
      return !c.minLoc || li >= c.minLoc;
    });
  }

  function start(id) {
    const pool = available();
    const c = id ? VF.conditionData.get(id) : VF.rng.weighted(pool, function (x) { return x.weight; }, VF.rng.g);
    if (!c) return false;
    active = c;
    remain = VF.rng.g.range(c.dur[0], c.dur[1]);
    VF.bus.emit('condition:start', c);
    return true;
  }

  function end() {
    if (!active) return;
    const was = active;
    active = null;
    remain = 0;
    idle = VF.rng.g.range(IDLE_MIN, IDLE_MAX);
    VF.bus.emit('condition:end', was);
  }

  function tick(dt) {
    if (active) {
      remain -= dt;
      blend = U.clamp(Math.min(blend + dt / FADE, remain / FADE), 0, 1);
      if (remain <= 0) end();
    } else {
      blend = Math.max(0, blend - dt / FADE);
      idle -= dt;
      if (idle <= 0) {
        idle = VF.rng.g.range(IDLE_MIN, IDLE_MAX);
        // conditions favour the deeper water, where things are less settled
        const li = VF.locations.index(VF.state.data.location);
        if (VF.rng.g() < 0.45 + li * 0.05) start();
      }
    }
  }

  /* Modifiers, eased in and out so nothing changes abruptly mid-cast. */
  function mods() {
    if (!active || blend <= 0.001) return NEUTRAL;
    const k = U.smoothstep(blend);
    const out = {};
    for (const key in NEUTRAL) {
      const v = active.mods[key];
      out[key] = v === undefined ? 1 : U.lerp(1, v, k);
    }
    return out;
  }

  function reset() { active = null; remain = 0; blend = 0; idle = 90; }

  VF.conditions = {
    tick: tick, mods: mods, start: start, end: end, reset: reset,
    current: function () { return active; },
    name: function () { return active ? active.name : null; },
    strength: function () { return active ? U.smoothstep(blend) : 0; },
    has: function (id) { return !!active && active.id === id; },
    flag: function (f) { return active && active[f] ? U.smoothstep(blend) : 0; }
  };

  VF.bus.on('location:changed', reset);
})(window.VF = window.VF || {});

/* js/systems/economy.js */
/* VOID FISHING — money in, money out. */
(function (VF) {
  'use strict';

  function earn(amount, reason) {
    amount = Math.max(0, Math.round(amount));
    if (!amount) return 0;
    const d = VF.state.data;
    d.money += amount;
    d.stats.earned += amount;
    VF.bus.emit('money:changed', { delta: amount, reason: reason || '' });
    return amount;
  }

  function canAfford(cost) { return VF.state.data.money >= cost; }

  function spend(cost, reason) {
    cost = Math.max(0, Math.round(cost));
    const d = VF.state.data;
    if (d.money < cost) return false;
    d.money -= cost;
    d.stats.spent += cost;
    VF.bus.emit('money:changed', { delta: -cost, reason: reason || '' });
    return true;
  }

  function buyRod(id) {
    const rod = VF.rods.get(id);
    const d = VF.state.data;
    if (!rod || d.ownedRods.indexOf(id) >= 0) return { ok: false, why: 'owned' };
    if (d.level < rod.level) return { ok: false, why: 'level' };
    if (rod.requiresVoidCatch && d.stats.voidCatches < 1) return { ok: false, why: 'void' };
    if (!spend(rod.cost, 'rod')) return { ok: false, why: 'money' };
    d.ownedRods.push(id);
    d.rod = id;
    VF.bus.emit('rod:bought', rod);
    VF.save.save();
    return { ok: true };
  }

  function buyBait(id, packs) {
    const bait = VF.bait.get(id);
    const d = VF.state.data;
    packs = Math.max(1, packs | 0);
    if (!bait || bait.unlimited) return { ok: false, why: 'free' };
    if (d.level < bait.level) return { ok: false, why: 'level' };
    const cost = bait.cost * packs;
    if (!spend(cost, 'bait')) return { ok: false, why: 'money' };
    VF.bait.add(id, bait.pack * packs);
    VF.bus.emit('bait:bought', { bait: bait, packs: packs });
    VF.save.save();
    return { ok: true, amount: bait.pack * packs };
  }

  VF.economy = { earn: earn, spend: spend, canAfford: canAfford, buyRod: buyRod, buyBait: buyBait };
})(window.VF = window.VF || {});

/* js/systems/loot.js */
/* VOID FISHING — deciding what is on the end of the line.
   Fish are drawn directly (not tier-then-species) so a tier with no local species
   simply never comes up, and preference tags shift the odds inside a tier. */
(function (VF) {
  'use strict';

  const U = VF.util;

  /* Combined "rarity power". Additive over sources so stacking every bonus is
     strong but never runaway-exponential. */
  function rarityPower(opts) {
    const d = VF.state.data;
    const rod = VF.rods.get(d.rod);
    const bait = VF.bait.get(d.bait);
    const loc = VF.locations.current();
    const build = VF.build ? VF.build.stats() : null;
    const cond = VF.conditions ? VF.conditions.mods() : null;
    const sum = Math.max(0,
      (rod.rare - 1) +
      (bait.rare - 1) +
      (VF.weather.rare() - 1) +
      (loc.rarityBoost - 1) +
      (build ? build.rare - 1 : 0) +
      (cond ? cond.rare - 1 : 0) +

    for (let i = 0; i < VF.fish.list.length; i++) {

  let prefKey = '';
  let prefMean = Object.create(null);
  function prefMeans(p, locId) {
    const d = VF.state.data;
    const key = locId + '|' + d.bait + '|' + VF.time.phase() + '|' + VF.weather.id();
    if (key === prefKey) return prefMean;
    const sum = Object.create(null), cnt = Object.create(null);

    const rp = rarityPower(opts);
    const minRank = opts.minRank || 0;

    const candidates = minRank
      ? p.pool.filter(function (e) { return VF.rarities.rank(e.f.rarity) >= minRank; })
      : p.pool;
    if (!candidates.length) return VF.fish.byId('smallmouth') || VF.fish.list[0];

    let counts = p.perRarity;

      for (let i = 0; i < candidates.length; i++) {

      const r = VF.rarities.get(e.f.rarity);

      // presence < 1 means this tier only drifts in from elsewhere — damp it

    const luck = VF.progression.luck();

    const traitBoost = (1 + (opts.traitBoost || 0)) * (build ? build.traitChance : 1);

    const scale = VF.traits.sizeScale(traits);
    if (scale !== 1) size = { kg: size.kg * scale, m: size.m * Math.pow(scale, 0.4), pct: size.pct, u: size.u };

    const rarity = VF.rarities.get(f.rarity);
    const traitMult = VF.traits.multiplier(traits);

    const sizeValue = 0.55 + size.pct * 1.75;
    const value = Math.max(1, Math.round(
      f.value * sizeValue * traitMult * loc.valueBoost * (build ? build.value : 1)
    ));
    const xp = Math.max(1, Math.round(
      rarity.xp * (0.8 + size.pct * 0.6) * loc.xpBoost * (build ? build.xp : 1)
    ));

    const prev = d.fishdex[f.id];
    const isNew = !prev;
    const isRecord = !!prev && size.kg > (prev.record ? prev.record.kg : 0);
    const isGiant = size.pct >= 0.985 || traits.indexOf('massive') >= 0;

    return {
      id: f.id, fish: f, rarity: f.rarity, rarityDef: rarity,
      traits: traits,
      mutation: traits.length ? traits[0] : null,     // kept for older save data
      kg: size.kg, m: size.m, pct: size.pct,
      value: value, xp: xp,
      isNew: isNew, isRecord: isRecord, isGiant: isGiant,
      location: loc.id, time: VF.time.phase(), weather: VF.weather.id(),
      at: Date.now()

  }

     is set. The fight loop then only reads these numbers, so difficulty is a
     property of the fish and the loadout rather than of the frame rate.

       the rod    line strength widens the white bar, reel force steadies it
       the charms barSize and barSpeed, straight off the worn loadout          */
  function fightParams(c) {
    const rod = VF.rods.get(VF.state.data.rod);
    const b = (VF.build ? VF.build.stats() : null) ||
              { line: 1, reel: 1, barSize: 1, barSpeed: 1 };
    const f = c.fish;
    const rank = VF.rarities.rank(c.rarity);
    const tf = VF.traits.fight(c.traits);

    /* One difficulty number, 0 at the easiest common and 1 at the worst thing
       in the catalogue. Traits push past 1, which is the point of them. */
    const raw = f.diff * 0.55 + rank * 0.100 + c.pct * 0.16;
    const D = U.clamp(((raw - 0.05) / 1.25) * Math.pow(tf.power, 0.55), 0, 1.15);

       through a log so the last rod is an upgrade, not the whole track. */

    const rodBar = 1 + 0.155 * (Math.log(lineTotal) / Math.LN2);

    const stam = U.clamp(tf.stamina, 0.7, 1.7);

    const fishSpeed = 0.30 + 0.66 * D;

       of them must never drop it below the fish it has to chase, or the fight
       stops being a question of control and becomes one of arithmetic. */
    const barTop = Math.max(0.74, fishSpeed * 1.45);

         the minigame: a rarer fish is harder to *hold*, never impossible to

      barSpeed: Math.max(fishSpeed * 1.20, barTop * barMul),       // track widths / second

      fishSpeed: fishSpeed,                             // top speed of the indicator
      fishStiff: stiff,                                 // how hard it drives at its target
      fishDrag: 1.10 * Math.sqrt(stiff),                // damped the same at every difficulty
      fishTurn: (1.05 - 0.77 * D) / surge,              // seconds between direction changes
      dart: U.clamp((0.10 + 0.45 * D) * surge, 0, 0.85),// chance a turn is a hard run
      evade: U.clamp((D - 0.55) / 0.45, 0, 1) * 0.40,   // only the rarest read the bar
      wobble: 0.020 + 0.040 * D,

      /* --- the progress bar --- */
      fill: (0.400 - 0.170 * D) / stam * (1 + 0.35 * q),
      drain: 0.230 + 0.260 * D,
      start: 0.33,

    };
  }

  VF.loot = {
    roll: roll,
    pickFish: pickFish,
    fightParams: fightParams,
    rarityPower: rarityPower,
    invalidatePool: function () { for (const k in poolCache) delete poolCache[k]; prefKey = ''; }

  const BITE_WINDOW_BIG = 2.6;     // an encounter is too rare to lose to a slow hand

    f.fish += f.fishV * dt;
    if (f.fish < FISH_EDGE) {
      f.fish = FISH_EDGE; f.fishV = Math.abs(f.fishV) * 0.45;
      f.target = VF.rng.g.range(0.18, 0.70);
    } else if (f.fish > 1 - FISH_EDGE) {
      f.fish = 1 - FISH_EDGE; f.fishV = -Math.abs(f.fishV) * 0.45;
      f.target = VF.rng.g.range(0.30, 0.82);
    }

    /* --- the bar either has the fish or it does not --- */
    const gap = Math.abs(f.fish - f.bar);
    const was = f.inside;
    f.inside = gap <= half;
    if (f.inside) {
      f.outsideT = 0;
      f.progress += p.fill * dt;
    } else {
      f.outsideT += dt;
      f.perfect = false;
      // the further out the fish gets, the faster the progress goes
      const away = U.clamp((gap - half) / 0.22, 0, 1);
      // and it takes a moment to get going, so a slip the player catches
      // straight away costs a little rather than most of the bar
      const ramp = U.clamp(f.outsideT / 0.18, 0.25, 1);
      f.progress -= p.drain * (0.62 + 0.58 * away) * ramp * dt;
    }
    f.progress = U.clamp(f.progress, 0, 1);
    /* Holding the fish against the edge of the bar is exactly what good play
       looks like, and `inside` can flip on consecutive frames there. The
       progress above uses every one of those frames; the announcement does
       not, or it would fire sixty times a second. */
    if (f.inside !== was && f.elapsed - f.lastEdge > 0.15) {
      f.lastEdge = f.elapsed;
      VF.bus.emit(f.inside ? 'fishing:grip' : 'fishing:slip', f);
    }

    /* --- what the rest of the game reads ---
       The rod bends off `tension`, the hooked shadow swims in on `distance`
       and thrashes on `surge`. All three are the minigame, seen from outside. */
    const speed01 = U.clamp(Math.abs(f.fishV) / Math.max(0.05, p.fishSpeed), 0, 1);
    const edge = half > 0 ? U.clamp(gap / half, 0, 1) : 1;
    f.tension = f.inside ? 0.30 + edge * 0.34 : U.clamp(0.70 + (gap - half) * 1.3, 0, 1);
    f.surge = speed01;
    // the ground gained on top of where the fight started, so the hooked
    // shadow swims up out of the dark rather than starting a third of the way in
    f.distance = 1 - U.clamp((f.progress - p.start) / Math.max(0.05, 1 - p.start), 0, 1);
    f.stamina = U.clamp(1 - f.progress * 0.92, 0, 1);
    f.shakeAmt = f.inside ? 0 : U.clamp(f.outsideT * 1.5, 0, 1) * (0.45 + speed01 * 0.55);
    f.reeling = f.inside;

    /* --- resolution --- */
    if (f.progress >= 1) { land(); return; }
    if (f.progress <= 0) { lose(gap > half + 0.20 ? 'snap' : 'slack'); return; }
  }

  /* ---------------------------------------------------------------- outcomes */

  function land() {
    const f = S.fight;
    const c = f.c;
    const d = VF.state.data;

    if (c.kind === 'treasure') { landTreasure(c, f); return; }

    d.stats.catches++;
    d.streak++;
    if (d.streak > d.records.bestStreak) d.records.bestStreak = d.streak;
    if (f.perfect) d.stats.perfectReels++;

    const rank = VF.rarities.rank(c.rarity);
    if (rank >= 4) d.stats.legendaryCatches++;
    if (rank >= 6) d.stats.voidCatches++;
    d.flags['rare_' + c.rarity] = true;

    const traits = c.traits || [];
    if (traits.length) {
      d.stats.mutationsFound++;
      if (traits.length >= 2) d.stats.multiTrait++;
      if (traits.length >= 3) d.flags.combo3 = true;
      if (traits.length >= 4) d.flags.combo4 = true;
      for (let i = 0; i < traits.length; i++) {
        d.traitsSeen[traits[i]] = (d.traitsSeen[traits[i]] | 0) + 1;
        d.flags['mut_' + traits[i]] = true;
        d.flags['trait_' + traits[i]] = true;
      }
    }
    if (c.isGiant) d.flags.caughtGiant = true;
    if (rank >= 6) VF.journal.add('firstvoid');

    /* fishdex */
    let entry = d.fishdex[c.id];
    if (!entry) {
      entry = d.fishdex[c.id] = { caught: 0, record: null, firstSeen: Date.now(), mutations: {} };
    }
    entry.caught++;
    if (!entry.traits) entry.traits = {};
    for (let i = 0; i < traits.length; i++) {
      entry.traits[traits[i]] = (entry.traits[traits[i]] | 0) + 1;
      entry.mutations[traits[i]] = (entry.mutations[traits[i]] | 0) + 1;
    }
    if (!entry.record || c.kg > entry.record.kg) {
      if (entry.record) d.stats.recordsBroken++;
      entry.record = { kg: c.kg, m: c.m, pct: c.pct, traits: traits.slice(),
                       mutation: traits.length ? traits[0] : null, at: Date.now() };
    }
    if (c.kg > d.stats.biggestKg) { d.stats.biggestKg = c.kg; d.stats.biggestFish = c.id; }
    if (rank > d.stats.rarestRank) { d.stats.rarestRank = rank; d.stats.rarestFish = c.id; }

    /* the record board */
    const R = d.records;
    if (c.kg > R.biggestKg) { R.biggestKg = c.kg; R.biggestId = c.id; R.biggestTraits = traits.slice(); }
    if (c.value > R.richest) { R.richest = c.value; R.richestId = c.id; R.richestTraits = traits.slice(); }
    const combo = VF.traits.comboScore(traits);
    if (combo > R.bestCombo) { R.bestCombo = combo; R.bestComboId = c.id; R.bestComboTraits = traits.slice(); }
    if (c.m > R.longestSpecies) { R.longestSpecies = c.m; R.longestId = c.id; }

    VF.progression.addXp(c.xp);

    S.fight = null;
    S.lastResult = c;
    S.encounterActive = false;
    setState('landed');
    VF.bus.emit('fishing:landed', c);
    VF.save.save();
  }

  /* Objects go straight into the record and the journal; there is no fight to
     have lost and no fishdex entry to make. */
  function landTreasure(c, f) {
    const d = VF.state.data;
    const t = c.treasure;
    d.stats.treasuresFound++;
    d.treasures[t.id] = (d.treasures[t.id] | 0) + 1;
    if (t.journal) VF.journal.add(t.journal);
    if (t.token) d.caseTokens++;
    if (t.relic) VF.charms.grant(t.relic);
    S.fight = null;
    S.lastResult = c;
    S.encounterActive = false;
    setState('landed');
    VF.bus.emit('fishing:treasure', c);
    VF.save.save();
  }

  function lose(reason) {
    const c = S.fight ? S.fight.c : null;
    VF.state.data.stats.escapes++;
    VF.state.data.streak = 0;
    if (reason === 'snap') VF.state.data.stats.linesSnapped++;
    S.fight = null;
    S.encounterActive = false;
    setState('idle');
    VF.bus.emit('fishing:lost', { reason: reason, catch: c });
  }

  /* Player reels in without a fish on (cancel a cast). */
  function reelIn() {
    if (S.state === 'waiting' || S.state === 'bite') {
      S.pending = null;
      setState('idle');
      VF.bus.emit('fishing:reelin');
      return true;
    }
    return false;
  }

  /* Called once the catch modal is dismissed. */
  function resolveCatch() {
    if (S.state !== 'landed') return;
    S.lastResult = null;
    setState('idle');
    VF.bus.emit('fishing:ready');
  }

  /* ---------------------------------------------------------------- driver */

  function setState(s) {
    S.state = s;
    S.t = 0;
    VF.bus.emit('fishing:state', s);
  }

  function tick(dt) {
    S.t += dt;

    if (S.charging) {
      S.charge += dt / CAST_CHARGE_TIME;
      if (S.charge >= 1) { S.charge = 1; releaseCharge(); }
    }

    switch (S.state) {
      case 'casting':
        S.flight = U.clamp(S.t / CAST_FLIGHT_TIME, 0, 1);
        if (S.t >= CAST_FLIGHT_TIME) {
          VF.bus.emit('fishing:splash', { dist: S.castDist });
          beginWaiting();
        }
        break;

      case 'waiting':
        S.biteWait -= dt;
        S.nibbleTimer -= dt;
        if (S.nibbleTimer <= 0) {
          S.nibble = 1;
          S.nibbleTimer = VF.rng.g.range(1.6, 4.2);
          VF.bus.emit('fishing:nibble');
        }
        S.nibble = Math.max(0, S.nibble - dt * 1.8);
        if (S.biteWait <= 0) {
          const opts = S.pendingOpts;
          S.pendingOpts = null;
          triggerBite(opts);
        }
        break;

      case 'bite':
        if (S.t >= (S.biteWindow || BITE_WINDOW)) {
          S.pending = null;
          VF.bus.emit('fishing:missed');
          beginWaiting();
        }
        break;

      case 'reeling':
        // nothing opens over a fight by design, but if anything ever does the
        // fight waits rather than draining away behind it
        if (!VF.state.rt.panelOpen) updateFight(dt);
        break;

      case 'landed':
        // watchdog: the catch card owns this state, so if it is gone the catch
        // is resolved here rather than leaving the rod unusable
        if (S.t > 25 && !(VF.catchUI && VF.catchUI.isOpen())) resolveCatch();
        break;
    }
  }

  /* Encounters force the next bite to be something enormous. */
  function queueEncounter(opts) {
    if (S.state !== 'waiting') return false;
    S.encounterActive = true;
    S.pendingOpts = opts;
    S.biteWait = Math.min(S.biteWait, opts.delay || 3.2);
    return true;
  }

  /* Return the rod to a usable state from anywhere (used by save reset). */
  function hardReset() {
    S.charging = false;
    S.charge = 0;
    S.pending = null;
    S.pendingOpts = null;
    S.fight = null;
    S.lastResult = null;
    S.encounterActive = false;
    if (S.state !== 'idle') setState('idle');
  }

  VF.fishing = {
    S: S,
    hardReset: hardReset,
    tick: tick,
    canCast: canCast,
    beginCharge: beginCharge,
    releaseCharge: releaseCharge,
    hook: hook,
    setReeling: setReeling,
    reelIn: reelIn,
    resolveCatch: resolveCatch,
    queueEncounter: queueEncounter,
    state: function () { return S.state; },
    CAST_CHARGE_TIME: CAST_CHARGE_TIME,
    BITE_WINDOW: BITE_WINDOW,
    SWEET_FROM: SWEET_FROM
  };
})(window.VF = window.VF || {});

/* js/systems/catches.js */
/* VOID FISHING — what happens after the fish is on the bank.
   Sell for money, keep for the collection, or release for reputation. */
(function (VF) {
  'use strict';

  const KEEP_LIMIT = 200;

  function last() { return VF.fishing.S.lastResult; }

  function sell() {
    const c = last();
    if (!c) return null;
    const d = VF.state.data;
    VF.economy.earn(c.value, 'catch');
    d.stats.sold++;
    VF.audio.sell();
    VF.bus.emit('catch:sold', c);
    VF.fishing.resolveCatch();
    VF.save.save();
    return c.value;
  }

  function keep() {
    const c = last();
    if (!c) return false;
    const d = VF.state.data;
    d.kept.push({
      id: c.id, kg: c.kg, m: c.m, pct: c.pct,
      mutation: c.mutation, value: c.value, at: c.at, location: c.location
    });
    if (d.kept.length > KEEP_LIMIT) d.kept.shift();
    VF.audio.click();
    VF.bus.emit('catch:kept', c);
    VF.fishing.resolveCatch();
    VF.save.save();
    return true;
  }

  /* Releasing trades money for reputation, which quietly raises luck.
     Occasionally the void says thank you. */
  function release() {
    const c = last();
    if (!c) return null;
    const d = VF.state.data;
    const rank = VF.rarities.rank(c.rarity);
    const rep = 1 + rank * 2;
    d.reputation += rep;
    d.stats.released++;
    VF.audio.release();

    let bonus = null;
    const roll = VF.rng.g();
    if (roll < 0.07) {
      // a handful of whatever bait the player can currently use
      const usable = VF.bait.list.filter(function (b) { return !b.unlimited && d.level >= b.level; });
      if (usable.length) {
        const b = usable[Math.min(usable.length - 1, VF.rng.g.int(Math.max(0, usable.length - 3), usable.length - 1))];
        const n = b.pack;
        VF.bait.add(b.id, n);
        bonus = { kind: 'bait', text: n + ' x ' + b.name };
      }
    } else if (roll < 0.13) {
      const amt = Math.round(c.value * VF.rng.g.range(0.25, 0.6));
      if (amt > 0) { VF.economy.earn(amt, 'gratitude'); bonus = { kind: 'money', amount: amt }; }
    }

    VF.bus.emit('catch:released', { catch: c, rep: rep, bonus: bonus });
    VF.fishing.resolveCatch();
    VF.save.save();
    return { rep: rep, bonus: bonus };
  }

  /* Selling from the Bag, after the fact. */
  function sellKept(index) {
    const d = VF.state.data;
    if (index < 0 || index >= d.kept.length) return 0;
    const k = d.kept.splice(index, 1)[0];
    VF.economy.earn(k.value, 'kept');
    d.stats.sold++;
    VF.audio.sell();
    VF.save.save();
    return k.value;
  }

  function sellAllKept() {
    const d = VF.state.data;
    let total = 0;
    for (let i = 0; i < d.kept.length; i++) total += d.kept[i].value;
    if (!total) return 0;
    d.stats.sold += d.kept.length;
    d.kept.length = 0;
    VF.economy.earn(total, 'kept');
    VF.audio.sell();
    VF.save.save();
    return total;
  }

  VF.catches = { sell: sell, keep: keep, release: release, sellKept: sellKept, sellAllKept: sellAllKept, KEEP_LIMIT: KEEP_LIMIT };
})(window.VF = window.VF || {});

/* js/systems/achievements.js */
/* VOID FISHING — achievement checks. Cheap enough to run on any state change. */
(function (VF) {
  'use strict';

  let queue = [];
  let cooldown = 0;

  function check() {
    const d = VF.state.data;
    const list = VF.achievementData.list;
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      if (d.achievements[a.id]) continue;
      let ok = false;
      try { ok = a.test(d); } catch (e) { ok = false; }
      if (!ok) continue;
      d.achievements[a.id] = Date.now();
      if (a.reward) VF.economy.earn(a.reward, 'achievement');
      queue.push(a);
    }
    if (queue.length) VF.save.save();
  }

  /* Trickle notifications out so a burst of unlocks doesn't stack up at once. */
  function tick(dt) {
    cooldown -= dt;
    if (cooldown <= 0 && queue.length) {
      const a = queue.shift();
      cooldown = 1.1;
      VF.audio.achievement();
      VF.bus.emit('achievement:unlocked', a);
    }
  }

  function unlockedCount() { return Object.keys(VF.state.data.achievements).length; }

  VF.achievements = { check: check, tick: tick, unlockedCount: unlockedCount };
})(window.VF = window.VF || {});

/* js/systems/encounters.js */
/* VOID FISHING — the things that happen while you are just sitting there.
   Small ambient events keep the water alive; rare legendary encounters break
   the calm completely. Both are on long timers so neither wears out. */
(function (VF) {
  'use strict';

  const U = VF.util;

  let ambientTimer = 22;
  let encTimer = 75;
  let calm = 0;            // 0..1, how still the water has gone
  let calmTarget = 0;
  let encPhase = null;     // null | 'still' | 'reveal' | 'waiting'
  let encT = 0;
  let encData = null;

  const LINES = [
    'something is below you',
    'the water has stopped',
    'it noticed the light',
    'do not reel yet',
    'it has been waiting',
    'something is looking up'
  ];

  /* ------------------------------------------------------- ambient events */

  const AMBIENT = [
    { id: 'splash', w: 22, run: function () {
        const L = VF.scene.L;
        const x = L.w * VF.rng.g.range(0.15, 0.92);
        const y = L.horizonY + L.waterH * VF.rng.g.range(0.06, 0.4);
        VF.fx.ripple(x, y, L.w * 0.09, 2.4);
        VF.fx.ripple(x, y, L.w * 0.055, 1.7);
        VF.particles.burst(x, y, 9, { color: [200, 226, 245], angle: -Math.PI / 2, spread: 1.5,
          speedMin: 25, speedMax: 80, sizeMax: 2, grav: 190, lifeMax: 0.7 });
        VF.audio.splash(0.5);
      } },
    { id: 'shadow', w: 20, run: function () {
        VF.scene.addShadow({ x: -0.2, y: VF.rng.g.range(0.18, 0.55), sp: VF.rng.g.range(0.035, 0.075),
          size: VF.rng.g.range(0.9, 2.2), alpha: 0.42, life: 22, max: 22 });
      } },
    { id: 'glow', w: 16, run: function () {
        const loc = VF.locations.current();
        VF.scene.addShadow({ x: -0.15, y: VF.rng.g.range(0.2, 0.5), sp: VF.rng.g.range(0.02, 0.045),
          size: VF.rng.g.range(0.7, 1.4), alpha: 0.34, life: 26, max: 26, glow: loc.glow });
        VF.audio.nibble();
      } },
    { id: 'swarm', w: 11, run: function () {
        for (let i = 0; i < 6; i++) {
          VF.scene.addShadow({ x: -0.25 - i * 0.06, y: VF.rng.g.range(0.2, 0.45),
            sp: 0.10 + VF.rng.g() * 0.05, size: 0.24 + VF.rng.g() * 0.2, alpha: 0.30, life: 16, max: 16 });
        }
      } },
    { id: 'meteorfall', w: 9, run: function () {
        const L = VF.scene.L;
        VF.scene.spawnMeteor();
        setTimeout(function () {
          const x = L.w * VF.rng.g.range(0.3, 0.9);
          const y = L.horizonY + L.waterH * VF.rng.g.range(0.05, 0.25);
          VF.fx.ripple(x, y, L.w * 0.14, 3.0, [255, 220, 170], 1.8);
          VF.particles.burst(x, y, 16, { color: [255, 220, 160], angle: -Math.PI / 2, spread: 1.8,
            speedMin: 40, speedMax: 150, sizeMax: 2.4, grav: 200 });
          VF.audio.splash(0.85);
          VF.fx.shake(2.2);
        }, 900);
      } },
    { id: 'drift', w: 10, run: function () {
        const L = VF.scene.L;
        VF.scene.addShadow({ x: -0.1, y: VF.rng.g.range(0.1, 0.28), sp: 0.014,
          size: VF.rng.g.range(0.5, 0.9), alpha: 0.28, life: 60, max: 60 });
      } },
    { id: 'whisper', w: 7, run: function () {
        VF.audio.duck(0.5);
        VF.bus.emit('ui:whisper');
      } },
    { id: 'ringlight', w: 8, run: function () {
        const L = VF.scene.L;
        const x = L.w * VF.rng.g.range(0.3, 0.85);
        const y = L.horizonY + L.waterH * VF.rng.g.range(0.15, 0.5);
        const loc = VF.locations.current();
        const col = U.hexToRgb(loc.glow);
        for (let i = 0; i < 3; i++) {
          setTimeout(function () { VF.fx.ripple(x, y, L.w * 0.10, 3.2, col, 1.1); }, i * 420);
        }
        VF.audio.nibble();
      } }
  ];

  function fireAmbient() {
    const ev = VF.rng.weighted(AMBIENT, function (e) { return e.w; }, VF.rng.g);
    if (!ev) return;
    try { ev.run(); } catch (e) { console.warn('[encounters] ambient failed', e); }
    VF.bus.emit('ambient:event', ev.id);
  }

  /* ---------------------------------------------------- legendary encounter */

  function encounterChance() {
    const d = VF.state.data;
    const loc = VF.locations.current();
    const base = 0.050 + VF.locations.index(loc.id) * 0.012;
    return U.clamp(base * VF.weather.encounter() * (1 + VF.progression.luck() * 0.10), 0, 0.25);
  }

  function tryStartEncounter() {
    if (encPhase) return false;
    if (VF.fishing.state() !== 'waiting') return false;
    if (VF.fishing.S.encounterActive) return false;
    const loc = VF.locations.current();
    const li = VF.locations.index(loc.id);
    // the guaranteed tier scales with how deep you are fishing
    const minRank = U.clamp(3 + Math.floor(li / 2), 3, 6);
    encData = { minRank: minRank, line: VF.rng.g.pick(LINES) };
    encPhase = 'still';
    encT = 0;
    calmTarget = 1;
    VF.audio.encounter();
    VF.state.data.stats.encounters++;
    VF.bus.emit('encounter:start', encData);
    return true;
  }

  function abortEncounter() {
    encPhase = null; encData = null; calmTarget = 0;
    VF.bus.emit('encounter:end');
  }

  function updateEncounter(dt) {
    encT += dt;
    if (VF.fishing.state() !== 'waiting' && encPhase !== 'done') {
      if (VF.fishing.state() === 'reeling' || VF.fishing.state() === 'bite') {
        // handed over to the fight — fade the stillness out
        encPhase = 'done'; calmTarget = 0;
        VF.bus.emit('encounter:hooked');
        return;
      }
      abortEncounter();
      return;
    }
    if (encPhase === 'still' && encT > 1.6) {
      encPhase = 'reveal'; encT = 0;
      const loc = VF.locations.current();
      // something very large, and something faintly lit inside it
      VF.scene.addShadow({ x: -0.45, y: 0.34, sp: 0.062, size: 9.5, alpha: 0.86, life: 15, max: 15 });
      VF.scene.addShadow({ x: -0.40, y: 0.30, sp: 0.062, size: 3.2, alpha: 0.5, life: 15, max: 15, glow: loc.glow });
      VF.fx.pulse(0.7);
      VF.bus.emit('encounter:reveal', encData);
    } else if (encPhase === 'reveal' && encT > 2.6) {
      encPhase = 'waiting'; encT = 0;
      VF.fishing.queueEncounter({ minRank: encData.minRank, delay: 1.4, mutBoost: 0.8, rareBoost: 1.35 });
    } else if (encPhase === 'waiting' && encT > 9) {
      abortEncounter();
    } else if (encPhase === 'done' && encT > 2.5) {
      encPhase = null; encData = null;
      VF.bus.emit('encounter:end');
    }
  }

  /* ---------------------------------------------------------------- tick */

  function tick(dt) {
    calm = U.approach(calm, calmTarget, 0.06, dt);

    if (encPhase) { updateEncounter(dt); return; }

    const st = VF.fishing.state();
    ambientTimer -= dt;
    if (ambientTimer <= 0) {
      ambientTimer = VF.rng.g.range(26, 74) / U.clamp(VF.weather.encounter(), 0.5, 3);
      fireAmbient();
    }

    if (st === 'waiting') {
      encTimer -= dt;
      if (encTimer <= 0) {
        encTimer = VF.rng.g.range(80, 190);
        if (VF.rng.g() < encounterChance()) tryStartEncounter();
      }
    }
  }

  function reset() {
    ambientTimer = 22; encTimer = 75;

/* js/systems/wrong.js */
/* VOID FISHING — "something is wrong".
   Very rare, entirely harmless, and never explained. The water stops, the
   music cuts, the interface goes, something passes underneath, and then it is
   all exactly as it was. Nothing is dropped, nothing is lost, nothing is said. */
(function (VF) {
  'use strict';

  const U = VF.util;

  /* Long timers on purpose. If a player sees two in a session it has failed. */
  const MIN_GAP = 1500;      // seconds of play before another can happen
  const CHECK = 45;

  let sinceLast = 620;       // a while before the first is even possible
  let check = CHECK;
  let phase = null;          // null | 'still' | 'wrong' | 'shape' | 'restore'
  let t = 0;
  let intensity = 0;

  function chance() {
    const d = VF.state.data;
    // slightly likelier the deeper you are and the longer you have played
    const li = VF.locations.index(d.location);
    return U.clamp(0.02 + li * 0.006, 0, 0.09);
  }

  function begin() {
    if (phase) return false;
    phase = 'still';
    t = 0;
    sinceLast = 0;
    VF.state.data.stats.wrongEvents++;
    VF.bus.emit('wrong:begin');
    return true;
  }

  function tick(dt) {
    if (!phase) {
      sinceLast += dt;
      check -= dt;
      if (check <= 0) {
        check = CHECK;
        const st = VF.fishing.state();
        const quiet = st === 'idle' || st === 'waiting';
        if (quiet && sinceLast > MIN_GAP && !VF.encounters.active() && VF.rng.g() < chance()) begin();
      }
      intensity = Math.max(0, intensity - dt * 1.5);
      return;
    }

    t += dt;
    if (phase === 'still') {
      intensity = U.clamp(t / 1.2, 0, 1);
      if (t > 1.4) { phase = 'wrong'; t = 0; VF.bus.emit('wrong:peak'); }
    } else if (phase === 'wrong') {
      intensity = 1;
      if (t > 3.2) { phase = 'shape'; t = 0; VF.bus.emit('wrong:shape'); }
    } else if (phase === 'shape') {
      intensity = 1;
      if (t > 5.0) { phase = 'restore'; t = 0; VF.bus.emit('wrong:restore'); }
    } else if (phase === 'restore') {
      intensity = U.clamp(1 - t / 2.6, 0, 1);
      if (t > 2.8) {
        phase = null; t = 0; intensity = 0;
        VF.journal.add('firstwrong');
        VF.bus.emit('wrong:end');
        VF.save.save();
      }
    }
  }

  function reset() { phase = null; t = 0; intensity = 0; }

  VF.wrong = {
    tick: tick, begin: begin, reset: reset,
    active: function () { return !!phase; },
    phase: function () { return phase; },
    intensity: function () { return intensity; }
  };
})(window.VF = window.VF || {});

/* js/systems/caseOpen.js */
/* VOID FISHING — buying and opening a case.
   The roll is decided up front and the animation is then arranged around it,
   which is the only honest way to build one of these. */
(function (VF) {
  'use strict';

  function canBuy(caseId) {
    const c = VF.cases.get(caseId);
    const d = VF.state.data;
    if (!c) return { ok: false, why: 'missing' };
    if (d.level < c.level) return { ok: false, why: 'level' };
    if (d.caseTokens > 0) return { ok: true, free: true };
    if (!VF.economy.canAfford(c.cost)) return { ok: false, why: 'money' };
    return { ok: true };
  }

  /* Returns everything the animation needs: the strip, where the winner sits,
     and whether it was already owned. */
  function buy(caseId) {
    const c = VF.cases.get(caseId);
    const d = VF.state.data;
    const check = canBuy(caseId);
    if (!check.ok) return null;

    if (check.free) d.caseTokens--;
    else if (!VF.economy.spend(c.cost, 'case')) return null;

    const result = VF.cases.rollFrom(c, VF.rng.g);
    const strip = VF.cases.buildStrip(c, result, VF.rng.g);
    const dupe = VF.cosmetics.owned(result.item.id);
    // duplicates are refunded, so a case is never simply wasted
    const refund = dupe ? Math.round(c.cost * refundRate(result.rarity)) : 0;

    d.cases[caseId] = (d.cases[caseId] | 0) + 1;
    d.stats.casesOpened++;
    if (!dupe) VF.cosmetics.grant(result.item.id);
    if (refund) VF.economy.earn(refund, 'duplicate');

    VF.save.save();
    return {
      caseDef: c, item: result.item, rarity: result.rarity,
      strip: strip.strip, winIndex: strip.winIndex,
      duplicate: dupe, refund: refund
    };
  }

  function refundRate(rarity) {
    return { common: 0.30, uncommon: 0.40, rare: 0.55, epic: 0.75,
             legendary: 1.10, mythic: 1.80 }[rarity] || 0.3;
  }

  VF.caseOpen = { buy: buy, canBuy: canBuy, refundRate: refundRate };
})(window.VF = window.VF || {});

/* js/systems/visit.js */
/* VOID FISHING — going to see somebody.

   Talking used to be a panel. Now the rod goes down, you stand up, they walk
   in along the shore, and the two of you have the conversation where the
   player can see it, one line at a time at the bottom of the frame. */
(function (VF) {
  'use strict';

  const U = VF.util;

  const S = {
    phase: 'idle',        // idle | out | talk | back
    npc: null,
    lines: [],
    index: 0,
    lineT: 0,             // how long the current line has been up
    walk: 0,              // 0..1 how much stride the figures have
    k: 0,                 // 0..1 progress along the current walk
    anglerK: 0,
    result: null,
    fade: 0               // caption opacity
  };

  const WALK_OUT = 1.45, WALK_BACK = 1.25;
  const MIN_LINE = 0.55;  // a line cannot be skipped instantly

  function canVisit() {
    const st = VF.fishing.S.state;
    return st === 'idle' || st === 'waiting' || st === 'bite';
  }

  function start(id) {
    if (S.phase !== 'idle') return false;
    if (!canVisit()) {
      VF.toast.show('reel in first — you cannot walk away mid-fight', null, 2600);
      return false;
    }
    const res = VF.npcs.talk(id, { defer: true });
    if (!res) return false;

    VF.fishing.hardReset();
    S.phase = 'out';
    S.npc = res.npc;
    S.result = res;
    S.lines = res.lines.slice();
    S.index = 0;
    S.lineT = 0;
    S.k = 0;
    S.anglerK = 0;
    S.walk = 0;
    S.fade = 0;
    VF.bus.emit('visit:start', { npc: res.npc });
    VF.audio.click();
    return true;
  }

  /* Click, tap or space moves the conversation on. */
  function advance() {
    if (S.phase !== 'talk') return false;
    if (S.lineT < MIN_LINE) return true;      // swallow the input, do not leave
    S.index++;
    S.lineT = 0;
    if (S.index >= S.lines.length) {
      S.phase = 'back';
      S.k = 0;
      // whatever they were going to give you, they give you now
      if (S.result && S.result.commit) S.result.commit();
      VF.audio.back();
      VF.bus.emit('visit:end', { npc: S.npc });
    } else {
      VF.audio.click();
    }
    return true;
  }

  /* Walking off early still counts — you heard them, you just did not stay. */
  function leave() {
    if (S.phase === 'idle' || S.phase === 'back') return;
    S.phase = 'back';
    S.k = 0;
    if (S.result && S.result.commit) S.result.commit();
    VF.bus.emit('visit:end', { npc: S.npc });
  }

  function tick(dt) {
    if (S.phase === 'idle') return;
    if (S.phase === 'out') {
      S.k = Math.min(1, S.k + dt / WALK_OUT);
      S.walk = U.clamp(S.k < 0.12 ? S.k / 0.12 : (S.k > 0.90 ? (1 - S.k) / 0.10 : 1), 0, 1);
      if (S.k >= 1) { S.phase = 'talk'; S.walk = 0; S.lineT = 0; }
    } else if (S.phase === 'talk') {
      S.lineT += dt;
      S.fade = U.clamp(S.fade + dt * 3.2, 0, 1);
    } else if (S.phase === 'back') {
      S.fade = U.clamp(S.fade - dt * 4.5, 0, 1);
      S.k = Math.min(1, S.k + dt / WALK_BACK);
      S.walk = U.clamp(S.k < 0.12 ? S.k / 0.12 : (S.k > 0.88 ? (1 - S.k) / 0.12 : 1), 0, 1);
      if (S.k >= 1) {
        S.phase = 'idle';
        S.walk = 0;
        S.npc = null;
        S.lines = [];
        VF.bus.emit('visit:done', {});
        VF.achievements.check();
        VF.save.save();
      }
    }
  }

  function line() {
    if (S.phase !== 'talk') return null;
    return S.lines[S.index] || null;
  }

  function hardReset() {
    S.phase = 'idle'; S.npc = null; S.lines = []; S.index = 0;
    S.k = 0; S.walk = 0; S.fade = 0; S.result = null;
  }

  VF.visit = {
    S: S,
    start: start, advance: advance, leave: leave, tick: tick,
    line: line, canVisit: canVisit, hardReset: hardReset,
    active: function () { return S.phase !== 'idle'; },
    talking: function () { return S.phase === 'talk'; },
    npc: function () { return S.npc; }
  };
})(window.VF = window.VF || {});

/* VOID FISHING — colour for the scene.
   Location supplies base tones; the time of day and the weather are layered on
   top as continuous interpolations so the sky never snaps between states. */
(function (VF) {
  'use strict';

  const U = VF.util;

  /* Keyframes around the day cycle. Interpolated, never switched. */
  const KEYS = [
    { at: 0.00, tint: '#ffb37a', k: 0.26, bright: 0.62, star: 0.42, glow: '#ffc48a', glowSize: 1.15, warm: 0.7 },
    { at: 0.18, tint: '#cfe2f5', k: 0.16, bright: 0.94, star: 0.10, glow: '#eaf4ff', glowSize: 0.85, warm: 0.3 },
    { at: 0.34, tint: '#bcd8f0', k: 0.13, bright: 1.00, star: 0.04, glow: '#ffffff', glowSize: 0.75, warm: 0.25 },
    { at: 0.50, tint: '#ff8f60', k: 0.30, bright: 0.66, star: 0.34, glow: '#ff9c66', glowSize: 1.25, warm: 0.85 },
    { at: 0.62, tint: '#7a5a9a', k: 0.26, bright: 0.40, star: 0.80, glow: '#c8a8e8', glowSize: 1.05, warm: 0.45 },
    { at: 0.80, tint: '#2c3c6e', k: 0.22, bright: 0.28, star: 1.00, glow: '#c8d8ff', glowSize: 1.00, warm: 0.1 },
    { at: 1.00, tint: '#ffb37a', k: 0.26, bright: 0.62, star: 0.42, glow: '#ffc48a', glowSize: 1.15, warm: 0.7 }
  ];

  const rgbCache = Object.create(null);
  function rgb(hex) { return rgbCache[hex] || (rgbCache[hex] = U.hexToRgb(hex)); }

  function dayKey(cycle) {
    let a = KEYS[0], b = KEYS[KEYS.length - 1];
    for (let i = 0; i < KEYS.length - 1; i++) {
      if (cycle >= KEYS[i].at && cycle <= KEYS[i + 1].at) { a = KEYS[i]; b = KEYS[i + 1]; break; }
    }
    const t = U.smoothstep(U.invLerp(a.at, b.at, cycle));
    return {
      tint: U.mixRgb(rgb(a.tint), rgb(b.tint), t),
      k: U.lerp(a.k, b.k, t),
      bright: U.lerp(a.bright, b.bright, t),
      star: U.lerp(a.star, b.star, t),
      glow: U.mixRgb(rgb(a.glow), rgb(b.glow), t),
      glowSize: U.lerp(a.glowSize, b.glowSize, t),
      warm: U.lerp(a.warm, b.warm, t)

  }

  const P = {
    skyTop: [0, 0, 0], skyBot: [0, 0, 0],
    waterTop: [0, 0, 0], waterBot: [0, 0, 0],
    glow: [255, 255, 255], glowSize: 1,
    fog: [0, 0, 0], fogAmt: 0,
    star: [255, 255, 255], starAlpha: 1,
    accent: [255, 255, 255],
    bright: 1, warm: 0

    let c = U.mixRgb(base, day.tint, day.k);
    c = c.map(function (v) { return v * U.lerp(1, day.bright, 0.78) * k; });
    if (wx) c = U.mixRgb(c, rgb(wx.c), wx.k * 0.30);
    return c;
  }

  function update() {
    const loc = VF.locations.current();
    const day = dayKey(VF.time.cycle());
    const wx = VF.weather.tint();
    const light = VF.weather.light();

    P.skyTop = apply(rgb(loc.sky[0]), day, wx, light);
    P.skyBot = apply(rgb(loc.sky[1]), day, wx, light);
    P.waterTop = apply(rgb(loc.water[0]), day, wx, light * 0.92);
    P.waterBot = apply(rgb(loc.water[1]), day, wx, light * 0.86);
    P.glow = U.mixRgb(rgb(loc.glow), day.glow, 0.45);
    P.glowSize = day.glowSize;
    P.fog = U.mixRgb(rgb(loc.fog), day.tint, day.k * 0.6);
    P.fogAmt = U.clamp(loc.fogAmt + VF.weather.fog() * 0.55, 0, 1);
    P.star = rgb(loc.starTint);
    P.starAlpha = U.clamp(day.star * loc.stars * U.lerp(1, 0.35, VF.weather.fog()), 0, 1);

    P.bright = day.bright * light;

})(window.VF = window.VF || {});

/* VOID FISHING — pooled particle system.

(function (VF) {
  'use strict';

  const U = VF.util;
  const MAX = 900;

  const p = {
    x: new Float32Array(MAX), y: new Float32Array(MAX),
    vx: new Float32Array(MAX), vy: new Float32Array(MAX),
    life: new Float32Array(MAX), max: new Float32Array(MAX),
    size: new Float32Array(MAX), rot: new Float32Array(MAX),
    r: new Uint8Array(MAX), g: new Uint8Array(MAX), b: new Uint8Array(MAX),
    a: new Float32Array(MAX), kind: new Uint8Array(MAX), drag: new Float32Array(MAX),
    grav: new Float32Array(MAX)

      let worst = 0, wv = Infinity;

        const j = (Math.random() * count) | 0;
        if (p.life[j] < wv) { wv = p.life[j]; worst = j; }
      }
      release(worst);
    }
    const i = count++;
    p.x[i] = o.x; p.y[i] = o.y;
    p.vx[i] = o.vx || 0; p.vy[i] = o.vy || 0;
    p.max[i] = p.life[i] = o.life || 1;
    p.size[i] = o.size || 2;
    p.rot[i] = o.rot || 0;
    const c = o.color || [255, 255, 255];
    p.r[i] = c[0]; p.g[i] = c[1]; p.b[i] = c[2];
    p.a[i] = o.alpha === undefined ? 1 : o.alpha;
    p.kind[i] = o.kind || 0;
    p.drag[i] = o.drag === undefined ? 0.6 : o.drag;
    p.grav[i] = o.grav || 0;

  }

    const last = --count;

      p.x[i] = p.x[last]; p.y[i] = p.y[last]; p.vx[i] = p.vx[last]; p.vy[i] = p.vy[last];
      p.life[i] = p.life[last]; p.max[i] = p.max[last]; p.size[i] = p.size[last];
      p.rot[i] = p.rot[last]; p.r[i] = p.r[last]; p.g[i] = p.g[last]; p.b[i] = p.b[last];

      spawn({
        x: x + (Math.random() - 0.5) * (opts.jitter || 4),
        y: y + (Math.random() - 0.5) * (opts.jitter || 4),
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: U.lerp(opts.lifeMin || 0.35, opts.lifeMax || 0.9, Math.random()),
        size: U.lerp(opts.sizeMin || 1, opts.sizeMax || 3, Math.random()),

        vx: (Math.random() - 0.5) * 9, vy: -3 - Math.random() * 8,

    burst: burst, ambient: ambient, clearKind: clearKind, countOf: countOf,

        d.moveTo(L * 0.16, -H * 0.72);
        d.quadraticCurveTo(-L * 0.02, -H * 1.5, -L * 0.24, -H * 0.68);
        d.closePath();
        paintFin(ctx, d, col, alpha, { col: rayCol, w: rw, n: 6,
          x: -L * 0.04, y: -H * 0.68, len: H * 1.1, a0: -2.3, a1: -0.9 });
        const an = new Path2D();
        an.moveTo(L * 0.10, H * 0.62);
        an.quadraticCurveTo(L * 0.00, H * 1.25, -L * 0.16, H * 0.60);
        an.closePath();
        paintFin(ctx, an, col, alpha, { col: rayCol, w: rw, n: 5,
          x: -L * 0.03, y: H * 0.60, len: H * 0.9, a0: 0.9, a1: 2.3 });
        break;
      }
    }
    ctx.globalAlpha = 1;
  }

  /* ------------------------------------------------------------- extras */

  function drawExtras(ctx, list, L, H, sway, art, rnd, tm) {
    const acc = art.c3;
    const accRgb = art.r3 || U.hexToRgb(art.c3);
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      ctx.save();
      switch (e) {
        case 'tentacles': {
          ctx.strokeStyle = acc; ctx.globalAlpha = 0.6; ctx.lineCap = 'round';
          const n = 6;
          for (let j = 0; j < n; j++) {
            const x = U.lerp(-L * 0.38, L * 0.38, j / (n - 1));
            const len = H * (1.4 + rnd() * 1.9);
            ctx.lineWidth = Math.max(1, L * 0.014);
            ctx.beginPath();
            ctx.moveTo(x, H * 0.55);
            ctx.quadraticCurveTo(x + Math.sin(sway * 1.4 + j) * L * 0.10, H * 0.55 + len * 0.55,
                                 x + Math.sin(sway * 1.9 + j * 1.7) * L * 0.16, H * 0.55 + len);
            ctx.stroke();
          }
          break;
        }
        case 'threads': {
          ctx.strokeStyle = acc; ctx.globalAlpha = 0.34; ctx.lineWidth = Math.max(0.7, L * 0.006);
          for (let j = 0; j < 7; j++) {
            const a0 = rnd() * TAU;
            const r0 = H * (0.5 + rnd() * 0.5);
            ctx.beginPath();
            ctx.moveTo(Math.cos(a0) * L * 0.3, Math.sin(a0) * r0);
            ctx.quadraticCurveTo(Math.cos(a0) * L * 0.6, Math.sin(a0) * r0 * 2.1 + Math.sin(sway + j) * 5,
                                 Math.cos(a0) * L * 0.5 - L * 0.3, Math.sin(a0) * r0 * 2.6);
            ctx.stroke();
          }
          break;
        }
        case 'halo': {
          ctx.strokeStyle = acc; ctx.globalAlpha = 0.5;
          ctx.lineWidth = Math.max(1, L * 0.012);
          ctx.beginPath();
          ctx.ellipse(L * 0.06, 0, L * 0.62, H * 1.5, Math.sin(tm * 0.3) * 0.15, 0, TAU);
          ctx.stroke();
          ctx.globalAlpha = 0.2;
          ctx.beginPath();
          ctx.ellipse(L * 0.06, 0, L * 0.74, H * 1.8, -Math.sin(tm * 0.24) * 0.2, 0, TAU);
          ctx.stroke();
          break;
        }
        case 'rings': {
          ctx.strokeStyle = acc; ctx.globalAlpha = 0.42;
          ctx.lineWidth = Math.max(1, L * 0.010);
          for (let j = 0; j < 3; j++) {
            ctx.beginPath();
            ctx.ellipse(0, 0, L * (0.34 + j * 0.14), H * (0.30 + j * 0.12),
                        tm * (0.2 + j * 0.1), 0, TAU);
            ctx.stroke();
          }
          break;
        }
        case 'crystals': {
          ctx.fillStyle = acc; ctx.globalAlpha = 0.72;
          for (let j = 0; j < 5; j++) {
            const x = U.lerp(-L * 0.3, L * 0.3, rnd());
            const y = (rnd() - 0.5) * H * 1.1;
            const s = L * (0.05 + rnd() * 0.07);
            ctx.beginPath();
            ctx.moveTo(x, y - s * 1.7); ctx.lineTo(x + s * 0.6, y);
            ctx.lineTo(x, y + s * 1.2); ctx.lineTo(x - s * 0.6, y);
            ctx.closePath(); ctx.fill();
          }
          break;
        }
        case 'spine': {
          ctx.strokeStyle = acc; ctx.globalAlpha = 0.75;
          ctx.lineWidth = Math.max(1, L * 0.011);
          for (let j = 0; j < 8; j++) {
            const k = j / 8;
            const x = U.lerp(L * 0.30, -L * 0.30, k);
            ctx.beginPath();
            ctx.moveTo(x, -H * 0.68);
            ctx.lineTo(x - L * 0.02, -H * (1.05 + Math.sin(k * 4) * 0.25));
            ctx.stroke();
          }
          break;
        }
        case 'teeth': {
          // an open jaw at the head: dark inside, teeth along both edges
          const mx = L * 0.50, back = L * 0.14;
          ctx.globalAlpha = 0.7;
          ctx.fillStyle = 'rgba(6,4,11,0.7)';
          ctx.beginPath();
          ctx.moveTo(mx, -H * 0.20);
          ctx.quadraticCurveTo(back + L * 0.08, -H * 0.10, back, H * 0.04);
          ctx.quadraticCurveTo(back + L * 0.08, H * 0.26, mx, H * 0.40);
          ctx.closePath(); ctx.fill();
          ctx.globalAlpha = 0.95;
          ctx.fillStyle = '#f4efe2';
          const nT = 8;
          for (let j = 0; j < nT; j++) {
            const t = j / (nT - 1);
            const xt = U.lerp(mx - L * 0.03, back + L * 0.04, t);
            const yTop = U.lerp(-H * 0.18, H * 0.02, t);
            const yBot = U.lerp(H * 0.37, H * 0.05, t);
            const sz = L * 0.015 * (1 - t * 0.45);
            ctx.beginPath();
            ctx.moveTo(xt - sz, yTop); ctx.lineTo(xt + sz, yTop);
            ctx.lineTo(xt, yTop + sz * 2.4); ctx.closePath(); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(xt - sz, yBot); ctx.lineTo(xt + sz, yBot);
            ctx.lineTo(xt, yBot - sz * 2.4); ctx.closePath(); ctx.fill();
          }
          break;
        }
        case 'lantern': {
          const lx = L * 0.66, ly = -H * 1.15;
          ctx.strokeStyle = art.c2; ctx.globalAlpha = 0.85;
          ctx.lineWidth = Math.max(1, L * 0.012);
          ctx.beginPath();
          ctx.moveTo(L * 0.30, -H * 0.62);
          ctx.quadraticCurveTo(L * 0.62, -H * 1.5, lx, ly);
          ctx.stroke();
          const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, L * 0.30);
          g.addColorStop(0, acc);
          g.addColorStop(0.3, U.rgbToCss(accRgb, 0.5));
          g.addColorStop(1, U.rgbToCss(accRgb, 0));
          ctx.globalAlpha = 0.9; ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(lx, ly, L * 0.30, 0, TAU); ctx.fill();
          ctx.fillStyle = acc; ctx.globalAlpha = 1;
          ctx.beginPath(); ctx.arc(lx, ly, L * 0.045, 0, TAU); ctx.fill();
          break;
        }
        case 'horns': {
          ctx.fillStyle = acc; ctx.globalAlpha = 0.9;
          for (let j = -1; j <= 1; j += 2) {
            ctx.beginPath();
            ctx.moveTo(L * 0.18, -H * 0.7);
            ctx.quadraticCurveTo(L * (0.30 + j * 0.06), -H * 1.9, L * (0.40 + j * 0.10), -H * 2.1);
            ctx.quadraticCurveTo(L * 0.30, -H * 1.5, L * 0.26, -H * 0.68);
            ctx.closePath(); ctx.fill();
          }
          break;
        }
        case 'antenna': {
          ctx.strokeStyle = acc; ctx.globalAlpha = 0.8;
          ctx.lineWidth = Math.max(0.8, L * 0.008);
          for (let j = -1; j <= 1; j += 2) {
            ctx.beginPath();
            ctx.moveTo(L * 0.40, H * 0.10 * j);
            ctx.quadraticCurveTo(L * 0.62, H * 0.5 * j, L * 0.78, H * 0.28 * j + Math.sin(sway + j) * 4);
            ctx.stroke();
          }
          break;
        }
        case 'runes': {
          ctx.strokeStyle = acc; ctx.globalAlpha = 0.55;
          ctx.lineWidth = Math.max(0.8, L * 0.008);
          for (let j = 0; j < 5; j++) {
            const x = U.lerp(-L * 0.28, L * 0.30, rnd());
            const y = (rnd() - 0.5) * H * 1.0;
            const s = L * 0.05;
            ctx.beginPath();
            ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y - s * 0.3);
            ctx.lineTo(x - s * 0.4, y + s * 0.4); ctx.lineTo(x + s * 0.7, y + s);
            ctx.stroke();
          }
          break;
        }
        case 'chains': {
          ctx.strokeStyle = acc; ctx.globalAlpha = 0.5;
          ctx.lineWidth = Math.max(1, L * 0.013);
          for (let j = 0; j < 3; j++) {
            const y0 = (j - 1) * H * 0.5;
            ctx.beginPath();
            for (let k = 0; k <= 8; k++) {
              const x = U.lerp(L * 0.40, -L * 0.46, k / 8);
              ctx.lineTo(x, y0 + Math.sin(k * 1.3 + sway + j) * H * 0.25);
            }
            ctx.stroke();
          }
          break;
        }
        case 'bubbles': {
          ctx.strokeStyle = acc; ctx.globalAlpha = 0.4;
          ctx.lineWidth = Math.max(0.7, L * 0.006);
          for (let j = 0; j < 6; j++) {
            const x = L * 0.42 + rnd() * L * 0.35;
            const y = -H * (0.4 + rnd() * 1.6) - (tm * 12 % (H * 2));
            ctx.beginPath(); ctx.arc(x, y, L * (0.012 + rnd() * 0.022), 0, TAU); ctx.stroke();
          }
          break;
        }
        case 'fracture': {
          ctx.strokeStyle = acc; ctx.globalAlpha = 0.7;
          ctx.lineWidth = Math.max(0.9, L * 0.009);
          for (let j = 0; j < 4; j++) {
            let x = (rnd() - 0.5) * L * 0.7, y = (rnd() - 0.5) * H * 1.2;
            ctx.beginPath(); ctx.moveTo(x, y);
            for (let k = 0; k < 4; k++) {
              x += (rnd() - 0.5) * L * 0.28; y += (rnd() - 0.5) * H * 0.7;
              ctx.lineTo(x, y);
            }
            ctx.stroke();
          }
          break;
        }
        case 'stars': {
          ctx.fillStyle = acc; ctx.globalAlpha = 0.85;
          for (let j = 0; j < 9; j++) {
            const x = (rnd() - 0.5) * L * 0.80;
            const y = (rnd() - 0.5) * H * 1.5;
            const s = L * (0.008 + rnd() * 0.018);
            ctx.beginPath(); ctx.arc(x, y, s, 0, TAU); ctx.fill();
          }
          break;
        }
        case 'wings': {
          ctx.fillStyle = acc; ctx.globalAlpha = 0.30;
          const f = Math.sin(tm * 3) * 0.25 + 1;
          for (let j = -1; j <= 1; j += 2) {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(-L * 0.2, j * H * 2.6 * f, L * 0.34, j * H * 1.9 * f);
            ctx.quadraticCurveTo(L * 0.2, j * H * 0.8, 0, 0);
            ctx.fill();
          }
          break;
        }
        case 'mask': {
          ctx.fillStyle = acc; ctx.globalAlpha = 0.8;
          ctx.beginPath();
          ctx.moveTo(L * 0.46, -H * 0.5);
          ctx.lineTo(L * 0.14, -H * 0.62);
          ctx.lineTo(L * 0.08, H * 0.42);
          ctx.lineTo(L * 0.44, H * 0.32);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#000'; ctx.globalAlpha = 0.9;
          ctx.beginPath(); ctx.ellipse(L * 0.32, -H * 0.14, L * 0.05, H * 0.10, 0, 0, TAU); ctx.fill();
          ctx.beginPath(); ctx.ellipse(L * 0.16, -H * 0.10, L * 0.04, H * 0.09, 0, 0, TAU); ctx.fill();
          break;
        }
        case 'eyes_extra': {
          ctx.fillStyle = '#f6f2e6'; ctx.globalAlpha = 0.92;
          for (let j = 0; j < 5; j++) {
            const x = (rnd() - 0.5) * L * 0.65;
            const y = (rnd() - 0.5) * H * 1.15;
            const s = L * (0.020 + rnd() * 0.020);
            ctx.beginPath(); ctx.arc(x, y, s, 0, TAU); ctx.fill();
            ctx.fillStyle = '#0a0810';
            ctx.beginPath(); ctx.arc(x, y, s * 0.5, 0, TAU); ctx.fill();
            ctx.fillStyle = '#f6f2e6';
          }
          break;
        }
      }
      ctx.restore();
    }
  }

  /* --------------------------------------------------- surface detail
     Everything here paints inside the already-clipped body path. */

  /* Rows of overlapping arcs. Reads as scales without costing a texture. */
  function scaleTexture(ctx, L, H, col, rnd, dense) {
    const step = L * (dense ? 0.042 : 0.058);
    const r = step * 0.85;
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(0.4, L * 0.0035);
    ctx.globalAlpha = 0.13;
    let row = 0;
    for (let y = -H * 1.05; y < H * 1.05; y += step * 0.68) {
      const off = (row++ % 2) * step * 0.5;
      ctx.beginPath();
      for (let x = -L * 0.55 + off; x < L * 0.55; x += step) {
        ctx.moveTo(x - r * 0.5, y);
        ctx.arc(x, y, r * 0.5, Math.PI * 0.15, Math.PI * 0.85);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  /* The pale seam along the flank that most fish carry. */
  function lateralLine(ctx, L, H, col) {
    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.22;
    ctx.lineWidth = Math.max(0.6, L * 0.005);
    ctx.beginPath();
    ctx.moveTo(L * 0.38, -H * 0.12);
    ctx.quadraticCurveTo(0, H * 0.06, -L * 0.42, H * 0.02);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  /* Operculum: the plate behind the head. */
  function gillPlate(ctx, L, H, col) {
    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.30;
    ctx.lineWidth = Math.max(0.6, L * 0.006);
    ctx.beginPath();
    ctx.moveTo(L * 0.30, -H * 0.70);
    ctx.quadraticCurveTo(L * 0.21, 0, L * 0.30, H * 0.62);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function mouthLine(ctx, L, H, col) {
    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.42;
    ctx.lineWidth = Math.max(0.6, L * 0.006);
    ctx.beginPath();
    ctx.moveTo(L * 0.52, H * 0.02);
    ctx.quadraticCurveTo(L * 0.44, H * 0.16, L * 0.34, H * 0.12);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  /* A pectoral fin sitting in front of the flank, which is what gives a fish
     its sense of depth rather than reading as a flat cutout. */
  function pectoral(ctx, L, H, col, accent, sway) {
    const p = new Path2D();
    p.moveTo(L * 0.20, H * 0.12);
    p.quadraticCurveTo(L * 0.10, H * 0.78 + sway * 2, -L * 0.04, H * 0.56);
    p.quadraticCurveTo(L * 0.08, H * 0.34, L * 0.20, H * 0.12);
    p.closePath();
    paintFin(ctx, p, col, 0.38, { col: accent, w: Math.max(0.5, L * 0.004), n: 4,
      x: L * 0.19, y: H * 0.14, len: H * 0.8, a0: 1.3, a1: 2.4 });
    ctx.globalAlpha = 1;
  }

  function eye(ctx, x, y, r, iris) {
    ctx.fillStyle = '#f7f3e8';
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.fillStyle = iris;
    ctx.beginPath(); ctx.arc(x + r * 0.14, y, r * 0.74, 0, TAU); ctx.fill();
    ctx.fillStyle = '#08060e';
    ctx.beginPath(); ctx.arc(x + r * 0.20, y, r * 0.42, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath(); ctx.arc(x - r * 0.30, y - r * 0.32, r * 0.24, 0, TAU); ctx.fill();
  }

  /* Bodies built from panels rather than scales — the strange ones. */
  const SCALED = { torpedo: 1, round: 1, eel: 1, serpent: 1, shard: 1, crustacean: 1, whale: 1 };

  /* --------------------------------------------------------------- main */

  /* Traits stack: each one tints the body further, the rarest one hardest, so a
     four-trait fish is visibly the sum of its parts. */
  function palette(art, traits) {
    let c1 = U.hexToRgb(art.c1), c2 = U.hexToRgb(art.c2), c3 = U.hexToRgb(art.c3);
    const ids = !traits ? [] : (typeof traits === 'string' ? [traits] : traits);
    let top = null;
    const fx = { glow: 0, shimmer: 0, metal: 0, facet: 0, crust: 0, fracture: 0, darken: 0 };

    for (let i = 0; i < ids.length; i++) {
      const m = VF.traits.get(ids[i]);
      if (!m || !m.color) continue;
      if (!top || m.tier > top.tier) top = m;
      const col = U.hexToRgb(m.color);
      // later, rarer traits pull the body further toward their own colour
      const w = 0.26 + m.tier * 0.055;
      c1 = U.mixRgb(c1, col, w);
      c2 = U.mixRgb(c2, col, w * 0.72);
      c3 = U.mixRgb(c3, U.hexToRgb(m.tint || m.color), w * 0.85);
      for (const k in fx) if (m[k]) fx[k] = Math.max(fx[k], m[k]);
    }
    if (fx.darken) { c1 = U.shade(c1, -fx.darken * 0.45); c2 = U.shade(c2, -fx.darken * 0.5); }

    // both forms: the css strings for anything that just needs a fill, and the
    // raw triples for anything that has to keep mixing. Running the strings
    // back through hexToRgb parses "rgb(…)" as hex and yields black, which is
    // exactly what used to happen to every body on screen.
    return {
      c1: U.rgbToCss(c1), c2: U.rgbToCss(c2), c3: U.rgbToCss(c3),
      r1: c1, r2: c2, r3: c3,
      mut: top, traits: ids, fx: fx
    };
  }

  /* size = half the body length in px. */
  function draw(ctx, fish, size, opts) {
    opts = opts || {};
    const art = fish.art;
    const tm = opts.time === undefined ? 0 : opts.time;
    const sway = Math.sin(tm * 2.1) * 0.55;
    const rnd = VF.rng.make(hash(fish.id));
    const L = size * 2;
    const pal = palette(art, opts.traits || opts.mutation);
    const glow = Math.min(1.4, art.glow * (pal.mut ? 1.25 : 1) + pal.fx.glow * 0.7);
    const j = jitter(fish.id);
    // below roughly 22px the fine detail is sub-pixel noise, so skip it
    const detail = opts.detail === undefined ? size >= 22 : opts.detail;

    ctx.save();
    // per-species proportion jitter, so two fish sharing a body type are never
    // the same fish in a different colour
    ctx.scale(j.x, j.y);

    // outer glow
    if (glow > 0.05) {
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, L * 0.95);
      g.addColorStop(0, U.rgbToCss(pal.r3, 0.30 * glow));
      g.addColorStop(0.5, U.rgbToCss(pal.r3, 0.10 * glow));
      g.addColorStop(1, U.rgbToCss(pal.r3, 0));
      ctx.fillStyle = g;
      ctx.fillRect(-L, -L, L * 2, L * 2);
    }

    // fins go behind the body
    const probe = VF.rng.make(hash(fish.id));
    const H0 = measureH(art.body, L);
    // a ray's body already is its wings, so a wing fin would only double it up
    if (!(art.body === 'ray' && art.fin === 'wing')) {
      drawFins(ctx, art.fin, L, H0, sway, pal.c2, 0.85, pal.c3, pal.r2, pal.r3);
    }

    // body
    const H = bodyPath(ctx, art.body, L, sway, probe);
    const c1 = pal.r1, c2 = pal.r2, c3 = pal.r3;
    const rnd2 = VF.rng.make(hash(fish.id) ^ 0x1234);

    /* Counter-shading: dark along the back, pale along the belly. This is the
       single thing that stops a fish reading as a flat coloured shape. */
    const bg = ctx.createLinearGradient(0, -H * 1.05, 0, H * 1.05);
    // the belly lightens out of the body colour, never all the way to the
    // accent, or pale species bleach out entirely
    const belly = U.mixRgb(c1, c3, 0.38);
    // pale species need the back pushed toward a common deep, or -46% of an
    // already-white c2 is still white and the counter-shading vanishes
    const back = U.mixRgb(U.shade(c2, -0.28), [11, 15, 24], 0.40);
    bg.addColorStop(0.00, U.rgbToCss(back));
    bg.addColorStop(0.16, U.rgbToCss(U.mixRgb(U.mixRgb(c2, c1, 0.40), back, 0.45)));
    bg.addColorStop(0.34, U.rgbToCss(U.mixRgb(c2, c1, 0.62)));
    bg.addColorStop(0.58, U.rgbToCss(c1));
    bg.addColorStop(0.84, U.rgbToCss(U.mixRgb(c1, belly, 0.7)));
    bg.addColorStop(1.00, U.rgbToCss(belly));
    ctx.fillStyle = bg;
    ctx.fill();

    /* The silhouette gets an edge: a lit rim along the back, shadow through
       the middle, and a little bounce off the belly. Without it the body has
       no boundary and every fish reads as a sticker. */
    const eg = ctx.createLinearGradient(0, -H * 1.02, 0, H * 1.02);
    eg.addColorStop(0.00, U.rgbToCss(U.mixRgb(c3, [255, 255, 255], 0.45), 0.46));
    eg.addColorStop(0.30, U.rgbToCss(U.shade(back, -0.35), 0.40));
    eg.addColorStop(0.72, U.rgbToCss(U.shade(c2, -0.45), 0.28));
    eg.addColorStop(1.00, U.rgbToCss(U.mixRgb(belly, [255, 255, 255], 0.30), 0.34));
    ctx.strokeStyle = eg;
    ctx.lineWidth = Math.max(0.7, L * 0.0055);
    ctx.stroke();

    ctx.save();
    ctx.clip();

    // scale texture — skipped at small sizes where it would only be noise
    if (detail && SCALED[art.body]) scaleTexture(ctx, L, H, U.rgbToCss(U.shade(c2, -0.5)), rnd, art.body === 'round');

    // specular band along the upper flank
    const sp = ctx.createLinearGradient(0, -H * 0.95, 0, H * 0.10);
    sp.addColorStop(0, U.rgbToCss(c3, 0));
    sp.addColorStop(0.42, U.rgbToCss(U.mixRgb(c3, [255, 255, 255], 0.35), 0.18));
    sp.addColorStop(1, U.rgbToCss(c3, 0));
    ctx.fillStyle = sp;
    ctx.fillRect(-L, -H * 1.2, L * 2, H * 1.4);

    // and a soft glow from the belly for anything luminous
    if (glow > 0.15) {

/* VOID FISHING — the person doing the fishing.

   smoothed scalars driven by what the rod is doing; the skeleton is built
   from those every frame, the arms are solved with two-bone IK so the hands

   figure reads as a body instead of a stack of capstrokes.

   standing, and walking (origin on the ground between the feet), so the same

    return U.rgbToCss(k >= 0 ? U.mixRgb(rgb, MOON, k) : U.shade(rgb, k));

    g.addColorStop(0, tone(rgb, hi));

    alert: 0,        // spine tension — the moment something takes the bait
