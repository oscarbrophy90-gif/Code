<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VOID FISHING</title>
<meta name="description" content="A quiet fishing game at the edge of an endless void.">
<style>
/* css/base.css */
/* VOID FISHING — foundations: reset, tokens, typography, shared controls. */

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; }

:root {
  --ink:        #e9eff6;
  --ink-2:      rgba(233, 239, 246, 0.62);
  --ink-3:      rgba(233, 239, 246, 0.36);
  --ink-4:      rgba(233, 239, 246, 0.18);

  --line:       rgba(255, 255, 255, 0.085);
  --line-2:     rgba(255, 255, 255, 0.16);
  --line-3:     rgba(255, 255, 255, 0.28);

  --pane:       rgba(8, 11, 17, 0.74);
  --pane-2:     rgba(12, 16, 24, 0.92);
  --fill:       rgba(255, 255, 255, 0.032);
  --fill-2:     rgba(255, 255, 255, 0.065);

  --accent:     #7fa8c8;
  --accent-dim: rgba(127, 168, 200, 0.30);

  --good:       #6fd8a4;
  --warn:       #ffc36a;
  --bad:        #ff6b6b;

  --r-sm: 3px;
  --r:    5px;
  --r-lg: 9px;

  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo,
          Consolas, "Liberation Mono", monospace;

  --ease: cubic-bezier(0.22, 0.68, 0.28, 1);
  --dur: 220ms;
}

body {
  background: #04060a;
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  /* the whole interface is lowercase — content stays cased in the DOM so it
     copies out normally, this is presentation only */
  text-transform: lowercase;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

#app { position: fixed; inset: 0; overflow: hidden; }

#scene {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  touch-action: none;
}

/* Vignette, pulse and grain are static compositing layers rather than per-frame
   canvas fills. Full-screen translucent fillRects were the dominant raster cost;
   as CSS layers the compositor handles them once. */
#vignette, #vigPulse, #grain {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 2;
}
#vignette {
  background: radial-gradient(ellipse 78% 82% at 50% 52%,
              rgba(0,0,0,0) 28%, rgba(0,0,0,0.30) 66%, rgba(0,0,0,0.62) 100%);
}
#vigPulse {
  background: radial-gradient(ellipse 62% 68% at 50% 52%,
              rgba(0,0,0,0) 18%, rgba(0,0,0,0.42) 72%, rgba(0,0,0,0.72) 100%);
  opacity: 0;
  transition: opacity 180ms linear;
}
#grain {
  inset: -28px;
  opacity: 0.042;
  background-repeat: repeat;
  animation: grainDrift 5.5s steps(5) infinite;
}
@keyframes grainDrift {
  0%   { transform: translate3d(0, 0, 0); }
  20%  { transform: translate3d(-9px, 6px, 0); }
  40%  { transform: translate3d(7px, -10px, 0); }
  60%  { transform: translate3d(-6px, -5px, 0); }
  80%  { transform: translate3d(10px, 8px, 0); }
  100% { transform: translate3d(0, 0, 0); }
}
body.q-low #grain { display: none; }

/* Coloured bleed at the screen edges, tinted by the current location. */
#edgeGlow {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 3;
  box-shadow: inset 0 0 160px -20px var(--accent-dim);
  opacity: 0.34;
  transition: box-shadow 900ms var(--ease), opacity 600ms var(--ease);
}

.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ------------------------------------------------------------------ boot */

#boot {
  position: absolute; inset: 0; z-index: 60;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 58%, rgba(6,9,16,0.38), rgba(2,3,6,0.86) 74%);
  backdrop-filter: blur(2px);
  transition: opacity 700ms var(--ease), visibility 700ms;
}
#boot.gone { opacity: 0; visibility: hidden; pointer-events: none; }

.boot-inner { text-align: center; animation: bootIn 1100ms var(--ease) both; }
@keyframes bootIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.title {
  margin: 0 0 14px;
  font-size: clamp(30px, 6.2vw, 62px);
  font-weight: 200;
  letter-spacing: 0.34em;
  text-indent: 0.34em;
  color: var(--ink);
  text-shadow: 0 0 42px rgba(160, 200, 255, 0.30);
}
.title span { display: block; font-weight: 500; font-size: 0.62em; letter-spacing: 0.52em; text-indent: 0.52em; color: var(--ink-2); margin-top: 6px; }
.tagline { margin: 0 0 30px; color: var(--ink-3); font-size: 13px; letter-spacing: 0.06em; }
.boot-note { margin: 16px 0 0; color: var(--ink-4); font-size: 11px; letter-spacing: 0.14em; text-transform: lowercase; }

/* -------------------------------------------------------------- controls */

/* form controls do not inherit text-transform from the UA stylesheet, so the
   lowercase treatment has to be handed to them explicitly */
button, input, select, textarea {
  font: inherit; color: inherit; text-transform: inherit;
  background: none; border: none;
}
button { cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 1px solid var(--line-3); outline-offset: 2px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 8px 16px;
  border: 1px solid var(--line-2);
  border-radius: var(--r);
  background: var(--fill);
  color: var(--ink-2);
  font-size: 12px; letter-spacing: 0.10em; text-transform: lowercase;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease),
              border-color var(--dur) var(--ease), transform 90ms var(--ease);
  white-space: nowrap;
}
.btn:hover { background: var(--fill-2); color: var(--ink); border-color: var(--line-3); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: 0.35; cursor: not-allowed; }
.btn[disabled]:hover { background: var(--fill); color: var(--ink-2); border-color: var(--line-2); }

.btn-primary { color: var(--ink); border-color: var(--line-3); background: rgba(255,255,255,0.07); }
.btn-primary:hover { background: rgba(255,255,255,0.12); }
.btn-lg { padding: 12px 34px; font-size: 13px; letter-spacing: 0.20em; }
.btn-sm { padding: 5px 10px; font-size: 10.5px; }
.btn-danger { color: #ffb0b0; border-color: rgba(255,110,110,0.32); }
.btn-danger:hover { background: rgba(255,90,90,0.14); color: #ffd0d0; border-color: rgba(255,110,110,0.5); }

/* ------------------------------------------------------------- utilities */

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.k {
  font-size: 10px; letter-spacing: 0.19em; text-transform: lowercase;
  color: var(--ink-3);
}

.scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.scroll::-webkit-scrollbar-track { background: transparent; }
.scroll::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
.scroll::-webkit-scrollbar-thumb:hover { background: var(--line-3); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  #grain { animation: none; }
}

/* css/hud.css */
/* VOID FISHING — heads-up display: status, gear, the cast control, the fight. */

#hud {
  position: absolute; inset: 0; z-index: 10;
  pointer-events: none;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: clamp(12px, 1.8vw, 22px);
  opacity: 1;
  transition: opacity 400ms var(--ease);
}
#hud > * { pointer-events: none; }
#hud button, #hud .chip-btn { pointer-events: auto; }
#hud.dimmed { opacity: 0.20; }

/* ------------------------------------------------------------------- top */

.hud-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }

.hud-tl { display: flex; flex-direction: column; gap: 7px; }

.money-row { display: flex; align-items: baseline; gap: 7px; }
.coin { color: var(--accent); font-size: 13px; transform: translateY(-1px); }
.money {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-size: clamp(19px, 2.3vw, 25px); font-weight: 300; letter-spacing: 0.02em;
  color: var(--ink);
  text-shadow: 0 1px 14px rgba(0,0,0,0.75);
}
.money-unit {
  font-size: 9px; letter-spacing: 0.18em; text-transform: lowercase;
  color: var(--ink-4); margin-left: 2px;
}
.money.bump { animation: moneyBump 460ms var(--ease); }
@keyframes moneyBump {
  0% { transform: none; }
  28% { transform: translateY(-3px) scale(1.055); color: var(--good); }
  100% { transform: none; }
}

.level-row { display: flex; align-items: center; gap: 9px; }
.lv {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em;
  color: var(--ink-2); min-width: 40px;
}
.xp-track {
  width: clamp(92px, 12vw, 150px); height: 3px;
  background: rgba(255,255,255,0.09);
  border-radius: 2px; overflow: hidden;
}
.xp-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent-dim), var(--accent));
  border-radius: 2px;
  transition: width 480ms var(--ease);
}
.xp-text { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.04em; }

.hud-tr { display: flex; flex-direction: column; align-items: flex-end; gap: 9px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip {
  display: flex; align-items: baseline; gap: 7px;
  padding: 4px 10px;
  border: 1px solid var(--line);
  border-radius: 100px;
  background: var(--pane);
  backdrop-filter: blur(9px);
  -webkit-backdrop-filter: blur(9px);
}
.chip-k { font-size: 9px; letter-spacing: 0.20em; color: var(--ink-3); }
.chip-v { font-size: 11px; color: var(--ink-2); letter-spacing: 0.03em; white-space: nowrap; }
.chip-btn { transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease); }
.chip-btn:hover { border-color: var(--line-3); background: var(--pane-2); }
.chip-btn:hover .chip-v { color: var(--ink); }

.menu-row { display: flex; gap: 3px; }
.mbtn {
  padding: 6px 11px;
  font-size: 10.5px; letter-spacing: 0.13em; text-transform: lowercase;
  color: var(--ink-3);
  border: 1px solid transparent; border-radius: var(--r);
  transition: color var(--dur) var(--ease), background var(--dur) var(--ease),
              border-color var(--dur) var(--ease);
}
.mbtn:hover { color: var(--ink); background: var(--fill); border-color: var(--line); }
.mbtn.active { color: var(--ink); border-color: var(--line-2); background: var(--fill-2); }
.mbtn-icon { display: flex; align-items: center; padding: 6px 9px; }
.mbtn.flash { animation: mbtnFlash 1.9s var(--ease) 3; }
@keyframes mbtnFlash {
  0%, 100% { color: var(--ink-3); }
  50% { color: var(--accent); text-shadow: 0 0 12px var(--accent-dim); }
}

/* ---------------------------------------------------------------- bottom */

.hud-bottom {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: flex-end;
  gap: 14px;
}

.gear-row { display: flex; gap: 7px; flex-wrap: wrap; }
.gear-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
  min-width: 108px; padding: 7px 12px;
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--pane);
  backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
  text-align: left; position: relative;
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease),
              transform 120ms var(--ease);
}
.gear-card:hover { border-color: var(--line-3); background: var(--pane-2); transform: translateY(-1px); }
.gear-k { font-size: 9px; letter-spacing: 0.22em; color: var(--ink-3); }
.gear-v { font-size: 12px; color: var(--ink-2); letter-spacing: 0.02em; }
.gear-card:hover .gear-v { color: var(--ink); }
.gear-n {
  position: absolute; top: 6px; right: 10px;
  font-family: var(--mono); font-size: 10px; color: var(--ink-3);
}
.gear-n.low { color: var(--warn); }

.action-col { display: flex; flex-direction: column; align-items: center; gap: 9px; }

.cast-meter { height: 4px; width: clamp(150px, 20vw, 230px); opacity: 0; transition: opacity 160ms var(--ease); }
.cast-meter.on { opacity: 1; }
.cast-track {
  position: relative; height: 100%;
  background: rgba(255,255,255,0.10);
  border-radius: 3px; overflow: hidden;
}
.cast-fill {
  position: absolute; inset: 0 auto 0 0; width: 0%;
  background: linear-gradient(90deg, var(--accent-dim), var(--accent));
  border-radius: 3px;
}
.cast-sweet {
  position: absolute; top: 0; bottom: 0; left: 80%; right: 0;
  background: rgba(255, 214, 120, 0.34);
  border-left: 1px solid rgba(255, 214, 120, 0.65);
}

.action-btn {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-width: clamp(150px, 20vw, 230px);
  padding: 11px 26px;
  border: 1px solid var(--line-2); border-radius: var(--r-lg);
  background: var(--pane);
  backdrop-filter: blur(11px); -webkit-backdrop-filter: blur(11px);
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
              transform 110ms var(--ease), box-shadow var(--dur) var(--ease);
}
.action-btn:hover { background: var(--pane-2); border-color: var(--line-3); }
.action-btn:active { transform: translateY(1px); }
#actionLabel { font-size: 13px; letter-spacing: 0.20em; text-transform: lowercase; color: var(--ink); }
.action-hint { font-size: 9.5px; letter-spacing: 0.16em; text-transform: lowercase; color: var(--ink-3); }

.action-btn.charging { border-color: rgba(255, 214, 120, 0.42); }
.action-btn.bite {
  border-color: rgba(255, 190, 90, 0.85);
  background: rgba(60, 34, 8, 0.72);
  box-shadow: 0 0 0 1px rgba(255,190,90,0.22), 0 0 34px rgba(255, 170, 60, 0.34);
  animation: bitePulse 380ms var(--ease) infinite alternate;
}
@keyframes bitePulse { from { transform: scale(1); } to { transform: scale(1.035); } }
.action-btn.reeling { border-color: var(--line-3); background: rgba(20,28,40,0.85); }
.action-btn.busy { opacity: 0.42; }

.side-col { display: flex; justify-content: flex-end; }
.hint-box {
  max-width: 250px; padding: 9px 13px;
  border: 1px solid var(--line); border-left: 2px solid var(--accent-dim);
  border-radius: var(--r);
  background: var(--pane);
  backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
  font-size: 11.5px; line-height: 1.55; color: var(--ink-2);
  opacity: 0; transform: translateY(6px);
  transition: opacity 400ms var(--ease), transform 400ms var(--ease);
}
.hint-box.on { opacity: 1; transform: none; }

/* ----------------------------------------------------------- the fight
   The catch bar. One long track, a white bar the player drives with space, a
   fish indicator loose inside it, and the progress bar underneath. Nothing in
   here transitions on position — the fight writes left/width every frame and a
   transition would read as input lag. */

/* The entrance is its own class, removed once it has played. Left on .fight it
   would re-run every time .shake was toggled off, because that is a change of
   animation-name — the panel would fade back in mid-fight. */
.fight.enter { animation: fightIn 280ms var(--ease) both; }
.fight {
  position: absolute; left: 50%; bottom: clamp(96px, 13vh, 146px);
  transform: translateX(-50%);
  width: clamp(320px, 46vw, 620px);
  padding: 13px 18px 15px;
  border: 1px solid var(--line-2); border-radius: var(--r-lg);
  background: var(--pane-2);
  backdrop-filter: blur(13px); -webkit-backdrop-filter: blur(13px);
  box-shadow: 0 18px 50px rgba(0,0,0,0.55);
}
@keyframes fightIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%); } }
.fight.shake { animation: fightShake 110ms linear infinite; }
@keyframes fightShake {
  0%,100% { transform: translateX(-50%) translate(0,0); }
  25% { transform: translateX(-50%) translate(1.6px,-1px); }
  75% { transform: translateX(-50%) translate(-1.6px,1px); }
}

.fight-head { display: flex; justify-content: space-between; align-items: baseline; }
.fight-name { font-size: 11px; letter-spacing: 0.16em; text-transform: lowercase; color: var(--ink-2); }
.fight-warn { font-size: 10px; letter-spacing: 0.16em; text-transform: lowercase; color: var(--bad); opacity: 0; transition: opacity 120ms; }
.fight-warn.on { opacity: 1; animation: warnBlink 480ms steps(2) infinite; }
@keyframes warnBlink { 50% { opacity: 0.25; } }

/* ------------------------------------------------------------- the track */

.mg-track {
  position: relative;
  height: 30px;
  margin: 21px 13px 0;
  border-radius: 4px;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.30)),
    rgba(10, 14, 21, 0.9);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07),
              inset 0 2px 9px rgba(0,0,0,0.6);
}
/* the red end markers from the reference — they sit outside the track and
   point in at the two walls the white bar can never cross */
.mg-track::before, .mg-track::after {
  content: ''; position: absolute; top: 50%; margin-top: -5px;
  width: 0; height: 0;
  border-top: 5px solid transparent; border-bottom: 5px solid transparent;
  opacity: 0.85;
}
.mg-track::before { left: -12px; border-left: 8px solid #d2453f; }
.mg-track::after  { right: -12px; border-right: 8px solid #d2453f; }

/* The strip the bar and the fish live in. Nothing is clipped: the bar is
   already clamped so it cannot leave, and the fish marker needs to hang its
   tag above the track. */
.mg-inner { position: absolute; inset: 3px; border-radius: 3px; }

/* the white bar — the player's zone */
.mg-bar {
  position: absolute; top: 0; bottom: 0; left: 0; width: 30%;
  border-radius: 2px;
  background: linear-gradient(180deg, #ffffff, #d7dee6);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.55), 0 0 14px rgba(255,255,255,0.16);
  display: grid; place-items: center;
}
.mg-bar.grip {
  background: linear-gradient(180deg, #ffffff, #e6f2ea);
  box-shadow: 0 0 0 1px rgba(150,255,205,0.7), 0 0 20px rgba(120,240,190,0.34);
}
/* the chevron reads which way the bar is travelling, the way the reference
   image shows one — it is the only moving thing that says "released" */
.mg-bar-arrow {
  width: 13px; height: 13px; opacity: 0.34;
  background: #0b1119;
  -webkit-mask: var(--chev) center / contain no-repeat;
          mask: var(--chev) center / contain no-repeat;
  --chev: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M10.5 2.5 4.5 8l6 5.5' fill='none' stroke='%23000' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  transition: transform 140ms var(--ease), opacity 140ms linear;
}
.mg-bar.right .mg-bar-arrow { transform: scaleX(-1); }
.mg-bar.still .mg-bar-arrow { opacity: 0.14; }

/* The fish. A hairline marker, because the rule is a point test — the fish is
   in the bar when its centre is, and a fat marker would lie about that. The
   silhouette hangs above the track where there is room for it to be legible,
   and it is the same colour as the fish's own rarity. */
.mg-fish { position: absolute; top: 0; bottom: 0; left: 0; width: 0; }
.mg-fish::before {
  content: ''; position: absolute; top: -2px; bottom: -2px; left: -2.5px; width: 5px;
  border-radius: 3px;
  background: linear-gradient(180deg, #fff, var(--fishcol, #7fd0ff) 60%, #fff);
  box-shadow: 0 0 0 1.5px rgba(4,7,12,0.85), 0 0 13px var(--fishcol, #7fd0ff);
}
.mg-fish::after {
  content: ''; position: absolute; left: -12px; top: -18px;
  width: 24px; height: 16px;
  background: var(--fishcol, #7fd0ff);
  /* the eye is a hole in the mask, so it reads at this size instead of
     disappearing into the silhouette */
  -webkit-mask: var(--fishglyph) center / contain no-repeat;
          mask: var(--fishglyph) center / contain no-repeat;
  --fishglyph: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 16'%3E%3Cpath fill-rule='evenodd' d='M14 1.4c4 .9 6.6 4 7.4 6.6-.8 2.6-3.4 5.7-7.4 6.6-4.5 1-9.2-2-11.4-6.6C4.8 3.4 9.5.4 14 1.4Zm2.6 5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z'/%3E%3Cpath d='M1.1 2.2 5 8l-3.9 5.8Z'/%3E%3C/svg%3E");
}
/* the fish turns to face the way it is swimming */
.mg-fish.left::after { transform: scaleX(-1); }

/* ---------------------------------------------------------- the progress */

.mg-prog {
  position: relative; height: 11px; margin: 9px 13px 0;
  border-radius: 3px;
  background: rgba(10, 14, 21, 0.9);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07), inset 0 2px 7px rgba(0,0,0,0.55);
  overflow: hidden;
}
.mg-prog-fill {
  position: absolute; inset: 1px auto 1px 1px; width: 32%;
  border-radius: 2px;
  background: linear-gradient(90deg, #b7c4d0, #ffffff);
  box-shadow: 0 0 12px rgba(255,255,255,0.22);
}
.mg-prog.gain .mg-prog-fill { background: linear-gradient(90deg, #63c79a, #b9ffdc); box-shadow: 0 0 14px rgba(120,240,190,0.30); }
.mg-prog.drain .mg-prog-fill { background: linear-gradient(90deg, #a5453c, #ff9c86); box-shadow: 0 0 14px rgba(255,120,90,0.30); }
/* the last of the progress is the part worth panicking about */
.mg-prog.low { box-shadow: inset 0 0 0 1px rgba(255,110,90,0.45), inset 0 2px 7px rgba(0,0,0,0.55); }
.mg-prog.low .mg-prog-fill { animation: progPanic 380ms steps(2) infinite; }
@keyframes progPanic { 50% { opacity: 0.55; } }

.fight-foot {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-top: 7px;
  font-size: 9.5px; letter-spacing: 0.17em; text-transform: lowercase;
  color: var(--ink-3);
}
.fight-pct { font-family: var(--mono); color: var(--ink-2); }
.fight-hint b { color: var(--ink-2); font-weight: 500; }

@media (max-width: 620px) {
  .fight { width: min(92vw, 460px); padding: 11px 15px 13px; }
  .mg-track { height: 26px; }
}

/* ------------------------------------------------------------- prompts */

.prompt {
  position: absolute; left: 50%; top: 34%;
  transform: translate(-50%, -50%);
  text-align: center; pointer-events: none;
  font-size: clamp(20px, 3.4vw, 38px);
  font-weight: 200; letter-spacing: 0.30em; text-indent: 0.30em;
  text-transform: lowercase;
  color: var(--ink);
  text-shadow: 0 0 34px rgba(0,0,0,0.9), 0 0 60px currentColor;
  opacity: 0;
}
.prompt.show { animation: promptIn 1500ms var(--ease) both; }
@keyframes promptIn {
  0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.94); letter-spacing: 0.55em; }
  16%  { opacity: 1; transform: translate(-50%,-50%) scale(1); letter-spacing: 0.30em; }
  72%  { opacity: 1; }
  100% { opacity: 0; }
}
.prompt.hold { animation: promptHold 400ms var(--ease) both; }
@keyframes promptHold {
  0% { opacity: 0; transform: translate(-50%,-50%) scale(0.94); }
  100% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
}

/* --------------------------------------------------------------- toasts */

.toasts {
  position: absolute; right: clamp(12px, 1.8vw, 22px); top: 50%;
  transform: translateY(-50%);
  z-index: 25; display: flex; flex-direction: column; gap: 7px;
  align-items: flex-end; pointer-events: none;
  max-width: min(330px, 42vw);
}
.toast {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 13px;
  border: 1px solid var(--line-2); border-radius: var(--r);
  background: var(--pane-2);
  backdrop-filter: blur(11px); -webkit-backdrop-filter: blur(11px);
  font-size: 11.5px; color: var(--ink-2);
  box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  animation: toastIn 320ms var(--ease) both;
}
.toast.out { animation: toastOut 320ms var(--ease) both; }
@keyframes toastIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateX(18px); } }
.toast .t-mark { width: 3px; align-self: stretch; border-radius: 2px; background: var(--accent); }
.toast.good .t-mark { background: var(--good); }
.toast.warn .t-mark { background: var(--warn); }
.toast.bad  .t-mark { background: var(--bad); }
.toast strong { color: var(--ink); font-weight: 500; }

/* ----------------------------------------------------------- encounter */

.encounter {
  position: absolute; inset: 0; z-index: 30;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 58%, rgba(0,0,0,0) 22%, rgba(0,0,0,0.72) 78%);
  animation: encIn 900ms var(--ease) both;
}
@keyframes encIn { from { opacity: 0; } to { opacity: 1; } }
.encounter.out { animation: encOut 900ms var(--ease) both; }
@keyframes encOut { to { opacity: 0; } }
.enc-inner { text-align: center; }
.enc-text {
  font-size: clamp(15px, 2.2vw, 24px);
  font-weight: 200; letter-spacing: 0.42em; text-indent: 0.42em;
  text-transform: lowercase; color: #e8dcff;
  text-shadow: 0 0 50px rgba(150, 110, 255, 0.75);
  animation: encPulse 2.6s ease-in-out infinite;
}
@keyframes encPulse { 0%,100% { opacity: 0.72; } 50% { opacity: 1; } }

/* ------------------------------------------------------------ responsive */

@media (max-width: 760px) {
  .hud-bottom { grid-template-columns: 1fr; justify-items: center; }
  .side-col { display: none; }
  .gear-row { order: 2; }
  .action-col { order: 1; }
  .menu-row { flex-wrap: wrap; justify-content: flex-end; }
  .fight { width: min(92vw, 430px); bottom: 152px; }
}
@media (max-height: 620px) {
  .fight { bottom: 88px; padding: 9px 13px 11px; }
  .mg-track { height: 24px; }
  .hint-box { display: none; }
}

/* the interface is simply not there for a moment */
#hud.gone { opacity: 0; transition: opacity 700ms var(--ease); pointer-events: none; }
body.wrong #vignette { opacity: 0.2; }
body.wrong #edgeGlow { opacity: 0; }
body.wrong .toasts { opacity: 0; transition: opacity 500ms var(--ease); }

/* -------------------------------------------------------------- captions
   A conversation happens out on the shore. All that belongs on the interface
   is the name, the line, and the fact that there is more of it. */

.caption {
  position: fixed;
  left: 50%;
  bottom: 44px;
  transform: translateX(-50%);
  width: min(640px, calc(100vw - 64px));
  z-index: 46;
  pointer-events: none;
  opacity: 1;
  transition: opacity 420ms var(--ease);
}
.caption.hidden { display: none; }
.caption.fading { opacity: 0; }

.caption-inner { text-align: center; }

.caption-who {
  font-size: 10px;
  letter-spacing: 0.30em;
  text-transform: lowercase;
  margin-bottom: 12px;
  opacity: 0.85;
}

.caption-text {
  font-size: 15px;
  line-height: 1.72;
  color: var(--ink);
  text-shadow: 0 2px 22px rgba(0, 0, 0, 0.92), 0 1px 4px rgba(0, 0, 0, 0.8);
  letter-spacing: 0.012em;
  animation: capIn 460ms var(--ease) both;
}

.caption-more {
  margin-top: 16px;
  font-size: 10px;
  letter-spacing: 0.24em;
  color: var(--ink-4);
  opacity: 0;
  transition: opacity 500ms var(--ease);
}
.caption.ready .caption-more { opacity: 1; }

@keyframes capIn {
  from { opacity: 0; transform: translateY(7px); filter: blur(3px); }
  to   { opacity: 1; transform: none; filter: none; }
}

/* while somebody is talking the rest of the interface gets out of the way */
#hud.visiting .hud-bottom,
#hud.visiting .fight,
#hud.visiting .prompt { opacity: 0; pointer-events: none; transition: opacity 420ms var(--ease); }
#hud.visiting .hud-top { opacity: 0.24; pointer-events: none; transition: opacity 420ms var(--ease); }

@media (max-width: 760px) {
  .caption { bottom: 34px; width: calc(100vw - 40px); }
  .caption-text { font-size: 14px; line-height: 1.68; }
}

/* css/panels.css */
/* VOID FISHING — overlays: menus, the catch card, selectors, dialogs. */

.overlay {
  position: absolute; inset: 0; z-index: 40;
  background: rgba(2, 4, 8, 0.62);
  backdrop-filter: blur(7px) saturate(0.75);
  -webkit-backdrop-filter: blur(7px) saturate(0.75);
  animation: fadeIn 220ms var(--ease) both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.overlay.out { animation: fadeOut 200ms var(--ease) both; }
@keyframes fadeOut { to { opacity: 0; } }

.modal-host {
  position: absolute; inset: 0; z-index: 45;
  display: flex; align-items: center; justify-content: center;
  padding: clamp(12px, 3vh, 32px);
  pointer-events: none;
}
.modal-host > * { pointer-events: auto; }

/* ---------------------------------------------------------------- panel */

.panel {
  display: flex; flex-direction: column;
  width: min(880px, 94vw);
  max-height: min(760px, 90vh);
  border: 1px solid var(--line-2);
  border-radius: var(--r-lg);
  background: linear-gradient(180deg, rgba(14,19,28,0.97), rgba(8,11,17,0.97));
  box-shadow: 0 30px 90px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.045);
  overflow: hidden;
  animation: panelIn 300ms var(--ease) both;
}
@keyframes panelIn { from { opacity: 0; transform: translateY(16px) scale(0.985); } to { opacity: 1; transform: none; } }
.panel.out { animation: panelOut 200ms var(--ease) both; }
@keyframes panelOut { to { opacity: 0; transform: translateY(10px) scale(0.99); } }

.panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 15px 20px 13px;
  border-bottom: 1px solid var(--line);
}
.panel-title { font-size: 13px; letter-spacing: 0.26em; text-transform: lowercase; color: var(--ink); }
.panel-sub { font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; margin-top: 3px; }
.panel-close {
  width: 28px; height: 28px; display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: var(--r);
  color: var(--ink-3); font-size: 15px; line-height: 1;
  transition: all var(--dur) var(--ease);
}
.panel-close:hover { color: var(--ink); border-color: var(--line-3); background: var(--fill); }

.tabs { display: flex; gap: 2px; padding: 10px 20px 0; border-bottom: 1px solid var(--line); }
.tab {
  padding: 7px 13px 9px;
  font-size: 10.5px; letter-spacing: 0.15em; text-transform: lowercase;
  color: var(--ink-3);
  border-bottom: 1.5px solid transparent;
  transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.tab:hover { color: var(--ink-2); }
.tab.active { color: var(--ink); border-bottom-color: var(--accent); }

.panel-body { padding: 18px 20px 22px; overflow-y: auto; flex: 1; }

.empty { padding: 44px 10px; text-align: center; color: var(--ink-4); font-size: 12px; letter-spacing: 0.06em; }

/* -------------------------------------------------------------- listing */

.list { display: flex; flex-direction: column; gap: 7px; }

.row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 14px; align-items: center;
  padding: 12px 14px;
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--fill);
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.row:hover { border-color: var(--line-2); background: var(--fill-2); }
.row.owned { border-color: rgba(120, 200, 160, 0.24); }
.row.locked { opacity: 0.45; }
.row.equipped { border-color: var(--accent-dim); background: rgba(127,168,200,0.055); }

.row-mark { width: 3px; align-self: stretch; border-radius: 2px; background: var(--line-2); min-height: 34px; }

/* rods are shown, not just described */
.row-rod { grid-template-columns: auto auto 1fr auto; }
.rod-art-box {
  width: 150px; flex: 0 0 150px;
  border: 1px solid var(--line); border-radius: var(--r-sm);
  background: linear-gradient(160deg, rgba(255,255,255,0.030), rgba(0,0,0,0.30));
  overflow: hidden;
}
.rod-art { display: block; width: 100%; height: 66px; }
.row-main { min-width: 0; }
.row-name { font-size: 13px; color: var(--ink); letter-spacing: 0.02em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-desc { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; line-height: 1.5; }
.row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.row-price { font-family: var(--mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.row-price.cant { color: var(--bad); }
.row-actions { display: flex; gap: 5px; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 6px; margin-top: 8px; }
.stat-cell { padding: 5px 7px; border: 1px solid var(--line); border-radius: var(--r-sm); background: rgba(0,0,0,0.22); }
.stat-cell .k { display: block; margin-bottom: 2px; }
.stat-cell .v { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.stat-cell .v.up { color: var(--good); }
.stat-cell .v.down { color: #c96a6a; }
.stat-cell .v.up { color: var(--good); }

.tag {
  display: inline-block; padding: 2px 7px;
  border: 1px solid currentColor; border-radius: 100px;
  font-size: 8.5px; letter-spacing: 0.16em; text-transform: lowercase;
  opacity: 0.9;
}

/* -------------------------------------------------------------- fishdex */

.dex-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.dex-count { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-left: auto; }
.seg { display: flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button {
  padding: 5px 9px; font-size: 9.5px; letter-spacing: 0.1em; text-transform: lowercase;
  color: var(--ink-3); border-right: 1px solid var(--line);
  transition: all var(--dur) var(--ease);
}
.seg button:last-child { border-right: none; }
.seg button:hover { background: var(--fill); color: var(--ink-2); }
.seg button.active { background: var(--fill-2); color: var(--ink); }

.dex-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
  gap: 8px;
}
.dex-cell {
  position: relative;
  padding: 10px 9px 9px;
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--fill);
  cursor: pointer; text-align: center;
  transition: transform 140ms var(--ease), border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.dex-cell:hover { transform: translateY(-2px); border-color: var(--line-3); background: var(--fill-2); }
.dex-cell.undiscovered { cursor: default; opacity: 0.55; }
.dex-cell.undiscovered:hover { transform: none; }
.dex-art { width: 100%; height: 66px; display: block; }
.dex-name {
  font-size: 10.5px; color: var(--ink-2); margin-top: 5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.02em;
}
.dex-rec { font-family: var(--mono); font-size: 9px; color: var(--ink-4); margin-top: 2px; }
.dex-pip { position: absolute; top: 7px; right: 7px; width: 5px; height: 5px; border-radius: 50%; }
.dex-n { position: absolute; top: 6px; left: 8px; font-family: var(--mono); font-size: 9px; color: var(--ink-4); }
.dex-cell.new::after {
  content: 'NEW'; position: absolute; bottom: 6px; right: 7px;
  font-size: 7.5px; letter-spacing: 0.14em; color: var(--good);
}

/* ----------------------------------------------------------- catch card */

.catch-card {
  width: min(420px, 94vw);
  border: 1px solid var(--line-2); border-radius: var(--r-lg);
  background: linear-gradient(180deg, rgba(14,19,28,0.97), rgba(7,10,16,0.98));
  box-shadow: 0 30px 90px rgba(0,0,0,0.75);
  overflow: hidden;
  animation: catchIn 460ms var(--ease) both;
}
@keyframes catchIn {
  0% { opacity: 0; transform: translateY(26px) scale(0.94); }
  60% { transform: translateY(-3px) scale(1.008); }
  100% { opacity: 1; transform: none; }
}
.catch-card.out { animation: panelOut 200ms var(--ease) both; }

.catch-banner {
  padding: 9px 18px;
  font-size: 9.5px; letter-spacing: 0.28em; text-transform: lowercase;
  text-align: center; color: #06080c;
  font-weight: 600;
}
.catch-hero {
  position: relative;
  height: 168px; display: grid; place-items: center;
  border-bottom: 1px solid var(--line);
  overflow: hidden;
}
.catch-hero canvas { display: block; }
.catch-glow { position: absolute; inset: 0; pointer-events: none; }

.catch-body { padding: 16px 18px 18px; }
.catch-rarity { font-size: 9.5px; letter-spacing: 0.24em; text-transform: lowercase; }
.catch-name {
  font-size: clamp(19px, 3vw, 25px); font-weight: 300; letter-spacing: 0.03em;
  color: var(--ink); margin: 4px 0 3px; line-height: 1.15;
}
.catch-mut { font-size: 11px; letter-spacing: 0.08em; margin-bottom: 8px; }
.catch-desc { font-size: 12px; line-height: 1.6; color: var(--ink-3); margin-bottom: 14px; font-style: italic; }

.catch-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.metric { padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: rgba(0,0,0,0.28); }
.metric .k { display: block; margin-bottom: 3px; }
.metric .v { font-family: var(--mono); font-size: 13px; color: var(--ink); }

.size-track { height: 4px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden; margin-bottom: 5px; }
.size-fill { height: 100%; width: 0%; border-radius: 2px; transition: width 900ms var(--ease) 260ms; }
.size-note { display: flex; justify-content: space-between; font-size: 9.5px; letter-spacing: 0.1em; color: var(--ink-4); text-transform: lowercase; margin-bottom: 15px; }

.catch-value {
  display: flex; align-items: baseline; justify-content: center; gap: 8px;
  padding: 11px 0 14px;
}
.catch-value .coin { font-size: 14px; }
.catch-value .amt { font-family: var(--mono); font-size: 25px; font-weight: 300; color: var(--ink); }

.catch-actions { display: grid; grid-template-columns: 1.35fr 1fr 1fr; gap: 7px; }

.record-flag {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; margin-bottom: 9px;
  border: 1px solid rgba(255,196,90,0.42); border-radius: 100px;
  background: rgba(255,180,60,0.10);
  font-size: 9px; letter-spacing: 0.2em; text-transform: lowercase; color: #ffd48a;
}

/* -------------------------------------------------------------- selector */

.select-card {
  width: min(560px, 94vw); max-height: 82vh;
  display: flex; flex-direction: column;
  border: 1px solid var(--line-2); border-radius: var(--r-lg);
  background: linear-gradient(180deg, rgba(14,19,28,0.97), rgba(8,11,17,0.97));
  box-shadow: 0 26px 70px rgba(0,0,0,0.65);
  overflow: hidden;
  animation: panelIn 260ms var(--ease) both;
}

/* --------------------------------------------------------------- dialog */

.dialog {
  width: min(380px, 92vw); padding: 22px;
  border: 1px solid var(--line-2); border-radius: var(--r-lg);
  background: linear-gradient(180deg, rgba(16,20,30,0.98), rgba(9,12,18,0.98));
  box-shadow: 0 24px 70px rgba(0,0,0,0.7);
  animation: panelIn 240ms var(--ease) both;
  text-align: center;
}
.dialog h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.2em; text-transform: lowercase; font-weight: 400; }
.dialog p { margin: 0 0 18px; font-size: 12.5px; color: var(--ink-3); line-height: 1.6; }
.dialog-actions { display: flex; gap: 8px; justify-content: center; }

/* ------------------------------------------------------------- settings */

.set-group { margin-bottom: 22px; }
.set-group > .k { display: block; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.set-row { display: flex; align-items: center; gap: 14px; padding: 8px 0; }
.set-row label { flex: 0 0 128px; font-size: 12px; color: var(--ink-2); }
.set-row .val { font-family: var(--mono); font-size: 11px; color: var(--ink-3); min-width: 40px; text-align: right; }

input[type=range] {
  -webkit-appearance: none; appearance: none;
  flex: 1; height: 3px; border-radius: 2px;
  background: rgba(255,255,255,0.12); outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--ink-2); border: none; cursor: pointer;
  transition: background var(--dur) var(--ease), transform 120ms var(--ease);
}
input[type=range]::-webkit-slider-thumb:hover { background: var(--ink); transform: scale(1.15); }
input[type=range]::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--ink-2); border: none; cursor: pointer;
}

.switch {
  position: relative; width: 34px; height: 18px;
  border: 1px solid var(--line-2); border-radius: 100px;
  background: rgba(0,0,0,0.35); cursor: pointer;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.switch::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--ink-3);
  transition: transform var(--dur) var(--ease), background var(--dur) var(--ease);
}
.switch.on { background: var(--accent-dim); border-color: var(--accent); }
.switch.on::after { transform: translateX(16px); background: var(--ink); }

/* ---------------------------------------------------------------- stats */

.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.stat-tile {
  padding: 12px 13px;
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--fill);
}
.stat-tile .k { display: block; margin-bottom: 5px; }
.stat-tile .v { font-family: var(--mono); font-size: 17px; font-weight: 300; color: var(--ink); }
.stat-tile .sub { font-size: 10.5px; color: var(--ink-4); margin-top: 3px; }

.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 7px; }
.ach {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px 12px;
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--fill);
}
.ach.locked { opacity: 0.42; }
.ach.done { border-color: rgba(120, 200, 160, 0.28); background: rgba(110,216,164,0.05); }
.ach-mark { width: 3px; align-self: stretch; border-radius: 2px; background: var(--line-2); min-height: 26px; }
.ach.done .ach-mark { background: var(--good); }
.ach-name { font-size: 12px; color: var(--ink); }
.ach-desc { font-size: 10.5px; color: var(--ink-3); margin-top: 2px; line-height: 1.45; }
.ach-reward { font-family: var(--mono); font-size: 9.5px; color: var(--ink-4); margin-top: 4px; }

/* ------------------------------------------------------------ locations */

.loc-list { display: flex; flex-direction: column; gap: 8px; }
.loc {
  display: grid; grid-template-columns: 4px 1fr auto; gap: 14px; align-items: center;
  padding: 14px 16px;
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--fill);
  transition: all var(--dur) var(--ease);
}
.loc:hover { border-color: var(--line-2); background: var(--fill-2); }
.loc.current { border-color: var(--accent); background: rgba(127,168,200,0.07); }
.loc.locked { opacity: 0.5; }
.loc-mark { align-self: stretch; border-radius: 2px; min-height: 40px; }
.loc-name { font-size: 14px; color: var(--ink); letter-spacing: 0.02em; }
.loc-tag { font-size: 11px; color: var(--ink-3); font-style: italic; margin-top: 2px; }
.loc-desc { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; line-height: 1.55; }
.loc-meta { display: flex; gap: 10px; margin-top: 7px; font-family: var(--mono); font-size: 10px; color: var(--ink-4); }

@media (max-width: 780px) {
  .row-rod { grid-template-columns: auto 1fr auto; }
  .rod-art-box { grid-column: 2; width: 100%; flex: 1 1 auto; }
}
@media (max-width: 620px) {
  .catch-metrics { grid-template-columns: repeat(2, 1fr); }
  .catch-actions { grid-template-columns: 1fr 1fr; }
  .row { grid-template-columns: auto 1fr; }
  .row-side { grid-column: 2; align-items: flex-start; }
  .tabs { overflow-x: auto; }
}

/* ------------------------------------------------------------ traits */

.trait-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.trait-chip {
  padding: 2px 8px;
  border: 1px solid currentColor; border-radius: 100px;
  font-size: 9.5px; letter-spacing: 0.10em;
  background: rgba(255,255,255,0.035);
}
.trait-combo { border-style: dashed; }

.relic-note {
  padding: 9px 12px; margin-bottom: 12px;
  border: 1px solid var(--line-2); border-left: 2px solid var(--accent);
  border-radius: var(--r-sm); background: rgba(255,255,255,0.03);
  font-size: 11.5px; color: var(--ink-2); line-height: 1.5;
}
.relic-note .k { display: block; margin-bottom: 3px; }

/* ------------------------------------------------------------ charms */

.slot-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.slot {
  width: 82px; height: 82px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  border: 1px dashed var(--line-2); border-radius: var(--r);
  background: rgba(0,0,0,0.24);
  font-size: 9px; letter-spacing: 0.1em; color: var(--ink-4);
  text-align: center; padding: 6px;
  transition: all var(--dur) var(--ease);
}
.slot.filled { border-style: solid; background: var(--fill-2); color: var(--ink-2); cursor: pointer; }
.slot.filled:hover { border-color: var(--line-3); }
.slot.locked { opacity: 0.35; }
.slot canvas { display: block; }
.slot-name { font-size: 9.5px; line-height: 1.2; }

.build-line {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding: 10px 13px; margin-bottom: 14px;
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--fill);
}
.build-line .v { font-family: var(--mono); font-size: 11px; color: var(--ink-2); }
.build-line .v.good { color: var(--good); }
.build-line .v.bad { color: #c96a6a; }

/* --------------------------------------------------------- cosmetics */

.cos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(126px, 1fr)); gap: 8px; }
.cos-cell {
  position: relative; padding: 9px 8px 8px;
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--fill); cursor: pointer; text-align: center;
  transition: transform 140ms var(--ease), border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.cos-cell:hover { transform: translateY(-2px); border-color: var(--line-3); background: var(--fill-2); }
.cos-cell.locked { opacity: 0.42; cursor: default; }
.cos-cell.locked:hover { transform: none; }
.cos-cell.on { border-color: var(--accent); background: rgba(127,168,200,0.08); }
.cos-art { display: block; width: 100%; height: 54px; }
.cos-name { font-size: 10.5px; color: var(--ink-2); margin-top: 5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cos-slot { font-size: 9px; color: var(--ink-4); margin-top: 1px; }
.cos-pip { position: absolute; top: 7px; right: 7px; width: 5px; height: 5px; border-radius: 50%; }
.cos-cell.on::after {
  content: 'equipped'; position: absolute; bottom: 6px; left: 0; right: 0;
  font-size: 7.5px; letter-spacing: 0.14em; color: var(--accent);
}

.bar-mini { height: 3px; background: rgba(255,255,255,0.09); border-radius: 2px; overflow: hidden; margin-top: 6px; }
.bar-mini > div { height: 100%; background: var(--accent); border-radius: 2px; transition: width 500ms var(--ease); }

/* ------------------------------------------------------------- cases */

.case-card {
  display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
  padding: 14px 16px;
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--fill);
  transition: all var(--dur) var(--ease);
}
.case-card:hover { border-color: var(--line-2); background: var(--fill-2); }
.case-card.locked { opacity: 0.45; }
.case-icon { width: 62px; height: 62px; border-radius: var(--r-sm); display: block; }
.case-name { font-size: 14px; color: var(--ink); }
.case-blurb { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
.odds { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.odds span { font-family: var(--mono); font-size: 9.5px; color: var(--ink-3); }

.opener {
  width: min(760px, 96vw);
  border: 1px solid var(--line-2); border-radius: var(--r-lg);
  background: linear-gradient(180deg, rgba(14,19,28,0.98), rgba(7,10,16,0.99));
  box-shadow: 0 30px 90px rgba(0,0,0,0.75);
  overflow: hidden;
  animation: panelIn 300ms var(--ease) both;
}
.opener-head { padding: 13px 18px; border-bottom: 1px solid var(--line); text-align: center; }
.opener-title { font-size: 11px; letter-spacing: 0.24em; color: var(--ink-2); }
.reel-window {
  position: relative; height: 152px; overflow: hidden;
  background: linear-gradient(180deg, rgba(0,0,0,0.4), rgba(0,0,0,0.15), rgba(0,0,0,0.4));
  border-bottom: 1px solid var(--line);
}
.reel-strip { position: absolute; top: 0; bottom: 0; left: 0; display: flex; align-items: center; gap: 8px; padding: 0 8px; will-change: transform; }
.reel-item {
  flex: 0 0 118px; height: 122px;
  border: 1px solid var(--line-2); border-radius: var(--r);
  background: rgba(255,255,255,0.03);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.reel-item canvas { display: block; width: 100%; height: 70px; }
.reel-item .rn { font-size: 9px; color: var(--ink-3); margin-top: 4px; padding: 0 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.reel-item .rbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; }
.reel-marker {
  position: absolute; left: 50%; top: 0; bottom: 0; width: 2px;
  background: linear-gradient(180deg, transparent, var(--accent), transparent);
  transform: translateX(-50%); z-index: 3; pointer-events: none;
}
.reel-fade {
  position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background: linear-gradient(90deg, rgba(8,11,17,0.98) 0%, rgba(8,11,17,0) 22%,
              rgba(8,11,17,0) 78%, rgba(8,11,17,0.98) 100%);
}
.opener-result { padding: 18px; text-align: center; }
.opener-result .cos-art { height: 104px; width: auto; max-width: 320px; margin: 0 auto; }
.result-name { font-size: 21px; font-weight: 300; color: var(--ink); margin: 8px 0 3px; }
.result-slot { font-size: 10.5px; letter-spacing: 0.16em; color: var(--ink-3); }
.result-rarity { font-size: 10px; letter-spacing: 0.24em; margin-top: 6px; }
.result-dupe { font-size: 11.5px; color: var(--ink-3); margin-top: 8px; }
.opener-actions { display: flex; gap: 8px; justify-content: center; padding: 0 18px 18px; }

.opener.hit-legendary { animation: hitGlow 1.2s var(--ease); }
@keyframes hitGlow {
  0% { box-shadow: 0 30px 90px rgba(0,0,0,0.75); }
  30% { box-shadow: 0 0 0 2px rgba(255,176,58,0.7), 0 0 90px rgba(255,176,58,0.5), 0 30px 90px rgba(0,0,0,0.75); }
  100% { box-shadow: 0 30px 90px rgba(0,0,0,0.75); }
}
.opener.hit-mythic { animation: hitGlowM 1.6s var(--ease); }
@keyframes hitGlowM {
  0% { box-shadow: 0 30px 90px rgba(0,0,0,0.75); }
  25% { box-shadow: 0 0 0 3px rgba(255,92,158,0.85), 0 0 130px rgba(255,92,158,0.65), 0 30px 90px rgba(0,0,0,0.75); }
  100% { box-shadow: 0 30px 90px rgba(0,0,0,0.75); }
}

/* -------------------------------------------------------- journal/npc */

.entry {
  padding: 13px 15px; margin-bottom: 8px;
  border: 1px solid var(--line); border-left: 2px solid var(--accent-dim);
  border-radius: var(--r); background: var(--fill);
}
.entry-title { font-size: 12.5px; color: var(--ink); letter-spacing: 0.02em; }
.entry-kind { font-size: 9px; letter-spacing: 0.16em; color: var(--ink-4); margin-left: 8px; }
.entry-text { font-size: 12px; line-height: 1.7; color: var(--ink-3); margin-top: 6px; }
.entry.hint { border-left-color: var(--warn); }

.npc-row {
  display: grid; grid-template-columns: 4px 1fr auto; gap: 14px; align-items: center;
  padding: 14px 16px; margin-bottom: 8px;
  border: 1px solid var(--line); border-radius: var(--r); background: var(--fill);
  transition: all var(--dur) var(--ease);
}
.npc-row:hover { border-color: var(--line-2); background: var(--fill-2); }
.npc-row.locked { opacity: 0.4; }
.npc-mark { align-self: stretch; border-radius: 2px; min-height: 40px; }
.npc-name { font-size: 14px; color: var(--ink); }
.npc-where { font-size: 11px; color: var(--ink-3); font-style: italic; margin-top: 2px; }
.npc-blurb { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; line-height: 1.55; }
.npc-new { font-size: 9px; letter-spacing: 0.16em; color: var(--good); }

.speech {
  width: min(520px, 94vw); padding: 22px;
  border: 1px solid var(--line-2); border-radius: var(--r-lg);
  background: linear-gradient(180deg, rgba(16,20,30,0.98), rgba(9,12,18,0.99));
  box-shadow: 0 26px 70px rgba(0,0,0,0.7);
  animation: panelIn 260ms var(--ease) both;
}
.speech-who { font-size: 11px; letter-spacing: 0.22em; margin-bottom: 14px; }
.speech-line { font-size: 14px; line-height: 1.75; color: var(--ink-2); margin-bottom: 12px; }
.speech-line:last-of-type { margin-bottom: 18px; }
.speech-actions { display: flex; justify-content: flex-end; }

/* -------------------------------------------------------- conditions */

.cond-chip { border-color: var(--accent) !important; }

</style>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="Fishing scene"></canvas>

  <!-- ambient screen treatment -->
  <div id="vignette" aria-hidden="true"></div>
  <div id="vigPulse" aria-hidden="true"></div>
  <div id="grain" aria-hidden="true"></div>
  <div id="edgeGlow" aria-hidden="true"></div>

  <!-- boot / title -->
  <div id="boot">
    <div class="boot-inner">
      <h1 class="title">VOID<span>FISHING</span></h1>
      <p class="tagline">Somewhere quiet, at the edge of everything.</p>
      <button id="bootStart" class="btn btn-primary btn-lg">Begin</button>
      <p class="boot-note">Sound recommended</p>
    </div>
  </div>

  <!-- heads-up display -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-tl">
        <div class="money-row" title="Brophys">
          <span class="coin">&#9671;</span><span id="moneyVal" class="money">0</span><span class="money-unit">Brophys</span>
        </div>
        <div class="level-row">
          <span id="levelVal" class="lv">LV 1</span>
          <div class="xp-track"><div id="xpFill" class="xp-fill"></div></div>
          <span id="xpText" class="xp-text">0 / 0</span>
        </div>
      </div>

      <div class="hud-tr">
        <div class="chips">
          <button id="chipLoc" class="chip chip-btn" title="Change location">
            <span class="chip-k">SPOT</span><span id="locName" class="chip-v">The Quiet Shore</span>
          </button>
          <div class="chip"><span class="chip-k">SKY</span><span id="wxName" class="chip-v">Clear</span></div>
          <div class="chip"><span class="chip-k">TIME</span><span id="timeName" class="chip-v">Night</span></div>
          <div id="chipCond" class="chip cond-chip hidden"><span class="chip-k">WATER</span><span id="condName" class="chip-v"></span></div>
        </div>
        <nav class="menu-row" aria-label="Menus">
          <button class="mbtn" data-panel="shop">Shop</button>
          <button class="mbtn" data-panel="fishdex">Fishdex</button>
          <button class="mbtn" data-panel="bag">Bag</button>
          <button class="mbtn" data-panel="wardrobe">Wardrobe</button>
          <button class="mbtn" data-panel="journal">Journal</button>
          <button class="mbtn" data-panel="stats">Stats</button>
          <button class="mbtn mbtn-icon" data-panel="settings" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M8 5.4A2.6 2.6 0 1 0 8 10.6 2.6 2.6 0 0 0 8 5.4zm0 4.1a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/><path fill="currentColor" d="M14 8c0-.3 0-.6-.1-.9l1.3-1-1.5-2.6-1.6.6c-.5-.4-1-.7-1.5-.9L10.3 1.5H7.7l-.3 1.7c-.6.2-1.1.5-1.5.9l-1.6-.6L2.8 6.1l1.3 1c0 .3-.1.6-.1.9s0 .6.1.9l-1.3 1 1.5 2.6 1.6-.6c.4.4 1 .7 1.5.9l.3 1.7h2.6l.3-1.7c.6-.2 1.1-.5 1.5-.9l1.6.6 1.5-2.6-1.3-1c.1-.3.1-.6.1-.9z" opacity=".55"/></svg>
          </button>
        </nav>
      </div>
    </div>

    <div class="hud-bottom">
      <div class="gear-row">
        <button id="gearRod" class="gear-card" title="Change rod">
          <span class="gear-k">ROD</span>
          <span id="rodName" class="gear-v">Old Wooden Rod</span>
        </button>
        <button id="gearBait" class="gear-card" title="Change bait">
          <span class="gear-k">BAIT</span>
          <span id="baitName" class="gear-v">Worm</span>
          <span id="baitCount" class="gear-n">&#8734;</span>
        </button>
      </div>

      <div class="action-col">
        <div id="castMeter" class="cast-meter" aria-hidden="true">
          <div class="cast-track">
            <div id="castFill" class="cast-fill"></div>
            <div class="cast-sweet"></div>
          </div>
        </div>
        <button id="actionBtn" class="action-btn">
          <span id="actionLabel">Cast</span>
          <span id="actionHint" class="action-hint">hold&nbsp;space</span>
        </button>
      </div>

      <div class="side-col">
        <div id="hintBox" class="hint-box"></div>
      </div>
    </div>

    <!-- the fight: hold to drive the white bar right, release and it runs left -->
    <div id="fightUI" class="fight hidden">
      <div class="fight-head">
        <span id="fightName" class="fight-name">&nbsp;</span>

      <div id="mgTrack" class="mg-track">
        <div class="mg-inner">
          <div id="mgBar" class="mg-bar"><span class="mg-bar-arrow"></span></div>
          <div id="mgFish" class="mg-fish"></div>

        <span id="fightPct" class="fight-pct">&mdash;</span>
      </div>
    </div>

    <!-- centred prompts -->
    <div id="prompt" class="prompt" aria-live="polite"></div>
  </div>

  <!-- conversations happen out on the shore, with the words down here -->
  <div id="caption" class="caption hidden" aria-live="polite">
    <div class="caption-inner">
      <div id="captionWho" class="caption-who"></div>
      <div id="captionText" class="caption-text"></div>
      <div id="captionMore" class="caption-more">click to continue</div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="encounter" class="encounter hidden"><div class="enc-inner"><div id="encText" class="enc-text"></div></div></div>
  <div id="overlay" class="overlay hidden"></div>
  <div id="modal" class="modal-host hidden"></div>
</div>

     than just stronger. */
  const SLOT_LEVELS = [6, 14, 26, 42, 58];
  function slotCount() {
    const lv = VF.state.data.level;
    let n = 0;
    for (let i = 0; i < SLOT_LEVELS.length; i++) if (lv >= SLOT_LEVELS[i]) n++;
    return n;
  }
  function nextSlotLevel() {
    const lv = VF.state.data.level;
    for (let i = 0; i < SLOT_LEVELS.length; i++) if (lv < SLOT_LEVELS[i]) return SLOT_LEVELS[i];
    return null;
  }

  function owned(id) { return VF.state.data.charms.indexOf(id) >= 0; }
  function equipped() {
    return VF.state.data.charmSlots.filter(function (x) { return !!x; });
  }
  function isEquipped(id) { return VF.state.data.charmSlots.indexOf(id) >= 0; }

  function grant(id) {
    const d = VF.state.data;
    if (!BY_ID[id] || owned(id)) return false;
    d.charms.push(id);
    VF.bus.emit('charm:found', BY_ID[id]);
    return true;
  }

  function equip(id, slot) {
    const d = VF.state.data;
    if (!owned(id)) return false;
    const max = slotCount();
    if (slot === undefined || slot < 0 || slot >= max) {
      slot = d.charmSlots.findIndex(function (x, i) { return i < max && !x; });
      if (slot < 0) slot = 0;
    }
    const already = d.charmSlots.indexOf(id);
    if (already >= 0) d.charmSlots[already] = null;
    d.charmSlots[slot] = id;
    VF.bus.emit('charm:changed');
    return true;
  }

  function unequip(slot) {
    const d = VF.state.data;
    if (slot < 0 || slot >= d.charmSlots.length) return;
    d.charmSlots[slot] = null;
    VF.bus.emit('charm:changed');
  }

  VF.charms = {
    list: LIST,
    get: function (id) { return BY_ID[id] || null; },
    slotCount: slotCount, nextSlotLevel: nextSlotLevel, SLOT_LEVELS: SLOT_LEVELS,
    owned: owned, equipped: equipped, isEquipped: isEquipped,
    grant: grant, equip: equip, unequip: unequip
  };
})(window.VF = window.VF || {});

    { id: 'strange', name: 'Something Unidentifiable', rarity: 'mythic', weight: 0.4, value: [200000, 900000],
      icon: 'strange', color: '#ff8fd0', minLoc: 5, journal: 'strange',
      desc: 'The archivist will want to see this. You are not sure you want her to.' }
  ];

  const BY_ID = VF.util.byId(LIST);

  /* Base odds that a cast brings up an object instead of a fish. */
  const BASE_CHANCE = 0.035;

  function chance() {
    const build = VF.build ? VF.build.stats() : null;
    const cond = VF.conditions ? VF.conditions.mods() : null;
    const k = (build ? build.treasure : 1) * (cond ? cond.treasure : 1);
    return VF.util.clamp(BASE_CHANCE * k, 0, 0.45);
  }

  /* Weighted draw, with relics excluded once you already own them. */
  function roll() {
    const li = VF.locations.index(VF.state.data.location);
    const pool = LIST.filter(function (t) {
      if (t.minLoc && li < t.minLoc) return false;
      if (t.relic && VF.charms.owned(t.relic)) return false;
      return true;
    });
    if (!pool.length) return null;
    const build = VF.build ? VF.build.stats() : null;
    // gear nudges the tier, it does not decide it — a relic stays a rare day
    const lux = VF.util.clamp(1 + (build ? (build.rare - 1) * 0.10 + (build.luck || 0) * 0.06 : 0), 1, 4);
    return VF.rng.weighted(pool, function (t) {
      const rank = VF.rarities.rank(t.rarity);
      return t.weight * Math.pow(lux, rank * 0.30);
    }, VF.rng.g);
  }

  VF.treasureData = {
    list: LIST,
    get: function (id) { return BY_ID[id] || null; },
    chance: chance, roll: roll, BASE_CHANCE: BASE_CHANCE
  };
})(window.VF = window.VF || {});

   place is, and eventually where the last of it is. */
(function (VF) {
  'use strict';

  const ENTRIES = {
    bottle: { title: 'the note in the bottle', kind: 'find',
      text: 'the handwriting is careful and the ink is not wet. it reads: "the shore is not the first shore. count backwards." there is no signature.' },
    fossil: { title: 'on the fossil', kind: 'find',
      text: 'nothing here has bones like this. the archivist would say that means it did not come from here. she would then ask where it did come from, and wait.' },
    key: { title: 'the brass key', kind: 'find',
      text: 'the keeper turned it over twice and said he had a box it might open, and that the box was full of things nobody had claimed. he took it and gave you nothing, which felt fair at the time.' },
    plate: { title: 'the engraved plate', kind: 'lore',
      text: 'a list of names. then a date. then, much further down and in a different hand, a second date roughly four hundred years later. the same names.' },
    chart: { title: 'the ruined chart', kind: 'lore', hint: 1,
      text: 'most of it has dissolved. one marked position survives, well past the trench, in water the current charts leave blank. somebody drew a small circle there and did not write anything next to it.' },
    lens: { title: 'the clouded lens', kind: 'lore',
      text: 'looking through it at the water, the water is about a metre to the left of where it is. looking through it at the sky is not recommended and you will only do it once.' },
    voidfrag: { title: 'the fragment', kind: 'lore',
      text: 'it is cold in a way that has nothing to do with temperature. holding it, the sense of down gets much stronger, and points somewhere the trench does not go.' },
    lantern: { title: "the drifter's lantern", kind: 'lore',
      text: 'still lit. the flame is the wrong colour and does not move when you do. the drifter said he had left it somewhere, once, and did not seem surprised to hear where it turned up.' },
    fossilheart: { title: 'the warm fossil', kind: 'lore',
      text: 'stone all the way through, and warm. it beats, if you are patient and hold it long enough, about once every four minutes.' },
    eye: { title: 'the eye', kind: 'lore',
      text: 'it is open. it does not blink, it does not track, and it is definitely looking. the archivist would not take it and asked you to keep it somewhere she was not.' },
    strange: { title: 'the unidentifiable thing', kind: 'lore',
      text: 'you can describe every part of it. the parts do not add up to anything. writing this down has not helped.' },

    firstvoid: { title: 'the first void catch', kind: 'event',
      text: 'it came up wrong. not damaged — wrong, in the way a sentence can be grammatical and still mean nothing. it is in the fishdex now, which is the only reason you believe it happened.' },
    firstwrong: { title: 'the quiet minute', kind: 'event',
      text: 'the water stopped. not calmed — stopped, entirely, like a held frame. it lasted under a minute and then went back to being water. nothing was on the line before or after.' },
    stillness: { title: 'on dead calm', kind: 'event',
      text: 'the old fisherman says the water goes flat like that when something large is holding still underneath it, and that the flatness is the shape of its back.' },
    thinplace: { title: 'thin places', kind: 'event',
      text: 'the water gets uncommitted. you can see through it to somewhere that is not the bottom. the drifter calls these thin places and says they move, and that they are looking for something too.' },

    beneath: { title: 'below the nowhere sea', kind: 'lore', hint: 1,
      text: 'the charts stop at the nowhere sea because the people drawing them stopped. it goes further. the old fisherman has been once and will not say how, only that you have to already know it is there.' },
    thelast: { title: 'the last water', kind: 'lore', hint: 2,
      text: 'every clue points the same direction and none of them name it. the chart circle, the plate\'s second date, the fragment\'s sense of down. there is one more place. it is not on the map because the map is what it is under.' }
  };

  /* Add an entry once. Later entries never overwrite earlier ones. */
  function add(id, extra) {
    const d = VF.state.data;
    const def = ENTRIES[id];
    if (!def) return false;
    for (let i = 0; i < d.journal.length; i++) if (d.journal[i].id === id) return false;
    d.journal.push({
      id: id, title: def.title, text: extra ? def.text + ' ' + extra : def.text,
      kind: def.kind, hint: def.hint || 0, at: Date.now()
    });
    if (d.journal.length > 300) d.journal.shift();
    VF.bus.emit('journal:entry', def);
    return true;
  }

  function has(id) {
    const d = VF.state.data;
    for (let i = 0; i < d.journal.length; i++) if (d.journal[i].id === id) return true;
    return false;
  }

  /* How many of the entries that actually point somewhere the player has. */
  function hintCount() {
    const d = VF.state.data;
    let n = 0;
    for (let i = 0; i < d.journal.length; i++) n += d.journal[i].hint || 0;
    return n;
  }

  VF.journal = { entries: ENTRIES, add: add, has: has, hintCount: hintCount };
})(window.VF = window.VF || {});

      stages: [
        { at: function (d) { return d.level >= 4; },

        { at: function (d) { return d.cosmetics.length >= 12; },
          lines: ['twelve. good. there are some i do not sell, you understand — they turn up in the water.',
                  'no, i will not tell you which. that would ruin the only interesting part.'] },
        { at: function (d) { return d.cosmetics.length >= 26; },
          lines: ['at this point you have better taste than i do, which is professionally humiliating.',
                  'take this one. it was never for sale.'],
          gives: 'cosmetic' }
      ] }
  ];

  const BY_ID = VF.util.byId(LIST);

  const NOBODY = { met: 0, stage: 0, heard: [] };

  /* Read-only. Asking whether somebody has something to say must not create a
     record for them — that is a write, and it made "speak to all five of them"
     true for a player who had spoken to none of them. */
  function peek(id) {
    return VF.state.data.npcs[id] || NOBODY;
  }

  /* Writable. Only called when something actually happens with that person. */
  function rec(id) {
    const d = VF.state.data;
    if (!d.npcs[id]) d.npcs[id] = { met: 0, stage: 0, heard: [] };
    return d.npcs[id];
  }

  /* The highest stage whose condition is satisfied. */
  function availableStage(npc) {
    const d = VF.state.data;
    let n = -1;
    for (let i = 0; i < npc.stages.length; i++) {
      let ok = false;
      try { ok = npc.stages[i].at(d); } catch (e) { ok = false; }
      if (ok) n = i; else break;
    }
    return n;
  }

  function hasNew(id) {
    const npc = BY_ID[id];
    if (!npc) return false;
    return availableStage(npc) > peek(id).stage - 1;
  }

  function anyNew() {
    for (let i = 0; i < LIST.length; i++) if (hasNew(LIST[i].id)) return true;
    return false;
  }

  /* Talking is what actually advances things — being eligible is not enough.
     The stage advances the moment the conversation starts, but what comes out
     of it — a journal entry, a key, a gift — is handed over by `commit`, which
     the visit calls once the last line has been read. */
  function talk(id, opts) {
    const npc = BY_ID[id];
    if (!npc) return null;
    const r = rec(id);
    const avail = availableStage(npc);
    if (avail < 0) return null;
    const stage = Math.min(avail, r.stage);
    const def = npc.stages[stage];
    const first = stage >= r.stage;
    r.met++;
    let done = false;
    function commit() {
      if (done || !first) return;
      done = true;
      if (def.journal) VF.journal.add(def.journal);
      if (def.gives) VF.bus.emit('npc:gives', { npc: npc, gives: def.gives });
      VF.bus.emit('npc:advanced', { npc: npc, stage: stage });
      VF.save.save();
    }
    if (first) {
      r.stage = stage + 1;
      if (r.heard.indexOf(stage) < 0) r.heard.push(stage);
    }
    const res = { npc: npc, stage: stage, lines: def.lines, fresh: first, commit: commit };
    if (!(opts && opts.defer)) commit();
    return res;
  }

  function unlocked(id) {
    const npc = BY_ID[id];
    return !!npc && availableStage(npc) >= 0;
  }

  VF.npcs = {
    list: LIST,
    get: function (id) { return BY_ID[id] || null; },
    rec: rec, peek: peek, talk: talk, hasNew: hasNew, anyNew: anyNew,
    met: function (id) { return peek(id).met > 0; },
    unlocked: unlocked, availableStage: availableStage
  };
})(window.VF = window.VF || {});

  for (let i = 0; i < LIST.length; i++) {
    LIST[i].secret = SECRET.indexOf(LIST[i].id) >= 0;
    (BY_SLOT[LIST[i].slot] || (BY_SLOT[LIST[i].slot] = [])).push(LIST[i]);
  }

  /* Defaults are owned from the start so every slot always has something in it. */
  const DEFAULTS = { rodSkin: null, bobber: 'bob_classic', line: 'line_plain',
                     splash: 'spl_plain', cast: 'cast_none', catchFx: 'catch_none',
                     theme: 'ui_default', outfit: 'fit_coat' };

  function owned(id) {
    const d = VF.state.data;
    return d.cosmetics.indexOf(id) >= 0 || isDefault(id);
  }
  function isDefault(id) {
    for (const k in DEFAULTS) if (DEFAULTS[k] === id) return true;
    return false;
  }

  function grant(id) {
    const d = VF.state.data;
    const c = BY_ID[id];
    if (!c) return false;
    if (d.cosmetics.indexOf(id) >= 0) return false;
    d.cosmetics.push(id);
    VF.bus.emit('cosmetic:found', c);
    return true;
  }

  function equip(id) {
    const c = BY_ID[id];
    if (!c || !owned(id)) return false;
    VF.state.data.equipped[c.slot] = id;
    VF.bus.emit('cosmetic:changed', c);
    return true;
  }
  function unequip(slot) {
    VF.state.data.equipped[slot] = DEFAULTS[slot] || null;
    VF.bus.emit('cosmetic:changed', null);
  }
  function equippedIn(slot) {
    const id = VF.state.data.equipped[slot];
    if (id && owned(id)) return BY_ID[id] || null;
    const dflt = DEFAULTS[slot];
    return dflt ? BY_ID[dflt] : null;
  }
  /* Convenience for the renderers: the config object, or an empty one. */
  function cfg(slot) {
    const c = equippedIn(slot);
    return c ? c.c : {};
  }

  function completion() {
    const d = VF.state.data;
    let have = 0;
    for (let i = 0; i < LIST.length; i++) if (owned(LIST[i].id)) have++;
    return { have: have, total: LIST.length, pct: have / LIST.length };
  }

  VF.cosmetics = {
    list: LIST, slots: SLOTS, DEFAULTS: DEFAULTS,
    get: function (id) { return BY_ID[id] || null; },
    inSlot: function (slot) { return BY_SLOT[slot] || []; },
    owned: owned, grant: grant, equip: equip, unequip: unequip,
    equippedIn: equippedIn, cfg: cfg, completion: completion,
    caseable: LIST.filter(function (c) { return !c.secret && !isDefault(c.id); })
  };
})(window.VF = window.VF || {});

/* js/data/cases.js */
/* VOID FISHING — cosmetic cases.
   Bought with Brophys, contain cosmetics and nothing else, and the odds are
   printed on the front because hiding them would be the only dishonest part. */
(function (VF) {
  'use strict';

  /* Odds are per case and sum to 1. They are shown to the player verbatim. */
  const ODDS = {
    common: 0.6000,
    uncommon: 0.2600,
    rare: 0.1000,
    epic: 0.0320,
    legendary: 0.0072,
    mythic: 0.0008
  };

  const LIST = [
    { id: 'harbour', name: 'Harbour Case', cost: 12000, level: 4,
      blurb: 'Ordinary things, well made. The starting collection.',
      color: '#7fa8c8',
      pool: ['rod_bone', 'rod_tar', 'rod_verd', 'rod_rose',
             'bob_slate', 'bob_buoy', 'bob_pearl', 'bob_lantern',
             'line_copper', 'line_glow', 'spl_gold', 'spl_ink',
             'cast_dust', 'cast_spark', 'catch_motes', 'catch_coin',
             'ui_paper', 'ui_tide', 'fit_hood', 'fit_scarf', 'rod_frost',
             'rod_orbit', 'catch_halo', 'line_thread'] },

    { id: 'deepwater', name: 'Deepwater Case', cost: 90000, level: 16,
      blurb: 'Recovered from further down than anybody sells from.',
      color: '#5fd0e0',
      pool: ['rod_verd', 'rod_ember', 'rod_frost', 'rod_orbit',
             'bob_pearl', 'bob_lantern', 'bob_eye',
             'line_glow', 'line_pulse', 'spl_ink', 'spl_bloom',
             'cast_spark', 'cast_comet', 'catch_coin', 'catch_halo',
             'ui_tide', 'ui_ember', 'ui_void', 'fit_scarf', 'fit_lamp'] },

    { id: 'cradle', name: 'Cradle Case', cost: 640000, level: 30,
      blurb: 'Salvage from the ring. Most of it should not still work.',
      color: '#ffd08a',
      pool: ['rod_ember', 'rod_orbit', 'rod_null',
             'bob_lantern', 'bob_eye', 'bob_star',
             'line_pulse', 'line_thread', 'spl_bloom', 'spl_shatter',
             'cast_comet', 'catch_halo', 'catch_rift',
             'ui_ember', 'ui_void', 'fit_lamp', 'fit_starlit'] },

    { id: 'nothing', name: 'Case Of Nothing', cost: 4800000, level: 46,
      blurb: 'The collector will not say where these come from.',
      color: '#a86bff',
      pool: ['rod_orbit', 'rod_null', 'bob_eye', 'bob_star',
             'line_thread', 'spl_shatter', 'cast_comet',
             'catch_halo', 'catch_rift', 'ui_void', 'fit_starlit', 'fit_lamp'] }
  ];

  const BY_ID = VF.util.byId(LIST);

  /* Pick a rarity by the printed odds, then a cosmetic of that rarity from the
     case's pool. If a case has nothing at the drawn rarity it steps down. */
  function rollFrom(caseDef, rnd) {
    const order = ['mythic', 'legendary', 'epic', 'rare', 'uncommon', 'common'];
    let r = rnd(), acc = 0, picked = 'common';
    for (let i = order.length - 1; i >= 0; i--) {
      acc += ODDS[order[i]] || 0;
      if (r <= acc) { picked = order[i]; break; }
    }
    const items = caseDef.pool.map(function (id) { return VF.cosmetics.get(id); })
                              .filter(function (c) { return !!c; });
    for (let step = order.indexOf(picked); step < order.length; step++) {
      const tier = order[step];
      const at = items.filter(function (c) { return c.rarity === tier; });
      if (at.length) return { item: at[Math.floor(rnd() * at.length)], rarity: tier };
    }
    return { item: items[0], rarity: items[0] ? items[0].rarity : 'common' };
  }

  /* The strip the opening animation scrolls through: mostly filler, with the
     real result parked at a known index. */
  function buildStrip(caseDef, result, rnd) {
    const items = caseDef.pool.map(function (id) { return VF.cosmetics.get(id); })
                              .filter(function (c) { return !!c; });
    const STRIP = 48;
    const WIN = 42;
    const strip = [];
    for (let i = 0; i < STRIP; i++) {
      if (i === WIN) { strip.push(result.item); continue; }
      // filler skews common, with the occasional glimpse of something good
      const r = rnd();
      const tier = r < 0.62 ? 'common' : r < 0.86 ? 'uncommon' : r < 0.96 ? 'rare' : r < 0.994 ? 'epic' : 'legendary';
      let at = items.filter(function (c) { return c.rarity === tier; });
      if (!at.length) at = items;
      strip.push(at[Math.floor(rnd() * at.length)]);
    }
    return { strip: strip, winIndex: WIN };
  }

  /* A case cannot pay out a tier it does not stock, so the odds shown are the
     odds after those tiers fold down into the next one they can actually fill. */
  function effectiveOdds(caseDef) {
    const order = ['mythic', 'legendary', 'epic', 'rare', 'uncommon', 'common'];
    const have = Object.create(null);
    caseDef.pool.forEach(function (id) {
      const c = VF.cosmetics.get(id);
      if (c) have[c.rarity] = true;
    });
    const out = Object.create(null);
    order.forEach(function (t) { out[t] = 0; });
    order.forEach(function (t) {
      let target = t;
      for (let i = order.indexOf(t); i < order.length; i++) {
        if (have[order[i]]) { target = order[i]; break; }
        target = order[order.length - 1];
      }
      out[target] += ODDS[t] || 0;
    });
    return out;
  }

  function completion(caseId) {
    const c = BY_ID[caseId];
    if (!c) return { have: 0, total: 0, pct: 0 };
    let have = 0;
    for (let i = 0; i < c.pool.length; i++) if (VF.cosmetics.owned(c.pool[i])) have++;
    return { have: have, total: c.pool.length, pct: have / c.pool.length };
  }

  VF.cases = {
    list: LIST, ODDS: ODDS,
    get: function (id) { return BY_ID[id] || null; },
    rollFrom: rollFrom, buildStrip: buildStrip, completion: completion,
    effectiveOdds: effectiveOdds
  };
})(window.VF = window.VF || {});
