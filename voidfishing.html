})(window.VF = window.VF || {});

/* js/audio/audio.js */
/* VOID FISHING — procedural audio.
   Everything is synthesised at runtime. The chain is:

     voices -> musicBus / sfxBus -> master -> limiter -> warmth -> out
                       \-> reverb send -> convolver -> master

   The limiter is what keeps overlapping effects from turning brittle, and the
   warmth filter rolls off the top end so nothing sounds like a test tone. */
(function (VF) {
  'use strict';

  const U = VF.util;

  let ac = null;
  let ready = false;
  let master, limiter, warmth, musicBus, sfxBus, verb, verbSend, sfxVerbSend;
  let beds = null;
  let music = null;
  let reelLoop = null;
  let ducking = 0;
  let fightDuck = 0;   // eases the ambient bed back while a fish is on the line

  /* ------------------------------------------------------------- buffers */
  let noiseWhite = null, noiseBrown = null, noisePink = null;

  function makeNoise(kind) {
    const len = ac.sampleRate * 4;
    const b = ac.createBuffer(1, len, ac.sampleRate);
    const d = b.getChannelData(0);
    if (kind === 'brown') {
      let last = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        last = (last + 0.02 * w) / 1.02;
        d[i] = last * 3.2;
      }
    } else if (kind === 'pink') {
      // Voss-McCartney: warmer than white, less rumbly than brown
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + w * 0.0555179;
        b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.96900 * b2 + w * 0.1538520;
        b3 = 0.86650 * b3 + w * 0.3104856;
        b4 = 0.55000 * b4 + w * 0.5329522;
        b5 = -0.7616 * b5 - w * 0.0168980;
        d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
        b6 = w * 0.115926;
      }
    } else {
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    return b;
  }

  /* A reverb tail with a short pre-delay and a darkening sweep, which reads as
     a large soft space rather than a metallic spring. */
  function makeImpulse(seconds, decay) {
    const rate = ac.sampleRate;
    const len = Math.floor(rate * seconds);
    const pre = Math.floor(rate * 0.02);
    const b = ac.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      let lp = 0;
      for (let i = 0; i < len; i++) {
        if (i < pre) { d[i] = 0; continue; }
        const t = (i - pre) / (len - pre);
        const env = Math.pow(1 - t, decay);
        // one-pole lowpass that closes as the tail decays
        const cut = 0.42 - t * 0.34;
        lp += cut * ((Math.random() * 2 - 1) - lp);
        d[i] = lp * env;
      }
    }
    return b;
  }

  /* ---------------------------------------------------------------- init */

  function init() {
    if (ac) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ac = new AC(); } catch (e) { return false; }

    noiseWhite = makeNoise('white');
    noiseBrown = makeNoise('brown');
    noisePink = makeNoise('pink');

    /* --- output chain --- */
    warmth = ac.createBiquadFilter();
    warmth.type = 'highshelf';
    warmth.frequency.value = 4200;
    warmth.gain.value = -4.0;
    warmth.connect(ac.destination);

    limiter = ac.createDynamicsCompressor();
    limiter.threshold.value = -12;
    limiter.knee.value = 22;
    limiter.ratio.value = 5;
    limiter.attack.value = 0.006;
    limiter.release.value = 0.22;
    limiter.connect(warmth);

    master = ac.createGain();
    master.gain.value = VF.state.data.settings.master;
    master.connect(limiter);

    verb = ac.createConvolver();
    verb.buffer = makeImpulse(4.6, 2.2);
    const verbReturn = ac.createGain();
    verbReturn.gain.value = 0.85;
    verb.connect(verbReturn);
    verbReturn.connect(master);

    verbSend = ac.createGain();
    verbSend.gain.value = 0.55;
    verbSend.connect(verb);

    sfxVerbSend = ac.createGain();
    sfxVerbSend.gain.value = 0.16;
    sfxVerbSend.connect(verb);

    musicBus = ac.createGain();
    musicBus.gain.value = VF.state.data.settings.music;
    musicBus.connect(master);
    musicBus.connect(verbSend);

    sfxBus = ac.createGain();
    sfxBus.gain.value = VF.state.data.settings.sfx;
    sfxBus.connect(master);
    sfxBus.connect(sfxVerbSend);

    buildBeds();
    buildMusic();
    ready = true;
    return true;
  }

  function pan(v) {
    if (!ac.createStereoPanner) return null;
    const p = ac.createStereoPanner();
    p.pan.value = v;
    return p;
  }

  function loopSource(buffer, rate) {
    const s = ac.createBufferSource();
    s.buffer = buffer;
    s.loop = true;
    if (rate) s.playbackRate.value = rate;
    s.start();
    return s;
  }

  /* ------------------------------------------------------- ambient beds */

  function buildBeds() {
    const out = ac.createGain();
    out.gain.value = 1;
    out.connect(sfxBus);

    /* water: two brown-noise layers at different rates, each breathing on its
       own slow filter, so the surface never settles into a loop */
    const wGain = ac.createGain(); wGain.gain.value = 0;
    wGain.connect(out);
    for (let i = 0; i < 2; i++) {
      const src = loopSource(noiseBrown, 0.85 + i * 0.35);
      const lp = ac.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 340 + i * 220;
      lp.Q.value = 0.5;
      const g = ac.createGain();
      g.gain.value = i ? 0.55 : 1;
      const p = pan(i ? 0.35 : -0.35);
      src.connect(lp); lp.connect(g);
      if (p) { g.connect(p); p.connect(wGain); } else { g.connect(wGain); }

      const lfo = ac.createOscillator();
      lfo.frequency.value = 0.055 + i * 0.031;
      const lfoG = ac.createGain(); lfoG.gain.value = 130;
      lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();

      // slow swell, so the water breathes
      const amp = ac.createOscillator();
      amp.frequency.value = 0.07 + i * 0.04;
      const ampG = ac.createGain(); ampG.gain.value = 0.28;
      amp.connect(ampG); ampG.connect(g.gain); amp.start();
    }

    /* wind: pink noise through a wandering bandpass */
    const nSrc = loopSource(noisePink);
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 560; bp.Q.value = 0.7;
    const nGain = ac.createGain(); nGain.gain.value = 0;
    nSrc.connect(bp); bp.connect(nGain); nGain.connect(out);
    const lfo2 = ac.createOscillator();
    lfo2.frequency.value = 0.037;
    const lfo2G = ac.createGain(); lfo2G.gain.value = 260;
    lfo2.connect(lfo2G); lfo2G.connect(bp.frequency); lfo2.start();

    /* rain: bright noise, softened so it hisses rather than sizzles */
    const rSrc = loopSource(noisePink, 1.6);
    const hp = ac.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 1300;
    const rlp = ac.createBiquadFilter();
    rlp.type = 'lowpass'; rlp.frequency.value = 6200;
    const rGain = ac.createGain(); rGain.gain.value = 0;
    rSrc.connect(hp); hp.connect(rlp); rlp.connect(rGain); rGain.connect(out);

    /* the deep drone that grows as the locations get further out */
    const dGain = ac.createGain(); dGain.gain.value = 0;
    dGain.connect(master);
    const dLp = ac.createBiquadFilter();
    dLp.type = 'lowpass'; dLp.frequency.value = 180;
    dLp.connect(dGain);
    const dOsc = ac.createOscillator();
    dOsc.type = 'sine'; dOsc.frequency.value = 42;
    dOsc.connect(dLp); dOsc.start();
    const dOsc2 = ac.createOscillator();
    dOsc2.type = 'sine'; dOsc2.frequency.value = 42 * 1.5;
    const d2g = ac.createGain(); d2g.gain.value = 0.28;
    dOsc2.connect(d2g); d2g.connect(dLp); dOsc2.start();

    beds = { water: wGain, wind: nGain, rain: rGain, drone: dGain, droneOsc: dOsc, droneOsc2: dOsc2 };
  }

  /* -------------------------------------------------------------- music */

  function midiHz(n) { return 440 * Math.pow(2, (n - 69) / 12); }

  /* Two banks of voices. A chord change crossfades between them instead of
     gliding, which avoids the dissonant sweep of retuning a sounding note. */
  function makeBank(dest) {
    const g = ac.createGain();
    g.gain.value = 0;
    g.connect(dest);
    const voices = [];
    for (let i = 0; i < 3; i++) {
      const o = ac.createOscillator();
      o.type = i === 0 ? 'sine' : 'triangle';
      o.frequency.value = 110;
      const vg = ac.createGain();
      vg.gain.value = i === 0 ? 0.62 : 0.30;
      const p = pan((i - 1) * 0.45);
      o.connect(vg);
      if (p) { vg.connect(p); p.connect(g); } else { vg.connect(g); }
      // each voice drifts on its own slow detune, which is what keeps a pad
      // from sounding like an organ
      const drift = ac.createOscillator();
      drift.frequency.value = 0.05 + i * 0.023;
      const driftG = ac.createGain();
      driftG.gain.value = 4 + i * 2.5;
      drift.connect(driftG); driftG.connect(o.detune);
      drift.start();
      o.start();
      voices.push(o);
    }
    return { gain: g, voices: voices };
  }

  /* Two modulated delay lines, panned apart: cheap, wide, and very smooth. */
  function makeChorus(input, output) {
    for (let i = 0; i < 2; i++) {
      const d = ac.createDelay(0.08);
      d.delayTime.value = 0.016 + i * 0.011;
      const lfo = ac.createOscillator();
      lfo.frequency.value = 0.11 + i * 0.06;
      const lg = ac.createGain();
      lg.gain.value = 0.0035;
      lfo.connect(lg); lg.connect(d.delayTime); lfo.start();
      const p = pan(i ? 0.7 : -0.7);
      const wet = ac.createGain();
      wet.gain.value = 0.42;
      input.connect(d); d.connect(wet);
      if (p) { wet.connect(p); p.connect(output); } else { wet.connect(output); }
    }
  }

  function buildMusic() {
    const out = ac.createGain();
    out.gain.value = 0;
    out.connect(musicBus);

    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 850; lp.Q.value = 0.35;
    lp.connect(out);
    makeChorus(lp, out);

    const banks = [makeBank(lp), makeBank(lp)];
    banks[0].gain.gain.value = 1;

    /* a sub an octave below the root, felt more than heard */
    const sub = ac.createOscillator();
    sub.type = 'sine';
    const subG = ac.createGain(); subG.gain.value = 0;
    sub.connect(subG); subG.connect(musicBus); sub.start();

    music = {
      out: out, lp: lp, banks: banks, active: 0, sub: sub, subG: subG,
      nextChord: 0.5, nextNote: 3, tension: 0
    };
  }

  const CHORD_FADE = 5.0;

  function setChord() {
    if (!music) return;
    const loc = VF.locations.current();
    const sc = loc.music.scale;
    const root = loc.music.root + (VF.rng.g() < 0.28 ? 12 : 0);
    const off = VF.rng.g.int(0, sc.length - 1);
    const next = 1 - music.active;
    const bank = music.banks[next];
    const degs = [0, 2, 4];
    for (let i = 0; i < bank.voices.length; i++) {
      const di = off + degs[i];
      const d = sc[di % sc.length] + 12 * Math.floor(di / sc.length);
      bank.voices[i].frequency.setValueAtTime(midiHz(root + d), ac.currentTime);
    }
    const now = ac.currentTime;
    bank.gain.gain.setTargetAtTime(1, now, CHORD_FADE * 0.4);
    music.banks[music.active].gain.gain.setTargetAtTime(0, now, CHORD_FADE * 0.4);
    music.active = next;
    music.sub.frequency.setTargetAtTime(midiHz(root - 12 + sc[off % sc.length]), now, 3.5);
  }

  /* A struck tone with a second partial and a soft attack — closer to a
     marimba than a test sine. */
  function bell(note, when, gainAmt, decay, panPos, dest) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(gainAmt, when + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, when + decay);

    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2600, when);
    lp.frequency.exponentialRampToValueAtTime(700, when + decay * 0.7);
    g.connect(lp);

    /* Route through a bus, never straight to the reverb send: a direct connect
       leaks past the volume that is supposed to control it. */
    const out = dest || sfxBus;
    const p = pan(panPos === undefined ? 0 : panPos);
    if (p) { lp.connect(p); p.connect(out); } else { lp.connect(out); }

    const partials = [[1, 1], [2.01, 0.26], [3.02, 0.09]];
    for (let i = 0; i < partials.length; i++) {
      const o = ac.createOscillator();
      o.type = 'sine';
      o.frequency.value = midiHz(note) * partials[i][0];
      const pg = ac.createGain();
      pg.gain.value = partials[i][1];
      o.connect(pg); pg.connect(g);
      o.start(when);
      o.stop(when + decay + 0.1);
    }
  }

  /* --------------------------------------------------------------- tick */

  function tick(dt) {
    if (!ready || ac.state !== 'running') return;
    const now = ac.currentTime;
    const loc = VF.locations.current();

    const wet = VF.weather.rain();
    const wind = VF.weather.wind();
    const depth = VF.locations.index(loc.id) / 7;
    const duck = 1 - ducking * 0.8;

    fightDuck = U.approach(fightDuck, reelLoop ? 1 : 0, 0.05, dt);
    const bedDuck = duck * (1 - fightDuck * 0.42);
    beds.water.gain.setTargetAtTime(0.20 * bedDuck * (1 - depth * 0.32), now, 0.7);
    beds.wind.gain.setTargetAtTime((0.014 + wind * 0.05) * bedDuck, now, 1.0);
    beds.rain.gain.setTargetAtTime(wet * 0.055 * duck, now, 0.8);
    beds.drone.gain.setTargetAtTime((0.010 + depth * 0.055) * duck, now, 1.8);
    const dh = 38 - depth * 12;
    beds.droneOsc.frequency.setTargetAtTime(dh, now, 4);
    beds.droneOsc2.frequency.setTargetAtTime(dh * 1.5, now, 4);

    music.nextChord -= dt;
    if (music.nextChord <= 0) {
      music.nextChord = 13 + VF.rng.g() * 11;
      setChord();
    }
    music.out.gain.setTargetAtTime(0.105 * loc.music.pad * duck, now, 3.0);
    music.subG.gain.setTargetAtTime(0.038 * loc.music.pad * duck, now, 3.0);
    music.lp.frequency.setTargetAtTime(760 + depth * 340 + music.tension * 700, now, 1.4);

    music.nextNote -= dt;
    if (music.nextNote <= 0) {
      music.nextNote = 4.5 + VF.rng.g() * 10 / (0.4 + loc.music.tempo * 4);
      const sc = loc.music.scale;
      const oct = VF.rng.g() < 0.32 ? 36 : 24;
      const n = loc.music.root + oct + sc[VF.rng.g.int(0, sc.length - 1)];
      const p = VF.rng.g.range(-0.55, 0.55);
      bell(n, now + 0.02, 0.068, 3.0 + VF.rng.g() * 2.6, p, musicBus);
      // an answering note, quieter and off to the other side
      if (VF.rng.g() < 0.4) {
        const n2 = n + sc[VF.rng.g.int(0, sc.length - 1)] - sc[0];
        bell(n2, now + 0.55 + VF.rng.g() * 0.5, 0.038, 2.6, -p, musicBus);
      }
    }

    ducking = Math.max(0, ducking - dt * 0.45);
  }

  /* --------------------------------------------------------------- sfx
     Every envelope opens and closes on a ramp. Instant starts and stops are
     what make small synthesised effects sound like clicks. */

  function env(node, when, attack, decay, peak, dest) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(Math.max(0.0002, peak), when + attack);
    g.gain.exponentialRampToValueAtTime(0.0004, when + attack + decay);
    g.gain.linearRampToValueAtTime(0, when + attack + decay + 0.02);
    node.connect(g);
    g.connect(dest || sfxBus);
    return g;
  }

  function noiseBurst(when, dur, filterType, freq, peak, sweepTo, opts) {
    opts = opts || {};
    const s = ac.createBufferSource();
    s.buffer = opts.pink === false ? noiseWhite : noisePink;
    s.playbackRate.value = 0.75 + Math.random() * 0.5;
    const f = ac.createBiquadFilter();
    f.type = filterType;
    f.Q.value = opts.q === undefined ? 0.8 : opts.q;
    f.frequency.setValueAtTime(freq, when);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(Math.max(40, sweepTo), when + dur);
    s.connect(f);
    let node = f;
    if (opts.pan !== undefined) {
      const p = pan(opts.pan);
      if (p) { f.connect(p); node = p; }
    }
    env(node, when, opts.attack === undefined ? 0.012 : opts.attack, dur, peak, opts.dest);
    s.start(when);
    s.stop(when + dur + 0.12);
  }

  function tone(when, freq, dur, type, peak, sweepTo, opts) {
    opts = opts || {};
    const o = ac.createOscillator();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, when);
    if (sweepTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, sweepTo), when + dur);
    let node = o;
    if (opts.lp) {
      const f = ac.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = opts.lp;
      o.connect(f); node = f;
    }
    if (opts.pan !== undefined) {
      const p = pan(opts.pan);
      if (p) { node.connect(p); node = p; }
    }
    env(node, when, opts.attack === undefined ? 0.014 : opts.attack, dur, peak, opts.dest);
    o.start(when);
    o.stop(when + dur + 0.12);
    return o;
  }

  const SFX = {
    click: function () { tone(ac.currentTime, 880, 0.07, 'sine', 0.05, 660, { attack: 0.004, lp: 2600 }); },
    hover: function () { tone(ac.currentTime, 1320, 0.045, 'sine', 0.016, 1180, { attack: 0.004, lp: 3200 }); },
    back:  function () { tone(ac.currentTime, 620, 0.10, 'sine', 0.045, 420, { attack: 0.006, lp: 2000 }); },
    error: function () {
      const n = ac.currentTime;
      tone(n, 196, 0.20, 'triangle', 0.045, 150, { lp: 900 });
      tone(n + 0.04, 165, 0.22, 'triangle', 0.030, 130, { lp: 800 });
    },
    buy: function () {
      const n = ac.currentTime;
      bell(76, n, 0.07, 0.9, -0.2);
      bell(83, n + 0.075, 0.06, 1.3, 0.2);
    },
    charge: function () {
      const n = ac.currentTime;
      return tone(n, 150, VF.fishing.CAST_CHARGE_TIME * 1.05, 'triangle', 0.020, 460,
                  { attack: 0.08, lp: 1400 });
    },
    cast: function (power) {
      const n = ac.currentTime;
      // air moving past the blank, then the line paying out
      noiseBurst(n, 0.30 + power * 0.20, 'bandpass', 700 + power * 700, 0.085, 220,
                 { q: 1.1, attack: 0.05, pan: -0.25 });
      tone(n, 280 + power * 180, 0.20, 'sine', 0.022, 160, { attack: 0.03, lp: 900 });
    },
    splash: function (size) {
      const n = ac.currentTime;
      size = size === undefined ? 1 : size;
      noiseBurst(n, 0.11 * size, 'lowpass', 2200, 0.13 * size, 480, { attack: 0.004 });
      noiseBurst(n + 0.03, 0.42 * size, 'bandpass', 620, 0.075 * size, 190, { q: 0.9, attack: 0.02 });
      tone(n, 175, 0.24 * size, 'sine', 0.045 * size, 85, { attack: 0.006, lp: 500 });
    },
    nibble: function () {
      noiseBurst(ac.currentTime, 0.07, 'bandpass', 1500, 0.030, 800, { q: 1.4, attack: 0.006 });
    },
    bite: function (rank) {
      const n = ac.currentTime;
      noiseBurst(n, 0.24, 'lowpass', 1200, 0.16, 280, { attack: 0.005 });
      tone(n, 140, 0.36, 'sine', 0.10, 72, { attack: 0.006, lp: 600 });
      tone(n + 0.015, 470, 0.26, 'triangle', 0.038, 820, { attack: 0.008, lp: 2400 });
      if (rank >= 4) {
        tone(n + 0.05, 82, 1.2, 'sine', 0.095, 52, { attack: 0.04, lp: 300 });
        ducking = 0.85;
      }
    },

    /* A ratchet, not a whistle: filtered noise gated by an audio-rate LFO so
       it clicks, with a little body underneath. */
    reelStart: function () {
      if (reelLoop) return;
      const s = loopSource(noiseWhite, 0.7);
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 1.6;
      const gate = ac.createGain(); gate.gain.value = 0.5;
      const lfo = ac.createOscillator();
      lfo.type = 'square';
      lfo.frequency.value = 26;
      const lfoG = ac.createGain(); lfoG.gain.value = 0.5;
      lfo.connect(lfoG); lfoG.connect(gate.gain); lfo.start();
      const out = ac.createGain(); out.gain.value = 0;
      out.gain.setTargetAtTime(0.095, ac.currentTime, 0.06);
      const lp = ac.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 4200;
      s.connect(bp); bp.connect(gate); gate.connect(lp); lp.connect(out); out.connect(sfxBus);

      const body = ac.createOscillator();
      body.type = 'triangle'; body.frequency.value = 92;
      const bodyG = ac.createGain(); bodyG.gain.value = 0;
      bodyG.gain.setTargetAtTime(0.030, ac.currentTime, 0.1);
      body.connect(bodyG); bodyG.connect(sfxBus); body.start();

      reelLoop = { src: s, out: out, filt: bp, lfo: lfo, body: body, bodyG: bodyG };
    },
    reelStop: function () {
      if (!reelLoop) return;
      const r = reelLoop; reelLoop = null;
      const n = ac.currentTime;
      r.out.gain.setTargetAtTime(0, n, 0.05);
      r.bodyG.gain.setTargetAtTime(0, n, 0.05);
      setTimeout(function () {
        try { r.src.stop(); r.lfo.stop(); r.body.stop(); } catch (e) { /* already stopped */ }
      }, 320);
    },
    reelTension: function (v) {
      if (!reelLoop) return;
      const n = ac.currentTime;
      reelLoop.filt.frequency.setTargetAtTime(1100 + v * 2200, n, 0.10);
      reelLoop.lfo.frequency.setTargetAtTime(18 + v * 30, n, 0.10);
      reelLoop.out.gain.setTargetAtTime(0.080 + v * 0.120, n, 0.10);
      reelLoop.body.frequency.setTargetAtTime(80 + v * 55, n, 0.12);
    },
    strain: function (v) {
      tone(ac.currentTime, 700 + v * 500, 0.18, 'triangle', 0.018 * v, null, { attack: 0.05, lp: 2000 });
    },
    snap: function () {
      const n = ac.currentTime;
      noiseBurst(n, 0.09, 'highpass', 2400, 0.20, null, { attack: 0.002, pink: false });
      tone(n, 1150, 0.10, 'triangle', 0.055, 220, { attack: 0.002, lp: 4000 });
      tone(n + 0.04, 120, 0.65, 'sine', 0.05, 62, { attack: 0.01, lp: 400 });
    },
    surge: function () {
      const n = ac.currentTime;
      noiseBurst(n, 0.5, 'lowpass', 700, 0.075, 200, { attack: 0.06 });
      tone(n, 104, 0.55, 'sine', 0.055, 66, { attack: 0.05, lp: 400 });
    },

    stinger: function (kind, rank) {
      const n = ac.currentTime;
      const loc = VF.locations.current();
      const root = loc.music.root + 12;
      const sc = loc.music.scale;
      if (kind === 'soft') {
        bell(root + 12 + sc[0], n, 0.075, 1.8, -0.25);
        bell(root + 12 + sc[2], n + 0.10, 0.060, 2.2, 0.25);
      } else if (kind === 'bright') {
        for (let i = 0; i < 4; i++) {
          bell(root + 12 + sc[i % sc.length] + (i > 2 ? 12 : 0), n + i * 0.085, 0.075, 2.4,
               (i % 2 ? 0.4 : -0.4));
        }
      } else if (kind === 'grand') {
        ducking = 1;
        for (let i = 0; i < 6; i++) {
          bell(root + sc[i % sc.length] + 12 * Math.floor(i / sc.length), n + i * 0.10, 0.085, 3.6,
               (i / 5 - 0.5) * 1.1);
        }
        tone(n, 62, 2.6, 'sine', 0.085, 46, { attack: 0.06, lp: 260 });
      } else if (kind === 'void') {
        ducking = 1;
        tone(n, 46, 3.8, 'sine', 0.12, 32, { attack: 0.15, lp: 220 });
        for (let i = 0; i < 5; i++) {
          bell(root - 12 + sc[i % sc.length], n + i * 0.19, 0.095, 5.0, (i / 4 - 0.5) * 1.2);
        }
        noiseBurst(n, 2.0, 'lowpass', 340, 0.05, 80, { attack: 0.5 });
      } else {
        ducking = 1;
        for (let i = 0; i < 8; i++) {
          tone(n + i * 0.05, 180 + Math.random() * 1800, 0.10, 'triangle', 0.040,
               null, { attack: 0.004, lp: 3000, pan: Math.random() * 1.6 - 0.8 });
        }
        tone(n, 39, 3.2, 'sine', 0.12, 28, { attack: 0.1, lp: 200 });
      }
    },
    levelUp: function () {
      const n = ac.currentTime;
      const sc = VF.locations.current().music.scale;
      const root = VF.locations.current().music.root + 24;
      for (let i = 0; i < 4; i++) bell(root + sc[i % sc.length], n + i * 0.085, 0.085, 2.2, (i - 1.5) * 0.35);
    },
    discover: function () {
      const n = ac.currentTime;
      tone(n, 760, 0.4, 'sine', 0.050, 1420, { attack: 0.05, lp: 3000, pan: -0.3 });
      tone(n + 0.14, 1140, 0.6, 'sine', 0.036, 1900, { attack: 0.06, lp: 3600, pan: 0.3 });
    },
    achievement: function () {
      const n = ac.currentTime;
      bell(72, n, 0.075, 1.6, -0.3); bell(76, n + 0.09, 0.075, 1.9, 0);
      bell(79, n + 0.18, 0.085, 2.8, 0.3);
    },
    encounter: function () {
      const n = ac.currentTime;
      ducking = 1;
      tone(n, 55, 5.0, 'sine', 0.14, 34, { attack: 0.5, lp: 240 });
      noiseBurst(n + 0.2, 3.0, 'lowpass', 240, 0.06, 60, { attack: 0.9 });
    },
    thunder: function (delay) {
      const n = ac.currentTime + (delay || 2);
      noiseBurst(n, 3.0, 'lowpass', 200, 0.070, 48, { attack: 0.25, pan: VF.rng.g.range(-0.6, 0.6) });
      tone(n + 0.15, 42, 2.8, 'sine', 0.048, 28, { attack: 0.3, lp: 160 });
    },
    /* the case reel: a short mechanical tick that lengthens as it slows */
    caseTick: function (k) {
      const n = ac.currentTime;
      const soft = Math.min(1, 0.35 + k * 0.9);
      noiseBurst(n, 0.035 + k * 0.04, 'bandpass', 2600 - k * 900, 0.030 * soft, null,
                 { q: 3.2, attack: 0.002, pink: false });
      if (k > 0.82) tone(n, 520 - k * 120, 0.07, 'triangle', 0.020, null, { attack: 0.003, lp: 2400 });
    },
    caseRoll: function () {
      const n = ac.currentTime;
      noiseBurst(n, 0.5, 'lowpass', 1600, 0.055, 500, { attack: 0.02 });
      tone(n, 180, 0.5, 'sine', 0.030, 320, { attack: 0.04, lp: 900 });
    },
    /* the shape passing underneath: felt more than heard */
    wrongShape: function () {
      const n = ac.currentTime;
      ducking = 1;
      tone(n, 31, 6.0, 'sine', 0.16, 22, { attack: 1.2, lp: 140 });
      noiseBurst(n + 0.6, 4.0, 'lowpass', 160, 0.045, 40, { attack: 1.4 });
    },
    sell: function () {
      const n = ac.currentTime;
      bell(84, n, 0.055, 0.8, -0.15);
      bell(91, n + 0.065, 0.045, 1.1, 0.15);
    },
    release: function () {
      const n = ac.currentTime;
      noiseBurst(n, 0.42, 'lowpass', 1400, 0.075, 380, { attack: 0.02 });
      tone(n, 620, 0.55, 'sine', 0.032, 1180, { attack: 0.08, lp: 2400 });
    }
  };

  /* Public wrappers: audio must never be able to break gameplay. */
  const api = {};
  Object.keys(SFX).forEach(function (k) {
    api[k] = function () {
      if (!ready || !ac || ac.state !== 'running') return;
      try { return SFX[k].apply(null, arguments); }
      catch (e) { /* ignore */ }
    };
  });

  function unlock() {
    if (!init()) return false;
    if (ac.state === 'suspended') ac.resume();
    if (music && music.nextChord > 0.4) { music.nextChord = 0; }
    return true;
  }

  function setVolumes() {
    if (!ready) return;
    const s = VF.state.data.settings;
    const n = ac.currentTime;
    master.gain.setTargetAtTime(s.master, n, 0.06);
    musicBus.gain.setTargetAtTime(s.music, n, 0.06);
    sfxBus.gain.setTargetAtTime(s.sfx, n, 0.06);
  }

  /* A parallel analyser on the output. It is a leaf, so it observes without
     affecting what is heard — useful for verifying the engine is actually
     producing signal, and for anything audio-reactive later. */
  let analyser = null;
  function tap() {
    if (!ready) return null;
    if (!analyser) {
      analyser = ac.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.6;
      limiter.connect(analyser);
    }
    return analyser;
  }

  function setTension(v) { if (music) music.tension = v; }
  function duck(a) { ducking = Math.max(ducking, a); }

  VF.audio = Object.assign(api, {
    unlock: unlock, tick: tick, setVolumes: setVolumes,
    setTension: setTension, duck: duck, tap: tap,
    isReady: function () { return ready && ac && ac.state === 'running'; }
  });
})(window.VF = window.VF || {});

/* js/ui/toast.js */
/* VOID FISHING — transient notifications on the right edge. */
(function (VF) {
  'use strict';

  const U = VF.util;
  let host = null;
  const live = [];
  const MAX = 4;

  function init() { host = document.getElementById('toasts'); }

  function show(text, kind, ms) {
    if (!host) return;
    while (live.length >= MAX) remove(live[0]);
    const el = U.el('div', 'toast' + (kind ? ' ' + kind : ''));
    el.appendChild(U.el('div', 't-mark'));
    const body = U.el('div', 't-body');
    body.innerHTML = text;   // callers pass pre-escaped, markup-limited strings
    el.appendChild(body);
    host.appendChild(el);
    const rec = { el: el, timer: setTimeout(function () { remove(rec); }, ms || 3400) };
    live.push(rec);
    return rec;
  }

  function remove(rec) {
    const i = live.indexOf(rec);
    if (i < 0) return;
    live.splice(i, 1);
    clearTimeout(rec.timer);
    rec.el.classList.add('out');
    setTimeout(function () { if (rec.el.parentNode) rec.el.parentNode.removeChild(rec.el); }, 340);
  }

  function plain(text, kind, ms) { return show(U.esc(text), kind, ms); }

  VF.toast = { init: init, show: show, plain: plain };
})(window.VF = window.VF || {});

/* js/ui/hud.js */
/* VOID FISHING — HUD rendering and all player input.
   One press model drives everything: hold to charge a cast, tap to set the
   hook, hold to reel. Mouse, touch and keyboard all route through it. */
(function (VF) {
  'use strict';

  const U = VF.util;
  const D = {};
  let shownMoney = 0;
  let pressed = false;
  let hintTimer = 0;
  let promptTimer = 0;

  function init() {
    [
      'hud', 'moneyVal', 'levelVal', 'xpFill', 'xpText', 'locName', 'wxName', 'timeName',
      'chipLoc', 'gearRod', 'gearBait', 'rodName', 'baitName', 'baitCount',
      'castMeter', 'castFill', 'actionBtn', 'actionLabel', 'actionHint',
      'fightUI', 'fightName', 'fightWarn', 'mgTrack', 'mgBar', 'mgFish',
      'mgProg', 'mgProgFill', 'fightHint', 'fightPct',
      'prompt', 'hintBox', 'edgeGlow', 'encounter', 'encText',
      'chipCond', 'condName'
    ].forEach(function (id) { D[id] = document.getElementById(id); });

    shownMoney = VF.state.data.money;
    bindInput();
    bindBus();
    refreshAll();
  }

  /* ------------------------------------------------------------- input */

  function pressStart(e) {
    if (VF.state.rt.panelOpen) return;
    if (e && e.type === 'pointerdown' && e.button !== undefined && e.button !== 0) return;
    // a conversation owns the input while it is running
    if (VF.visit.active()) { VF.visit.advance(); return; }
    if (pressed) return;
    pressed = true;
    const st = VF.fishing.state();
    if (st === 'idle') {
      if (VF.fishing.beginCharge()) VF.audio.charge();
    } else if (st === 'bite') {
      // the button is already down, so the bar starts driving on this press
      // rather than waiting for the player to let go and press again
      if (VF.fishing.hook()) VF.fishing.setReeling(true);
    } else if (st === 'reeling') {
      VF.fishing.setReeling(true);
    }
  }

  function pressEnd() {
    if (!pressed) return;
    pressed = false;
    const st = VF.fishing.state();
    if (st === 'idle' || VF.fishing.S.charging) VF.fishing.releaseCharge();
    if (st === 'reeling') VF.fishing.setReeling(false);
  }

  function bindInput() {
    const canvas = document.getElementById('scene');

    canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); pressStart(e); });
    D.actionBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); pressStart(e); });
    window.addEventListener('pointerup', pressEnd);
    window.addEventListener('pointercancel', pressEnd);
    window.addEventListener('blur', pressEnd);

    window.addEventListener('keydown', function (e) {
      if (e.repeat) return;
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;

      if (e.code === 'Escape') {
        if (VF.panels.isOpen()) { e.preventDefault(); VF.panels.close(); return; }
        if (VF.visit.talking()) { e.preventDefault(); VF.visit.leave(); }
        return;
      }
      if (VF.visit.active()) {
        // nothing else is reachable until the two of you are done
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); VF.visit.advance(); }
        return;
      }
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        if (VF.catchUI.isOpen()) { VF.catchUI.defaultAction(); return; }
        pressStart(e);
        return;
      }
      if (VF.state.rt.panelOpen) return;
      // a menu opening mid-fight is a fish lost to a mis-key, not to the fish
      if (VF.fishing.state() === 'reeling') return;
      switch (e.code) {
        case 'KeyQ': e.preventDefault(); VF.panels.open('shop'); break;
        case 'KeyF': e.preventDefault(); VF.panels.open('fishdex'); break;
        case 'KeyB': e.preventDefault(); VF.panels.open('bag'); break;
        case 'KeyT': e.preventDefault(); VF.panels.open('stats'); break;
        case 'KeyM': e.preventDefault(); VF.panels.open('map'); break;
        case 'KeyJ': e.preventDefault(); VF.panels.open('journal'); break;
        case 'KeyC': e.preventDefault(); VF.panels.open('wardrobe'); break;
        case 'KeyR':
          e.preventDefault();
          if (VF.fishing.reelIn()) VF.toast.plain('Line reeled in', null, 1600);
          break;
      }
    });

    window.addEventListener('keyup', function (e) {
      if (e.code === 'Space' || e.code === 'Enter') pressEnd();
    });

    D.chipLoc.addEventListener('click', function () { VF.audio.click(); VF.panels.open('map'); });
    D.gearRod.addEventListener('click', function () { VF.audio.click(); VF.panels.open('shop', 'rods'); });
    D.gearBait.addEventListener('click', function () { VF.audio.click(); VF.panels.open('shop', 'bait'); });

    U.qsa('.mbtn').forEach(function (b) {
      b.addEventListener('click', function () { VF.audio.click(); VF.panels.open(b.dataset.panel); });
      b.addEventListener('pointerenter', function () { VF.audio.hover(); });
    });
  }

  /* --------------------------------------------------------------- bus */

  function bindBus() {
    VF.bus.on('fishing:cast', function (e) {
      VF.audio.cast(e.power);
      VF.scene.newCastLateral();
      const cc = VF.cosmetics.cfg('cast');
      if (cc.n) {
        const tip = VF.scene.L.rodTip;
        VF.particles.burst(tip.x, tip.y, 6 * cc.n, {
          color: cc.col || [220, 210, 180], angle: -0.6, spread: 0.9,
          speedMin: 60, speedMax: 260, sizeMax: cc.tail ? 3 : 2, grav: 90, lifeMax: 0.9
        });
      }
      if (e.sweet) {
        VF.toast.plain('Perfect cast', 'good', 1700);
        VF.fx.pulse(0.28);
      }
    });
    VF.bus.on('fishing:splash', function () {
      const L = VF.scene.L, b = L.bobber;
      const sc = VF.cosmetics.cfg('splash');
      const col = sc.col || [200, 228, 248];
      VF.audio.splash(0.7);
      VF.fx.ripple(b.x, b.y, L.w * 0.07 * b.scale, 2.0, col);
      VF.fx.ripple(b.x, b.y, L.w * 0.04 * b.scale, 1.3, col);
      for (let i = 0; i < (sc.ring || 0); i++) {
        VF.fx.ripple(b.x, b.y, L.w * (0.10 + i * 0.05) * b.scale, 2.6 + i * 0.4, col, 1.6);
      }
      VF.particles.burst(b.x, b.y, Math.round(11 * (sc.n || 1)), {
        color: col, angle: -Math.PI / 2, spread: 1.6,
        speedMin: 30, speedMax: 110 * (sc.shard ? 1.7 : 1), sizeMax: 2.2, grav: 240, lifeMax: 0.7
      });
    });
    VF.bus.on('fishing:nibble', function () {
      const b = VF.scene.L.bobber;
      VF.audio.nibble();
      VF.fx.ripple(b.x, b.y, VF.scene.L.w * 0.022 * b.scale, 1.1, [190, 215, 235], 0.9);
    });
    VF.bus.on('fishing:bite', function (c) {
      const rank = VF.rarities.rank(c.rarity);
      VF.audio.bite(rank);
      VF.fx.shake(2.4 + rank * 0.9);
      VF.fx.pulse(0.5);
      const b = VF.scene.L.bobber;
      VF.fx.ripple(b.x, b.y, VF.scene.L.w * 0.06 * b.scale, 1.4, [255, 220, 180], 1.6);
      VF.particles.burst(b.x, b.y, 12, {
        color: [220, 236, 250], angle: -Math.PI / 2, spread: 1.9,
        speedMin: 50, speedMax: 150, sizeMax: 2.4, grav: 300, lifeMax: 0.6
      });
      showPrompt(rank >= 4 ? 'Set the hook' : 'Bite', VF.rarities.color(c.rarity), 1.0);
    });
    VF.bus.on('fishing:hooked', function () { VF.audio.reelStart(); });
    VF.bus.on('fishing:missed', function () {
      VF.toast.plain('It got away with the bait', 'warn', 2200);
    });
    VF.bus.on('fishing:surge', function () { VF.audio.surge(); VF.fx.shake(2.0); });
    // the reel runs for the whole fight; these two are the bar catching the
    // fish and the bar losing it, which is the thing the player needs to hear
    VF.bus.on('fishing:grip', function () { VF.audio.nibble(); });
    VF.bus.on('fishing:slip', function () { VF.audio.strain(0.9); });
    VF.bus.on('fishing:lost', function (e) {
      VF.audio.reelStop();
      if (e.reason === 'snap') {
        VF.audio.snap();
        VF.fx.shake(7, 5);
        VF.fx.flash('rgba(255,120,90,0.28)', 0.3);
        VF.toast.plain('It ran, and the line snapped', 'bad', 2800);
        showPrompt('Line snapped', '#ff8a6a', 1.2);
      } else {
        VF.toast.plain('It shook the hook loose', 'warn', 2600);
        showPrompt('It got away', '#ffc36a', 1.0);
      }
      VF.achievements.check();
    });
    VF.bus.on('fishing:landed', function () { VF.audio.reelStop(); });
    VF.bus.on('fishing:reelin', function () { VF.audio.reelStop(); });

    VF.bus.on('money:changed', function () { /* animated in tick */ });
    VF.bus.on('level:up', onLevelUp);
    VF.bus.on('achievement:unlocked', function (a) {
      VF.toast.show('<strong>' + U.esc(a.name) + '</strong><br><span style="color:var(--ink-3)">' +
        U.esc(a.desc) + '</span>' + (a.reward ? '<br><span class="mono" style="color:var(--good)">+' +
        U.money(a.reward) + '</span>' : ''), 'good', 5200);
    });
    VF.bus.on('weather:changed', function (id) {
      const w = VF.weatherData.get(id);
      VF.toast.show('<strong>' + U.esc(w.name) + '</strong><br><span style="color:var(--ink-3)">' +
        U.esc(w.blurb) + '</span>', null, 4200);
    });
    VF.bus.on('location:changed', refreshAll);
    VF.bus.on('rod:bought', refreshGear);
    VF.bus.on('bait:bought', refreshGear);
    VF.bus.on('bait:changed', refreshGear);
    VF.bus.on('gear:changed', refreshGear);

    VF.bus.on('ui:toast', function (o) { VF.toast.plain(o.text, o.kind); });
    VF.bus.on('ui:whisper', function () {
      showPrompt(VF.rng.g.pick(['listen', 'something moved', 'not alone', 'hello?']), '#b9a8e8', 1.6);
    });

    VF.bus.on('encounter:start', function () {
      VF.audio.duck(1);

    VF.bus.on('charm:found', function (c) {

        U.esc(c.note) + '</span>', 'good', 6000);

    });
    VF.bus.on('cosmetic:found', function (c) {
      VF.toast.show('<strong>' + U.esc(c.name) + '</strong> — ' +
        U.esc(VF.rarities.get(c.rarity).name), 'good', 4000);

    VF.bus.on('journal:entry', function (e) {
      VF.toast.show('journal · <strong>' + U.esc(e.title) + '</strong>', null, 3600);
      flashMenu('journal');

    VF.bus.on('npc:advanced', function () { flashMenu('journal'); });
    VF.bus.on('npc:gives', function (o) {
      if (o.gives === 'case') {
        VF.state.data.caseTokens++;
        VF.toast.show('the keeper hands you <strong>a key</strong>', 'good', 4200);
      } else if (o.gives === 'cosmetic') {
        const pool = VF.cosmetics.list.filter(function (c) { return c.secret && !VF.cosmetics.owned(c.id); });
        if (pool.length) {

          VF.toast.show('the collector gives you <strong>' + U.esc(pick.name) + '</strong>', 'good', 5200);
        }

    /* --- something is wrong --- */
    VF.bus.on('wrong:begin', function () {
      VF.audio.duck(1);
      D.hud.classList.add('dimmed');
    });
    VF.bus.on('wrong:peak', function () {
      document.body.classList.add('wrong');
      D.hud.classList.add('gone');
    });
    VF.bus.on('wrong:shape', function () {
      const loc = VF.locations.current();
      VF.scene.addShadow({ x: -0.6, y: 0.34, sp: 0.085, size: 16, alpha: 0.92, life: 9, max: 9 });
      VF.audio.wrongShape();
    });
    VF.bus.on('wrong:restore', function () {
      document.body.classList.remove('wrong');
      D.hud.classList.remove('gone');
    });
    VF.bus.on('wrong:end', function () {
      D.hud.classList.remove('dimmed');
      document.body.classList.remove('wrong');

  }

  function endEncounterUI() {
    D.hud.classList.remove('dimmed');
    if (D.encounter.classList.contains('hidden')) return;
    D.encounter.classList.add('out');
    setTimeout(function () { D.encounter.classList.add('hidden'); D.encounter.classList.remove('out'); }, 900);
  }

  function onLevelUp(e) {
    VF.audio.levelUp();
    VF.fx.flash('rgba(180,220,255,0.16)', 0.22, 1.6);
    VF.fx.pulse(0.4);
    showPrompt('Level ' + e.level, '#cfe4ff', 1.4);
    const u = e.unlocked;
    if (u) {
      u.locations.forEach(function (l) {
        VF.toast.show('<strong>New spot: ' + U.esc(l.name) + '</strong><br><span style="color:var(--ink-3)">' +
          U.esc(l.tag) + '</span>', 'good', 6000);
        flashMenu('map');
      });
      u.rods.forEach(function (r) {
        VF.toast.show('<strong>' + U.esc(r.name) + '</strong> available in the shop', null, 5000);
        flashMenu('shop');
      });
      u.baits.forEach(function (b) {
        VF.toast.show('<strong>' + U.esc(b.name) + '</strong> available in the shop', null, 5000);

  function flashMenu(panel) {
    const b = U.qs('.mbtn[data-panel="' + panel + '"]');

    b.classList.remove('flash');

    b.classList.add('flash');
  }

  /* ------------------------------------------------------------ prompts */

  /* ------------------------------------------------------------ captions */

  let capLine = null, capNpc = null, capReady = false;

  /* Somebody becoming willing to talk is silent otherwise — the player would
     have to keep opening the journal to find out. Checked about once a second;
     anyNew() only walks five people and their stage gates. */
  let newCheck = 0, hadNew = false;

  function watchForVisitors(dt) {
    newCheck -= dt;
    if (newCheck > 0) return;
    newCheck = 1.1;
    const now = VF.npcs.anyNew();
    if (now && !hadNew && !VF.visit.active()) {
      VF.toast.show('somebody on the shore has something to say &mdash; ' +
                    '<strong>journal &middot; people</strong>', null, 5600);
      flashMenu('journal');
    }
    hadNew = now;
  }

  function tickCaption() {
    const el = document.getElementById('caption');
    if (!el) return;
    const V = VF.visit;
    const hudEl = document.getElementById('hud');

    if (!V.active()) {
      if (!el.classList.contains('hidden')) {
        el.classList.add('hidden');
        el.classList.remove('fading', 'ready');
        capLine = null; capNpc = null;
      }
      if (hudEl) hudEl.classList.remove('visiting');
      return;
    }
    if (hudEl) hudEl.classList.add('visiting');

    const line = V.line();
    if (!line) {
      // walking out or walking back — the shore, and nothing written on it
      if (!el.classList.contains('hidden')) el.classList.add('fading');
      capLine = null;
      return;
    }
    const npc = V.npc();
    if (line !== capLine || npc !== capNpc) {
      capLine = line; capNpc = npc; capReady = false;
      document.getElementById('captionWho').textContent = npc ? npc.name.toLowerCase() : '';
      document.getElementById('captionWho').style.color = npc ? npc.color : 'var(--ink-3)';
      const txt = document.getElementById('captionText');
      txt.textContent = line;
      // restart the entry animation for each new line
      txt.style.animation = 'none';
      void txt.offsetWidth;
      txt.style.animation = '';
      el.classList.remove('hidden', 'fading', 'ready');
    }
    // the prompt only appears once the line has had time to be read
    const ready = VF.visit.S.lineT >= 0.55;
    if (ready !== capReady) {
      capReady = ready;
      el.classList.toggle('ready', ready);
    }
  }

  /* Whether this is a device that can only be pressed, not typed on — the
     control is the same either way, the sentence that teaches it is not. */
  function touchOnly() {
    return !!(window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches);
  }

  function showPrompt(text, color, hold) {
    D.prompt.textContent = text;
    D.prompt.style.color = color || 'var(--ink)';
    D.prompt.classList.remove('show', 'hold');
    void D.prompt.offsetWidth;
    D.prompt.classList.add('show');
    promptTimer = hold || 1.2;
  }

  function hint(text, seconds) {
    if (!VF.state.data.settings.showHints) return;
    D.hintBox.textContent = text;
    D.hintBox.classList.add('on');
    hintTimer = seconds || 6;
  }
  function clearHint() { D.hintBox.classList.remove('on'); hintTimer = 0; }

  /* ------------------------------------------------------------ refresh */

  function refreshAll() {
    refreshGear();
    refreshChips();
    refreshLevel();
    const loc = VF.locations.current();
    document.documentElement.style.setProperty('--accent', loc.glow);
    document.documentElement.style.setProperty('--accent-dim', U.rgbToCss(U.hexToRgb(loc.glow), 0.30));
  }

  function refreshGear() {
    const d = VF.state.data;
    const rod = VF.rods.get(d.rod);
    const bait = VF.bait.get(d.bait);
    D.rodName.textContent = rod.name;
    D.baitName.textContent = bait.name;
    const n = VF.bait.count(d.bait);
    D.baitCount.textContent = n === Infinity ? '∞' : n;
    D.baitCount.classList.toggle('low', n !== Infinity && n <= 3);
  }

  function refreshChips() {
    D.locName.textContent = VF.locations.current().name;
    D.wxName.textContent = VF.weather.name();
    D.timeName.textContent = VF.time.phaseName() + ' · ' + VF.time.clock();
    const c = VF.conditions.current();
    D.chipCond.classList.toggle('hidden', !c);
    if (c) {
      D.condName.textContent = c.name;
      D.chipCond.style.borderColor = U.rgbToCss(U.hexToRgb(c.tint), 0.55);
      D.condName.style.color = c.tint;
      D.chipCond.title = c.blurb;
    }
  }

  function refreshLevel() {
    const d = VF.state.data;
    D.levelVal.textContent = 'LV ' + d.level + (d.streak >= 5 ? '  ×' + d.streak : '');
    const need = VF.progression.xpToNext();
    const pctv = U.clamp(d.xp / Math.max(1, need), 0, 1);
    D.xpFill.style.width = (pctv * 100).toFixed(1) + '%';
    D.xpText.textContent = U.commas(d.xp) + ' / ' + U.commas(need);
  }

  /* --------------------------------------------------------------- tick */

  let chipTimer = 0;

  function tick(dt) {
    const d = VF.state.data;
    const S = VF.fishing.S;

    tickCaption();
    watchForVisitors(dt);

    /* money counts up rather than snapping */
    if (Math.abs(shownMoney - d.money) > 0.5) {
      const before = Math.floor(shownMoney);
      shownMoney = U.approach(shownMoney, d.money, 0.0006, dt);
      if (Math.abs(shownMoney - d.money) < 1) shownMoney = d.money;
      D.moneyVal.textContent = U.money(shownMoney);
      if (Math.floor(shownMoney) > before + 1) {
        D.moneyVal.classList.remove('bump'); void D.moneyVal.offsetWidth;
        D.moneyVal.classList.add('bump');
      }
    } else if (D.moneyVal.textContent !== U.money(d.money)) {
      shownMoney = d.money;
      D.moneyVal.textContent = U.money(d.money);
    }

    chipTimer -= dt;
    if (chipTimer <= 0) { chipTimer = 0.5; refreshChips(); refreshLevel(); }

    /* cast meter */
    if (S.charging) {
      D.castMeter.classList.add('on');
      D.castFill.style.width = (S.charge * 100).toFixed(1) + '%';
      D.actionBtn.classList.add('charging');
    } else {
      D.castMeter.classList.remove('on');
      D.actionBtn.classList.remove('charging');
    }

    updateAction(S);
    updateFight(S, dt);

    if (promptTimer > 0) {
      promptTimer -= dt;
      if (promptTimer <= 0) D.prompt.classList.remove('show', 'hold');
    }
    if (hintTimer > 0) {
      hintTimer -= dt;
      if (hintTimer <= 0) clearHint();
    }
  }

  function updateAction(S) {
    const st = S.state;
    let label = 'Cast', h = 'hold to charge', cls = '';
    if (S.charging) { label = 'Release'; h = 'let go to cast'; }
    else if (st === 'casting') { label = '—'; h = 'casting'; cls = 'busy'; }
    else if (st === 'waiting') { label = 'Waiting'; h = 'press R to reel in'; cls = 'busy'; }
    else if (st === 'bite') { label = 'Set hook'; h = 'now'; cls = 'bite'; }
    else if (st === 'reeling') { label = 'Reel'; h = 'hold · release'; cls = 'reeling'; }
    else if (st === 'landed') { label = '—'; h = ''; cls = 'busy'; }

    if (D.actionLabel.textContent !== label) D.actionLabel.textContent = label;
    if (D.actionHint.textContent !== h) D.actionHint.textContent = h;
    D.actionBtn.className = 'action-btn' + (cls ? ' ' + cls : '') + (S.charging ? ' charging' : '');
  }

  /* The catch bar. Everything here is a straight read of the fight state the
     simulation already computed this frame — the HUD never decides anything,
     so what is drawn and what is being played are always the same thing. */
  function updateFight(S, dt) {
    const on = S.state === 'reeling' && S.fight;
    if (!on) {
      if (!D.fightUI.classList.contains('hidden')) {
        D.fightUI.classList.add('hidden');
        D.fightUI.classList.remove('shake', 'enter');
        // the ratchet loop is opened on the hook and closed here, because this
        // is the one observer that sees every way a fight can end — including
        // a treasure landing and a save reset, neither of which says anything
        VF.audio.reelStop();
        VF.audio.setTension(0);
      }
      return;
    }
    const f = S.fight;
    if (D.fightUI.classList.contains('hidden')) {
      D.fightUI.classList.remove('hidden');
      D.fightUI.classList.add('enter');
      setTimeout(function () { D.fightUI.classList.remove('enter'); }, 320);
      const col = f.c.kind === 'treasure' ? '#d8c79a' : VF.rarities.color(f.c.rarity);
      D.fightName.textContent = f.c.kind === 'treasure' ? 'something heavy'
        : f.c.isNew ? 'unknown — something new'
        : VF.traits.prefix(f.c.traits) + f.c.fish.name;
      D.fightName.style.color = col;
      D.mgFish.style.setProperty('--fishcol', col);
      // the bar is sized once: it is a property of this fish and this loadout,
      // and resizing it mid-fight would move the walls under the player
      D.mgBar.style.width = (f.barW * 100).toFixed(2) + '%';
      // a phone has no space bar, and the same press model reaches the screen
      const key = touchOnly() ? 'hold' : 'hold <b>space</b>';
      D.fightHint.innerHTML = VF.state.data.stats.catches < 5
        ? key + ' — keep the fish in the bar'
        : key + ' to go right, let go to go left';
    }

    /* the bar and the fish */
    D.mgBar.style.left = ((f.bar - f.barW * 0.5) * 100).toFixed(3) + '%';
    D.mgFish.style.left = (f.fish * 100).toFixed(3) + '%';
    D.mgFish.classList.toggle('left', f.fishV < -0.02);
    D.mgBar.classList.toggle('grip', f.inside);
    D.mgBar.classList.toggle('right', f.barV > 0.05);
    D.mgBar.classList.toggle('still', Math.abs(f.barV) < 0.05);

    /* the progress */
    const pr = U.clamp(f.progress, 0, 1);
    D.mgProgFill.style.width = (pr * 100).toFixed(2) + '%';
    D.mgProg.classList.toggle('gain', f.inside);
    D.mgProg.classList.toggle('drain', !f.inside);
    D.mgProg.classList.toggle('low', pr < 0.22);
    D.fightPct.textContent = Math.round(pr * 100) + '%';

    /* the warning line only says something once it means something */
    const losing = !f.inside && f.outsideT > 0.28;
    const warn = pr < 0.18 ? 'nearly gone' : losing ? 'losing it' : '';
    if (D.fightWarn.textContent !== warn) D.fightWarn.textContent = warn;
    D.fightWarn.classList.toggle('on', !!warn);
    D.fightUI.classList.toggle('shake', f.shakeAmt > 0.45);

    VF.audio.reelTension(f.tension);
    VF.audio.setTension(f.tension);
    // no decay argument: fx.shake's decay is global and last-caller-wins, and
    // overriding it here would cut the surge shake short every frame
    if (f.shakeAmt > 0.1) VF.fx.shake(f.shakeAmt * 2.2);
  }

  VF.hud = {
    init: init, tick: tick, refreshAll: refreshAll, refreshGear: refreshGear,
    hint: hint, clearHint: clearHint, showPrompt: showPrompt,
    show: function () { D.hud.classList.remove('hidden'); },
    pressEnd: pressEnd
  };
})(window.VF = window.VF || {});

/* js/ui/panels.js */
/* VOID FISHING — menus. One panel host, six views, all rebuilt on open so they
   never drift out of sync with the game state. */
(function (VF) {
  'use strict';

  const U = VF.util;
  let host = null, overlay = null, current = null, node = null;
  let gen = 0;   // guards the deferred teardown against a newer open
  let rodCanvases = [];   // live rod previews, animated while the shop is open
  let rodRaf = 0;

  /* Rod previews animate — the flourishes on the late-tier rods are the point
     of showing them at all — so they run their own loop while visible. */
  function startRodLoop() {
    stopRodLoop();
    if (!rodCanvases.length) return;
    const t0 = performance.now();
    (function frame() {
      if (!rodCanvases.length) { rodRaf = 0; return; }
      const t = (performance.now() - t0) / 1000;
      for (let i = 0; i < rodCanvases.length; i++) {
        const e = rodCanvases[i];
        if (!e.cv.isConnected) continue;
        const g = e.ctx;
        g.clearRect(0, 0, e.cv.width, e.cv.height);
        VF.rodArt.preview(g, e.rod, e.cv.width, e.cv.height, t + e.phase);
      }
      rodRaf = requestAnimationFrame(frame);
    })();
  }
  function stopRodLoop() {
    if (rodRaf) cancelAnimationFrame(rodRaf);
    rodRaf = 0;
    rodCanvases = [];
  }

  function rodPreview(rod, i, dim) {
    const cv = U.el('canvas', 'rod-art');
    cv.width = 300; cv.height = 132;
    const g = cv.getContext('2d');
    if (dim) cv.style.opacity = '0.45';
    VF.rodArt.preview(g, rod, cv.width, cv.height, i * 0.9);
    rodCanvases.push({ cv: cv, ctx: g, rod: rod, phase: i * 0.9 });
    return cv;
  }
  let dexFilter = 'all', dexMode = 'all';

  function init() {
    host = document.getElementById('modal');
    overlay = document.getElementById('overlay');
    overlay.addEventListener('click', function () { if (current) close(); });
  }

  function isOpen() { return !!current; }

  function open(id, tab) {
    if (VF.catchUI.isOpen()) return;
    // a menu mid-fight is a fish lost to a mis-click: the bar cannot be held
    // while a panel owns the input, so it would run to the wall and drain out
    if (VF.fishing.state() === 'reeling') { VF.audio.error(); return; }
    if (current === id) { close(); return; }
    if (current) closeNow();
    stopRodLoop();
    gen++;
    current = id;
    VF.state.rt.panelOpen = id;
    overlay.classList.remove('hidden', 'out');
    node = build(id, tab);
    U.clear(host);
    host.appendChild(node);
    host.classList.remove('hidden');
    startRodLoop();
    U.qsa('.mbtn').forEach(function (b) { b.classList.toggle('active', b.dataset.panel === id); });
    VF.hud.pressEnd();
  }

  function close() {
    if (!current) return;
    VF.audio.back();
    if (node) node.classList.add('out');
    overlay.classList.add('out');
    const n = node;
    const myGen = ++gen;
    setTimeout(function () {
      // a panel opened during the exit animation owns the host now — leave it alone
      if (myGen !== gen) return;
      if (n && n.parentNode) n.parentNode.removeChild(n);
      if (!current) { host.classList.add('hidden'); overlay.classList.add('hidden'); }
    }, 210);
    closeNow();
  }

  function closeNow() {
    stopRodLoop();
    current = null; node = null;
    VF.state.rt.panelOpen = null;
    U.qsa('.mbtn').forEach(function (b) { b.classList.remove('active'); });
    overlay.classList.add('hidden');
  }

  function refresh(tab) {
    if (!current) return;
    stopRodLoop();
    const id = current, prev = node;
    node = build(id, tab);
    if (prev && prev.parentNode) prev.parentNode.replaceChild(node, prev);
    startRodLoop();
  }

  /* ------------------------------------------------------------ scaffold */

  function shell(title, sub) {
    const p = U.el('div', 'panel');
    const head = U.el('div', 'panel-head');
    const left = U.el('div');
    left.appendChild(U.el('div', 'panel-title', title));
    if (sub) left.appendChild(U.el('div', 'panel-sub', sub));
    head.appendChild(left);
    const x = U.el('button', 'panel-close', '×');
    x.setAttribute('aria-label', 'Close');
    x.addEventListener('click', close);
    head.appendChild(x);
    p.appendChild(head);
    return p;
  }

  function tabs(items, active, onPick) {
    const bar = U.el('div', 'tabs');
    items.forEach(function (it) {
      const b = U.el('button', 'tab' + (it.id === active ? ' active' : ''), it.label);
      b.addEventListener('click', function () { VF.audio.click(); onPick(it.id); });
      bar.appendChild(b);
    });
    return bar;
  }

  function body() { return U.el('div', 'panel-body scroll'); }

  function priceEl(cost, affordable) {
    const s = U.el('div', 'row-price' + (affordable ? '' : ' cant'));
    s.textContent = '◈ ' + U.money(cost);
    return s;
  }

  function statCell(k, v, dir) {
    const c = U.el('div', 'stat-cell');
    c.appendChild(U.el('span', 'k', k));
    const val = U.el('span', 'v' + (dir > 0 ? ' up' : dir < 0 ? ' down' : ''), v);
    c.appendChild(val);
    return c;
  }

  function build(id, tab) {
    switch (id) {
      case 'shop': return buildShop(tab || 'rods');
      case 'fishdex': return buildDex();
      case 'bag': return buildBag(tab || 'catches');
      case 'stats': return buildStats(tab || 'stats');
      case 'settings': return buildSettings();
      case 'map': return buildMap();
      case 'cases': return buildCases();
      case 'wardrobe': return buildWardrobe(tab || 'all');
      case 'journal': return buildJournal(tab || 'entries');
      default: return shell('—');
    }
  }

  /* ---------------------------------------------------------------- shop */

  function buildShop(tab) {
    const d = VF.state.data;
    const p = shell('Shop', 'Everything you will ever need, eventually · paid in Brophys');
    p.appendChild(tabs([
      { id: 'rods', label: 'rods' }, { id: 'bait', label: 'bait' },
      { id: 'charms', label: 'charms' }, { id: 'cases', label: 'cases' }
    ], tab, function (t) { refresh(t); }));
    const b = body();

    if (tab === 'charms') { b.appendChild(charmShop()); p.appendChild(b); return p; }
    if (tab === 'cases') { b.appendChild(caseList()); p.appendChild(b); return p; }

    if (tab === 'rods') {
      const eq = VF.rods.get(d.rod);
      const list = U.el('div', 'list');
      VF.rods.list.forEach(function (rod) {
        const owned = d.ownedRods.indexOf(rod.id) >= 0;
        const levelOk = d.level >= rod.level;
        const voidOk = !rod.requiresVoidCatch || d.stats.voidCatches >= 1;
        const locked = !levelOk || !voidOk;
        const can = VF.economy.canAfford(rod.cost);

        const row = U.el('div', 'row row-rod' + (owned ? ' owned' : '') + (locked && !owned ? ' locked' : '') +
                                  (d.rod === rod.id ? ' equipped' : ''));

        main.appendChild(U.el('div', 'row-desc', locked && !owned
          ? (!levelOk ? 'Requires level ' + rod.level : 'Requires a Void-tier catch')

        // comparison arrows only matter when deciding whether to buy
        const c = owned ? function () { return 0; } : cmp;
        const grid = U.el('div', 'stat-grid');
        grid.appendChild(statCell('Cast', rod.cast.toFixed(2), c(rod.cast, eq.cast)));
        grid.appendChild(statCell('Reel', rod.reel.toFixed(2), c(rod.reel, eq.reel)));
        grid.appendChild(statCell('Line', rod.line.toFixed(2), c(rod.line, eq.line)));
        grid.appendChild(statCell('Rare', '×' + rod.rare.toFixed(2), c(rod.rare, eq.rare)));
        grid.appendChild(statCell('Luck', '+' + rod.luck.toFixed(2), c(rod.luck, eq.luck)));

        const bn = U.el('div', 'row-desc', rodBarNote(rod));
        bn.style.color = 'var(--ink-2)';
        main.appendChild(bn);
        row.appendChild(main);

        const side = U.el('div', 'row-side');
        if (owned) {
          if (d.rod !== rod.id) {

          } else {

        } else {
          side.appendChild(priceEl(rod.cost, can && !locked));

          btn.disabled = locked || !can;
          btn.addEventListener('click', function () {
            const r = VF.economy.buyRod(rod.id);
            if (r.ok) {
              VF.audio.buy();
              VF.toast.show('Equipped <strong>' + U.esc(rod.name) + '</strong>', 'good');
              VF.hud.refreshGear(); VF.achievements.check(); refresh('rods');
            } else { VF.audio.error(); }
          });
          side.appendChild(btn);
        }
        row.appendChild(side);
        list.appendChild(row);
      });
      b.appendChild(list);
    } else {
      const list = U.el('div', 'list');
      VF.bait.list.forEach(function (bt) {
        const levelOk = d.level >= bt.level;
        const have = VF.bait.count(bt.id);
        const row = U.el('div', 'row' + (levelOk ? '' : ' locked') + (d.bait === bt.id ? ' equipped' : ''));
        const mark = U.el('div', 'row-mark');
        mark.style.background = bt.color;
        row.appendChild(mark);

        const main = U.el('div', 'row-main');
        const name = U.el('div', 'row-name');
        name.appendChild(U.el('span', null, bt.name));
        if (d.bait === bt.id) { const t = U.el('span', 'tag', 'equipped'); t.style.color = 'var(--accent)'; name.appendChild(t); }
        if (bt.unlimited) { const t = U.el('span', 'tag', 'unlimited'); t.style.color = 'var(--ink-3)'; name.appendChild(t); }
        main.appendChild(name);
        main.appendChild(U.el('div', 'row-desc', levelOk ? bt.desc : 'Requires level ' + bt.level));
        const grid = U.el('div', 'stat-grid');
        grid.appendChild(statCell('Held', have === Infinity ? '∞' : U.commas(have), 0));
        grid.appendChild(statCell('Bite', (bt.bite < 1 ? '' : '+') + Math.round((1 - bt.bite) * 100) + '%', bt.bite < 1 ? 1 : bt.bite > 1 ? -1 : 0));
        grid.appendChild(statCell('Rare', '×' + bt.rare.toFixed(2), bt.rare > 1 ? 1 : 0));
        grid.appendChild(statCell('Luck', '+' + bt.luck.toFixed(2), bt.luck > 0 ? 1 : 0));
        main.appendChild(grid);
        row.appendChild(main);

        const side = U.el('div', 'row-side');
        if (!bt.unlimited) side.appendChild(priceEl(bt.cost, VF.economy.canAfford(bt.cost)));
        const acts = U.el('div', 'row-actions');
        if (!bt.unlimited) {
          [1, 5, 25].forEach(function (n) {
            const btn = U.el('button', 'btn btn-sm', '+' + (bt.pack * n));
            btn.title = 'Buy ' + n + ' pack' + (n > 1 ? 's' : '') + ' — ◈ ' + U.money(bt.cost * n);
            btn.disabled = !levelOk || !VF.economy.canAfford(bt.cost * n);
            btn.addEventListener('click', function () {
              const r = VF.economy.buyBait(bt.id, n);
              if (r.ok) { VF.audio.buy(); VF.hud.refreshGear(); refresh('bait'); }
              else VF.audio.error();
            });
            acts.appendChild(btn);
          });
        }
        if (d.bait !== bt.id && levelOk && (bt.unlimited || have > 0)) {
          const eqb = U.el('button', 'btn btn-sm btn-primary', 'Use');
          eqb.addEventListener('click', function () {
            d.bait = bt.id; VF.audio.click(); VF.bus.emit('bait:changed'); VF.save.save(); refresh('bait');
          });
          acts.appendChild(eqb);
        }
        side.appendChild(acts);
        row.appendChild(side);
        list.appendChild(row);
      });
      b.appendChild(list);
    }
    p.appendChild(b);
    return p;
  }

  function cmp(a, b) { return a > b + 1e-9 ? 1 : a < b - 1e-9 ? -1 : 0; }

  /* What a rod is worth once the fish is on: line strength is what widens the
     white bar, reel force is what steadies it and sharpens how fast it answers
     the key. Same arithmetic as loot.fightParams — stated here so the shop is
     not describing a bonus the fight does not actually give. */
  function rodBarNote(rod) {
    const q = U.clamp((rod.reel - 0.40) / 2.70, 0, 1.25);
    const wider = Math.round(15.5 * (Math.log(Math.max(0.25, rod.line)) / Math.LN2));
    const steadier = Math.round(20 * q);
    const sharper = Math.round(60 * q);
    if (wider <= 0 && steadier <= 0) return 'white bar: the baseline every other rod is measured against';
    const bits = [];
    if (wider > 0) bits.push('white bar +' + wider + '%');
    if (steadier > 0) bits.push(steadier + '% steadier');
    if (sharper > 0) bits.push(sharper + '% sharper on the key');
    return bits.join(' · ');
  }

  /* --------------------------------------------------------- charms */

  function charmIcon(c, size) {
    const cv = U.el('canvas');
    cv.width = cv.height = size * 2;
    cv.style.width = cv.style.height = size + 'px';
    const g = cv.getContext('2d');
    const col = U.hexToRgb(VF.rarities.color(c.rarity));
    g.translate(size, size);
    const R = size * 0.72;
    const grd = g.createRadialGradient(0, 0, 0, 0, 0, R * 1.6);
    grd.addColorStop(0, U.rgbToCss(col, 0.30));
    grd.addColorStop(1, U.rgbToCss(col, 0));
    g.fillStyle = grd;
    g.fillRect(-R * 1.6, -R * 1.6, R * 3.2, R * 3.2);
    g.strokeStyle = U.rgbToCss(col, 0.9);
    g.lineWidth = Math.max(1.4, size * 0.05);
    g.beginPath();
    if (c.kind === 'relic') {
      // relics are drawn as a broken ring, charms as a closed one
      g.arc(0, 0, R * 0.62, 0.5, Math.PI * 1.7);
    } else {
      g.arc(0, 0, R * 0.62, 0, VF.util.TAU);
    }
    g.stroke();
    g.fillStyle = U.rgbToCss(col, 0.55);
    const n = c.kind === 'relic' ? 3 : 4;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * VF.util.TAU - 0.6;
      g.beginPath();
      g.arc(Math.cos(a) * R * 0.62, Math.sin(a) * R * 0.62, size * 0.07, 0, VF.util.TAU);
      g.fill();
    }
    // charms that carry an emblem wear it in the middle of the ring
    if (c.icon) {
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.font = Math.round(size * 0.62) + 'px ' +
               '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      g.fillText(c.icon, 0, size * 0.03);
    }
    return cv;
  }

  function statLine(c) {
    const parts = [];
    const st = c.stats || {};
    const NAMES = { luck: 'luck', rare: 'rarity', value: 'value', xp: 'xp', bite: 'bite time',
                    reel: 'reel', line: 'line', size: 'size', trait: 'traits',
                    treasure: 'salvage', encounter: 'encounters', secret: 'discovery', 'void': 'the deep',
                    barSize: 'white bar size', barSpeed: 'bar movement' };
    for (const k in st) {
      const v = st[k];
      if (k === 'luck') { parts.push({ t: 'luck +' + v.toFixed(2), good: v > 0 }); continue; }
      // a lower bite figure is faster, so it reads as an improvement
      // bar movement is a preference, not an upgrade — it is left uncoloured
      const better = k === 'barSpeed' ? null : (k === 'bite' ? v < 1 : v > 1);
      const pctv = Math.round(Math.abs(v - 1) * 100);
      parts.push({ t: NAMES[k] + ' ' + (v > 1 ? '+' : '−') + pctv + '%', good: better });
    }
    const row = U.el('div', 'stat-grid');
    parts.forEach(function (p) {
      const cell = U.el('div', 'stat-cell');
      const val = U.el('span', 'v' + (p.good === null ? '' : p.good ? ' up' : ' down'), p.t);
      cell.appendChild(val);
      row.appendChild(cell);
    });
    return row;
  }

  /* The worn row, plus what the loadout currently adds up to. */
  function slotStrip() {
    const d = VF.state.data;
    const wrap = U.el('div');
    const max = VF.charms.slotCount();
    const row = U.el('div', 'slot-row');
    for (let i = 0; i < 5; i++) {
      const id = d.charmSlots[i];
      const c = VF.charms.get(id);
      const el = U.el('div', 'slot' + (i >= max ? ' locked' : c ? ' filled' : ''));
      if (i >= max) {
        const nx = VF.charms.SLOT_LEVELS[i];
        el.appendChild(U.el('div', 'slot-name', 'level ' + nx));
      } else if (c) {
        el.appendChild(charmIcon(c, 38));
        el.appendChild(U.el('div', 'slot-name', c.name));
        el.title = c.note;
        el.addEventListener('click', function () {
          VF.charms.unequip(i); VF.audio.back(); VF.save.save(); refresh(current === 'shop' ? 'charms' : 'charms');
        });
      } else {
        el.appendChild(U.el('div', 'slot-name', 'empty'));
      }
      row.appendChild(el);
    }
    wrap.appendChild(row);

    const bs = VF.build.charmStats();
    const line = U.el('div', 'build-line');
    line.appendChild(U.el('span', 'k', 'charms'));
    const tag = U.el('span', 'v');
    tag.textContent = VF.build.describe();
    line.appendChild(tag);
    const show = [['rarity', bs.rare, false], ['size', bs.size, false], ['traits', bs.trait, false],
                  ['value', bs.value, false], ['bite time', bs.bite, true], ['line', bs.line, false],
                  ['salvage', bs.treasure, false], ['discovery', bs.secret, false],
                  ['white bar', bs.barSize, false], ['bar movement', bs.barSpeed, null]];
    show.forEach(function (row2) {
      const v = row2[1];
      if (Math.abs(v - 1) < 0.02) return;
      const better = row2[2] === null ? null : row2[2] ? v < 1 : v > 1;
      const el = U.el('span', 'v' + (better === null ? '' : better ? ' good' : ' bad'),
        row2[0] + ' ' + (v > 1 ? '+' : '−') + Math.round(Math.abs(v - 1) * 100) + '%');
      line.appendChild(el);
    });
    if (bs.luck > 0.01) line.appendChild(U.el('span', 'v good', 'luck +' + bs.luck.toFixed(2)));
    else if (bs.luck < -0.01) line.appendChild(U.el('span', 'v bad', 'luck ' + bs.luck.toFixed(2)));
    if (line.children.length <= 2) line.appendChild(U.el('span', 'v', 'nothing worn'));
    wrap.appendChild(line);
    return wrap;
  }

  /* ---------------------------------------------------------- cases */

  function caseIcon(c, size) {
    const cv = U.el('canvas', 'case-icon');
    cv.width = cv.height = size * 2;
    cv.style.width = cv.style.height = size + 'px';
    const g = cv.getContext('2d');
    const col = U.hexToRgb(c.color);
    g.translate(size, size);
    const S = size * 0.62;
    const grd = g.createLinearGradient(-S, -S, S, S);
    grd.addColorStop(0, U.rgbToCss(U.shade(col, -0.25)));
    grd.addColorStop(1, U.rgbToCss(U.shade(col, -0.62)));
    g.fillStyle = grd;
    g.fillRect(-S, -S * 0.78, S * 2, S * 1.56);
    g.strokeStyle = U.rgbToCss(col, 0.95);
    g.lineWidth = Math.max(1.4, size * 0.045);
    g.strokeRect(-S, -S * 0.78, S * 2, S * 1.56);
    g.fillStyle = U.rgbToCss(col, 0.85);
    g.fillRect(-S, -S * 0.16, S * 2, S * 0.32);
    g.fillStyle = U.rgbToCss(U.shade(col, 0.5), 0.95);
    g.fillRect(-S * 0.18, -S * 0.34, S * 0.36, S * 0.68);
    return cv;
  }

    const d = VF.state.data;
    const wrap = U.el('div');

      const note = U.el('div', 'relic-note');

    const list = U.el('div', 'list');
    VF.cases.list.forEach(function (c) {

      const comp = VF.cases.completion(c.id);
      const check = VF.caseOpen.canBuy(c.id);

      ['common', 'uncommon', 'rare', 'epic', 'legendary', 'mythic'].forEach(function (r) {

      bar.appendChild(fill);
      main.appendChild(bar);
      const cnt = U.el('div', 'case-blurb', 'collection ' + comp.have + ' / ' + comp.total);
      cnt.style.marginTop = '5px';

      list.appendChild(card);

    wrap.appendChild(list);

    const foot = U.el('div', 'case-blurb');
    foot.style.marginTop = '14px';
    foot.textContent = 'cases contain cosmetics only. nothing inside changes how you fish. ' +
                       'duplicates are refunded.';

    return wrap;

  function buildWardrobe(tab) {
    const d = VF.state.data;
    const comp = VF.cosmetics.completion();
    const p = shell('Wardrobe', comp.have + ' of ' + comp.total + ' owned · ' +
                    Math.round(comp.pct * 100) + '% complete');
    const items = [{ id: 'all', label: 'all' }].concat(
      VF.cosmetics.slots.map(function (s2) { return { id: s2.id, label: s2.name }; }));
    p.appendChild(tabs(items, tab, function (t) { refresh(t); }));
    const b = body();

    const bar = U.el('div', 'bar-mini');
    const fill = U.el('div');
    fill.style.width = (comp.pct * 100).toFixed(1) + '%';
    bar.appendChild(fill);

    spacer.style.height = '14px';

    list.sort(function (a, c) {
      const ra = VF.rarities.rank(a.rarity), rc = VF.rarities.rank(c.rarity);
      if (ra !== rc) return rc - ra;
      return a.name.localeCompare(c.name);
    });

    const grid = U.el('div', 'cos-grid');
    list.forEach(function (c, i) {
      const own = VF.cosmetics.owned(c.id);
      const on = VF.cosmetics.equippedIn(c.slot) === c;
      const cell = U.el('div', 'cos-cell' + (own ? '' : ' locked') + (on ? ' on' : ''));
      const pip = U.el('div', 'cos-pip');

      if (own) pip.style.boxShadow = '0 0 8px ' + U.rgbToCss(U.hexToRgb(VF.rarities.get(c.rarity).glow), 0.7);
      cell.appendChild(pip);

      if (own) {
        cell.appendChild(cosThumb(c, 118, 54, i * 0.6));
        cell.appendChild(U.el('div', 'cos-name', c.name));
      } else {
        const blank = U.el('canvas', 'cos-art');
        blank.width = 236; blank.height = 108;
        const g = blank.getContext('2d');
        g.scale(2, 2);
        g.globalAlpha = 0.16;
        VF.cosmeticArt.draw(g, c, 118, 54, 0);
        cell.appendChild(blank);
        cell.appendChild(U.el('div', 'cos-name', '?????'));
      }
      cell.appendChild(U.el('div', 'cos-slot',
        (VF.cosmetics.slots.filter(function (s2) { return s2.id === c.slot; })[0] || {}).name || c.slot));

      if (own) {
